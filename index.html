ircunflejo, y en cualquier otro sitio del documento se escribe el texto de la nota. Se numeran solas por orden de aparición y se colocan todas juntas al final de la página.\n\n````md\nEsto necesita una aclaración[^1] y esto otra[^fuente].\n\n[^1]: El texto de la primera nota.\n[^fuente]: Se puede usar una palabra como etiqueta en vez de un número.\n````\n\n<div class=\"demo\">\n\nEsto necesita una aclaración[^1] y esto otra[^fuente].\n\n<\/div>\n\nBaja al final de esta página: ahí están las dos notas, con una flecha para volver al punto exacto donde estabas.\n\n[^1]: El texto de la primera nota. Puede llevar **formato** y [enlaces](#13-notas-al-pie).\n[^fuente]: Se puede usar una palabra como etiqueta en vez de un número; el número se calcula solo.\n\n## 14. Listas de definiciones\n\nUn término en una línea y su definición debajo, empezando por dos puntos y un espacio. Un término puede tener varias definiciones.\n\n````md\nMarkdown\n: Lenguaje de marcas ligero para escribir con formato en texto plano.\n\nHTML\n: El idioma que entiende el navegador.\n: Se puede mezclar con Markdown.\n````\n\n<div class=\"demo\">\n\nMarkdown\n: Lenguaje de marcas ligero para escribir con formato en texto plano.\n\nHTML\n: El idioma que entiende el navegador.\n: Se puede mezclar con Markdown.\n\n<\/div>\n\n## 15. Abreviaturas\n\nSe declara una vez en cualquier parte del documento y a partir de ahí, cada vez que la palabra aparezca, sale subrayada con puntitos y con su explicación al pasar el ratón.\n\n````md\n*[HTML]: Lenguaje de marcado para páginas web\n*[PDF]: Formato de documento portátil\n\nEste archivo es HTML y se puede imprimir en PDF.\n````\n\n<div class=\"demo\">\n\nEste archivo es HTML y se puede imprimir en PDF. Pasa el ratón por encima de las siglas.\n\n<\/div>\n\n*[HTML]: Lenguaje de marcado para páginas web\n*[PDF]: Formato de documento portátil\n\n## 16. Emojis\n\nSe pueden pegar tal cual (🚀) o escribir su nombre entre dos puntos.\n\n| Escribes | Se ve | | Escribes | Se ve |\n| --- | :---: | --- | --- | :---: |\n| `:white_check_mark:` | :white_check_mark: | | `:warning:` | :warning: |\n| `:x:` | :x: | | `:bulb:` | :bulb: |\n| `:rocket:` | :rocket: | | `:fire:` | :fire: |\n| `:star:` | :star: | | `:tada:` | :tada: |\n| `:pushpin:` | :pushpin: | | `:memo:` | :memo: |\n| `:bug:` | :bug: | | `:zap:` | :zap: |\n| `:books:` | :books: | | `:mag:` | :mag: |\n| `:thumbsup:` | :thumbsup: | | `:eyes:` | :eyes: |\n| `:lock:` | :lock: | | `:gear:` | :gear: |\n| `:calendar:` | :calendar: | | `:chart:` | :chart: |\n\nSi el nombre no está en la lista, el texto se queda tal cual, así que no se rompe nada.\n\n## 17. HTML dentro de Markdown\n\nTodo lo que Markdown no cubre se resuelve escribiendo HTML directamente. La única regla es dejar una línea en blanco antes y después del bloque.\n\n### Detalles plegables\n\n````md\n<details>\n<summary>Pulsa para desplegar<\/summary>\n\nAquí dentro se sigue escribiendo **Markdown normal**, siempre que haya\nuna línea en blanco después de la etiqueta de resumen.\n\n<\/details>\n````\n\n<div class=\"demo\">\n\n<details>\n<summary>Pulsa para desplegar<\/summary>\n\nAquí dentro se sigue escribiendo **Markdown normal**, siempre que haya una línea en blanco después de la etiqueta de resumen.\n\n<\/details>\n\n<\/div>\n\n### Etiquetas útiles\n\n| Escribes | Se ve |\n| --- | --- |\n| `<kbd>Ctrl<\/kbd> + <kbd>P<\/kbd>` | <kbd>Ctrl<\/kbd> + <kbd>P<\/kbd> |\n| `<mark>resaltado<\/mark>` | <mark>resaltado<\/mark> |\n| `<abbr title=\"Por ejemplo\">p. ej.<\/abbr>` | <abbr title=\"Por ejemplo\">p. ej.<\/abbr> |\n| `<sup>arriba<\/sup>` y `<sub>abajo<\/sub>` | <sup>arriba<\/sup> y <sub>abajo<\/sub> |\n| `<u>subrayado<\/u>` | <u>subrayado<\/u> |\n| `<span style=\"color:#cf222e\">en rojo<\/span>` | <span style=\"color:#cf222e\">en rojo<\/span> |\n| `<br>` | un salto de línea |\n\n### Centrar y repartir en columnas\n\nEsta plantilla trae tres clases preparadas: `centrado`, `dos-columnas` y `salto-pagina`.\n\n````md\n<p class=\"centrado\">Este párrafo va centrado.<\/p>\n\n<div class=\"dos-columnas\">\n\nTexto largo que se reparte en dos columnas al imprimir...\n\n<\/div>\n````\n\n<div class=\"demo\">\n\n<p class=\"centrado\">Este párrafo va centrado.<\/p>\n\n<div class=\"dos-columnas\">\n\nEl texto que va dentro de este bloque se reparte solo en dos columnas y salta a la segunda cuando la primera se llena, igual que en un periódico. Sirve para listas largas, para notas al pie de un informe o para aprovechar el papel cuando el texto es corto y sobra hueco a la derecha. Si la pantalla es estrecha, o si el papel no da de sí, vuelve a una sola columna sin que haya que tocar nada.\n\n<\/div>\n\n<\/div>\n\nOjo con dos detalles: hay que dejar una línea en blanco después de `<div ...>` y otra antes de `<\/div>`, porque si no el Markdown de dentro no se convierte; y las columnas solo se notan cuando hay texto suficiente para llenar la primera.\n\n## 18. Escapar caracteres\n\nDelante de un carácter con significado especial se pone una barra invertida y el carácter se escribe tal cual, sin transformarse.\n\n````md\n\\*esto no va en cursiva\\*\n\\# esto no es un título\n2 \\* 3 \\= 6\n````\n\n<div class=\"demo\">\n\n\\*esto no va en cursiva\\*  \n\\# esto no es un título\n\n<\/div>\n\nSe pueden escapar: `\\ ` `` ` `` `*` `_` `{ }` `[ ]` `( )` `#` `+` `-` `.` `!` `|` `~` `^` `=` `<` `>` `$` `:` `/` `\"` `'`\n\nTambién funcionan las entidades de HTML: `&copy;` da &copy;, `&nbsp;` da un espacio que no se parte, `&mdash;` da &mdash; y `&hellip;` da &hellip;\n\n## 19. Comentarios ocultos\n\nUn comentario de HTML no se ve en la página ni se imprime, pero queda escrito en el archivo. Sirve para notas al margen, recordatorios o para apagar un trozo sin borrarlo.\n\n````md\n<!-- Recordar actualizar las cifras antes de imprimir -->\n````\n\n<!-- Este comentario existe en el archivo pero no se ve en la página. -->\n\n## 20. Preparar la impresión\n\n- **Forzar un cambio de página:** `<div class=\"salto-pagina\"><\/div>` en una línea sola.\n- **Márgenes del papel:** se cambian en la hoja de estilo, en la regla `@page`, arriba del archivo.\n- Los títulos nunca se quedan solos al final de una página, y las tablas, imágenes y bloques de código no se parten por la mitad: eso ya está resuelto en la hoja de estilo.\n- Para que salga el fondo gris de los bloques de código en el PDF, marca la casilla *Gráficos de fondo* en las opciones de impresión del navegador.\n\n## 21. Diagramas\n\nUn bloque marcado como `mermaid` ya no se queda escrito: se dibuja. El dibujo es un SVG que hace la propia plantilla, así que funciona sin conexión, se imprime nítido a cualquier tamaño y se adapta solo al tema claro u oscuro. Debajo de cada dibujo hay un botón **código** para ver el texto que lo generó.\n\nSi el texto tiene un error y no se puede dibujar, no se pierde nada: se muestra tal cual, como un bloque de código.\n\n### Diagrama de flujo\n\n````md\n```mermaid\ngraph TD\n  A[Llega el pedido] --> B{¿Hay existencias?}\n  B -->|Sí| C[Preparar el envío]\n  B -->|No| D[(Pedir al proveedor)]\n  D --> B\n  C --> E([Entregado])\n```\n````\n\n```mermaid\ngraph TD\n  A[Llega el pedido] --> B{¿Hay existencias?}\n  B -->|Sí| C[Preparar el envío]\n  B -->|No| D[(Pedir al proveedor)]\n  D --> B\n  C --> E([Entregado])\n```\n\n**Hacia dónde va:** `graph TD` de arriba abajo, `LR` de izquierda a derecha, `BT` de abajo arriba y `RL` de derecha a izquierda. En lugar de `graph` también vale `flowchart`.\n\n**Formas de las cajas**\n\n| Se escribe | Sale |\n| --- | --- |\n| `A[Texto]` | rectángulo |\n| `A(Texto)` | rectángulo redondeado |\n| `A([Texto])` | píldora |\n| `A[[Texto]]` | subproceso |\n| `A[(Texto)]` | cilindro (base de datos) |\n| `A((Texto))` | círculo |\n| `A(((Texto)))` | círculo doble |\n| `A{Texto}` | rombo (una decisión) |\n| `A{{Texto}}` | hexágono |\n| `A[/Texto/]` | paralelogramo |\n| `A[\\Texto\\]` | paralelogramo al revés |\n| `A[/Texto\\]` | trapecio |\n| `A>Texto]` | banderín |\n\nSi el texto lleva paréntesis, comas o signos raros, se pone entre comillas: `A[\"Total (con IVA)\"]`.\n\n**Tipos de línea**\n\n| Se escribe | Sale |\n| --- | --- |\n| `A --> B` | flecha |\n| `A --- B` | línea sin punta |\n| `A -.-> B` | flecha punteada |\n| `A ==> B` | flecha gruesa |\n| `A --o B` | termina en círculo |\n| `A --x B` | termina en cruz |\n| `A <--> B` | flecha en los dos sentidos |\n\nPara escribir algo encima de la línea hay dos maneras, las dos valen: `A -->|texto| B` o `A -- texto --> B`.\n\n### Agrupar y pintar\n\n`subgraph` mete varias cajas dentro de un recuadro con título, y `classDef` + `class` les da color.\n\n````md\n```mermaid\ngraph LR\n  U([Usuario]) --> F\n  subgraph Servidor\n    F[API] --> B[(Base de datos)]\n    F --> C[Caché]\n  end\n  B --> F\n  class B,C guardado\n  classDef guardado fill:#e7f5ff,stroke:#1971c2\n```\n````\n\n```mermaid\ngraph LR\n  U([Usuario]) --> F\n  subgraph Servidor\n    F[API] --> B[(Base de datos)]\n    F --> C[Caché]\n  end\n  B --> F\n  class B,C guardado\n  classDef guardado fill:#e7f5ff,stroke:#1971c2\n```\n\nEn `classDef` y en `style` se entienden `fill:` (relleno), `stroke:` (borde), `color:` (texto) y `stroke-width:` (grosor del borde). `style B fill:#ffe3e3` pinta una sola caja.\n\n### Diagrama de secuencia\n\nPara contar quién le habla a quién y en qué orden.\n\n````md\n```mermaid\nsequenceDiagram\n  autonumber\n  actor C as Cliente\n  participant W as Tienda\n  participant P as Pasarela de pago\n  C->>W: Confirma el carrito\n  W->>P: Cobra 45,00 €\n  alt Pago aceptado\n    P-->>W: Todo correcto\n    W-->>C: Aquí tienes tu factura\n  else Tarjeta rechazada\n    P-->>W: Rechazado\n    W-->>C: Prueba con otra tarjeta\n  end\n  Note over C,W: El pedido se guarda igualmente\n```\n````\n\n```mermaid\nsequenceDiagram\n  autonumber\n  actor C as Cliente\n  participant W as Tienda\n  participant P as Pasarela de pago\n  C->>W: Confirma el carrito\n  W->>P: Cobra 45,00 €\n  alt Pago aceptado\n    P-->>W: Todo correcto\n    W-->>C: Aquí tienes tu factura\n  else Tarjeta rechazada\n    P-->>W: Rechazado\n    W-->>C: Prueba con otra tarjeta\n  end\n  Note over C,W: El pedido se guarda igualmente\n```\n\n`->>` es una llamada, `-->>` es la respuesta (línea de rayas), `-x` termina en cruz y `-)` es un aviso que no espera respuesta. `autonumber` numera los mensajes. `Note left of A:`, `Note right of A:` y `Note over A,B:` pegan una nota amarilla. `loop`, `alt`/`else`, `opt`, `par`/`and` y `critical` abren un recuadro que se cierra con `end`. `activate`/`deactivate` marcan cuándo alguien está ocupado.\n\n### Diagrama de estados\n\nIgual que el de flujo, pero `[*]` es el principio y el final.\n\n````md\n```mermaid\nstateDiagram-v2\n  [*] --> Borrador\n  Borrador --> EnRevision : lo envías\n  EnRevision --> Borrador : con correcciones\n  EnRevision --> Publicado : aprobado\n  Publicado --> [*]\n```\n````\n\n```mermaid\nstateDiagram-v2\n  [*] --> Borrador\n  Borrador --> EnRevision : lo envías\n  EnRevision --> Borrador : con correcciones\n  EnRevision --> Publicado : aprobado\n  Publicado --> [*]\n```\n\nPara que un estado se llame de otra manera: `state \"En revisión\" as EnRevision`.\n\n### Tarta\n\n````md\n```mermaid\npie title Cómo se reparte la jornada\n  \"Programar\" : 45\n  \"Reuniones\" : 20\n  \"Revisar\" : 25\n  \"Café\" : 10\n```\n````\n\n```mermaid\npie title Cómo se reparte la jornada\n  \"Programar\" : 45\n  \"Reuniones\" : 20\n  \"Revisar\" : 25\n  \"Café\" : 10\n```\n\nLos porcentajes se calculan solos, no hace falta que los números sumen 100.\n\n> [!NOTE]\n> Se dibujan estos cinco tipos: flujo, secuencia, estados, tarta y los que se escriben como `flowchart`. Otros tipos de Mermaid (Gantt, clases, ER, mapas mentales) se muestran como bloque de código en lugar de fallar. La palabra `diagrama` funciona igual que `mermaid` si prefieres escribirla en español.\n\n## 22. Fórmulas matemáticas\n\nEntre dos signos de dólar, dentro de una frase: `$a^2 + b^2 = c^2$` se lee $a^2 + b^2 = c^2$. En un párrafo aparte, con dos dólares arriba y dos abajo.\n\n````md\nLa energía cumple $E = mc^2$, y en grande:\n\n$$\n\\int_0^\\infty e^{-x}\\,dx = 1\n$$\n````\n\n<div class=\"demo\">\n\nLa energía cumple $E = mc^2$, y en grande:\n\n$$\n\\int_0^\\infty e^{-x}\\,dx = 1\n$$\n\n<\/div>\n\nSe escribe en LaTeX y el navegador lo dibuja solo, sin descargar nada. Lo más usado:\n\n| Se escribe | Sale |\n| --- | --- |\n| `x^2` y `x_i` | $x^2$ y $x_i$ |\n| `\\frac{a}{b}` | $\\frac{a}{b}$ |\n| `\\sqrt{x}` y `\\sqrt[3]{x}` | $\\sqrt{x}$ y $\\sqrt[3]{x}$ |\n| `\\sum_{i=1}^{n} i` | $\\sum_{i=1}^{n} i$ |\n| `\\int_a^b f(x)dx` | $\\int_a^b f(x)dx$ |\n| `\\alpha \\beta \\pi \\Omega` | $\\alpha \\beta \\pi \\Omega$ |\n| `\\leq \\geq \\neq \\approx` | $\\leq \\geq \\neq \\approx$ |\n| `\\to \\Rightarrow \\infty` | $\\to \\Rightarrow \\infty$ |\n| `\\left( \\frac{a}{b} \\right)` | $\\left( \\frac{a}{b} \\right)$ |\n| `\\text{palabras}` | $\\text{palabras}$ |\n\nTambién hay matrices (`\\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}`), casos (`\\begin{cases}`) y alineaciones (`\\begin{aligned}`).\n\n$$\n\\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}\n\\qquad\nf(x) = \\begin{cases} x & \\text{si } x \\geq 0 \\\\ -x & \\text{si } x < 0 \\end{cases}\n$$\n\nSi en un documento no quieres que los dólares se conviertan en fórmulas (por ejemplo, si hablas de dinero), pon `matematicas: no` en los metadatos de arriba.\n\n## 23. Color en el texto y en el código\n\n### El código se colorea solo\n\nAl poner el nombre del lenguaje detrás de los acentos graves, las palabras se pintan según lo que son: los comentarios en gris, los textos en verde, los números en azul... y en la esquina aparece la etiqueta del lenguaje.\n\n<div class=\"demo\">\n\n```python\ndef saludar(nombre: str) -> str:\n    \"\"\"Devuelve un saludo.\"\"\"\n    total = 42 * 1.5          # un comentario\n    return f\"Hola, {nombre} ({total})\"\n```\n\n```json\n{ \"nombre\": \"informe\", \"paginas\": 12, \"borrador\": false, \"temas\": [\"a\", \"b\"] }\n```\n\n<\/div>\n\nSe reconocen: `javascript` `typescript` `json` `python` `css` `html` `bash` `yaml` `sql` `markdown` `diff` `ini` `java` `c` `cpp` `go` `rust` `php` `ruby` `lua`, con los apodos de siempre (`js`, `ts`, `py`, `sh`, `yml`, `jsonc`, `c++`, `golang`, `rb`...). Un lenguaje que no esté en la lista se muestra sin color, pero con su etiqueta.\n\n### Colores en el texto\n\nMarkdown por sí solo no tiene colores, pero como admite HTML hay dos maneras. La primera, con las clases que ya trae la plantilla:\n\n````md\nTexto en <span class=\"rojo\">rojo<\/span>, en <span class=\"verde\">verde<\/span>\ny en <span class=\"azul\">azul<\/span>.\n\n<span class=\"fondo\">resaltado con fondo<\/span> y <span class=\"recuadro\">en un recuadro<\/span>\n````\n\n<div class=\"demo\">\n\nTexto en <span class=\"rojo\">rojo<\/span>, en <span class=\"verde\">verde<\/span>, en <span class=\"azul\">azul<\/span>, en <span class=\"naranja\">naranja<\/span>, en <span class=\"morado\">morado<\/span>, en <span class=\"rosa\">rosa<\/span>, en <span class=\"cian\">cian<\/span> y en <span class=\"gris\">gris<\/span>.\n\n<span class=\"fondo\">con fondo<\/span> &nbsp; <span class=\"recuadro\">en un recuadro<\/span> &nbsp; <span class=\"grande\">más grande<\/span> &nbsp; <span class=\"pequeno\">más pequeño<\/span>\n\n<\/div>\n\nEstas clases se llevan bien con el tema oscuro y con la impresión, que es la ventaja de usarlas en vez de escribir el color a mano.\n\nLa segunda manera es poner el color directamente, útil para un tono concreto:\n\n````md\n<span style=\"color:#c2255c\">rosa fuerte<\/span>\n<span style=\"background:#fff3bf\">fondo amarillo<\/span>\n````\n\n<div class=\"demo\">\n\n<span style=\"color:#c2255c\">rosa fuerte<\/span> y <span style=\"background:#fff3bf\">fondo amarillo<\/span>\n\n<\/div>\n\n> [!TIP]\n> Los colores escritos a mano no cambian con el tema oscuro. Si el documento se va a leer de noche o se va a imprimir, es mejor usar las clases.\n\n### Color en las tablas y en los avisos\n\nDentro de una celda de tabla también valen las clases: escribe `<span class=\"verde\">Al día<\/span>` en la celda. Y para bloques enteros de color están los avisos del apartado 7 (`> [!NOTE]`, `> [!TIP]`, `> [!WARNING]`...), que ya vienen con su color y su icono.\n\n| Proyecto | Estado |\n| --- | --- |\n| Portal interno | <span class=\"verde\">Al día<\/span> |\n| Migración | <span class=\"naranja\">En riesgo<\/span> |\n| Facturación | <span class=\"rojo\">Parado<\/span> |\n\n## 24. Chuleta rápida\n\n| Para... | Se escribe |\n| --- | --- |\n| Título de nivel 2 | `## Texto` |\n| Negrita | `**texto**` |\n| Cursiva | `*texto*` |\n| Tachado | `~~texto~~` |\n| Resaltado | `==texto==` |\n| Código en línea | `` `texto` `` |\n| Bloque de código | tres acentos graves arriba y abajo |\n| Lista | `- punto` |\n| Lista numerada | `1. punto` |\n| Tarea | `- [ ] pendiente` |\n| Cita | `> texto` |\n| Aviso de color | `> [!WARNING]` |\n| Enlace | `[texto](direccion)` |\n| Imagen | `![descripción](archivo.jpg)` |\n| Tabla | `\\| a \\| b \\|` y debajo `\\| --- \\| --- \\|` |\n| Raya divisoria | `---` con una línea en blanco encima |\n| Nota al pie | `texto[^1]` y `[^1]: la nota` |\n| Salto de línea | dos espacios al final de la línea |\n| Índice automático | `[TOC]` |\n| Comentario invisible | `<!-- texto -->` |\n| Cambio de página | `<div class=\"salto-pagina\"><\/div>` |\n\n---\n\n## Empieza aquí\n\nBorra desde el primer título de esta página hasta esta línea y escribe lo tuyo. Si te quedas con la duda de cómo se escribía algo, abre el archivo original: sigue estando entero.\n\n"},{"id":"doc-en-blanco","cat":"documentos","archivo":"doc-en-blanco.md","nombre":"documento.md","titulo":"Documento en blanco","destino":"—","desc":"Portada con título, autor y fecha, y dos apartados vacíos. Nada más.","cuerpo":"---\ntitulo: Título del documento\nautor: Tu nombre\nfecha: \n---\n\nEscribe aquí.\n\n## Primer apartado\n\n## Segundo apartado\n"},{"id":"doc-informe","cat":"documentos","archivo":"doc-informe.md","nombre":"informe.md","titulo":"Informe","destino":"—","desc":"Resumen, datos, análisis, riesgos y una recomendación. Pensado para imprimir.","cuerpo":"---\ntitulo: Informe de [asunto]\nsubtitulo: Periodo [desde] – [hasta]\nautor: Tu nombre\nfecha: \n---\n\n## Resumen\n\nTres frases: qué se ha mirado, qué se ha encontrado y qué hay que decidir. Quien solo lea esto tiene que poder tomar la decisión.\n\n## Contexto\n\nPor qué se hace este informe y qué pasó antes.\n\n## Datos\n\n| Indicador | Periodo actual | Periodo anterior | Variación |\n| --- | ---: | ---: | ---: |\n|  |  |  |  |\n|  |  |  |  |\n\n> Fuente de los datos y fecha de extracción.\n\n## Análisis\n\nQué explica los números. Separa lo que sabes de lo que supones:\n\n- **Confirmado:** …\n- **Probable:** …\n- **Por comprobar:** …\n\n## Riesgos\n\n| Riesgo | Probabilidad | Impacto | Qué haríamos |\n| --- | :---: | :---: | --- |\n|  |  |  |  |\n\n## Recomendación\n\nUna opción, no tres. Di también qué se pierde al elegirla.\n\n## Próximos pasos\n\n- [ ] Acción — responsable — fecha\n- [ ] Acción — responsable — fecha\n"},{"id":"doc-acta-reunion","cat":"documentos","archivo":"doc-acta-reunion.md","nombre":"acta.md","titulo":"Acta de reunión","destino":"—","desc":"Decisiones y tareas con responsable y fecha, antes que el relato de lo que se dijo.","cuerpo":"---\ntitulo: Acta de la reunión de [tema]\nfecha: \n---\n\n**Asistentes:** …\n**Ausentes:** …\n**Duración:** …\n\n## Objetivo\n\nPara qué se convocó, en una frase.\n\n## Decisiones\n\n| Decisión | Quién decide | Fecha |\n| --- | --- | --- |\n|  |  |  |\n\n## Acuerdos y tareas\n\n- [ ] Tarea — **responsable** — fecha límite\n- [ ] Tarea — **responsable** — fecha límite\n\n## Temas tratados\n\n### [Tema 1]\n\nQué se planteó, qué se dijo y en qué quedó.\n\n### [Tema 2]\n\n## Sin resolver\n\nLo que quedó abierto y qué hace falta para cerrarlo.\n\n## Próxima reunión\n\nFecha, y qué hay que traer preparado.\n"},{"id":"doc-readme","cat":"documentos","archivo":"doc-readme.md","nombre":"README.md","titulo":"README de proyecto","destino":"README.md","desc":"Qué hace, cómo se instala, cómo se usa y qué variables acepta.","cuerpo":"# Nombre del proyecto\n\nUna frase: qué hace y para quién. Sin adjetivos.\n\n## Para qué sirve\n\nDos o tres frases sobre el problema que resuelve. Si hay una captura o un ejemplo de salida, va aquí.\n\n## Instalación\n\n```bash\ngit clone https://ejemplo.com/proyecto.git\ncd proyecto\nnpm install\n```\n\n**Requisitos:** Node 20 o superior.\n\n## Uso\n\nEl caso más común, completo y copiable:\n\n```bash\nnpm run dev\n```\n\nY el resultado que se espera ver.\n\n## Configuración\n\n| Variable | Por defecto | Para qué |\n| --- | --- | --- |\n| `PUERTO` | `3000` | Puerto del servidor |\n| `NIVEL_LOG` | `info` | `debug`, `info`, `warn`, `error` |\n\n## Desarrollo\n\n```bash\nnpm test          # pruebas\nnpm run check     # tipos y estilo\nnpm run build     # construir\n```\n\n## Estructura\n\n```\nsrc/\n├── api/      controladores HTTP\n├── dominio/  reglas de negocio\n└── datos/    acceso a base de datos\n```\n\n## Problemas conocidos\n\n- …\n\n## Licencia\n\nMIT. Ver [LICENSE](LICENSE).\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Make a README](https://www.makeareadme.com/) — qué secciones suele llevar un README y por qué.\n- [About the repository README file](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes) — GitHub: dónde busca el archivo (`.github`, raíz o `docs`) y cómo lo muestra.\n"},{"id":"doc-propuesta","cat":"documentos","archivo":"doc-propuesta.md","nombre":"propuesta.md","titulo":"Propuesta comercial","destino":"—","desc":"Problema, alcance con su lista de lo que NO incluye, fases, precio y validez.","cuerpo":"---\ntitulo: Propuesta de [servicio o proyecto]\nsubtitulo: Para [cliente]\nautor: Tu nombre\nfecha: \n---\n\n## El problema\n\nLo que le pasa hoy al cliente, dicho con **sus** palabras, no con las tuyas. Si esto no le suena verdadero, lo demás no importa.\n\n## Lo que proponemos\n\nUna descripción en lenguaje llano, sin nombres de tecnología. Qué va a poder hacer cuando esté terminado.\n\n## Alcance\n\n**Incluye**\n\n- …\n- …\n\n**No incluye**\n\n- …\n- …\n\nEsta segunda lista evita el 90% de los malentendidos: escríbela con cuidado.\n\n## Cómo lo haremos\n\n| Fase | Qué se entrega | Plazo |\n| --- | --- | --- |\n| 1. Descubrimiento |  | semana 1 |\n| 2. Construcción |  | semanas 2-5 |\n| 3. Puesta en marcha |  | semana 6 |\n\n## Qué necesitamos de ti\n\n- …\n- …\n\nSin esto, los plazos no se sostienen.\n\n## Inversión\n\n| Concepto | Importe |\n| --- | ---: |\n|  |  |\n| **Total** |  |\n\nForma de pago: …\n\n## Validez\n\nEsta propuesta es válida hasta el *[fecha]*.\n"},{"id":"doc-plan-proyecto","cat":"documentos","archivo":"doc-plan-proyecto.md","nombre":"plan.md","titulo":"Plan de proyecto","destino":"—","desc":"Objetivo medible, hitos, tareas, riesgos y registro de decisiones.","cuerpo":"---\ntitulo: Plan de [proyecto]\nautor: \nfecha: \n---\n\n## Objetivo\n\nQué será verdad cuando esto termine y hoy no lo es. Una frase medible.\n\n## Cómo sabremos que ha salido bien\n\n| Indicador | Hoy | Objetivo | Cuándo se mide |\n| --- | ---: | ---: | --- |\n|  |  |  |  |\n\n## Fuera de alcance\n\nLo que **no** vamos a hacer, aunque nos lo pidan. Se pacta ahora, no después.\n\n## Hitos\n\n| # | Hito | Fecha | Depende de |\n| :---: | --- | --- | --- |\n| 1 |  |  | — |\n| 2 |  |  | 1 |\n\n## Tareas\n\n- [ ] **Tarea** — responsable — fecha\n  - [ ] Subtarea\n- [ ] **Tarea** — responsable — fecha\n\n## Riesgos\n\n| Riesgo | Probabilidad | Impacto | Plan |\n| --- | :---: | :---: | --- |\n|  |  |  |  |\n\n## Decisiones tomadas\n\n| Fecha | Decisión | Por qué |\n| --- | --- | --- |\n|  |  |  |\n\n## Personas\n\n| Papel | Quién | Para qué se le consulta |\n| --- | --- | --- |\n|  |  |  |\n"},{"id":"doc-adr","cat":"documentos","archivo":"doc-adr.md","nombre":"001-decision.md","titulo":"Decisión de arquitectura (ADR)","destino":"docs/adr/001-titulo.md","desc":"Un archivo por decisión: contexto, opciones, qué se eligió y qué se acepta a cambio.","cuerpo":"---\ntitulo: \"ADR 001: [decisión en una frase]\"\nfecha: \n---\n\n**Estado:** propuesta · **aceptada** · sustituida por ADR-XXX · descartada\n\n<!-- Un ADR (registro de decisión de arquitectura) es un archivo por decisión,\n     numerado, que no se edita: si cambias de idea, escribes otro que lo sustituye.\n     Guardar en: docs/adr/001-titulo.md -->\n\n## Contexto\n\nQué situación obliga a decidir ahora. Hechos, no opiniones: restricciones, cifras, plazos, lo que ya existe.\n\n## Opciones consideradas\n\n### Opción A — [nombre]\n\n- A favor: …\n- En contra: …\n\n### Opción B — [nombre]\n\n- A favor: …\n- En contra: …\n\n### Opción C — no hacer nada\n\nQué pasa si lo dejamos como está. Esta opción siempre se evalúa.\n\n## Decisión\n\nElegimos **[opción]**.\n\nEl motivo, en dos o tres frases. Lo que importa aquí es el criterio, porque es lo que alguien necesitará dentro de dos años para entender por qué.\n\n## Consecuencias\n\n**Aceptamos que:**\n\n- …\n\n**A cambio ganamos:**\n\n- …\n\n**Habrá que revisarlo si:**\n\n- …\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Documenting Architecture Decisions](https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions) — Michael Nygard, 2011: el artículo que fijó el formato (contexto, decisión, estado, consecuencias).\n- [Architectural Decision Records](https://adr.github.io/) — plantillas, herramientas y variantes del formato.\n"},{"id":"doc-changelog","cat":"documentos","archivo":"doc-changelog.md","nombre":"CHANGELOG.md","titulo":"Registro de cambios","destino":"CHANGELOG.md","desc":"Formato Keep a Changelog: añadido, cambiado, obsoleto, eliminado, corregido y seguridad.","cuerpo":"# Registro de cambios\n\nFormato basado en [Keep a Changelog](https://keepachangelog.com/es-ES/1.1.0/).\nVersionado según [SemVer](https://semver.org/lang/es/).\n\n## [Sin publicar]\n\n### Añadido\n\n- …\n\n### Cambiado\n\n- …\n\n### Corregido\n\n- …\n\n## [1.2.0] — 2026-08-21\n\n### Añadido\n\n- Exportación a PDF desde la vista de informes.\n- Filtro por fecha en el listado de pedidos.\n\n### Cambiado\n\n- El buscador ahora ignora acentos y mayúsculas.\n\n### Obsoleto\n\n- El parámetro `orden` de la API; usa `ordenar_por`. Se retirará en la 2.0.\n\n### Corregido\n\n- Las fechas se mostraban en la zona horaria del servidor y no en la del usuario.\n\n### Seguridad\n\n- Se rotaron las claves de firma de sesión.\n\n## [1.1.0] — 2026-07-02\n\n### Añadido\n\n- Primera versión pública.\n\n<!-- Categorías: Añadido, Cambiado, Obsoleto, Eliminado, Corregido, Seguridad -->\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Mantenga un changelog](https://keepachangelog.com/es-ES/1.1.0/) — la versión 1.1.0 en español: orden, formato y las seis categorías.\n- [Versionado Semántico 2.0.0](https://semver.org/lang/es/) — cuándo sube la mayor, la menor y el parche.\n"},{"id":"doc-carta","cat":"documentos","archivo":"doc-carta.md","nombre":"carta.md","titulo":"Carta formal","destino":"—","desc":"Remitente, destinatario, asunto y tres párrafos: motivo, datos y petición.","cuerpo":"---\ntitulo: \nfecha: \n---\n\n<div style=\"text-align:right\">\n\n**[Tu nombre]**\n[Dirección]\n[Ciudad, código postal]\n[Correo] · [Teléfono]\n\n<\/div>\n\n[Ciudad], [fecha]\n\n**[Nombre del destinatario]**\n[Cargo]\n[Empresa]\n[Dirección]\n\n**Asunto:** [en cinco palabras]\n\nEstimado/a [nombre]:\n\nPrimer párrafo: el motivo de la carta, directo. Quien la lea tiene que saber en la primera línea de qué va y qué se espera de ella.\n\nSegundo párrafo: el desarrollo. Los datos concretos, las fechas, los importes, las referencias. Un asunto por párrafo.\n\nTercer párrafo: lo que pides, con la fecha en la que lo necesitas. Si no pides nada, dilo también.\n\nQuedo a la espera de su respuesta.\n\nAtentamente,\n\n<br><br>\n\n**[Tu nombre]**\n[Cargo]\n\n<!-- Adjuntos: -->\n"},{"id":"apa-articulo","cat":"academico","archivo":"apa-articulo.md","nombre":"articulo-apa.md","titulo":"Artículo de investigación (APA 7)","destino":"—","desc":"Portada de estudiante, resumen, método, resultados con tabla y figura, discusión y apéndices, con los cinco niveles de título.","cuerpo":"---\ntitulo: [Título del trabajo, claro y específico]\nsubtitulo: [Subtítulo, si lo hay]\nautor: Tu nombre\nfecha: \n---\n\n<style>\n/* Formato APA 7: márgenes de 2,54 cm, interlineado doble, sangría de primera\n   línea, títulos con el aspecto que pide la norma y sangría francesa en las\n   referencias. Esto solo cambia cómo se ve y cómo se imprime el documento.\n   Si no lo necesitas, borra este bloque entero. */\n@page{ margin:2.54cm }\n.documento > header.portada{ display:none }   /* la portada buena es la de abajo */\n.documento{ font-family:\"Times New Roman\", Times, Tinos, Liberation Serif, Georgia, serif; font-size:12pt }\n.documento p, .documento li{ line-height:2 }\n.documento p{ text-indent:1.27cm; text-align:left; margin:0 }\n.documento h1, .documento h2, .documento h3, .documento h4{\n  font-family:inherit; font-size:12pt; line-height:2; border:0; margin:0; padding:0;\n}\n.documento h1{ text-align:center; font-weight:700 }\n.documento h2{ text-align:left;   font-weight:700 }\n.documento h3{ text-align:left;   font-weight:700; font-style:italic }\n.documento h4{ text-align:left;   font-weight:700; text-indent:1.27cm }\n.documento blockquote{ margin:0 0 0 1.27cm; padding:0; border:0; background:none }\n.documento blockquote p{ text-indent:0 }\n.documento .portada p{ text-indent:0; text-align:center }\n.documento .referencias p{ text-indent:-1.27cm; padding-left:1.27cm }\n.documento .sin-sangria p{ text-indent:0 }\n.documento h1#resumen + p{ text-indent:0 }   /* el resumen va sin sangría */\n.documento table{ font-size:11pt }\n.documento table p{ text-indent:0; line-height:1.4 }\n<\/style>\n\n<p class=\"centrado\"><strong>[Título del trabajo: máximo unas 12 palabras, sin abreviaturas ni \"Un estudio sobre\"]<\/strong><\/p>\n\n<p class=\"centrado\">[Nombre y apellidos, tal como los tienes matriculados]<\/p>\n\n<p class=\"centrado\">[Facultad o departamento], [Universidad]<\/p>\n\n<p class=\"centrado\">[Código] [Nombre del curso]<\/p>\n\n<p class=\"centrado\">[Título y nombre del docente]<\/p>\n\n<p class=\"centrado\">[Día de mes de año de entrega]<\/p>\n\n> [!NOTE]\n> Así es la **portada de estudiante** de APA 7: seis bloques centrados, a doble espacio,\n> empezando a un tercio de la página. El título va en **negrita**; lo demás, en redonda.\n> La portada de estudiante **no lleva encabezado corto** (*running head*): eso es solo\n> para artículos que se mandan a una revista.\n\n<div class=\"salto-pagina\"><\/div>\n\n# Resumen\n\nEntre **150 y 250 palabras**, en un solo párrafo y **sin sangría**. Es el trabajo entero en\nminiatura, no una introducción. Escríbelo al final, cuando ya sepas qué encontraste.\n\nUna frase por cada cosa: el problema y por qué importa; el objetivo; a quién estudiaste y\ncómo; el resultado principal **con el dato**; y qué se concluye. Nada de citas, nada de\n\"se presentarán los resultados\".\n\n*Palabras clave:* [tres a cinco términos], [en minúscula], [separados por comas]\n\n<div class=\"salto-pagina\"><\/div>\n\n# [Título del trabajo]\n\n> [!TIP]\n> En APA 7 la introducción **no lleva el título \"Introducción\"**. Se repite el título del\n> trabajo, centrado y en negrita, y el texto empieza debajo. Si tu docente pide el rótulo\n> *Introducción*, úsalo aquí como título de nivel 1 y no discutas.\n\n**Primer párrafo: el problema.** Qué pasa, a quién le pasa y qué se ignora todavía. Empieza\npor lo concreto, no por \"desde tiempos inmemoriales\".\n\n**Segundo bloque: qué se sabe ya.** Una revisión breve y ordenada por ideas, no por autores.\nMal: \"López (2020) dice X. Ruiz (2021) dice Y\". Bien: \"La evidencia apunta a X (López, 2020;\nRuiz, 2021), aunque en poblaciones rurales el efecto se invierte (Chan, 2023)\".\n\n**Tercer bloque: el hueco.** La frase más importante del trabajo: qué no ha respondido nadie\ntodavía y por qué merece respuesta.\n\n**Último párrafo: objetivos e hipótesis.** Dilo sin rodeos: \"El objetivo de este estudio es\n[verbo en infinitivo] […]. Se plantea la hipótesis de que [predicción concreta y falsable]\".\n\n# Método\n\nSe escribe con el detalle suficiente para que otra persona pueda **repetir** el estudio.\nEn pasado y en voz activa: \"medimos\", \"aplicamos\", no \"se procedió a la aplicación de\".\n\n## Participantes\n\nCuántos, cómo los conseguiste y cómo son: edad (media y desviación típica), sexo, nivel\neducativo, procedencia, y los criterios de inclusión y exclusión. Di también cuántos\nabandonaron y por qué.\n\n## Instrumentos\n\nUn subapartado por instrumento. De cada uno: nombre completo, autoría y año, qué mide,\ncuántos ítems, con qué escala responde y **qué fiabilidad y validez** tiene, con la cita.\n\n### [Nombre del instrumento] ([Autoría], [año])\n\nDescribe la versión que usaste. Si la adaptaste o la tradujiste, dilo aquí y explica cómo.\n\n## Procedimiento\n\nEl orden real de los hechos: dónde, cuándo, en qué condiciones, quién administró qué y\ncuánto duró. Incluye el consentimiento informado y el aval del comité de ética.\n\n## Análisis de datos\n\nQué pruebas estadísticas usaste, para responder a qué pregunta, con qué programa y versión,\ny qué nivel de significación fijaste. Ejemplo: \"Se aplicó un ANOVA de medidas repetidas con\nun alfa de 0,05, usando jamovi 2.5\".\n\n# Resultados\n\nLos hallazgos, sin interpretarlos. Primero los descriptivos, después los contrastes. Cada\nresultado con su estadístico, sus grados de libertad, su valor *p* y su **tamaño del efecto**.\n\nEn el texto, apunta a la tabla en vez de repetirla: \"La Tabla 1 muestra […]\". Nunca escribas\n\"en la tabla de arriba\" o \"en la siguiente figura\".\n\n**Tabla 1**\n\n*Medias y desviaciones típicas de [variable] por grupo*\n\n| Grupo | *n* | *M* | *DT* | *t* | *p* |\n| --- | ---: | ---: | ---: | ---: | ---: |\n| Experimental |  |  |  |  |  |\n| Control |  |  |  |  |  |\n\n*Nota.* [Qué mide la variable y en qué unidades. Explica aquí cualquier abreviatura de la\ntabla.] *M* = media; *DT* = desviación típica.\n\nEn APA una tabla lleva, por este orden: el número en **negrita**, el título en *cursiva*\ndebajo, la tabla con líneas solo horizontales, y la nota al pie empezando por *Nota.*\n\n**Figura 1**\n\n*[Título de la figura, en cursiva y descriptivo]*\n\n![Descripción de la figura para quien no pueda verla](ruta/a/la-figura.png)\n\n*Nota.* [Qué se ve, qué representan los ejes y de dónde salen los datos. Si la figura es de\notra fuente, aquí va el permiso y la referencia.]\n\n> [!TIP]\n> Si la figura es un diagrama (un flujo de participantes, un modelo), puedes dibujarlo con un\n> bloque `mermaid` en vez de insertar una imagen. Se imprime igual de bien.\n\n# Discusión\n\n**Empieza respondiendo.** Primera frase: ¿se cumplió la hipótesis o no? Sin suspense.\n\n**Compara con la literatura.** Qué encaja con lo que ya se sabía y qué no. Cuando algo no\nencaja, propón una explicación en vez de esconderlo.\n\n## Limitaciones\n\nLas de verdad: tamaño de la muestra, diseño, instrumento, sesgo de selección. Di cómo afecta\ncada una a la conclusión. Una limitación sin consecuencia no es una limitación.\n\n## Implicaciones y líneas futuras\n\nQué debería cambiar alguien mañana por la mañana a raíz de esto, y qué estudio haría falta\npara responder lo que aquí quedó abierto. Concreto: no \"se sugiere seguir investigando\".\n\n## Conclusión\n\nDos o tres frases. Lo que se sabe ahora y no se sabía antes. Sin datos nuevos.\n\n<div class=\"salto-pagina\"><\/div>\n\n# Referencias\n\nOrden alfabético por el apellido del primer autor, **sangría francesa** y solo las obras que\nde verdad citaste en el texto. Nada de bibliografía \"de apoyo\".\n\n<div class=\"referencias\">\n\nApellido, A. A. (2023). Título del artículo en minúscula salvo la primera palabra.\n*Nombre de la Revista, 12*(3), 45-67. https://doi.org/10.xxxx/xxxxx\n\nApellido, B. B. y Apellido, C. C. (2021). *Título del libro en cursiva* (2.ª ed.). Editorial.\n\n<\/div>\n\n> [!TIP]\n> Ese `<div class=\"referencias\">` es lo que le da la **sangría francesa** a la lista: la\n> primera línea al margen y las siguientes metidas. Escribe cada referencia dentro, separada\n> por una línea en blanco.\n\n<div class=\"salto-pagina\"><\/div>\n\n# Apéndices\n\nVa aquí lo que interrumpiría la lectura: el cuestionario completo, el guion de entrevista,\nlas tablas largas, la sintaxis del análisis. Cada apéndice empieza en página nueva.\n\nSi hay uno solo, se rotula **Apéndice**. Si hay varios, **Apéndice A**, **Apéndice B**… en el\norden en que se mencionan en el texto. Y hay que mencionarlos: \"(ver Apéndice A)\".\n\n# Apéndice A: [Nombre del anexo]\n\n[Contenido.]\n\n<div class=\"salto-pagina\"><\/div>\n\n# Cómo se marcan los niveles de título\n\nAPA 7 tiene cinco niveles. En este documento se escriben con almohadillas, y la hoja de\nestilo se encarga del resto.\n\n| Nivel | Aspecto en APA 7 | Markdown |\n| :--- | :--- | :--- |\n| 1 | Centrado, **negrita**, empieza en párrafo nuevo | `#` |\n| 2 | A la izquierda, **negrita**, párrafo nuevo | `##` |\n| 3 | A la izquierda, ***negrita cursiva***, párrafo nuevo | `###` |\n| 4 | Sangrado, **negrita**, termina en punto, el texto sigue en la misma línea | `####` |\n| 5 | Sangrado, ***negrita cursiva***, termina en punto, el texto sigue en la misma línea | `#####` |\n\nReglas que se olvidan siempre:\n\n- Se usan **en orden**. No hay un nivel 3 sin un nivel 2 por encima.\n- Si una sección tiene un solo subapartado, no lo pongas: no se subdivide en uno.\n- *Método*, *Resultados*, *Discusión*, *Referencias* y *Apéndice* son siempre nivel 1.\n- En inglés los títulos van en *Title Case*. **En español se respeta la ortografía del\n  español**: mayúscula solo en la primera palabra y en los nombres propios.\n\n# Formato general del documento\n\nAPA 7 pide: **interlineado doble** en todo el trabajo (también en las referencias y en las\nnotas de las tablas), **sangría de primera línea de 1,27 cm** en cada párrafo, **márgenes de\n2,54 cm** en los cuatro lados y el **número de página arriba a la derecha** en todas.\n\n> [!IMPORTANT]\n> Nada de eso se escribe en el Markdown, y no hace falta que lo hagas: el bloque `<style>`\n> del principio de esta plantilla ya pone los márgenes de 2,54 cm, el interlineado doble, la\n> sangría de primera línea, la sangría francesa de las referencias y el aspecto de los cinco\n> niveles de título. Tú escribe el contenido.\n>\n> Lo único que no puede poner una hoja de estilo es el **número de página**: eso lo añade el\n> navegador. Al imprimir, activa *Encabezados y pies de página* en las opciones, o numera\n> después si tu facultad exige la posición exacta de APA (arriba a la derecha).\n\nTipografías que APA acepta, entre otras: Calibri 11, Arial 11, Times New Roman 12, Georgia 11.\nElige una y no la mezcles.\n"},{"id":"apa-ensayo","cat":"academico","archivo":"apa-ensayo.md","nombre":"ensayo-apa.md","titulo":"Ensayo académico (APA 7)","destino":"—","desc":"Tesis, tres argumentos con citas, objeción y conclusión, más cómo se arma un párrafo académico.","cuerpo":"---\ntitulo: [Título del ensayo]\nsubtitulo: [Asignatura o unidad, si hace falta]\nautor: Tu nombre\nfecha: \n---\n\n<style>\n/* Formato APA 7: márgenes de 2,54 cm, interlineado doble, sangría de primera\n   línea, títulos con el aspecto que pide la norma y sangría francesa en las\n   referencias. Esto solo cambia cómo se ve y cómo se imprime el documento.\n   Si no lo necesitas, borra este bloque entero. */\n@page{ margin:2.54cm }\n.documento > header.portada{ display:none }   /* la portada buena es la de abajo */\n.documento{ font-family:\"Times New Roman\", Times, Tinos, Liberation Serif, Georgia, serif; font-size:12pt }\n.documento p, .documento li{ line-height:2 }\n.documento p{ text-indent:1.27cm; text-align:left; margin:0 }\n.documento h1, .documento h2, .documento h3, .documento h4{\n  font-family:inherit; font-size:12pt; line-height:2; border:0; margin:0; padding:0;\n}\n.documento h1{ text-align:center; font-weight:700 }\n.documento h2{ text-align:left;   font-weight:700 }\n.documento h3{ text-align:left;   font-weight:700; font-style:italic }\n.documento h4{ text-align:left;   font-weight:700; text-indent:1.27cm }\n.documento blockquote{ margin:0 0 0 1.27cm; padding:0; border:0; background:none }\n.documento blockquote p{ text-indent:0 }\n.documento .portada p{ text-indent:0; text-align:center }\n.documento .referencias p{ text-indent:-1.27cm; padding-left:1.27cm }\n.documento .sin-sangria p{ text-indent:0 }\n.documento table{ font-size:11pt }\n.documento table p{ text-indent:0; line-height:1.4 }\n<\/style>\n\n<p class=\"centrado\"><strong>[Título del ensayo: que anuncie la postura, no solo el tema]<\/strong><\/p>\n\n<p class=\"centrado\">[Nombre y apellidos]<\/p>\n\n<p class=\"centrado\">[Facultad o departamento], [Universidad]<\/p>\n\n<p class=\"centrado\">[Código] [Nombre del curso]<\/p>\n\n<p class=\"centrado\">[Título y nombre del docente]<\/p>\n\n<p class=\"centrado\">[Día de mes de año de entrega]<\/p>\n\n> [!NOTE]\n> Portada de estudiante de APA 7: seis bloques centrados a doble espacio. El título en\n> **negrita**, el resto en redonda, y **sin encabezado corto**. Un ensayo de curso no lleva\n> resumen salvo que te lo pidan.\n\n<div class=\"salto-pagina\"><\/div>\n\n# [Título del ensayo]\n\nEn APA 7 la primera sección no se rotula \"Introducción\": se repite el título del trabajo\ncomo título de nivel 1. Si tu docente pide el rótulo, cámbialo y sigue.\n\n**Gancho.** Un dato, un caso o una tensión real. Dos frases, no más.\n\n**Contexto.** Lo mínimo para que se entienda el problema y por qué está en disputa.\n\n**Tesis.** Una sola frase, discutible y concreta. Es la promesa del ensayo:\n\n> [Afirmo que X, porque Y, aunque haya que aceptar Z.]\n\nSi tu tesis no admite que alguien esté en desacuerdo, no es una tesis: es un resumen.\n\n**Hoja de ruta.** Una frase que anuncie los tres apartados en el orden en que vienen.\n\n# Desarrollo\n\n## [Primer argumento: el que sostiene la tesis de forma más directa]\n\n**Idea.** La afirmación del apartado, en la primera frase. Sin calentamiento.\n\n**Evidencia.** El dato, el estudio o el texto que la respalda, **con su cita**. Ejemplo:\nSegún Ramírez et al. (2022), el efecto se mantiene incluso cuando se controla la variable\nsocioeconómica. También vale en paréntesis: el efecto se mantiene (Ramírez et al., 2022).\n\n**Interpretación.** Lo que hace que este párrafo sea tuyo: por qué esa evidencia prueba tu\nidea. Es lo que más se olvida y lo que más peso tiene en la nota.\n\n**Enlace.** Media frase que abra el siguiente apartado.\n\n## [Segundo argumento: el que añade una dimensión distinta]\n\nMismo patrón. Cambia la clase de evidencia: si el primero fue cuantitativo, que este sea un\ncaso, una fuente histórica o un argumento conceptual. Repetir el mismo tipo de prueba tres\nveces convence menos que variarla.\n\n## [Tercer apartado: la objeción y tu respuesta]\n\nAquí gana o pierde el ensayo. Enuncia la mejor objeción a tu tesis **en su versión fuerte**,\ncon quién la sostiene y su cita, y luego responde. Nunca la caricaturices para tumbarla\nfácil: quien corrige lo nota.\n\nFórmula que funciona: \"Se ha argumentado que [objeción] (Autor, año). El argumento es sólido\nen [lo que concede], pero no alcanza a explicar [el punto que tú defiendes], porque […]\".\n\n# Conclusión\n\nReformula la tesis con las palabras que has ganado por el camino, no copiando la\nintroducción. Después, dos cosas: qué implica esto para alguien que tenga que decidir algo, y\nqué queda abierto. **Nada de datos ni citas nuevas.**\n\n<div class=\"salto-pagina\"><\/div>\n\n# Referencias\n\nOrden alfabético, sangría francesa, y solo lo que citaste. Si aparece aquí, tiene que estar\nen el texto; si está en el texto, tiene que aparecer aquí.\n\n<div class=\"referencias\">\n\nApellido, A. A. (2022). Título del artículo, en minúscula salvo la primera palabra.\n*Nombre de la Revista, 15*(2), 33-51. https://doi.org/10.xxxx/xxxxx\n\nApellido, B. B. (2020). *Título del libro en cursiva*. Editorial.\n\nApellido, C. C. (2023, 14 de marzo). *Título de la página web*. Nombre del sitio.\nhttps://ejemplo.org/ruta\n\n<\/div>\n\n> [!TIP]\n> Ese `<div class=\"referencias\">` es lo que le da la **sangría francesa**: la primera línea\n> al margen y las siguientes metidas. Escribe cada referencia dentro, separada por una línea\n> en blanco.\n\n<div class=\"salto-pagina\"><\/div>\n\n# El párrafo académico, en cuatro movimientos\n\nTodo párrafo del desarrollo tiene la misma anatomía. Si te falta uno de los cuatro, el\npárrafo cojea.\n\n| Movimiento | Qué hace | Señal de que falta |\n| :--- | :--- | :--- |\n| **Idea** | Afirma algo discutible en la primera frase | El párrafo empieza con una cita |\n| **Evidencia** | Trae el dato o la fuente, citada | \"Es evidente que…\", \"todos sabemos\" |\n| **Interpretación** | Explica por qué esa evidencia prueba la idea | El párrafo acaba justo tras la cita |\n| **Enlace** | Encadena con el párrafo siguiente | Cada apartado parece de otro trabajo |\n\nComprobación rápida antes de entregar:\n\n- [ ] Puedo subrayar mi tesis en una sola frase de la introducción\n- [ ] Cada apartado del desarrollo defiende una idea distinta, no la misma tres veces\n- [ ] Ningún párrafo termina en una cita: siempre hablo yo al final\n- [ ] La objeción está en su versión fuerte, no en la fácil\n- [ ] Todas las citas del texto están en las referencias, y al revés\n- [ ] La conclusión no introduce material nuevo\n\n> [!WARNING]\n> Si un párrafo entero no tiene ninguna cita y tampoco es tuyo del todo, es una **paráfrasis\n> sin acreditar**. Se cita también cuando resumes con tus palabras: lo que se cita es la\n> idea, no las palabras.\n\n# Formato\n\nInterlineado doble, sangría de primera línea de 1,27 cm, márgenes de 2,54 cm y número de\npágina arriba a la derecha. En esta app eso lo pone la hoja de estilo **al imprimir**: tú\nescribe el texto y no te pelees con espacios ni tabulaciones.\n"},{"id":"apa-anteproyecto","cat":"academico","archivo":"apa-anteproyecto.md","nombre":"anteproyecto.md","titulo":"Anteproyecto de investigación (APA 7)","destino":"—","desc":"Problema, preguntas, objetivos, justificación, marco teórico, hipótesis, metodología y cronograma.","cuerpo":"---\ntitulo: [Título del anteproyecto]\nsubtitulo: Anteproyecto de investigación\nautor: Tu nombre\nfecha: \n---\n\n<style>\n/* Formato APA 7: márgenes de 2,54 cm, interlineado doble, sangría de primera\n   línea, títulos con el aspecto que pide la norma y sangría francesa en las\n   referencias. Esto solo cambia cómo se ve y cómo se imprime el documento.\n   Si no lo necesitas, borra este bloque entero. */\n@page{ margin:2.54cm }\n.documento > header.portada{ display:none }   /* la portada buena es la de abajo */\n.documento{ font-family:\"Times New Roman\", Times, Tinos, Liberation Serif, Georgia, serif; font-size:12pt }\n.documento p, .documento li{ line-height:2 }\n.documento p{ text-indent:1.27cm; text-align:left; margin:0 }\n.documento h1, .documento h2, .documento h3, .documento h4{\n  font-family:inherit; font-size:12pt; line-height:2; border:0; margin:0; padding:0;\n}\n.documento h1{ text-align:center; font-weight:700 }\n.documento h2{ text-align:left;   font-weight:700 }\n.documento h3{ text-align:left;   font-weight:700; font-style:italic }\n.documento h4{ text-align:left;   font-weight:700; text-indent:1.27cm }\n.documento blockquote{ margin:0 0 0 1.27cm; padding:0; border:0; background:none }\n.documento blockquote p{ text-indent:0 }\n.documento .portada p{ text-indent:0; text-align:center }\n.documento .referencias p{ text-indent:-1.27cm; padding-left:1.27cm }\n.documento .sin-sangria p{ text-indent:0 }\n.documento table{ font-size:11pt }\n.documento table p{ text-indent:0; line-height:1.4 }\n<\/style>\n\n<p class=\"centrado\"><strong>[Título: qué se estudia, en quién y dónde. Máximo unas 15 palabras]<\/strong><\/p>\n\n<p class=\"centrado\">[Nombre y apellidos]<\/p>\n\n<p class=\"centrado\">[Escuela o departamento], [Universidad]<\/p>\n\n<p class=\"centrado\">[Código] [Nombre del curso o seminario de tesis]<\/p>\n\n<p class=\"centrado\">[Título y nombre del asesor o docente]<\/p>\n\n<p class=\"centrado\">[Día de mes de año de entrega]<\/p>\n\n> [!NOTE]\n> Portada de estudiante de APA 7. En APA los títulos **no van numerados**; si tu facultad\n> exige la numeración clásica (1., 1.1, 1.1.1), añádela al texto de cada título y mantén el\n> mismo criterio en todo el documento.\n\n<div class=\"salto-pagina\"><\/div>\n\n# Planteamiento del problema\n\nTres movimientos, en este orden y sin adornos:\n\n**Qué pasa.** El hecho observable, con datos y con fuente. \"El 43 % de los estudiantes de\nprimer ingreso abandona antes del segundo año (MINEDUC, 2023).\" Nada de \"desde siempre el ser\nhumano\".\n\n**Por qué es un problema.** A quién perjudica y con qué consecuencia medible. Si nadie sale\nperjudicado, no hay problema que investigar.\n\n**Qué no se sabe.** El vacío concreto: qué han respondido otros y qué han dejado sin\nresponder. Esta frase es el corazón del anteproyecto y de ella salen las preguntas, los\nobjetivos y las hipótesis. Si no la tienes clara, nada de lo que sigue va a encajar.\n\nCierra delimitando: **qué** población, **dónde** y **en qué periodo**.\n\n# Preguntas de investigación\n\n**Pregunta general.** Una sola, y tiene que ser la traducción exacta del vacío que acabas de\ndescribir.\n\n> ¿[Qué relación existe entre X e Y en (población), durante (periodo)]?\n\n**Preguntas específicas.** Entre tres y cinco, cada una respondible con un dato que puedas\nrecoger de verdad.\n\n1. ¿[…]?\n2. ¿[…]?\n3. ¿[…]?\n\n> [!TIP]\n> Prueba de realidad: para cada pregunta, di en voz alta con qué instrumento la vas a\n> responder. Si no sabes contestar, la pregunta es un tema, no una pregunta.\n\n# Objetivos\n\n## Objetivo general\n\n> [Verbo en infinitivo] [el qué] [en quién] [dónde y cuándo].\n\nEjemplo: *Determinar la relación entre la carga académica y el abandono estudiantil en los\nalumnos de primer ingreso de la Facultad de Ingeniería durante el ciclo 2026.*\n\n## Objetivos específicos\n\n1. [Verbo en infinitivo] […]\n2. [Verbo en infinitivo] […]\n3. [Verbo en infinitivo] […]\n\n## Cómo se redactan\n\n- **Un solo verbo en infinitivo por objetivo**, al principio. Nada de \"analizar y evaluar\":\n  son dos objetivos.\n- El general se corresponde con la pregunta general; cada específico, con una pregunta\n  específica. **Misma cantidad y mismo orden.**\n- Los específicos, sumados, tienen que dar el general. Ni más ni menos.\n- Cada objetivo específico terminará siendo **un apartado de tus resultados**. Si no ves qué\n  tabla o qué hallazgo produce, sobra.\n\n| Verbos que sirven | Verbos que no |\n| :--- | :--- |\n| Determinar, identificar, describir, comparar, analizar, evaluar, establecer, diseñar, validar, medir, caracterizar | Conocer, saber, entender, comprender, estudiar, profundizar, concienciar, mejorar |\n\nLos de la derecha no sirven porque no se puede demostrar que los cumpliste.\n\n# Justificación\n\nCuatro preguntas, un párrafo cada una:\n\n**Conveniencia.** ¿Para qué sirve esto? ¿Quién usa el resultado?\n\n**Relevancia social o práctica.** ¿A quién beneficia y de qué forma concreta?\n\n**Valor teórico.** ¿Qué aporta a lo que ya se sabe? ¿Llena un vacío, pone a prueba una teoría\nen otro contexto, propone algo nuevo?\n\n**Viabilidad.** ¿Tienes acceso a la población, tiempo, presupuesto y permisos? Sé honesto:\nun anteproyecto inviable se cae en la defensa.\n\n# Marco teórico y antecedentes\n\n## Antecedentes\n\nEstudios previos sobre tu mismo problema, ordenados **de lo general a lo cercano**:\ninternacionales, nacionales y locales. De cada uno: autor y año, qué hizo, con quién, qué\nencontró y **qué te deja a ti**. Un párrafo por estudio, no una ficha bibliográfica.\n\nÚltimos cinco años, salvo los clásicos fundacionales.\n\n## Bases teóricas\n\nLa teoría o el modelo desde el que miras el problema, y **por qué ese y no otro**. Aquí se\ndefine cada concepto que vas a usar, siempre con su cita. Organiza por conceptos, no por\nautores.\n\n## Definición de términos\n\nTérminos técnicos o locales que quien lee podría no compartir contigo.\n\nDeserción estudiantil\n: [La definición operativa que vas a usar en este trabajo, con su cita.]\n\n[Otro término]\n: [Su definición.]\n\n# Hipótesis y variables\n\n## Hipótesis\n\n**H1.** [Predicción concreta, direccional y falsable: \"A mayor X, menor Y en (población)\".]\n\n**H0.** [La hipótesis nula: no existe relación entre X e Y.]\n\n> [!NOTE]\n> No todos los estudios llevan hipótesis. En investigación **cualitativa** y en estudios\n> **descriptivos** normalmente no se plantean: se sustituyen por supuestos o directamente se\n> trabaja solo con las preguntas. Si tu alcance es exploratorio, dilo y sigue adelante.\n\n## Operacionalización de las variables\n\nEs la tabla que convierte una idea abstracta en algo que se puede medir. Si no puedes\nllenarla, todavía no tienes un proyecto de investigación.\n\n| Variable | Definición conceptual | Definición operacional | Indicadores | Escala |\n| :--- | :--- | :--- | :--- | :--- |\n| [Independiente] | [Qué es, según la teoría, con cita] | [Cómo la vas a medir en la práctica] | [Qué observas: ítems, conductas, registros] | [Nominal / ordinal / de intervalo / de razón] |\n| [Dependiente] |  |  |  |  |\n| [Interviniente o de control] |  |  |  |  |\n\nCómo se llena cada columna:\n\n- **Definición conceptual:** la que da la teoría. Va **citada**, no inventada.\n- **Definición operacional:** el puente. \"Puntaje total del cuestionario X, de 0 a 40 puntos.\"\n- **Indicadores:** las señales concretas que observas o preguntas. Los ítems del instrumento\n  salen de aquí.\n- **Escala:** determina qué pruebas estadísticas podrás usar después. Elígela ahora, no\n  cuando ya tengas los datos.\n\nSi tu instrumento es un cuestionario, añade una columna **Ítems** con los números.\n\n# Metodología\n\n## Enfoque\n\n[Cuantitativo, cualitativo o mixto], **porque** [la razón viene de tu pregunta, no de tu\ncomodidad]. Las preguntas de \"cuánto\" y \"qué relación\" piden cuantitativo; las de \"cómo\" y\n\"por qué vivido\" piden cualitativo.\n\n## Alcance\n\n[Exploratorio, descriptivo, correlacional o explicativo]. El alcance tiene que ser el mismo\nque prometen tus objetivos: si el objetivo dice \"determinar la relación\", el alcance es\ncorrelacional, y entonces no puedes concluir causalidad.\n\n## Diseño\n\n[Experimental (preexperimental, cuasiexperimental o experimental puro) o no experimental\n(transversal o longitudinal). En cualitativo: fenomenológico, etnográfico, teoría\nfundamentada, estudio de caso o investigación-acción.]\n\nDescribe qué implica ese diseño en tu caso concreto, no lo que dice el manual.\n\n## Población y muestra\n\n**Población.** [Quiénes son, cuántos son y de dónde sale ese número. Cita la fuente.]\n\n**Criterios de inclusión.** [Quién entra.]\n\n**Criterios de exclusión.** [Quién queda fuera y por qué.]\n\n**Muestra.** [Tamaño, y cómo llegaste a él: fórmula, cálculo de potencia, saturación teórica\no criterio del asesor. Di cuál.]\n\n**Tipo de muestreo.**\n\n| Familia | Tipos | Cuándo se usa |\n| :--- | :--- | :--- |\n| Probabilístico | Aleatorio simple, sistemático, estratificado, por conglomerados | Quieres generalizar a la población |\n| No probabilístico | Por conveniencia, por cuotas, bola de nieve, por criterio o teórico | No hay marco muestral, o el estudio es cualitativo |\n\nSi usas muestreo no probabilístico, **dilo claramente y asume la consecuencia**: los\nresultados no se generalizan. Es preferible a fingir que sí.\n\n## Técnicas e instrumentos\n\n| Técnica | Instrumento | A quién se aplica | Qué objetivo responde |\n| :--- | :--- | :--- | :--- |\n| Encuesta | Cuestionario de [nombre] | [Muestra] | Objetivo específico 1 |\n| Entrevista | Guion semiestructurado | [Informantes clave] | Objetivo específico 2 |\n| Observación | Lista de cotejo | [Contexto] | Objetivo específico 3 |\n\nDe cada instrumento: autoría y año si es prestado, número de ítems, escala de respuesta y\n**cómo garantizas su validez y su confiabilidad** (juicio de expertos, prueba piloto, alfa de\nCronbach). Si lo construyes tú, dedica un párrafo entero a esto.\n\n## Procedimiento\n\nLas fases en el orden en que van a ocurrir, con lo que se produce en cada una.\n\n1. **Gestión de permisos.** [Autoridades, comité de ética, cartas.]\n2. **Validación del instrumento.** [Expertos y prueba piloto con n = …]\n3. **Recolección de datos.** [Cómo, dónde, en cuánto tiempo.]\n4. **Depuración y codificación.** [Qué haces con los casos incompletos.]\n5. **Análisis.** […]\n6. **Redacción del informe final.** […]\n\n## Plan de análisis de datos\n\n**Cuantitativo.** Qué estadísticos descriptivos, qué pruebas de contraste y para qué\nhipótesis, con qué nivel de significación y en qué programa. Ejemplo: *frecuencias y medias\npara el objetivo 1; correlación de Pearson para H1, con alfa de 0,05, en jamovi 2.5.*\n\n**Cualitativo.** Cómo transcribes, cómo codificas (abierta, axial, selectiva), cómo llegas a\nlas categorías y cómo aseguras el rigor (triangulación, verificación con los participantes,\nauditoría del asesor).\n\n# Consideraciones éticas\n\n- **Consentimiento informado** por escrito, explicando objetivo, uso de los datos y derecho a\n  retirarse en cualquier momento sin consecuencias. El formato va en anexos.\n- **Menores de edad:** consentimiento del padre, madre o tutor **y asentimiento del menor**.\n  Las dos cosas.\n- **Confidencialidad y anonimato.** Cómo se sustituyen los nombres, quién tiene acceso a los\n  datos crudos, dónde se guardan y cuándo se destruyen.\n- **Aval institucional.** Comité de ética o autoridad de la institución donde recojas datos.\n- **Riesgos y beneficios.** Qué riesgo corre el participante y qué se hace si aparece un caso\n  que requiera derivación.\n- **Devolución de resultados.** Qué reciben los participantes y la institución al terminar.\n- **Conflicto de interés y financiamiento.** Decláralo aunque sea \"ninguno\".\n- **Integridad académica.** Citas correctas, y declaración del uso de herramientas de IA si tu\n  universidad lo exige.\n\n# Cronograma\n\nMarca con **X** las semanas o los meses de cada actividad. Deja siempre holgura: el trabajo de\ncampo se atrasa, no es una posibilidad, es una certeza.\n\n| Actividad | M1 | M2 | M3 | M4 | M5 | M6 |\n| :--- | :-: | :-: | :-: | :-: | :-: | :-: |\n| Revisión de literatura | X | X |  |  |  |  |\n| Elaboración del instrumento |  | X |  |  |  |  |\n| Validación y prueba piloto |  |  | X |  |  |  |\n| Permisos y consentimientos |  |  | X |  |  |  |\n| Recolección de datos |  |  |  | X | X |  |\n| Procesamiento y análisis |  |  |  |  | X | X |\n| Redacción del informe |  |  |  |  |  | X |\n| Entrega y defensa |  |  |  |  |  | X |\n\n> [!TIP]\n> Si prefieres un diagrama de Gantt en vez de la tabla, este documento admite bloques\n> `mermaid`. Cambia las fechas y borra la tabla de arriba.\n\n```mermaid\ngantt\n    dateFormat YYYY-MM-DD\n    title Cronograma\n    section Preparacion\n    Revision de literatura :a1, 2026-02-01, 45d\n    Instrumento y pilotaje :a2, after a1, 30d\n    section Campo\n    Recoleccion de datos :a3, after a2, 45d\n    section Cierre\n    Analisis y redaccion :a4, after a3, 45d\n```\n\n# Presupuesto\n\nPon la moneda en el encabezado de la columna (Q, EUR, USD) y no la repitas en cada fila.\n\n| Rubro | Cantidad | Costo unitario (Q) | Total (Q) |\n| :--- | ---: | ---: | ---: |\n| Impresión de instrumentos |  |  |  |\n| Transporte y viáticos |  |  |  |\n| Licencias de software |  |  |  |\n| Incentivos a participantes |  |  |  |\n| Transcripción de entrevistas |  |  |  |\n| Imprevistos (10 %) |  |  |  |\n| **Total** |  |  |  |\n\nDi también **quién paga**: fondos propios, beca, financiamiento institucional. Y si algo es\naportado en especie, ponlo con valor cero pero ponlo.\n\n<div class=\"salto-pagina\"><\/div>\n\n# Referencias\n\nOrden alfabético, sangría francesa y formato APA 7. Solo lo citado en el texto.\n\n<div class=\"referencias\">\n\nApellido, A. A. (2023). Título del artículo en minúscula salvo la primera palabra.\n*Nombre de la Revista, 12*(3), 45-67. https://doi.org/10.xxxx/xxxxx\n\nApellido, B. B. y Apellido, C. C. (2021). *Título del libro en cursiva* (2.ª ed.). Editorial.\n\nInstitución. (2023). *Título del informe en cursiva*. https://ejemplo.org/informe\n\n<\/div>\n\n> [!TIP]\n> Ese `<div class=\"referencias\">` es lo que le da la **sangría francesa**: la primera línea\n> al margen y las siguientes metidas. Escribe cada referencia dentro, separada por una línea\n> en blanco.\n\n<div class=\"salto-pagina\"><\/div>\n\n# Anexos\n\nUno por página, en el orden en que se mencionan en el texto. Menciónalos: \"(ver Anexo A)\".\n\n- **Anexo A.** Formato de consentimiento informado\n- **Anexo B.** Instrumento completo\n- **Anexo C.** Guion de entrevista\n- **Anexo D.** Constancia de validación por expertos\n- **Anexo E.** Carta de autorización de la institución\n\n<div class=\"salto-pagina\"><\/div>\n\n# Antes de entregar\n\n- [ ] La pregunta general, el objetivo general y la hipótesis hablan de **las mismas\n      variables** y de la misma población\n- [ ] Hay tantos objetivos específicos como preguntas específicas, en el mismo orden\n- [ ] Todos los objetivos empiezan con un verbo en infinitivo demostrable\n- [ ] Cada variable de la hipótesis aparece en la tabla de operacionalización\n- [ ] Cada objetivo específico tiene un instrumento que lo responde\n- [ ] El alcance declarado no promete más de lo que el diseño puede demostrar\n- [ ] El cronograma cabe en el tiempo real que te queda\n- [ ] Todas las citas del texto están en las referencias, y al revés\n- [ ] Interlineado doble, márgenes de 2,54 cm y sangría de 1,27 cm: en esta app eso se\n      aplica **al imprimir**, no se escribe en el texto\n"},{"id":"apa-citas","cat":"academico","archivo":"apa-citas.md","nombre":"citas-apa.md","titulo":"Citas y referencias (APA 7)","destino":"—","desc":"Chuleta de consulta: cómo se cita cada fuente dentro del texto y cómo se escribe en la lista final.","cuerpo":"---\ntitulo: Citas y referencias en APA 7\nsubtitulo: Chuleta de consulta rápida\nautor: \nfecha: \n---\n\nDocumento de consulta. Busca el caso que tienes delante, copia el patrón y cambia los datos.\nTodo lo que hay aquí es **APA 7.ª edición** (2019), no APA 6.\n\n> [!IMPORTANT]\n> **La regla de oro:** todo lo que citas en el texto está en las referencias, y todo lo que\n> está en las referencias se cita en el texto. Sin excepciones (salvo la comunicación\n> personal, que solo va en el texto).\n\n> [!NOTE]\n> **Escribiendo en español se usa `y`, no `&`**, tanto en el texto como en las referencias:\n> (García y López, 2021). El signo `&` es del APA en inglés. Algunas facultades lo exigen\n> igualmente; mira la guía de la tuya antes de entregar.\n\n# 1. Las dos formas de citar\n\nToda cita en APA lleva **autor y año**. Solo cambia dónde los pones.\n\n**Cita parentética.** Los dos datos van dentro del paréntesis, al final de la idea.\n\n> El efecto se mantiene en muestras rurales (Chan, 2023).\n\n**Cita narrativa.** El autor forma parte de la frase y el año va detrás, entre paréntesis.\n\n> Chan (2023) encontró que el efecto se mantiene en muestras rurales.\n\n| Cuándo usar cuál | Forma |\n| :--- | :--- |\n| El dato importa más que quién lo dijo | Parentética |\n| Quién lo dijo importa (contraste de posturas, autoridad) | Narrativa |\n| Varias fuentes apoyan lo mismo | Parentética, todas juntas |\n\n# 2. Según cuántos autores\n\n| Autores | En el texto (parentética) | Narrativa |\n| :--- | :--- | :--- |\n| Uno | (Molina, 2021) | Molina (2021) |\n| Dos | (Molina y Serrano, 2021) | Molina y Serrano (2021) |\n| Tres o más | (Molina et al., 2021) | Molina et al. (2021) |\n\nCon tres o más autores se usa **et al. desde la primera cita**. Esto cambió respecto a APA 6,\ndonde la primera vez se listaban todos.\n\n- `et al.` va **sin cursiva**, con punto solo detrás de *al*.\n- Si dos obras distintas se abrevian igual —Molina, Ruiz y Paz (2021) y Molina, Vega y Soto\n  (2021)—, añade los apellidos necesarios para distinguirlas: (Molina, Ruiz et al., 2021) y\n  (Molina, Vega et al., 2021).\n\n# 3. Casos especiales\n\n## Autor corporativo con siglas\n\nPrimera cita, con la sigla entre corchetes; a partir de ahí, solo la sigla.\n\n> Primera vez: (Organización Mundial de la Salud [OMS], 2022)\n>\n> Después: (OMS, 2022)\n>\n> Narrativa la primera vez: la Organización Mundial de la Salud (OMS, 2022) advirtió que…\n\nSi la organización se cita una sola vez en todo el trabajo, no introduzcas la sigla.\n\n## Obra sin autor\n\nSe cita por el **título**, abreviado a las primeras palabras. Entre comillas si es un\nartículo, un capítulo o una página web; en cursiva si es un libro o un informe.\n\n> (\"Nuevas rutas migratorias\", 2023)\n>\n> (*Diccionario de psicología*, 2020)\n\nSi la obra la firma \"Anónimo\" de forma explícita, entonces sí: (Anónimo, 2019).\n\n## Obra sin fecha\n\n> (Ramírez, s. f.)\n\n`s. f.` = sin fecha, con espacio y en minúscula. En la referencia se escribe igual.\n\n## Dos obras del mismo autor y el mismo año\n\nSe distinguen con letras pegadas al año. El orden de las letras lo marca el **orden\nalfabético de los títulos** en la lista de referencias, no el orden en que las citas.\n\n> (Vargas, 2024a) … (Vargas, 2024b)\n>\n> Ambas: (Vargas, 2024a, 2024b)\n\n## Varias obras en el mismo paréntesis\n\nOrden alfabético, separadas por **punto y coma**.\n\n> (Díaz, 2019; Molina y Serrano, 2021; Vargas, 2024)\n\nDel mismo autor, varias fechas: se pone el apellido una vez y los años ordenados de la más\nantigua a la más reciente.\n\n> (Molina, 2015, 2019, 2021)\n>\n> (Molina, s. f., 2019, en prensa)\n\n# 4. Citas textuales\n\n## Corta: menos de 40 palabras\n\nVa en el párrafo, entre **comillas**, y siempre con **número de página**.\n\n> Parentética: El aprendizaje \"no ocurre por acumulación sino por reorganización\"\n> (Torres, 2020, p. 45).\n>\n> Narrativa: Torres (2020) sostuvo que el aprendizaje \"no ocurre por acumulación sino por\n> reorganización\" (p. 45).\n\nFíjate dónde cae el punto: **comillas, paréntesis y después el punto**. Nunca dentro.\n\n## En bloque: 40 palabras o más\n\nSin comillas, en un bloque aparte con sangría de 1,27 cm y a doble espacio. Y aquí el punto\ncambia de sitio: **el punto va antes del paréntesis**.\n\n> La memoria de trabajo no es un almacén sino un espacio de operación, y su límite no se mide\n> en unidades de información sino en cantidad de manipulación simultánea que el sistema puede\n> sostener sin degradarse. Esa distinción explica por qué dos tareas de la misma extensión\n> resultan tan desiguales en dificultad. (Torres, 2020, p. 112)\n\nSi presentas la cita en bloque con el autor en la frase, en el paréntesis final solo va la\npágina: `(p. 112)`.\n\n## Página, páginas y párrafo\n\n| Qué tienes | Cómo se escribe |\n| :--- | :--- |\n| Una página | p. 45 |\n| Varias páginas seguidas | pp. 45-47 |\n| Páginas sueltas | pp. 45, 52 |\n| Sin paginación (web, vídeo) | párr. 4 |\n| Sin paginación, con apartados | sección Método, párr. 2 |\n| Vídeo o audio | 12:35 |\n\n# 5. Paráfrasis\n\nDecir la idea de otro con tus palabras **también se cita**. Se cita la idea, no las palabras.\n\n> Torres (2020) explicó que el aprendizaje reorganiza lo que ya se sabe en lugar de sumarle\n> información nueva.\n\nEl número de página es opcional en la paráfrasis, pero APA lo **recomienda** si la obra es\nlarga y quieres ayudar a quien busque el pasaje.\n\n> [!WARNING]\n> Cambiar cuatro palabras y dejar la estructura de la frase original no es parafrasear: es\n> plagio con sinónimos. O lo reescribes de verdad, o lo pones entre comillas.\n\n# 6. Cita de cita (fuente secundaria)\n\nCuando citas algo que leíste dentro de otra obra porque no pudiste acceder al original.\nPrimero intenta encontrar el original: APA pide usar esto **lo mínimo**.\n\n> Watson y Rayner (1920, como se citó en Torres, 2020) demostraron que…\n>\n> (Watson y Rayner, 1920, como se citó en Torres, 2020)\n\nEn la lista de referencias va **solo la obra que sí leíste** (Torres, 2020). La original, no.\n\n# 7. Comunicación personal\n\nEntrevistas, correos, mensajes, clases, conversaciones: cosas que quien te lee no puede\nrecuperar. Se citan **solo en el texto** y no se incluyen en las referencias.\n\n> (J. Pérez, comunicación personal, 15 de marzo de 2024)\n>\n> J. Pérez (comunicación personal, 15 de marzo de 2024) confirmó que…\n\nIniciales del nombre, apellido y **fecha exacta**.\n\n# 8. Inteligencia artificial generativa\n\nAPA trata la respuesta de un modelo como el resultado de un algoritmo: el autor es **la\nempresa que lo hizo**, no el modelo. Se cita como software.\n\n> (OpenAI, 2025)\n>\n> Anthropic (2025) generó la clasificación inicial de los códigos.\n\nComo la conversación no la puede recuperar nadie más, APA recomienda **incluir el prompt\ncompleto y la respuesta en un apéndice** y remitir a él desde el texto. Y antes de nada:\ncomprueba si tu universidad permite el uso y qué exige declarar.\n\n<div class=\"salto-pagina\"><\/div>\n\n# 9. Las referencias, tipo por tipo\n\nEn cada bloque: primero el patrón, después el ejemplo con las cursivas ya puestas.\n\n## Libro\n\n```text\nApellido, A. A. (Año). Título del libro en cursiva (X.ª ed.). Editorial. DOI o URL\n```\n\n> Kahneman, D. (2012). *Pensar rápido, pensar despacio* (J. Chamorro, Trad.). Debate.\n> (Obra original publicada en 2011)\n\nEn APA 7 **ya no se pone la ciudad** de la editorial. La edición solo se indica si no es la\nprimera.\n\n## Libro con editor o coordinador\n\n```text\nApellido, A. A. y Apellido, B. B. (Eds.). (Año). Título del libro en cursiva. Editorial.\n```\n\n> Castro, L. y Ruiz, M. (Eds.). (2021). *Métodos mixtos en investigación educativa*. Morata.\n\n## Capítulo de libro editado\n\n```text\nApellido, A. A. (Año). Título del capítulo. En B. B. Editor (Ed.), Título del libro\nen cursiva (pp. xx-xx). Editorial.\n```\n\n> Núñez, P. (2021). El muestreo en estudios cualitativos. En L. Castro y M. Ruiz (Eds.),\n> *Métodos mixtos en investigación educativa* (pp. 87-114). Morata.\n\nFíjate: las iniciales del editor van **delante** del apellido, al revés que en el autor.\n\n## Artículo de revista con DOI\n\n```text\nApellido, A. A., Apellido, B. B. y Apellido, C. C. (Año). Título del artículo.\nNombre de la Revista, vol(núm.), pp-pp. https://doi.org/10.xxxx/xxxxx\n```\n\n> Ramírez, S., Chan, L. y Vargas, T. (2022). Carga cognitiva y rendimiento lector en\n> educación primaria. *Revista de Psicología Educativa, 28*(3), 145-162.\n> https://doi.org/10.1234/rpe.2022.283\n\nEl **volumen va en cursiva junto al nombre de la revista**; el número entre paréntesis,\n**no**. El DOI se escribe siempre como enlace completo, sin \"doi:\" ni \"Recuperado de\".\n\n## Artículo de revista sin DOI\n\n```text\nApellido, A. A. (Año). Título del artículo. Nombre de la Revista, vol(núm.), pp-pp. URL\n```\n\n> Ferrer, N. (2020). La escritura académica como proceso.\n> *Cuadernos de Educación, 12*(1), 22-38. https://cuadernos.edu/12-1/ferrer\n\nSi lo sacaste de una base de datos académica (Scopus, EBSCO, ProQuest) y no tiene DOI,\n**termina en las páginas**: no se pone la URL de la base de datos.\n\n## Artículo de periódico\n\n```text\nApellido, A. A. (Año, día de mes). Título del artículo. Nombre del Periódico. URL\n```\n\n> Sandoval, R. (2024, 12 de febrero). La matrícula universitaria cae por tercer año.\n> *El Observador*. https://elobservador.com/matricula-2024\n\nEl nombre del periódico va en cursiva; el titular, no.\n\n## Página web\n\n```text\nApellido, A. A. o Institución. (Año, día de mes). Título de la página en cursiva.\nNombre del sitio. URL\n```\n\n> Ministerio de Educación. (2023, 5 de septiembre). *Calendario escolar 2024*.\n> https://mineduc.gob/calendario-2024\n\nSi el autor y el sitio son el mismo, **el nombre del sitio se omite**, como en el ejemplo.\nSolo se añade fecha de recuperación cuando el contenido cambia y no queda archivado:\n`Recuperado el 5 de mayo de 2024, de https://…`\n\n## Informe institucional\n\n```text\nInstitución. (Año). Título del informe en cursiva (Informe n.º xxx). Editorial. URL\n```\n\n> Organización Mundial de la Salud. (2022). *Informe mundial sobre salud mental:\n> Transformar la salud mental para todos*. https://www.who.int/publications/i/item/9789240050860\n\nSi la institución que publica es la misma que firma, no se repite como editorial.\n\n## Tesis\n\n```text\nApellido, A. A. (Año). Título de la tesis en cursiva [Tesis doctoral, Universidad].\nNombre del repositorio. URL\n```\n\n> Aguilar, M. (2023). *Alfabetización digital en zonas rurales* [Tesis doctoral,\n> Universidad de San Carlos de Guatemala]. Repositorio USAC. https://repositorio.usac.edu.gt/12345\n\nSi no está publicada ni depositada: `[Tesis de maestría no publicada]. Nombre de la Universidad.`\n\n## Ley o norma\n\n```text\nNombre completo de la norma, número y fecha. (Año). Publicación oficial. URL\n```\n\n> Ley de Protección Integral de la Niñez y Adolescencia, Decreto 27-2003. (2003).\n> Diario de Centro América. https://www.congreso.gob.gt/decreto-27-2003\n\n> [!WARNING]\n> Las referencias legales de APA siguen el estilo jurídico **de Estados Unidos**, que no\n> encaja con la legislación hispanohablante. Cada universidad adapta el formato: usa el\n> patrón de arriba solo si la tuya no te da uno propio, y sé consistente en todo el trabajo.\n\n## Vídeo de YouTube\n\n```text\nNombre del canal. (Año, día de mes). Título del vídeo en cursiva [Vídeo]. YouTube. URL\n```\n\n> TED-Ed. (2021, 8 de junio). *Cómo funciona la memoria de trabajo* [Vídeo]. YouTube.\n> https://www.youtube.com/watch?v=abc123\n\nEl autor es **quien subió el vídeo**, aunque sea un canal. Si conoces el nombre real:\n`Apellido, A. A. [Nombre del canal].`\n\n## Pódcast\n\n```text\nApellido, A. A. (Anfitrión). (Año, día de mes). Título del episodio (n.º 42)\n[Episodio de pódcast de audio]. En Título del pódcast en cursiva. Productora. URL\n```\n\n> Molina, C. (Anfitriona). (2024, 3 de abril). Aprender sin memorizar (n.º 87)\n> [Episodio de pódcast de audio]. En *Aula abierta*. Radio Universidad.\n> https://aulaabierta.fm/87\n\nPara el pódcast entero: `(Anfitrión). (2019-actualidad). Título en cursiva [Pódcast de audio]. Productora. URL`\n\n## Publicación en red social\n\n```text\nApellido, A. A. [@usuario]. (Año, día de mes). Primeras veinte palabras de la publicación\nen cursiva [Publicación] [Imagen adjunta]. Nombre de la red. URL\n```\n\n> Organización Panamericana de la Salud [@opsoms]. (2024, 21 de mayo). *La cobertura de\n> vacunación en la región recuperó los niveles previos a la pandemia según el informe*\n> [Publicación]. X. https://x.com/opsoms/status/123456789\n\nSe conserva la ortografía original, emojis incluidos. El corchete describe el formato:\n`[Publicación]`, `[Imagen adjunta]`, `[Vídeo]`, `[Estado]`.\n\n## Software o aplicación\n\n```text\nAutor o empresa. (Año). Nombre del software en cursiva (Versión x.x) [Software]. URL\n```\n\n> Corporation for Digital Scholarship. (2024). *Zotero* (Versión 7.0) [Software].\n> https://www.zotero.org\n\nEl software de uso común (Word, Excel, un navegador) **no se referencia**: se menciona en el\ntexto y ya. Se referencia el especializado: SPSS, jamovi, R, Atlas.ti.\n\n## Conjunto de datos\n\n```text\nApellido, A. A. o Institución. (Año). Título del conjunto de datos en cursiva\n(Versión 1.2) [Conjunto de datos]. Editorial. DOI o URL\n```\n\n> Instituto Nacional de Estadística. (2023). *Encuesta nacional de empleo e ingresos 2023*\n> [Conjunto de datos]. https://www.ine.gob/enei-2023\n\n## Inteligencia artificial generativa\n\n```text\nEmpresa. (Año). Nombre del modelo en cursiva (Versión) [Modelo de lenguaje grande]. URL\n```\n\n> OpenAI. (2025). *ChatGPT* (versión del 13 de marzo) [Modelo de lenguaje grande].\n> https://chat.openai.com\n\n> Anthropic. (2025). *Claude* (Sonnet 4.5) [Modelo de lenguaje grande]. https://claude.ai\n\nEs la forma que recomienda APA en su guía de estilo: autor = la empresa; título = el modelo,\nen cursiva, con la versión entre paréntesis; descripción entre corchetes. Añade el prompt y\nla respuesta en un apéndice.\n\n<div class=\"salto-pagina\"><\/div>\n\n# 10. Reglas de la lista de referencias\n\n## Orden\n\n- **Alfabético** por el apellido del primer autor. Si escribes en español, la *ñ* va después\n  de la *n* y los apellidos con partícula se alfabetizan como los firma el autor.\n- Mismo primer autor: la obra **de un solo autor va antes** que la de varios.\n  Molina (2019) antes que Molina y Serrano (2018).\n- Mismos autores: por año, de la más antigua a la más reciente. Sin fecha primero, en prensa\n  al final.\n- Mismo autor y mismo año: se ordenan **alfabéticamente por título** y se etiquetan 2024a,\n  2024b.\n\n## Sangría francesa\n\nLa primera línea de cada entrada va pegada al margen y las demás sangradas 1,27 cm. En esta\napp la pone la hoja de estilo al imprimir: tú escribe cada referencia como un párrafo normal.\n\n## Mayúsculas en los títulos\n\n| Qué es | Cómo se escribe |\n| :--- | :--- |\n| Título de libro, capítulo, artículo, web, informe | Mayúscula solo en la primera palabra, en los nombres propios y tras dos puntos |\n| Nombre de la revista o del periódico | Con sus mayúsculas propias: *Revista de Psicología Educativa* |\n| Subtítulo tras dos puntos | Primera palabra en mayúscula |\n\n## Cursiva sí, cursiva no\n\n| Va en cursiva | No va en cursiva |\n| :--- | :--- |\n| Título de libro, informe, tesis | Título de artículo o de capítulo |\n| Nombre de la revista o periódico | Número de la revista, entre paréntesis |\n| Número de volumen | Páginas |\n| Título de vídeo, pódcast, web, dataset | Nombre de la editorial |\n| Nombre del modelo de IA o del software | Descripción entre corchetes: [Vídeo], [Software] |\n\n## Cuántos autores se listan\n\n| Autores en la obra | En la referencia |\n| :--- | :--- |\n| De 1 a 20 | Se listan **todos**, con `y` antes del último |\n| 21 o más | Los **19 primeros**, después `. . .` y el **último** autor |\n\nCon 21 o más autores **no se pone `y`** antes del último: el lugar de la conjunción lo ocupan\nlos puntos suspensivos.\n\n```text\nAutor1, A., Autor2, B., … [hasta 19] …, Autor19, S., . . . AutorFinal, Z. (2023).\n```\n\n# 11. Errores que se repiten siempre\n\n- [ ] Poner \"Recuperado de\" antes de una URL — **en APA 7 se quitó**, salvo cuando hay fecha\n      de recuperación de verdad\n- [ ] Poner la ciudad de la editorial — se quitó en APA 7\n- [ ] Listar todos los autores la primera vez con tres o más — desde APA 7 es `et al.` siempre\n- [ ] Escribir `et. al.` — el punto va solo detrás de *al*\n- [ ] Poner el punto dentro de las comillas en una cita corta\n- [ ] Poner el punto después del paréntesis en una cita en bloque\n- [ ] Referencias que no se citan en el texto, o citas que no están en las referencias\n- [ ] Cursiva en el número de la revista, que va en redonda entre paréntesis\n- [ ] Un DOI escrito como \"doi: 10.1234/…\" en vez de como enlace completo\n- [ ] Título de artículo en mayúsculas iniciales, cuando va en minúscula\n"}]}</script>
