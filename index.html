/* cache de expresiones ya compiladas */
var LEXERS = {};
function lexer(nombre){
  if(LEXERS[nombre]) return LEXERS[nombre];
  var reglas = LENGUAJES[nombre];
  if(!reglas) return null;
  var listas = [];
  for(var i = 0; i < reglas.length; i++){
    var r = reglas[i];
    var banderas = "y" + (r.ci ? "i" : "") + (/\^|\$/.test(r.re) ? "m" : "");
    try{ listas.push({ re: new RegExp(r.re, banderas), clase: r.clase }); }
    catch(e){ /* el navegador no entiende esta regla: se salta y el resto sigue */ }
  }
  LEXERS[nombre] = listas;
  return LEXERS[nombre];
}

function nombreLenguaje(etiqueta){
  var n = String(etiqueta || "").toLowerCase().replace(/^lang(uage)?-/, "").split(/[\s,{]/)[0];
  return ALIAS[n] || n;
}

function hayLenguaje(etiqueta){
  var n = nombreLenguaje(etiqueta);
  return !!(n && LENGUAJES[n]);
}

function colorear(codigo, etiqueta){
  var reglas = lexer(nombreLenguaje(etiqueta));
  if(!reglas) return X(codigo);
  var txt = String(codigo), n = txt.length, i = 0, salida = [], sueltos = "";
  var vueltas = 0, tope = n * 4 + 1000;
  while(i < n && vueltas++ < tope){
    var encontrado = null;
    for(var k = 0; k < reglas.length; k++){
      reglas[k].re.lastIndex = i;
      var m = reglas[k].re.exec(txt);
      if(m && m[0].length > 0){ encontrado = { t: m[0], c: reglas[k].clase }; break; }
    }
    if(!encontrado){ sueltos += txt.charAt(i); i++; continue; }
    if(sueltos){ salida.push(X(sueltos)); sueltos = ""; }
    if(encontrado.c) salida.push('<span class="' + encontrado.c + '">' + X(encontrado.t) + "</span>");
    else salida.push(X(encontrado.t));
    i += encontrado.t.length;
  }
  if(sueltos) salida.push(X(sueltos));
  if(i < n) salida.push(X(txt.slice(i)));
  return salida.join("");
}

/* el HTML lleva CSS y JavaScript dentro: se colorean por separado */
function colorearHtml(codigo){
  var trozos = [], resto = String(codigo), salida = "";
  var re = /(<(script|style)\b[^>]*>)([\s\S]*?)(<\/\2\s*>)/gi, ult = 0, m;
  while((m = re.exec(resto))){
    salida += colorear(resto.slice(ult, m.index), "html");
    salida += colorear(m[1], "html");
    salida += colorear(m[3], m[2].toLowerCase() === "style" ? "css" : "javascript");
    salida += colorear(m[4], "html");
    ult = m.index + m[0].length;
  }
  salida += colorear(resto.slice(ult), "html");
  return salida;
}

function resaltar(codigo, etiqueta){
  var n = nombreLenguaje(etiqueta);
  if(n === "html") return colorearHtml(codigo);
  return colorear(codigo, etiqueta);
}

   Dibuja de verdad, en SVG, los bloques ```mermaid: diagramas de flujo,

var DIA_FUENTE = '13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
var DIA_FUENTE_SVG = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
var DIA_TAM = 13, DIA_ALTO_LINEA = 17, DIA_ANCHO_MAX = 210;
var nDiagramas = 0;

/* ---------- medir texto ---------- */
var _lienzo;
function medir(txt, tam, negrita){
  if(_lienzo === undefined){
    try{ _lienzo = document.createElement("canvas").getContext("2d"); }
    catch(e){ _lienzo = null; }
  }
  if(!_lienzo) return String(txt).length * (tam || DIA_TAM) * 0.56;
  _lienzo.font = (negrita ? "600 " : "") + (tam || DIA_TAM) + "px " + DIA_FUENTE_SVG;
  return _lienzo.measureText(String(txt)).width;
}

/* corta el texto en lineas: respeta <br> y parte lo que se pase de ancho */
function partirTexto(txt, anchoMax, tam){
  var crudo = String(txt).replace(/<br\s*\/?>/gi, "\n").replace(/\\n/g, "\n");
  var lineas = [];
  crudo.split("\n").forEach(function(trozo){
    var palabras = trozo.split(/\s+/).filter(function(p){ return p !== ""; });
    if(!palabras.length){ lineas.push(""); return; }
    var actual = "";
    palabras.forEach(function(p){
      var prueba = actual ? actual + " " + p : p;
      if(actual && medir(prueba, tam) > anchoMax){ lineas.push(actual); actual = p; }
      else actual = prueba;
    });
    if(actual) lineas.push(actual);
  });
  return lineas.length ? lineas : [""];
}

function anchoLineas(lineas, tam, negrita){
  var a = 0;
  lineas.forEach(function(l){ a = Math.max(a, medir(l, tam, negrita)); });
  return a;
}

function textoSvg(lineas, cx, cy, opciones){
  var o = opciones || {};
  var tam = o.tam || DIA_TAM, alto = o.alto || DIA_ALTO_LINEA;
  var y = cy - (lineas.length - 1) * alto / 2 + tam * 0.35;
  var atr = ' text-anchor="' + (o.anclaje || "middle") + '"';
  if(o.negrita) atr += ' font-weight="600"';
  if(o.tam) atr += ' font-size="' + o.tam + '"';
  if(o.color) atr += ' fill="' + o.color + '"';
  var s = "<text" + atr + ' x="' + r2(cx) + '" y="' + r2(y) + '">';
  lineas.forEach(function(l, i){
    s += '<tspan x="' + r2(cx) + '"' + (i ? ' dy="' + alto + '"' : "") + ">" + X(l) + "</tspan>";
  });
  return s + "</text>";
}

function r2(n){ return Math.round(n * 100) / 100; }
function escRe2(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

var FORMAS = [
  { a: "(((", c: [")))"], f: "circulo2" },

  { a: "[[",  c: ["]]"],  f: "subrutina" },
  { a: "[(",  c: [")]"],  f: "cilindro" },
  { a: "((",  c: ["))"],  f: "circulo" },
  { a: "{{",  c: ["}}"],  f: "hexagono" },
  { a: "[/",  c: ["/]", "\\]"], f: ["paralelogramo", "trapecio"] },
  { a: "[\\", c: ["\\]", "/]"], f: ["paralelogramo2", "trapecio2"] },
  { a: ">",   c: ["]"],   f: "bandera" },
  { a: "[",   c: ["]"],   f: "rect" },
  { a: "(",   c: [")"],   f: "redondo" },
  { a: "{",   c: ["}"],   f: "rombo" }
];

function casarForma(L, j){
  for(var k = 0; k < FORMAS.length; k++){
    var F = FORMAS[k];
    if(L.substr(j, F.a.length) !== F.a) continue;
    var ini = j + F.a.length, desde = ini;
    if(L.charAt(ini) === '"'){
      var fc = L.indexOf('"', ini + 1);
      if(fc > 0) desde = fc + 1;
    }
    var mejor = -1, cual = 0;
    for(var q = 0; q < F.c.length; q++){
      var p = L.indexOf(F.c[q], desde);
      if(p >= 0 && (mejor < 0 || p < mejor)){ mejor = p; cual = q; }
    }
    if(mejor < 0) continue;
    var txt = L.slice(ini, mejor).trim().replace(/^"|"$/g, "");
    var forma = typeof F.f === "string" ? F.f : F.f[cual];
    return { texto: txt, forma: forma, fin: mejor + F.c[cual].length };
  }
  return null;
}

var RE_IDENT = /^[A-Za-z0-9_À-ɏ一-鿿]+/;

function extraerNodos(L, defs){
  var out = "", i = 0;
  while(i < L.length){
    var mi = RE_IDENT.exec(L.slice(i));
    if(!mi){ out += L.charAt(i); i++; continue; }
    var id = mi[0], j = i + id.length;
    var par = casarForma(L, j);
    if(par){
      defs.push({ id: id, forma: par.forma, texto: par.texto });
      out += id;
      i = par.fin;
    }else{
      out += id;
      i = j;
    }
  }
  return out;
}

var FICHAS = ["<-.->", "<-->", "<==>", "o--o", "x--x", "-.->", "==>", "-->", "--o", "--x",

function normalizarEnlaces(sk){
  return sk
    .replace(/-{3,}>/g, "-->").replace(/={3,}>/g, "==>")
    .replace(/-\.{2,}->/g, "-.->").replace(/-\.{2,}-/g, "-.-")
    .replace(/-{4,}/g, "---").replace(/={4,}/g, "===")
    .replace(/-{2,}\s+([^\n|]+?)\s+(-->|---|--o|--x)/g, function(m, t, fin){ return fin + "|" + t + "|"; })
    .replace(/-\.\s*([^\n|]+?)\s*(\.->|\.-)/g, function(m, t, fin){ return (fin === ".->" ? "-.->" : "-.-") + "|" + t + "|"; })
    .replace(/={2,}\s+([^\n|]+?)\s+(==>|===|==o|==x)/g, function(m, t, fin){ return fin + "|" + t + "|"; });

function leerFicha(f){
  var e = { tipo: "solido", finA: "", finB: "" };
  if(f.indexOf("-.") === 0 || f.indexOf("<-.") === 0) e.tipo = "punteado";
  else if(f.indexOf("=") >= 0) e.tipo = "grueso";
  var ult = f.charAt(f.length - 1);
  if(ult === ">") e.finB = "flecha";
  else if(ult === "o") e.finB = "circulo";
  else if(ult === "x") e.finB = "cruz";
  var pri = f.charAt(0);
  if(pri === "<") e.finA = "flecha";
  else if(pri === "o") e.finA = "circulo";
  else if(pri === "x") e.finA = "cruz";
  return e;
}

function analizarFlujo(texto, esEstado){
  var lineas = texto.replace(/\r\n?/g, "\n").split("\n");
  var G = { dir: esEstado ? "TD" : "TD", nodos: {}, orden: [], enlaces: [], grupos: [], estilos: {}, clases: {} };
  var pila = [], primera = true;

  function nodo(id, forma, txt){
    if(!G.nodos[id]){
      G.nodos[id] = { id: id, forma: forma || "rect", texto: txt === undefined ? id : txt, grupo: pila.length ? pila[pila.length - 1] : null };
      G.orden.push(id);
      if(pila.length) pila[pila.length - 1].miembros.push(id);
    }else{
      var n = G.nodos[id];
      if(forma && forma !== "rect") n.forma = forma;
      if(txt !== undefined && txt !== id) n.texto = txt;
      if(n.grupo === null && pila.length){ n.grupo = pila[pila.length - 1]; pila[pila.length - 1].miembros.push(id); }
    }
    return G.nodos[id];
  }

  for(var i = 0; i < lineas.length; i++){
    var L = lineas[i].replace(/%%[^\n]*$/, "").trim();
    if(!L) continue;

    if(primera){
      var mh = L.match(/^(?:graph|flowchart)\s+([A-Za-z]{2})\b/i);
      if(mh){ G.dir = mh[1].toUpperCase(); primera = false; continue; }
      if(/^(?:graph|flowchart|stateDiagram(?:-v2)?)\b/i.test(L)){ primera = false; continue; }
      primera = false;
    }

    var md = L.match(/^direction\s+([A-Za-z]{2})$/i);
    if(md){ G.dir = md[1].toUpperCase(); continue; }

    var ms = L.match(/^subgraph\s+(.*)$/i);
    if(ms){
      var resto = ms[1].trim(), gid = "", gtxt = resto;
      var mg = resto.match(/^([A-Za-z0-9_À-ɏ]+)\s*\[([^\]]*)\]$/);
      if(mg){ gid = mg[1]; gtxt = mg[2].replace(/^"|"$/g, ""); }
      else gid = "g" + G.grupos.length;
      var grupo = { id: gid, texto: gtxt.replace(/^"|"$/g, ""), miembros: [], padre: pila.length ? pila[pila.length - 1] : null, indice: G.grupos.length };
      G.grupos.push(grupo);
      pila.push(grupo);
      continue;
    }
    if(/^end$/i.test(L)){ if(pila.length) pila.pop(); continue; }

    var me = L.match(/^style\s+([A-Za-z0-9_À-ɏ]+)\s+(.*)$/i);
    if(me){ G.estilos[me[1]] = leerEstilo(me[2]); continue; }
    var mcd = L.match(/^classDef\s+([A-Za-z0-9_,À-ɏ]+)\s+(.*)$/i);
    if(mcd){
      var est = leerEstilo(mcd[2]);
      mcd[1].split(",").forEach(function(c){ G.clases[c.trim()] = est; });
      continue;
    }
    var mc = L.match(/^class\s+([A-Za-z0-9_,\sÀ-ɏ]+)\s+([A-Za-z0-9_À-ɏ]+)$/i);
    if(mc){
      var cl = mc[2];
      mc[1].split(",").forEach(function(id){
        id = id.trim();
        if(id) (G.nodos[id] || nodo(id)).clase = cl;
      });
      continue;
    }
    if(/^(click|linkStyle|accTitle|accDescr)\b/i.test(L)) continue;

    /* estados: [*] a la izquierda es el principio, a la derecha el final */
    if(esEstado){
      var mDesc = L.match(/^state\s+"([^"]*)"\s+as\s+([A-Za-z0-9_À-ɏ]+)$/i);
      if(mDesc){ nodo(mDesc[2], "redondo", mDesc[1]); continue; }
      if(/^(note|state\s)/i.test(L) && !/-->|---/.test(L)) continue;
      var corte = L.search(/-->|---/);
      L = L.replace(/\[\*\]/g, function(m, desplazamiento){
        return (corte < 0 || desplazamiento < corte) ? "iniEstado" : "finEstado";
      });
      var mEt = L.match(/^(.*?)(-->|---)([^:]*?):\s*(.+)$/);
      if(mEt) L = mEt[1] + mEt[2] + "|" + mEt[4].trim() + "|" + mEt[3];
    }

    var defs = [];
    var sk = extraerNodos(L, defs);
    defs.forEach(function(d){ nodo(d.id, d.forma, d.texto); });

    /* la clase con dos puntos: A:::destacado */
    sk = sk.replace(/([A-Za-z0-9_À-ɏ]+):::([A-Za-z0-9_]+)/g, function(m, id, cl){
      nodo(id).clase = cl;
      return id;
    });

    sk.split(";").forEach(function(trozo){
      trozo = normalizarEnlaces(trozo.trim());
      if(!trozo) return;
      var partes = trozo.split(RE_FICHAS);
      if(partes.length === 1){
        var solo = partes[0].trim();
        if(solo && /^[A-Za-z0-9_À-ɏ&\s]+$/.test(solo)){
          solo.split("&").forEach(function(id){ id = id.trim(); if(id) nodo(id); });
        }
        return;
      }
      var prev = null;
      for(var p = 0; p < partes.length; p += 2){
        var bloque = partes[p], etiqueta = "";
        var mlab = bloque.match(/^\s*\|([^|]*)\|\s*/);
        if(mlab){ etiqueta = mlab[1].trim().replace(/^"|"$/g, ""); bloque = bloque.slice(mlab[0].length); }
        var ids = bloque.split("&").map(function(s){ return s.trim(); }).filter(Boolean);
        ids.forEach(function(id){ nodo(id); });
        if(prev && ids.length){
          var ficha = partes[p - 1];
          prev.forEach(function(a){
            ids.forEach(function(b){
              var e = leerFicha(ficha);
              e.a = a; e.b = b; e.texto = etiqueta;
              G.enlaces.push(e);
            });
          });
        }
        if(ids.length) prev = ids;
      }
    });
  }

  if(esEstado){
    if(G.nodos.iniEstado){ G.nodos.iniEstado.forma = "punto"; G.nodos.iniEstado.texto = ""; }
    if(G.nodos.finEstado){ G.nodos.finEstado.forma = "fin"; G.nodos.finEstado.texto = ""; }
    G.orden.forEach(function(id){
      var nn = G.nodos[id];
      if(nn.forma === "rect" && nn.texto === id) nn.forma = "redondo";
    });
  }
  return G;
}

function leerEstilo(s){
  var e = {};
  String(s).split(",").forEach(function(par){
    var m = par.split(":");
    if(m.length < 2) return;
    var k = m[0].trim().toLowerCase(), v = m.slice(1).join(":").trim();
    if(k === "fill") e.relleno = v;
    else if(k === "stroke") e.borde = v;
    else if(k === "color") e.texto = v;
    else if(k === "stroke-width") e.grosor = parseFloat(v) || 1;
    else if(k === "stroke-dasharray") e.rayas = v;
  });
  return e;
}

/* ==========================================================================
   2. COLOCACION
   ========================================================================== */
function tamNodo(n){
  var esRedondo = n.forma === "circulo" || n.forma === "circulo2";
  var esRombo = n.forma === "rombo";
  var lineas = partirTexto(n.texto, esRedondo ? 110 : DIA_ANCHO_MAX, DIA_TAM);
  var a = anchoLineas(lineas, DIA_TAM);
  var altoTxt = lineas.length * DIA_ALTO_LINEA;
  n.lineas = lineas;
  if(n.forma === "punto"){ n.w = 16; n.h = 16; return; }
  if(n.forma === "fin"){ n.w = 20; n.h = 20; return; }
  if(esRedondo){
    var d = Math.max(46, Math.sqrt(a * a + altoTxt * altoTxt) + 22);
    n.w = d; n.h = d; return;
  }
  if(esRombo){ n.w = Math.max(70, a * 1.5 + 34); n.h = Math.max(52, altoTxt * 1.7 + 18); return; }
  if(n.forma === "hexagono"){ n.w = Math.max(70, a + 46); n.h = Math.max(38, altoTxt + 18); return; }
  if(n.forma === "cilindro"){ n.w = Math.max(70, a + 34); n.h = Math.max(46, altoTxt + 30); return; }
  if(n.forma === "paralelogramo" || n.forma === "paralelogramo2" || n.forma === "trapecio" || n.forma === "trapecio2"){
    n.w = Math.max(80, a + 46); n.h = Math.max(38, altoTxt + 18); return;
  }
  n.w = Math.max(56, a + 34);
  n.h = Math.max(36, altoTxt + 18);
}

function colocarFlujo(G){
  var ids = G.orden.slice();
  if(!ids.length) return null;
  ids.forEach(function(id){ tamNodo(G.nodos[id]); });

  /* primero se marcan las flechas que vuelven atras: si no, un bucle
     empujaria su destino hasta el infinito al repartir los niveles */
  var salientes = {};
  G.enlaces.forEach(function(e){
    e.atras = false;
    if(e.a === e.b){ e.atras = true; return; }
    (salientes[e.a] = salientes[e.a] || []).push(e);
  });
  var visto = {};
  ids.forEach(function(raiz){
    if(visto[raiz]) return;
    var pila = [{ id: raiz, k: 0 }];
    visto[raiz] = 1;
    while(pila.length){
      var arriba = pila[pila.length - 1];
      var lista = salientes[arriba.id] || [];
      if(arriba.k >= lista.length){ visto[arriba.id] = 2; pila.pop(); continue; }
      var e = lista[arriba.k++];
      var s = visto[e.b] || 0;
      if(s === 1) e.atras = true;
      else if(s === 0){ visto[e.b] = 1; pila.push({ id: e.b, k: 0 }); }
    }
  });

  /* rangos por camino mas largo sobre el grafo ya sin ciclos */
  var rango = {};
  ids.forEach(function(id){ rango[id] = 0; });
  var cambio = true, vueltas = 0;
  while(cambio && vueltas++ < ids.length + 4){
    cambio = false;
    G.enlaces.forEach(function(e){
      if(e.atras) return;
      if(rango[e.b] < rango[e.a] + 1){ rango[e.b] = rango[e.a] + 1; cambio = true; }
    });
  }
  ids.forEach(function(id){ G.nodos[id].rango = rango[id]; });

  /* las flechas que se saltan niveles pasan por nodos invisibles: asi no
     atraviesan las cajas de en medio y ademas se les reserva su carril */
  var nFicticio = 0;
  G.enlaces.forEach(function(e){
    e.cadena = null;
    if(e.atras || e.a === e.b) return;
    if(rango[e.b] - rango[e.a] <= 1) return;
    var ga = G.nodos[e.a].grupo, gb = G.nodos[e.b].grupo;
    var cadena = [e.a];
    for(var r = rango[e.a] + 1; r < rango[e.b]; r++){
      var did = "\u0001f" + (nFicticio++);
      G.nodos[did] = { id: did, ficticio: true, w: 2, h: 2, texto: "", forma: "punto",
                       rango: r, grupo: (ga && ga === gb) ? ga : null, lineas: [""] };
      rango[did] = r;
      ids.push(did);
      cadena.push(did);
    }
    cadena.push(e.b);
    e.cadena = cadena;
  });

  var capas = [];
  ids.forEach(function(id){
    var r = rango[id];
    (capas[r] = capas[r] || []).push(id);
  });
  for(var c = 0; c < capas.length; c++) if(!capas[c]) capas[c] = [];

  /* ordenar dentro de cada capa: primero por grupo, luego por baricentro */
  function grupoRaiz(n){
    var g = n.grupo;
    while(g && g.padre) g = g.padre;
    return g ? g.indice : -1;
  }
  var vecinos = {};
  ids.forEach(function(id){ vecinos[id] = { arriba: [], abajo: [] }; });
  G.enlaces.forEach(function(e){
    if(e.a === e.b || e.atras) return;
    var cad = e.cadena || [e.a, e.b];
    for(var q = 1; q < cad.length; q++){
      var u = cad[q - 1], w = cad[q];
      if(!vecinos[u] || !vecinos[w]) continue;
      vecinos[u].abajo.push(w); vecinos[w].arriba.push(u);
    }
  });

  var pos = {};
  capas.forEach(function(capa){ capa.forEach(function(id, k){ pos[id] = k; }); });

  for(var pase = 0; pase < 6; pase++){
    var haciaAbajo = pase % 2 === 0;
    for(var ci = 0; ci < capas.length; ci++){
      var capa = capas[haciaAbajo ? ci : capas.length - 1 - ci];
      var bar = {};
      capa.forEach(function(id, k){
        var vs = haciaAbajo ? vecinos[id].arriba : vecinos[id].abajo;
        if(!vs.length){ bar[id] = pos[id]; return; }
        var s = 0;
        vs.forEach(function(v){ s += pos[v]; });
        bar[id] = s / vs.length;
      });
      capa.sort(function(a, b){
        var ga = grupoRaiz(G.nodos[a]), gb = grupoRaiz(G.nodos[b]);
        if(ga !== gb) return ga - gb;
        if(bar[a] !== bar[b]) return bar[a] - bar[b];
        return ids.indexOf(a) - ids.indexOf(b);
      });
      capa.forEach(function(id, k){ pos[id] = k; });
    }
  }

  /* coordenadas */
  var horizontal = G.dir === "LR" || G.dir === "RL";
  var hayGrupos = G.grupos.length > 0;
  var SEP = hayGrupos ? 46 : 38, SEP_GRUPO = 74;
  var SALTO = hayGrupos ? 88 : 66;

  /* eje principal: una capa detras de otra */
  var avance = 0, ejes = [];
  capas.forEach(function(capa){
    var grueso = 0;
    capa.forEach(function(id){
      var n = G.nodos[id];
      grueso = Math.max(grueso, horizontal ? n.w : n.h);
    });
    ejes.push(avance + grueso / 2);
    avance += grueso + SALTO;
  });

  /* eje transversal: se reparten y luego se acercan a sus vecinos */
  capas.forEach(function(capa){
    var t = 0;
    capa.forEach(function(id, k){
      var n = G.nodos[id];
      var tam = horizontal ? n.h : n.w;
      if(k > 0){
        var ant = G.nodos[capa[k - 1]];
        t += (grupoRaiz(ant) !== grupoRaiz(n) ? SEP_GRUPO : SEP);
      }
      n.t = t + tam / 2;
      t += tam;
    });
  });

  for(var it = 0; it < 8; it++){
    for(var ci2 = 0; ci2 < capas.length; ci2++){
      var capa2 = capas[ci2];
      capa2.forEach(function(id){
        var n = G.nodos[id];
        var vs = vecinos[id].arriba.concat(vecinos[id].abajo);
        if(!vs.length) return;
        var s = 0, cuenta = 0;
        vs.forEach(function(v){ if(G.nodos[v].t !== undefined){ s += G.nodos[v].t; cuenta++; } });
        if(cuenta) n.t = n.t + (s / cuenta - n.t) * 0.5;
      });
      /* separar lo que se haya montado */
      for(var k2 = 1; k2 < capa2.length; k2++){
        var a2 = G.nodos[capa2[k2 - 1]], b2 = G.nodos[capa2[k2]];
        var minimo = (horizontal ? (a2.h + b2.h) : (a2.w + b2.w)) / 2 +
                     (grupoRaiz(a2) !== grupoRaiz(b2) ? SEP_GRUPO : SEP);
        if(b2.t - a2.t < minimo) b2.t = a2.t + minimo;
      }
      for(var k3 = capa2.length - 2; k3 >= 0; k3--){
        var a3 = G.nodos[capa2[k3]], b3 = G.nodos[capa2[k3 + 1]];
        var min3 = (horizontal ? (a3.h + b3.h) : (a3.w + b3.w)) / 2 +
                   (grupoRaiz(a3) !== grupoRaiz(b3) ? SEP_GRUPO : SEP);
        if(b3.t - a3.t < min3) a3.t = b3.t - min3;
      }
    }
  }

  /* pasar (eje, transversal) a (x, y) segun la direccion */
  capas.forEach(function(capa, r){
    capa.forEach(function(id){
      var n = G.nodos[id], e = ejes[r];
      if(G.dir === "TD" || G.dir === "TB"){ n.x = n.t; n.y = e; }
      else if(G.dir === "BT"){ n.x = n.t; n.y = -e; }
      else if(G.dir === "LR"){ n.x = e; n.y = n.t; }
      else { n.x = -e; n.y = n.t; }
    });
  });

  /* cajas de los subgrupos */
  G.grupos.forEach(function(g){ g.caja = null; });
  for(var gi = G.grupos.length - 1; gi >= 0; gi--){
    var g = G.grupos[gi];
    var x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity, algo = false;
    g.miembros.forEach(function(id){
      var n = G.nodos[id];
      if(!n || n.x === undefined) return;
      algo = true;
      x1 = Math.min(x1, n.x - n.w / 2); x2 = Math.max(x2, n.x + n.w / 2);
      y1 = Math.min(y1, n.y - n.h / 2); y2 = Math.max(y2, n.y + n.h / 2);
    });
    G.grupos.forEach(function(h){
      if(h.padre === g && h.caja){
        algo = true;
        x1 = Math.min(x1, h.caja.x1); x2 = Math.max(x2, h.caja.x2);
        y1 = Math.min(y1, h.caja.y1); y2 = Math.max(y2, h.caja.y2);
      }
    });
    if(!algo) continue;
    var pad = 14;
    g.caja = { x1: x1 - pad, y1: y1 - pad - 20, x2: x2 + pad, y2: y2 + pad };
  }

  /* margenes */
  var mx1 = Infinity, my1 = Infinity, mx2 = -Infinity, my2 = -Infinity;
  ids.forEach(function(id){
    var n = G.nodos[id];
    mx1 = Math.min(mx1, n.x - n.w / 2); mx2 = Math.max(mx2, n.x + n.w / 2);
    my1 = Math.min(my1, n.y - n.h / 2); my2 = Math.max(my2, n.y + n.h / 2);
  });
  G.grupos.forEach(function(g){
    if(!g.caja) return;
    mx1 = Math.min(mx1, g.caja.x1); mx2 = Math.max(mx2, g.caja.x2);
    my1 = Math.min(my1, g.caja.y1); my2 = Math.max(my2, g.caja.y2);
  });
  /* hueco para los lazos y para las flechas que vuelven atras, que se
     dibujan por fuera de las cajas */
  var hayLazo = false, hayVuelta = false;
  G.enlaces.forEach(function(e){
    if(e.a === e.b) hayLazo = true;
    else if(e.atras || e.b.rango < e.a.rango) hayVuelta = true;
  });
  if(hayLazo){
    if(horizontal) my1 -= 56;
    else mx2 += 78;
  }
  if(hayVuelta){
    if(horizontal) my1 -= 66;
    else mx2 += 72;
  }

  var M = 14;
  var dx = M - mx1, dy = M - my1;
  ids.forEach(function(id){ G.nodos[id].x += dx; G.nodos[id].y += dy; });
  G.grupos.forEach(function(g){
    if(!g.caja) return;
    g.caja.x1 += dx; g.caja.x2 += dx; g.caja.y1 += dy; g.caja.y2 += dy;
  });
  return { w: mx2 - mx1 + M * 2, h: my2 - my1 + M * 2, capas: capas, rango: rango };
}

/* ==========================================================================
   3. DIBUJO
   ========================================================================== */
function formaSvg(n, est){
  var x = n.x - n.w / 2, y = n.y - n.h / 2, w = n.w, h = n.h;
  var relleno = est.relleno || "var(--dia-relleno)";
  var borde = est.borde || "var(--dia-borde)";
  var atr = ' fill="' + relleno + '" stroke="' + borde + '" stroke-width="' + (est.grosor || 1.4) + '"' +
            (est.rayas ? ' stroke-dasharray="' + est.rayas + '"' : "");
  function P(d){ return '<path d="' + d + '"' + atr + "/>"; }
  switch(n.forma){
    case "punto":
      return '<circle cx="' + r2(n.x) + '" cy="' + r2(n.y) + '" r="8" fill="' + borde + '" stroke="none"/>';
    case "fin":
      return '<circle cx="' + r2(n.x) + '" cy="' + r2(n.y) + '" r="10" fill="none" stroke="' + borde + '" stroke-width="1.6"/>' +
             '<circle cx="' + r2(n.x) + '" cy="' + r2(n.y) + '" r="6" fill="' + borde + '" stroke="none"/>';
    case "circulo":
    case "circulo2":
      var s = '<circle cx="' + r2(n.x) + '" cy="' + r2(n.y) + '" r="' + r2(w / 2) + '"' + atr + "/>";
      if(n.forma === "circulo2") s += '<circle cx="' + r2(n.x) + '" cy="' + r2(n.y) + '" r="' + r2(w / 2 - 5) + '" fill="none" stroke="' + borde + '" stroke-width="1.2"/>';
      return s;
    case "estadio":
      return '<rect x="' + r2(x) + '" y="' + r2(y) + '" width="' + r2(w) + '" height="' + r2(h) + '" rx="' + r2(h / 2) + '"' + atr + "/>";
    case "redondo":
      return '<rect x="' + r2(x) + '" y="' + r2(y) + '" width="' + r2(w) + '" height="' + r2(h) + '" rx="9"' + atr + "/>";
    case "subrutina":
      return '<rect x="' + r2(x) + '" y="' + r2(y) + '" width="' + r2(w) + '" height="' + r2(h) + '"' + atr + "/>" +
             '<line x1="' + r2(x + 8) + '" y1="' + r2(y) + '" x2="' + r2(x + 8) + '" y2="' + r2(y + h) + '" stroke="' + borde + '" stroke-width="1.2"/>' +
             '<line x1="' + r2(x + w - 8) + '" y1="' + r2(y) + '" x2="' + r2(x + w - 8) + '" y2="' + r2(y + h) + '" stroke="' + borde + '" stroke-width="1.2"/>';
    case "cilindro":
      var ry = 8;
      return P("M" + r2(x) + "," + r2(y + ry) + " a" + w / 2 + "," + ry + " 0 0,1 " + w + ",0" +
               " v" + r2(h - ry * 2) + " a" + w / 2 + "," + ry + " 0 0,1 " + (-w) + ",0 z") +
             '<path d="M' + r2(x) + "," + r2(y + ry) + " a" + w / 2 + "," + ry + " 0 0,0 " + w + ',0" fill="none" stroke="' + borde + '" stroke-width="1.2"/>';
    case "rombo":
      return P("M" + r2(n.x) + "," + r2(y) + " L" + r2(x + w) + "," + r2(n.y) +
               " L" + r2(n.x) + "," + r2(y + h) + " L" + r2(x) + "," + r2(n.y) + " z");
    case "hexagono":
      var d1 = Math.min(18, w / 4);
      return P("M" + r2(x + d1) + "," + r2(y) + " H" + r2(x + w - d1) + " L" + r2(x + w) + "," + r2(n.y) +
               " L" + r2(x + w - d1) + "," + r2(y + h) + " H" + r2(x + d1) + " L" + r2(x) + "," + r2(n.y) + " z");
    case "paralelogramo":
      var d2 = Math.min(20, w / 5);
      return P("M" + r2(x + d2) + "," + r2(y) + " H" + r2(x + w) + " L" + r2(x + w - d2) + "," + r2(y + h) + " H" + r2(x) + " z");
    case "paralelogramo2":
      var d3 = Math.min(20, w / 5);
      return P("M" + r2(x) + "," + r2(y) + " H" + r2(x + w - d3) + " L" + r2(x + w) + "," + r2(y + h) + " H" + r2(x + d3) + " z");
    case "trapecio":
      var d4 = Math.min(20, w / 5);
      return P("M" + r2(x + d4) + "," + r2(y) + " H" + r2(x + w - d4) + " L" + r2(x + w) + "," + r2(y + h) + " H" + r2(x) + " z");
    case "trapecio2":
      var d5 = Math.min(20, w / 5);
      return P("M" + r2(x) + "," + r2(y) + " H" + r2(x + w) + " L" + r2(x + w - d5) + "," + r2(y + h) + " H" + r2(x + d5) + " z");
    case "bandera":
      return P("M" + r2(x) + "," + r2(y) + " H" + r2(x + w - 14) + " L" + r2(x + w) + "," + r2(n.y) +
               " L" + r2(x + w - 14) + "," + r2(y + h) + " H" + r2(x) + " z");
    default:
      return '<rect x="' + r2(x) + '" y="' + r2(y) + '" width="' + r2(w) + '" height="' + r2(h) + '" rx="3"' + atr + "/>";
  }
}

/* punto de salida/entrada de una linea en el borde de un nodo */
function puerto(n, hacia, dir){
  var horizontal = dir === "LR" || dir === "RL";
  var signo = (dir === "BT" || dir === "RL") ? -1 : 1;
  var lado = (hacia === "adelante" ? signo : -signo);
  if(horizontal) return { x: n.x + lado * n.w / 2, y: n.y, dx: lado, dy: 0 };
  return { x: n.x, y: n.y + lado * n.h / 2, dx: 0, dy: lado };
}

function puntoCubica(p0, p1, p2, p3, t){
  var u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
  };
}

function pintarEnlace(partes, d, e, id, medio){
  var rayas = e.tipo === "punteado" ? ' stroke-dasharray="5 4"' : "";
  var grosor = e.tipo === "grueso" ? 2.6 : 1.5;
  var fin = e.finB ? ' marker-end="url(#' + id + "-" + e.finB + ')"' : "";
  var ini = e.finA ? ' marker-start="url(#' + id + "-" + e.finA + '-i)"' : "";
  partes.push('<path d="' + d + '" fill="none" stroke="var(--dia-linea)" stroke-width="' + grosor + '"' + rayas + fin + ini + "/>");
  if(!e.texto) return;
  var ls = partirTexto(e.texto, 150, 11.5);
  var aw = anchoLineas(ls, 11.5) + 10, ah = ls.length * 14 + 4;
  partes.push('<rect x="' + r2(medio.x - aw / 2) + '" y="' + r2(medio.y - ah / 2) + '" width="' + r2(aw) +
              '" height="' + r2(ah) + '" rx="3" fill="var(--dia-fondo)" stroke="none"/>');
  partes.push(textoSvg(ls, medio.x, medio.y, { tam: 11.5, alto: 14, color: "var(--dia-tenue)" }));
}

function dibujarFlujo(texto, esEstado){
  var G = analizarFlujo(texto, esEstado);
  if(!G.orden.length) return null;
  var caja = colocarFlujo(G);
  if(!caja) return null;
  var id = "d" + (++nDiagramas);
  var invertida = G.dir === "BT" || G.dir === "RL";
  var partes = [];

  /* subgrupos, al fondo */
  G.grupos.forEach(function(g){
    if(!g.caja) return;
    var c = g.caja;
    partes.push('<rect x="' + r2(c.x1) + '" y="' + r2(c.y1) + '" width="' + r2(c.x2 - c.x1) +
                '" height="' + r2(c.y2 - c.y1) + '" rx="8" fill="var(--dia-grupo)" stroke="var(--dia-grupo-borde)" stroke-width="1.2" stroke-dasharray="5 4"/>');
    if(g.texto){
      partes.push('<text x="' + r2(c.x1 + 12) + '" y="' + r2(c.y1 + 15) + '" text-anchor="start" font-size="11.5" font-weight="600" fill="var(--dia-tenue)">' + X(g.texto) + "</text>");
    }
  });

  /* lineas */
  var usados = {};
  G.enlaces.forEach(function(e, k){
    var a = G.nodos[e.a], b = G.nodos[e.b];
    if(!a || !b) return;
    var d, p0, p1, p2, p3;
    if(e.cadena){
      var pts = [puerto(a, "adelante", G.dir)];
      for(var q2 = 1; q2 < e.cadena.length - 1; q2++){
        var f = G.nodos[e.cadena[q2]];
        pts.push({ x: f.x, y: f.y });
      }
      pts.push(puerto(b, "atras", G.dir));
      var horiz = G.dir === "LR" || G.dir === "RL";
      d = "M" + r2(pts[0].x) + "," + r2(pts[0].y);
      for(var q3 = 1; q3 < pts.length; q3++){
        var u = pts[q3 - 1], w2 = pts[q3];
        var c1, c2;
        if(horiz){
          var mx = (u.x + w2.x) / 2;
          c1 = { x: mx, y: u.y }; c2 = { x: mx, y: w2.y };
        }else{
          var my = (u.y + w2.y) / 2;
          c1 = { x: u.x, y: my }; c2 = { x: w2.x, y: my };
        }
        d += " C" + r2(c1.x) + "," + r2(c1.y) + " " + r2(c2.x) + "," + r2(c2.y) + " " + r2(w2.x) + "," + r2(w2.y);
      }
      var medio = pts[Math.floor(pts.length / 2)];
      p0 = pts[0]; p3 = pts[pts.length - 1];
      p1 = medio; p2 = medio;
      pintarEnlace(partes, d, e, id, medio);
      return;
    }
    if(a === b){
      var rr = 26;
      if(G.dir === "LR" || G.dir === "RL"){
        p0 = { x: a.x - 8, y: a.y - a.h / 2 };
        p3 = { x: a.x + 8, y: a.y - a.h / 2 };
        p1 = { x: p0.x - rr, y: p0.y - rr * 1.5 };
        p2 = { x: p3.x + rr, y: p3.y - rr * 1.5 };
      }else{
        p0 = { x: a.x + a.w / 2, y: a.y - 6 };
        p3 = { x: a.x + a.w / 2, y: a.y + 6 };
        p1 = { x: p0.x + rr * 2, y: p0.y - rr };
        p2 = { x: p3.x + rr * 2, y: p3.y + rr };
      }
    }else{
      var haciaDelante = !e.atras && b.rango > a.rango;
      if(haciaDelante){
        p0 = puerto(a, "adelante", G.dir);
        p3 = puerto(b, "atras", G.dir);
      }else{
        var lado = (usados[e.a + ">" + e.b] = (usados[e.a + ">" + e.b] || 0) + 1);
        var D = 34 + lado * 14;
        if(G.dir === "LR" || G.dir === "RL"){
          p0 = { x: a.x, y: a.y - a.h / 2 };
          p3 = { x: b.x, y: b.y - b.h / 2 };
          p1 = { x: a.x, y: a.y - a.h / 2 - D };
          p2 = { x: b.x, y: b.y - b.h / 2 - D };
        }else{
          p0 = { x: a.x + a.w / 2, y: a.y };
          p3 = { x: b.x + b.w / 2, y: b.y };
          p1 = { x: a.x + a.w / 2 + D, y: a.y };
          p2 = { x: b.x + b.w / 2 + D, y: b.y };
        }
      }
      if(!p1){
        var lx = Math.abs(p3.x - p0.x), ly = Math.abs(p3.y - p0.y);
        var m = Math.max(18, (G.dir === "LR" || G.dir === "RL" ? lx : ly) * 0.45);
        p1 = { x: p0.x + p0.dx * m, y: p0.y + p0.dy * m };
        p2 = { x: p3.x + p3.dx * m, y: p3.y + p3.dy * m };
      }
    }
    d = "M" + r2(p0.x) + "," + r2(p0.y) + " C" + r2(p1.x) + "," + r2(p1.y) + " " +
        r2(p2.x) + "," + r2(p2.y) + " " + r2(p3.x) + "," + r2(p3.y);
    pintarEnlace(partes, d, e, id, puntoCubica(p0, p1, p2, p3, 0.5));
  });

  /* nodos */
  G.orden.forEach(function(nid){
    var n = G.nodos[nid];
    var est = {};
    if(n.clase && G.clases[n.clase]) est = G.clases[n.clase];
    if(G.estilos[nid]) est = G.estilos[nid];
    partes.push(formaSvg(n, est));
    if(n.forma !== "punto" && n.forma !== "fin"){
      var cyTexto = n.forma === "cilindro" ? n.y + 4 : n.y;
      partes.push(textoSvg(n.lineas, n.x, cyTexto, { color: est.texto || "var(--dia-texto)" }));
    }
  });

  return envolver(id, caja.w, caja.h, partes.join("\n"), "Diagrama de flujo");
}

/* ==========================================================================
   4. DIAGRAMA DE SECUENCIA
   ========================================================================== */
function dibujarSecuencia(texto){
  var lineas = texto.replace(/\r\n?/g, "\n").split("\n");
  var actores = [], porId = {}, sucesos = [], pilaG = [], autonum = false, num = 0;

  function actor(id, alias, esPersona){
    id = id.trim();
    if(!id) return null;
    if(!porId[id]){
      porId[id] = { id: id, texto: alias || id, persona: !!esPersona, indice: actores.length, activo: 0, barras: [] };
      actores.push(porId[id]);
    }else if(alias) porId[id].texto = alias;
    return porId[id];
  }

  for(var i = 0; i < lineas.length; i++){
    var L = lineas[i].replace(/%%[^\n]*$/, "").trim();
    if(!L || /^sequenceDiagram$/i.test(L)) continue;
    if(/^autonumber\b/i.test(L)){ autonum = true; continue; }

    var mp = L.match(/^(participant|actor)\s+(.+)$/i);
    if(mp){
      var cuerpo = mp[2], ma = cuerpo.match(/^(\S+)\s+as\s+(.+)$/i);
      if(ma) actor(ma[1], ma[2].trim(), /^actor$/i.test(mp[1]));
      else actor(cuerpo.trim(), "", /^actor$/i.test(mp[1]));
      continue;
    }
    var mn = L.match(/^note\s+(left of|right of|over)\s+([^:]+):\s*(.*)$/i);
    if(mn){
      var refs = mn[2].split(",").map(function(s){ return actor(s.trim()); }).filter(Boolean);
      sucesos.push({ t: "nota", donde: mn[1].toLowerCase(), refs: refs, texto: mn[3].trim() });
      continue;
    }
    var mg = L.match(/^(loop|alt|opt|par|critical|rect|break)\s*(.*)$/i);
    if(mg){
      var g = { t: "grupo", clase: mg[1].toLowerCase(), texto: mg[2].trim(), desde: sucesos.length, ramas: [] };
      sucesos.push(g); pilaG.push(g); continue;
    }
    var mel = L.match(/^(else|and|option)\s*(.*)$/i);
    if(mel){
      if(pilaG.length) sucesos.push({ t: "rama", grupo: pilaG[pilaG.length - 1], texto: mel[2].trim() });
      continue;
    }
    if(/^end$/i.test(L)){
      var g2 = pilaG.pop();
      if(g2){ g2.hasta = sucesos.length; sucesos.push({ t: "finGrupo", grupo: g2 }); }
      continue;
    }
    var mact = L.match(/^(activate|deactivate)\s+(\S+)$/i);
    if(mact){
      sucesos.push({ t: /^activate$/i.test(mact[1]) ? "activar" : "desactivar", a: actor(mact[2]) });
      continue;
    }

    var mm = L.match(/^([^\s:>+-]+)\s*(-{1,2}>>?|-{1,2}x|-{1,2}\)|--?>)\s*([+-]?)\s*([^\s:]+)\s*:\s*(.*)$/);
    if(!mm) mm = L.match(/^(\S+?)\s*(--?>>|--?>|--?x|--?\))\s*([+-]?)\s*(\S+?)\s*:\s*(.*)$/);
    if(mm){
      var a = actor(mm[1]), b = actor(mm[4]);
      if(!a || !b) continue;
      var f = mm[2];
      sucesos.push({
        t: "msg", a: a, b: b, texto: mm[5].trim(),
        rayas: f.indexOf("--") === 0,
        punta: f.charAt(f.length - 1) === "x" ? "cruz" : (f.charAt(f.length - 1) === ")" ? "abierta" : (f.indexOf(">>") > 0 ? "flecha" : "linea")),
        act: mm[3]
      });
      continue;
    }
  }
  if(!actores.length) return null;

  /* medidas */
  var ANCHO_MIN = 110, PAD = 22, ALTO_CAB = 42, SEP_MSG = 40;
  actores.forEach(function(a){
    a.lineas = partirTexto(a.texto, 150, 12.5);
    a.w = Math.max(86, anchoLineas(a.lineas, 12.5, true) + 30);
    a.h = Math.max(34, a.lineas.length * 16 + 14);
  });

  /* separacion horizontal segun el texto de los mensajes entre vecinos */
  var necesario = [];
  for(var q = 0; q < actores.length - 1; q++) necesario[q] = ANCHO_MIN;
  sucesos.forEach(function(s){
    if(s.t !== "msg" || s.a === s.b) return;
    var i1 = Math.min(s.a.indice, s.b.indice), i2 = Math.max(s.a.indice, s.b.indice);
    var ls = partirTexto(s.texto, 260, 12);
    s.lineas = ls;
    var anchoTxt = anchoLineas(ls, 12) + 26;
    var reparto = anchoTxt / (i2 - i1);
    for(var k = i1; k < i2; k++) necesario[k] = Math.max(necesario[k], reparto);
  });

  var x = PAD + actores[0].w / 2;
  actores.forEach(function(a, k){
    if(k > 0) x += Math.max(necesario[k - 1], (actores[k - 1].w + a.w) / 2 + 24);
    a.x = x;
  });
  var ultimo = actores[actores.length - 1];
  var minX = actores[0].x - actores[0].w / 2;
  var maxX = ultimo.x + ultimo.w / 2;
  var altoCab = 0;
  actores.forEach(function(a){ altoCab = Math.max(altoCab, a.h); });

  /* recorrido vertical */
  var y = PAD + altoCab + 24;
  var dibujos = [], cajasGrupo = [];
  var idd = "s" + (++nDiagramas);

  sucesos.forEach(function(s){
    if(s.t === "msg"){
      var ls = s.lineas || partirTexto(s.texto, 260, 12);
      if(autonum) { num++; ls = ls.slice(); ls[0] = num + ". " + ls[0]; }
      var propio = s.a === s.b;
      var altoTxt = ls.length * 15;
      y += altoTxt + 6;
      var x1 = s.a.x, x2 = s.b.x;
      var dir = x2 >= x1 ? 1 : -1;
      var off1 = s.a.activo > 0 ? dir * 5 : 0, off2 = s.b.activo > 0 ? -dir * 5 : 0;
      if(s.act === "+"){ s.b.activo++; s.b.barras.push({ y1: y }); off2 = -dir * 5; }
      if(propio){
        var bx = x1 + 6, w2 = 44;
        dibujos.push('<path d="M' + r2(bx) + "," + r2(y) + " h" + w2 + " v22 h" + (-w2) +
                     '" fill="none" stroke="var(--dia-linea)" stroke-width="1.4"' +
                     (s.rayas ? ' stroke-dasharray="5 4"' : "") +
                     ' marker-end="url(#' + idd + '-flecha)"/>');
        dibujos.push(textoSvg(ls, bx + w2 + 10, y + 4, { tam: 12, alto: 15, anclaje: "start", color: "var(--dia-texto)" }));
        maxX = Math.max(maxX, bx + w2 + 10 + anchoLineas(ls, 12));
        y += 30;
      }else{
        dibujos.push('<line x1="' + r2(x1 + off1) + '" y1="' + r2(y) + '" x2="' + r2(x2 + off2) + '" y2="' + r2(y) +
                     '" stroke="var(--dia-linea)" stroke-width="1.4"' + (s.rayas ? ' stroke-dasharray="5 4"' : "") +
                     (s.punta === "linea" ? "" : ' marker-end="url(#' + idd + "-" + (s.punta === "cruz" ? "cruz" : "flecha") + ')"') + "/>");
        dibujos.push(textoSvg(ls, (x1 + x2) / 2, y - altoTxt / 2 - 3, { tam: 12, alto: 15, color: "var(--dia-texto)" }));
        y += 14;
      }
      if(s.act === "-" && s.a.activo > 0){
        s.a.activo--;
        var ba = s.a.barras.pop();
        if(ba) ba.y2 = y;
      }
    }else if(s.t === "activar"){
      s.a.activo++; s.a.barras.push({ y1: y });
    }else if(s.t === "desactivar"){
      if(s.a.activo > 0){ s.a.activo--; var b2 = s.a.barras.pop(); if(b2) b2.y2 = y; }
    }else if(s.t === "nota"){
      var lsn = partirTexto(s.texto, 220, 12);
      var wn = anchoLineas(lsn, 12) + 24, hn = lsn.length * 15 + 16;
      var cx, x1n;
      if(s.donde === "over"){
        var xs = s.refs.map(function(r){ return r.x; });
        var mn2 = Math.min.apply(null, xs), mx2 = Math.max.apply(null, xs);
        cx = (mn2 + mx2) / 2;
        wn = Math.max(wn, mx2 - mn2 + 60);
      }else if(s.donde === "left of"){ cx = s.refs[0].x - wn / 2 - 12; }
      else { cx = s.refs[0].x + wn / 2 + 12; }
      y += 8;
      dibujos.push('<rect x="' + r2(cx - wn / 2) + '" y="' + r2(y) + '" width="' + r2(wn) + '" height="' + r2(hn) +
                   '" rx="4" fill="var(--dia-nota)" stroke="var(--dia-nota-borde)" stroke-width="1.2"/>');
      dibujos.push(textoSvg(lsn, cx, y + hn / 2, { tam: 12, alto: 15, color: "var(--dia-texto)" }));
      y += hn + 12;
      minX = Math.min(minX, cx - wn / 2);
      maxX = Math.max(maxX, cx + wn / 2);
    }else if(s.t === "grupo"){
      y += 8;
      s.y1 = y;
      y += 22;
    }else if(s.t === "rama"){
      s.y = y;
      s.grupo.ramas.push({ y: y, texto: s.texto });
      y += 20;
    }else if(s.t === "finGrupo"){
      y += 10;
      s.grupo.y2 = y;
      cajasGrupo.push(s.grupo);
      y += 8;
    }
  });

  var yPie = y + 22;
  var alto = yPie + altoCab + PAD;
  actores.forEach(function(a){
    a.barras.forEach(function(b){ if(b.y2 === undefined) b.y2 = yPie - 6; });
  });
  var desplaza = Math.max(0, PAD - minX);
  var ancho = maxX + desplaza + PAD;

  var partes = [];
  /* cajas de grupo, al fondo */
  cajasGrupo.forEach(function(g){
    var gx1 = minX - 10, gx2 = maxX + 10;
    partes.push('<rect x="' + r2(gx1) + '" y="' + r2(g.y1) + '" width="' + r2(gx2 - gx1) + '" height="' + r2(g.y2 - g.y1) +
                '" rx="4" fill="none" stroke="var(--dia-grupo-borde)" stroke-width="1.2"/>');
    var et = g.clase.toUpperCase();
    var wet = medir(et, 10.5, true) + 14;
    partes.push('<path d="M' + r2(gx1) + "," + r2(g.y1) + " h" + r2(wet) + " l8,14 h" + r2(-wet - 8) +
                ' z" fill="var(--dia-grupo)" stroke="var(--dia-grupo-borde)" stroke-width="1"/>');
    partes.push('<text x="' + r2(gx1 + 7) + '" y="' + r2(g.y1 + 10.5) + '" font-size="10.5" font-weight="700" text-anchor="start" fill="var(--dia-tenue)">' + X(et) + "</text>");
    if(g.texto) partes.push('<text x="' + r2(gx1 + wet + 22) + '" y="' + r2(g.y1 + 12) + '" font-size="12" text-anchor="start" fill="var(--dia-tenue)">[' + X(g.texto) + "]</text>");
    g.ramas.forEach(function(rm){
      partes.push('<line x1="' + r2(gx1) + '" y1="' + r2(rm.y) + '" x2="' + r2(gx2) + '" y2="' + r2(rm.y) + '" stroke="var(--dia-grupo-borde)" stroke-width="1" stroke-dasharray="4 4"/>');
      if(rm.texto) partes.push('<text x="' + r2(gx1 + 10) + '" y="' + r2(rm.y + 14) + '" font-size="12" text-anchor="start" fill="var(--dia-tenue)">[' + X(rm.texto) + "]</text>");
    });
  });

  /* lineas de vida */
  actores.forEach(function(a){
    partes.push('<line x1="' + r2(a.x) + '" y1="' + r2(PAD + altoCab) + '" x2="' + r2(a.x) + '" y2="' + r2(yPie) +
                '" stroke="var(--dia-linea)" stroke-width="1" stroke-dasharray="4 5" opacity=".75"/>');
    a.barras.forEach(function(b){
      partes.push('<rect x="' + r2(a.x - 5) + '" y="' + r2(b.y1) + '" width="10" height="' + r2(Math.max(10, b.y2 - b.y1)) +
                  '" fill="var(--dia-relleno)" stroke="var(--dia-borde)" stroke-width="1.2"/>');
    });
  });

  partes = partes.concat(dibujos);

  /* cabeceras y pies */
  actores.forEach(function(a){
    [PAD, yPie].forEach(function(yy){
      partes.push('<rect x="' + r2(a.x - a.w / 2) + '" y="' + r2(yy) + '" width="' + r2(a.w) + '" height="' + r2(a.h) +
                  '" rx="5" fill="var(--dia-relleno)" stroke="var(--dia-borde)" stroke-width="1.4"/>');
      partes.push(textoSvg(a.lineas, a.x, yy + a.h / 2, { tam: 12.5, alto: 16, negrita: true, color: "var(--dia-texto)" }));
    });
  });

  var cuerpo = partes.join("\n");
  if(desplaza) cuerpo = '<g transform="translate(' + r2(desplaza) + ',0)">' + cuerpo + "</g>";
  return envolver(idd, ancho, alto, cuerpo, "Diagrama de secuencia");
}

/* ==========================================================================
   5. TARTA
   ========================================================================== */
var COLORES_TARTA = ["#3b82f6","#f97316","#10b981","#a855f7","#ef4444","#14b8a6","#eab308","#ec4899","#6366f1","#84cc16","#06b6d4","#f43f5e"];

function dibujarTarta(texto){
  var lineas = texto.replace(/\r\n?/g, "\n").split("\n");
  var titulo = "", datos = [];
  lineas.forEach(function(L){
    L = L.replace(/%%[^\n]*$/, "").trim();
    if(!L) return;
    var mt = L.match(/^pie(?:\s+showData)?(?:\s+title\s+(.*))?$/i);
    if(mt){ if(mt[1]) titulo = mt[1].trim(); return; }
    var mt2 = L.match(/^title\s+(.*)$/i);
    if(mt2){ titulo = mt2[1].trim(); return; }
    var m = L.match(/^"?([^":]+?)"?\s*:\s*([\d.]+)$/);
    if(m) datos.push({ etiqueta: m[1].trim(), valor: parseFloat(m[2]) || 0 });
  });
  if(!datos.length) return null;
  var total = datos.reduce(function(s, d){ return s + d.valor; }, 0) || 1;

  var R = 96, cx = R + 20, cy = R + 20 + (titulo ? 28 : 0);
  var anchoLeyenda = 0;
  datos.forEach(function(d){
    d.pct = d.valor / total;
    d.txt = d.etiqueta + "  " + (Math.round(d.pct * 1000) / 10) + "%";
    anchoLeyenda = Math.max(anchoLeyenda, medir(d.txt, 12.5) + 30);
  });
  var ancho = cx + R + 34 + anchoLeyenda + 20;
  var alto = Math.max(cy + R + 24, 60 + datos.length * 22 + (titulo ? 28 : 0));
  var partes = [], ang = -Math.PI / 2;

  datos.forEach(function(d, k){
    var color = COLORES_TARTA[k % COLORES_TARTA.length];
    var barrido = d.pct * Math.PI * 2;
    if(datos.length === 1 || d.pct >= 0.9999){
      partes.push('<circle cx="' + r2(cx) + '" cy="' + r2(cy) + '" r="' + R + '" fill="' + color + '" stroke="var(--dia-fondo)" stroke-width="2"/>');
    }else{
      var x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
      var x2 = cx + R * Math.cos(ang + barrido), y2 = cy + R * Math.sin(ang + barrido);
      partes.push('<path d="M' + r2(cx) + "," + r2(cy) + " L" + r2(x1) + "," + r2(y1) +
                  " A" + R + "," + R + " 0 " + (barrido > Math.PI ? 1 : 0) + ",1 " + r2(x2) + "," + r2(y2) +
                  ' z" fill="' + color + '" stroke="var(--dia-fondo)" stroke-width="2"/>');
    }
    ang += barrido;
    var ly = 34 + (titulo ? 28 : 0) + k * 22;
    var lx = cx + R + 30;
    partes.push('<rect x="' + r2(lx) + '" y="' + r2(ly) + '" width="13" height="13" rx="3" fill="' + color + '"/>');
    partes.push('<text x="' + r2(lx + 20) + '" y="' + r2(ly + 10.5) + '" font-size="12.5" text-anchor="start" fill="var(--dia-texto)">' + X(d.txt) + "</text>");
  });
  if(titulo){
    partes.unshift('<text x="' + r2(ancho / 2) + '" y="26" font-size="14.5" font-weight="600" text-anchor="middle" fill="var(--dia-texto)">' + X(titulo) + "</text>");
  }
  return envolver("t" + (++nDiagramas), ancho, alto, partes.join("\n"), "Grafico de tarta");
}

/* ---------- puerta de entrada ---------- */
function dibujarDiagrama(texto){
  var t = String(texto == null ? "" : texto).replace(/\r\n?/g, "\n");
  var cab = "";
  var ls = t.split("\n");
  for(var i = 0; i < ls.length; i++){
    var L = ls[i].replace(/%%[^\n]*$/, "").trim();
    if(L){ cab = L; break; }
  }
  try{
    if(/^(?:graph|flowchart)\b/i.test(cab)) return dibujarFlujo(t, false);
    if(/^stateDiagram(?:-v2)?\b/i.test(cab)) return dibujarFlujo(t, true);
    if(/^sequenceDiagram\b/i.test(cab)) return dibujarSecuencia(t);
    if(/^pie\b/i.test(cab)) return dibujarTarta(t);
  }catch(e){ return null; }
  return null;
}

/* ---------- reparto en fichas ---------- */
function fichasTex(s){
  var out = [], i = 0, n = s.length;
  while(i < n){
    var c = s.charAt(i);
    if(c === "\\"){
      var m = /^\\([A-Za-z]+|\\|.)/.exec(s.slice(i));
      if(!m){ i++; continue; }
      out.push({ t: "cmd", v: m[1] });
      i += m[0].length;
    }else if(c === " " || c === "\t" || c === "\n"){
      out.push({ t: "esp", v: " " });
      i++;
    }else if(c >= "0" && c <= "9"){
      var m2 = /^[0-9]+(?:[.,][0-9]+)?/.exec(s.slice(i));
      out.push({ t: "num", v: m2[0] });
      i += m2[0].length;
    }else{
      out.push({ t: "car", v: c });
      i++;
    }
  }
  return out;
}

function texAMathml(tex, bloque){
  var f = fichasTex(String(tex)), i = 0;

  function fin(){ return i >= f.length; }
  function mira(){ return f[i]; }
  function esCierre(tk){
    if(!tk) return true;
    if(tk.t === "car" && tk.v === "}") return true;
    if(tk.t === "cmd" && (tk.v === "right" || tk.v === "end" || tk.v === "\\")) return true;
    return false;
  }

  /* un solo trozo: una ficha, un grupo entre llaves o un mandato con argumentos */
  function trozo(){
    while(!fin() && mira().t === "esp") i++;
    if(fin()) return "";
    var tk = f[i];

    if(tk.t === "car" && tk.v === "{"){
      i++;
      var dentro = secuencia();
      if(!fin() && mira().t === "car" && mira().v === "}") i++;
      return "<mrow>" + dentro + "</mrow>";
    }
    if(tk.t === "num"){ i++; return "<mn>" + X(tk.v) + "</mn>"; }
    if(tk.t === "car"){
      i++;
      var c = tk.v;
      if(/[A-Za-z]/.test(c)) return "<mi>" + X(c) + "</mi>";
      if(c === "'") return "<mo>′</mo>";
      if(c === "-") return "<mo>−</mo>";
      if(c === "*") return "<mo>∗</mo>";
      if(DELIMS[c] !== undefined) return '<mo stretchy="false">' + X(c) + "</mo>";
      return "<mo>" + X(c) + "</mo>";
    }
    /* mandatos */
    i++;
    var c2 = tk.v;

    if(GRIEGAS[c2]) return "<mi>" + GRIEGAS[c2] + "</mi>";
    if(SIMBOLOS[c2]) return "<mo>" + SIMBOLOS[c2] + "</mo>";
    if(ESPACIOS[c2]) return '<mspace width="' + ESPACIOS[c2] + '"/>';
    if(c2 === "\\") return "";

    if(GRANDES[c2] || INTEGRALES[c2]){
      var simbolo = GRANDES[c2] || INTEGRALES[c2];
      var conLim = !!GRANDES[c2] && bloque;
      return operadorGrande('<mo largeop="true">' + simbolo + "</mo>", conLim);
    }
    if(FUNCIONES.indexOf(c2) >= 0){
      var base = "<mi>" + X(c2) + "</mi>";
      if(CON_LIMITES[c2]) return operadorGrande(base, bloque);
      return base;
    }
    if(c2 === "frac" || c2 === "dfrac" || c2 === "tfrac" || c2 === "cfrac"){
      var a = trozo(), b = trozo();
      return "<mfrac>" + (a || "<mrow></mrow>") + (b || "<mrow></mrow>") + "</mfrac>";
    }
    if(c2 === "binom" || c2 === "dbinom"){
      var b1 = trozo(), b2 = trozo();
      return '<mrow><mo stretchy="true">(</mo><mfrac linethickness="0">' + b1 + b2 +
             '</mfrac><mo stretchy="true">)</mo></mrow>';
    }
    if(c2 === "sqrt"){
      while(!fin() && mira().t === "esp") i++;
      if(!fin() && mira().t === "car" && mira().v === "["){
        i++;
        var indice = secuencia("]");
        if(!fin() && mira().t === "car" && mira().v === "]") i++;
        return "<mroot>" + trozo() + "<mrow>" + indice + "</mrow></mroot>";
      }
      return "<msqrt>" + trozo() + "</msqrt>";
    }
    if(c2 === "text" || c2 === "textnormal" || c2 === "mbox"){
      return "<mtext>" + X(textoCrudo()) + "</mtext>";
    }
    if(VARIANTES[c2]){
      var v = VARIANTES[c2];
      if(c2.indexOf("text") === 0) return '<mtext mathvariant="' + v + '">' + X(textoCrudo()) + "</mtext>";
      return '<mstyle mathvariant="' + v + '">' + trozo() + "</mstyle>";
    }
    if(ACENTOS[c2]){
      var esBarra = c2 === "bar" || c2 === "overline";
      return "<mover" + (esBarra ? "" : ' accent="true"') + ">" + trozo() +
             "<mo>" + ACENTOS[c2] + "</mo></mover>";
    }
    if(c2 === "underline"){ return '<munder accentunder="true">' + trozo() + "<mo>‾</mo></munder>"; }
    if(c2 === "operatorname"){ return "<mi>" + X(textoCrudo()) + "</mi>"; }
    if(c2 === "left"){
      var da = leerDelim();
      var cuerpo = secuencia();
      var db = "";
      if(!fin() && mira().t === "cmd" && mira().v === "right"){ i++; db = leerDelim(); }
      return "<mrow>" + (da ? '<mo stretchy="true">' + X(da) + "</mo>" : "") + cuerpo +
             (db ? '<mo stretchy="true">' + X(db) + "</mo>" : "") + "</mrow>";
    }
    if(c2 === "begin"){
      var nombre = textoCrudo().replace(/[*]$/, "");
      return entorno(nombre);
    }
    if(c2 === "limits" || c2 === "nolimits" || c2 === "displaystyle" ||
       c2 === "textstyle" || c2 === "scriptstyle" || c2 === "!" ) return "";
    if(DELIMS["\\" + c2] !== undefined) return '<mo stretchy="false">' + X(DELIMS["\\" + c2]) + "</mo>";

    return "<mi>" + X(c2) + "</mi>";
  }

  /* sub y superindices que van pegados al trozo anterior */
  function operadorGrande(base, bajoEncima){
    var abajo = "", arriba = "";
    for(var vueltas = 0; vueltas < 2; vueltas++){
      while(!fin() && mira().t === "esp") i++;
      if(fin()) break;
      var tk = mira();
      if(tk.t === "cmd" && (tk.v === "limits" || tk.v === "nolimits")){ i++; vueltas--; continue; }
      if(tk.t !== "car" || (tk.v !== "_" && tk.v !== "^")) break;
      i++;
      if(tk.v === "_") abajo = trozo(); else arriba = trozo();
    }
    if(abajo && arriba) return (bajoEncima ? "<munderover>" : "<msubsup>") + base + abajo + arriba + (bajoEncima ? "</munderover>" : "</msubsup>");
    if(abajo) return (bajoEncima ? "<munder>" : "<msub>") + base + abajo + (bajoEncima ? "</munder>" : "</msub>");
    if(arriba) return (bajoEncima ? "<mover>" : "<msup>") + base + arriba + (bajoEncima ? "</mover>" : "</msup>");
    return base;
  }

  function leerDelim(){
    while(!fin() && mira().t === "esp") i++;
    if(fin()) return "";
    var tk = f[i];
    if(tk.t === "cmd"){ i++; return DELIMS["\\" + tk.v] !== undefined ? DELIMS["\\" + tk.v] : ""; }
    i++;
    if(tk.v === ".") return "";
    return DELIMS[tk.v] !== undefined ? DELIMS[tk.v] : tk.v;
  }

  function textoCrudo(){
    while(!fin() && mira().t === "esp") i++;
    if(fin() || mira().t !== "car" || mira().v !== "{") {
      if(!fin()){ var t1 = f[i]; i++; return t1.v; }
      return "";
    }
    i++;
    var s = "", hondo = 1;
    while(!fin()){
      var tk = f[i];
      if(tk.t === "car" && tk.v === "{"){ hondo++; s += "{"; i++; continue; }
      if(tk.t === "car" && tk.v === "}"){ hondo--; i++; if(!hondo) break; s += "}"; continue; }
      s += tk.t === "cmd" ? "\\" + tk.v : tk.v;
      i++;
    }
    return s;
  }

  function entorno(nombre){
    var marco = ENTORNOS[nombre] || ["", ""];
    if(nombre === "array"){ textoCrudo(); }   /* se descarta la fila de alineaciones */
    var filas = [[]], actual = [];
    function cerrarCelda(){ filas[filas.length - 1].push("<mtd>" + actual.join("") + "</mtd>"); actual = []; }
    while(!fin()){
      var tk = mira();
      if(tk.t === "cmd" && tk.v === "end"){ i++; textoCrudo(); break; }
      if(tk.t === "cmd" && tk.v === "\\"){ i++; cerrarCelda(); filas.push([]); continue; }
      if(tk.t === "car" && tk.v === "&"){ i++; cerrarCelda(); continue; }
      if(tk.t === "esp"){ i++; continue; }
      actual.push(conIndices());
    }
    cerrarCelda();
    var cuerpo = filas.filter(function(fila){ return fila.length && fila.join("") !== "<mtd></mtd>"; })
                      .map(function(fila){ return "<mtr>" + fila.join("") + "</mtr>"; }).join("");
    var alineado = nombre === "cases" || nombre.indexOf("align") === 0;
    var tabla = "<mtable" + (alineado ? ' columnalign="left"' : "") + ">" + cuerpo + "</mtable>";
    if(!marco[0] && !marco[1]) return tabla;
    return "<mrow>" + (marco[0] ? '<mo stretchy="true">' + X(marco[0]) + "</mo>" : "") + tabla +
           (marco[1] ? '<mo stretchy="true">' + X(marco[1]) + "</mo>" : "") + "</mrow>";
  }

  function conIndices(){
    var base = trozo();
    var abajo = "", arriba = "";
    for(var vueltas = 0; vueltas < 2; vueltas++){
      while(!fin() && mira().t === "esp") i++;
      if(fin()) break;
      var tk = mira();
      if(tk.t !== "car" || (tk.v !== "_" && tk.v !== "^")) break;
      i++;
      if(tk.v === "_"){ if(abajo) break; abajo = trozo(); }
      else { if(arriba) break; arriba = trozo(); }
    }
    if(abajo && arriba) return "<msubsup>" + base + abajo + arriba + "</msubsup>";
    if(abajo) return "<msub>" + base + abajo + "</msub>";
    if(arriba) return "<msup>" + base + arriba + "</msup>";
    return base;
  }

  function secuencia(parar){
    var trozos = [];
    while(!fin()){
      var tk = mira();
      if(esCierre(tk)) break;
      if(parar && tk.t === "car" && tk.v === parar) break;
      if(tk.t === "esp"){ i++; continue; }
      var antes = i;
      trozos.push(conIndices());
      if(i === antes) i++;   /* red de seguridad: nunca quedarse quieto */
    }
    return trozos.join("");
  }

  var cuerpo = "<mrow>" + secuencia() + "</mrow>";
  if(bloque) cuerpo = '<mstyle displaystyle="true">' + cuerpo + "</mstyle>";
  return '<math xmlns="http://www.w3.org/1998/Math/MathML"' +
         (bloque ? ' display="block"' : "") + ' class="formula' + (bloque ? " formula-bloque" : "") + '">' +
         cuerpo + "</math>";
}

function formula(tex, bloque){
  try{ return texAMathml(tex, bloque); }
  catch(e){ return '<code class="formula-cruda">' + X(tex) + "</code>"; }
}

var ALERTAS = {
  NOTE:{c:"nota", t:"Nota", i:I_NOTA},
  NOTA:{c:"nota", t:"Nota", i:I_NOTA},

/* -------------------------------------------------------------------------- */
function mdAHtml(fuente){
  var Z = String.fromCharCode(0);        // marca interna, invisible
  var RE_MARCA = new RegExp(Z + "(\\d+)" + Z, "g");
  var RE_TROZOS = new RegExp("(" + Z + "\\d+" + Z + "|<[^<>]*>)");

  var G = [];            // fragmentos ya resueltos, a salvo de las demas reglas
  var refs = {};         // definiciones de enlace
  var notas = {};        // notas al pie
  var ordenNotas = [];
  var abrev = [];
  var toc = [];
  var ids = {};
  var meta = {};
  var metaOrden = [];
  var hayTOC = false;

  function g(html){ G.push(html); return Z + (G.length - 1) + Z; }
  function abrirTodo(s){
    var antes, vueltas = 0;
    do{
      antes = s;
      s = s.replace(RE_MARCA, function(m, i){ return G[+i] !== undefined ? G[+i] : m; });
      vueltas++;
    } while(s !== antes && vueltas < 30);
    return s;
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function escAtr(s){ return esc(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function hacerId(t){
    var s = String(t).replace(/<[^>]*>/g, "").replace(/[`*_~\[\]()]/g, "").toLowerCase();
    try{ s = s.normalize("NFD").replace(RE_DIACRITICOS, ""); }catch(e){}
    s = s.replace(/[^a-z0-9\s-]/g, "").trim().replace(/\s+/g, "-").replace(/-+/g, "-");
    if(!s) s = "seccion";
    if(ids[s] === undefined){ ids[s] = 0; return s; }
    ids[s]++;
    return s + "-" + ids[s];
  }

  /* ---------- nivel de linea ---------- */
  function ancla(href, titulo, texto){
    var externo = /^(https?:)?\/\//i.test(href) || /^www\./i.test(href);
    return '<a href="' + escAtr(href) + '"' +
           (titulo ? ' title="' + escAtr(titulo) + '"' : "") +
           (externo ? ' target="_blank" rel="noopener"' : "") + ">" + enLinea(texto) + "</a>";
  }

  function enLinea(t){
    if(t === undefined || t === null) return "";
    t = String(t);

    /* saltos de linea forzados */
    t = t.replace(/ {2,}\n/g, function(){ return g("<br>") + "\n"; });
    t = t.replace(/\\\n/g,   function(){ return g("<br>") + "\n"; });

    /* codigo dentro de la frase */
    t = t.replace(/(`+)([\s\S]+?)\1(?!`)/g, function(m, tk, c){
      if(/^ [\s\S]* $/.test(c) && c.trim() !== "") c = c.slice(1, -1);
      return g("<code>" + esc(c) + "</code>");
    });

    /* formulas entre dolares: $E = mc^2$ */
    if(meta.matematicas !== "no"){
      t = t.replace(/(^|[^\\$])\$([^\s$][^$\n]*?)\$(?![\w$])/g, function(m, antes, cuerpo){
        if(/\s$/.test(cuerpo)) return m;
        return antes + g(formula(cuerpo, false));
      });
    }

    /* caracteres escapados con barra invertida */
    t = t.replace(/\\([\\`*_{}\[\]()<>#+\-.!|~^=$:@\/"'])/g, function(m, c){ return g(esc(c)); });

    /* autoenlaces */
    t = t.replace(/<((?:https?|ftp|mailto):[^>\s]+)>/gi, function(m, u){
      return g('<a href="' + escAtr(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^mailto:/i, "")) + "</a>");
    });
    t = t.replace(/<([^\s<>@]+@[^\s<>@]+\.[a-z]{2,})>/gi, function(m, e){
      return g('<a href="mailto:' + escAtr(e) + '">' + esc(e) + "</a>");
    });

    /* HTML escrito a mano: se respeta tal cual */
    t = t.replace(/<!--[\s\S]*?-->/g, function(m){ return g(m); });
    t = t.replace(/<\/?[a-zA-Z][a-zA-Z0-9-]*(?:\s[^<>]*)?\/?>/g, function(m){ return g(m); });

    /* lo que quede de & < > se escapa */
    t = t.replace(/&(?![a-zA-Z#][a-zA-Z0-9]{1,10};)/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    /* notas al pie */
    t = t.replace(/\[\^([^\]\s]+)\]/g, function(m, id){
      if(!notas[id]) return m;
      if(!notas[id].num){ notas[id].num = ordenNotas.length + 1; ordenNotas.push(id); }
      return g('<sup class="nota-ref" id="notaref-' + escAtr(id) + '"><a href="#nota-' + escAtr(id) + '">' + notas[id].num + "</a></sup>");
    });

    /* imagenes */
    t = t.replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]*)>?(?:\s+["']([^"']*)["'])?\s*\)/g, function(m, alt, src, tit){
      return g('<img src="' + escAtr(src) + '" alt="' + escAtr(alt) + '"' + (tit ? ' title="' + escAtr(tit) + '"' : "") + ">");
    });
    t = t.replace(/!\[([^\]]*)\]\[([^\]]*)\]/g, function(m, alt, id){
      var r = refs[(id || alt).toLowerCase()];
      if(!r) return m;
      return g('<img src="' + escAtr(r.href) + '" alt="' + escAtr(alt) + '"' + (r.titulo ? ' title="' + escAtr(r.titulo) + '"' : "") + ">");
    });

    /* enlaces: directos, por referencia y por referencia corta */
    t = t.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\(\s*<?([^)\s>]*)>?(?:\s+["']([^"']*)["'])?\s*\)/g, function(m, txt, href, tit){
      return g(ancla(href, tit, txt));
    });
    t = t.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\[([^\]]*)\]/g, function(m, txt, id){
      var r = refs[(id || txt).toLowerCase()];
      return r ? g(ancla(r.href, r.titulo, txt)) : m;
    });
    t = t.replace(/\[([^\[\]]+)\](?!\()/g, function(m, txt){
      var r = refs[txt.toLowerCase()];
      return r ? g(ancla(r.href, r.titulo, txt)) : m;
    });

    /* direcciones escritas sueltas */
    t = t.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<>()"']+[^\s<>()"'.,;:!?])/g, function(m, pre, u){
      return pre + g('<a href="' + escAtr(/^www\./i.test(u) ? "https://" + u : u) + '" target="_blank" rel="noopener">' + esc(u) + "</a>");
    });

    /* enfasis y adornos */
    t = t.replace(/(\*\*\*|___)(?=\S)([\s\S]*?\S)\1/g, "<strong><em>$2</em></strong>");
    t = t.replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>");
    t = t.replace(/\*(?=\S)([\s\S]*?\S)\*/g, "<em>$1</em>");
    t = t.replace(/(^|[^\wÀ-ɏ])_(?=\S)([\s\S]*?\S)_(?![\wÀ-ɏ])/g, "$1<em>$2</em>");
    t = t.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
    t = t.replace(/==(?=\S)([\s\S]*?\S)==/g, "<mark>$1</mark>");
    t = t.replace(/\^([^\s^]+)\^/g, "<sup>$1</sup>");
    t = t.replace(/~([^\s~]+)~/g, "<sub>$1</sub>");

    /* emojis por nombre */
    t = t.replace(/:([a-z0-9_+-]{1,30}):/gi, function(m, n){
      var e = EMOJI[n.toLowerCase()];
      return e ? e : m;
    });

    /* abreviaturas */
    if(abrev.length){
      t = t.split(RE_TROZOS).map(function(trozo, i){
        if(i % 2 === 1 || !trozo) return trozo;
        abrev.forEach(function(a){
          trozo = trozo.replace(new RegExp("(^|[^\\w])(" + escRe(a.k) + ")(?![\\w])", "g"), function(mm, p, w){
            return p + '<abbr title="' + escAtr(a.v) + '">' + w + "</abbr>";
          });
        });
        return trozo;
      }).join("");
    }
    return t;
  }

  /* ---------- ayudas de bloque ---------- */
  function esInicioBloque(l){
    return RE_VALLA.test(l) || RE_ATX.test(l) || RE_HR.test(l) ||
           /^ {0,3}>/.test(l) || RE_ITEM.test(l) || RE_HTML.test(l) ||
           /^ {0,3}<!--/.test(l) || RE_TOC.test(l);
  }
  function esTabla(ls, i){
    return ls[i].indexOf("|") >= 0 && i + 1 < ls.length &&
           ls[i + 1].indexOf("-") >= 0 && RE_SEP_TABLA.test(ls[i + 1]);
  }
  function celdas(l){
    var s = l.trim().replace(/^\|/, "").replace(/\|$/, "");
    var out = [], cur = "";
    for(var k = 0; k < s.length; k++){
      if(s[k] === "\\" && s[k + 1] === "|"){ cur += "|"; k++; continue; }
      if(s[k] === "|"){ out.push(cur); cur = ""; continue; }
      cur += s[k];
    }
    out.push(cur);
    return out.map(function(x){ return x.trim(); });
  }
  function quitarP(html){ return html.replace(/^<p>([\s\S]*?)<\/p>\s*/, "$1"); }

  /* ---------- listas ---------- */
  function lista(ls, i){
    var prim = ls[i].match(RE_ITEM);
    var ordenada = /\d/.test(prim[2]);
    var inicio = ordenada ? parseInt(prim[2], 10) : 1;
    var sangriaBase = prim[1].length;
    var items = [], suelta = false, hayTareas = false;

    while(i < ls.length){
      var mm = ls[i].match(RE_ITEM);
      if(!mm) break;
      if(mm[1].length < sangriaBase || mm[1].length > sangriaBase + 3) break;
      if(/\d/.test(mm[2]) !== ordenada) break;
      if(RE_HR.test(ls[i])) break;

      var sangriaCont = mm[1].length + mm[2].length + (mm[3] ? mm[3].length : 1);
      var reCont = new RegExp("^ {" + sangriaCont + ",}");
      var cuerpo = [mm[4]];
      i++;

      while(i < ls.length){
        var l2 = ls[i];
        if(l2.trim() === ""){
          var j = i;
          while(j < ls.length && ls[j].trim() === "") j++;
          if(j < ls.length && reCont.test(ls[j])){
            for(var k = i; k < j; k++) cuerpo.push("");
            suelta = true;
            i = j;
            continue;
          }
          var sig = j < ls.length ? ls[j].match(RE_ITEM) : null;
          if(sig && sig[1].length >= sangriaBase && sig[1].length <= sangriaBase + 3) suelta = true;
          i = j;
          break;
        }
        if(reCont.test(l2)){ cuerpo.push(l2.slice(sangriaCont)); i++; continue; }
        var m3 = l2.match(RE_ITEM);
        if(m3 && m3[1].length >= sangriaBase) break;
        if(esInicioBloque(l2)) break;
        cuerpo.push(l2);                 /* continuacion perezosa */
        i++;
      }
      items.push(cuerpo);
    }

    var html = items.map(function(c){
      var texto = c.join("\n");
      var marca = "";
      var tarea = texto.match(/^\[([ xX])\][ \t]+([\s\S]*)$/);
      if(tarea){
        hayTareas = true;
        marca = '<input type="checkbox" disabled' + (/[xX]/.test(tarea[1]) ? " checked" : "") + "> ";
        texto = tarea[2];
      }
      var dentro = bloques(texto.split("\n"));
      if(!suelta) dentro = quitarP(dentro);
      return "<li" + (tarea ? ' class="tarea"' : "") + ">" + marca + dentro + "</li>";
    }).join("\n");

    var etq = ordenada ? "ol" : "ul";
    var atr = (ordenada && inicio !== 1 ? ' start="' + inicio + '"' : "") +
              (hayTareas ? ' class="lista-tareas"' : "");
    return { html: "<" + etq + atr + ">\n" + html + "\n</" + etq + ">", i: i };
  }

  /* ---------- bloques ---------- */
  function bloques(ls){
    var out = [], i = 0, m;

    while(i < ls.length){
      var L = ls[i];

      if(!L.trim()){ i++; continue; }

      /* indice automatico */
      if(RE_TOC.test(L)){ out.push(Z + "TOC" + Z); hayTOC = true; i++; continue; }

      /* formula suelta entre dobles dolares */
      if(meta.matematicas !== "no" && /^ {0,3}\$\$/.test(L)){
        var restoF = L.replace(/^ {0,3}\$\$/, ""), bufF = [];
        var cerradaF = /\$\$[ \t]*$/.test(restoF) && restoF.replace(/\$\$[ \t]*$/, "").trim() !== "";
        if(cerradaF){
          bufF.push(restoF.replace(/\$\$[ \t]*$/, ""));
          i++;
        }else{
          if(restoF.trim()) bufF.push(restoF);
          i++;
          while(i < ls.length){
            if(/\$\$[ \t]*$/.test(ls[i])){
              var colaF = ls[i].replace(/\$\$[ \t]*$/, "");
              if(colaF.trim()) bufF.push(colaF);
              i++;
              cerradaF = true;
              break;
            }
            bufF.push(ls[i]);
            i++;
          }
        }
        if(cerradaF || bufF.length){
          out.push('<div class="formula-caja no-romper">' + formula(bufF.join("\n").trim(), true) + "</div>");
          continue;
        }
      }

      /* bloque de codigo con vallas */
      m = L.match(RE_VALLA);
      if(m && (m[2].length >= 3)){
        var sangria = m[1].length, valla = m[2], leng = m[3] || "";
        var reSangria = new RegExp("^ {0," + sangria + "}");
        var buf = [];
        i++;
        while(i < ls.length){
          var c = ls[i].match(RE_CIERRE);
          if(c && c[1].charAt(0) === valla.charAt(0) && c[1].length >= valla.length){ i++; break; }
          buf.push(ls[i].replace(reSangria, ""));
          i++;
        }
        var codigo = buf.join("\n");
        var etiqueta = leng.toLowerCase().replace(/^lang(uage)?-/, "");
        if(etiqueta === "mermaid" || etiqueta === "diagrama" || etiqueta === "grafico" || etiqueta === "gr\u00e1fico"){
          var svg = dibujarDiagrama(codigo);
          if(svg){
            out.push('<figure class="diagrama no-romper">' + svg +
                     '<button type="button" class="ver-codigo no-print" aria-expanded="false">c\u00f3digo</button>' +
                     '<pre class="diagrama-fuente" hidden><code>' + esc(codigo) + "</code></pre></figure>");
            continue;
          }
        }
        out.push("<pre" + (leng ? ' data-lenguaje="' + escAtr(leng) + '"' : "") + "><code" +
                 (leng ? ' class="lenguaje-' + escAtr(etiqueta) + '"' : "") + ">" +
                 (hayLenguaje(etiqueta) ? resaltar(codigo, etiqueta) : esc(codigo)) + "</code></pre>");
        continue;
      }

      /* titulos con almohadilla */
      m = L.match(RE_ATX);
      if(m){
        var niv = m[1].length, txt = (m[2] || "").trim(), id = "";
        var mid = txt.match(/[ \t]*\{#([^}]+)\}$/);
        if(mid){ id = mid[1]; txt = txt.slice(0, mid.index); }
        var htxt = enLinea(txt);
        if(!id) id = hacerId(txt);
        toc.push({ n: niv, id: id, t: htxt });
        out.push("<h" + niv + ' id="' + escAtr(id) + '">' + htxt +
                 '<a class="anclaje no-print" href="#' + escAtr(id) + '" aria-label="Enlace a esta sección">#</a></h' + niv + ">");
        i++;
        continue;
      }

      /* raya divisoria */
      if(RE_HR.test(L)){ out.push("<hr>"); i++; continue; }

      /* HTML escrito a mano */
      if(RE_HTML.test(L) || /^ {0,3}<!--/.test(L)){
        var crudo = [];
        while(i < ls.length && ls[i].trim() !== ""){ crudo.push(ls[i]); i++; }
        out.push(crudo.join("\n"));
        continue;
      }

      /* citas y avisos */
      if(/^ {0,3}>/.test(L)){
        var q = [];
        while(i < ls.length){
          if(/^ {0,3}>/.test(ls[i])){ q.push(ls[i].replace(/^ {0,3}>[ \t]?/, "")); i++; }
          else if(ls[i].trim() !== "" && q.length && !esInicioBloque(ls[i])){ q.push(ls[i]); i++; }
          else break;
        }
        var al = q.length ? q[0].match(/^\[!([A-Za-zÁÉÍÓÚÑáéíóúñ]+)\][ \t]*(.*)$/) : null;
        var def = al ? ALERTAS[al[1].toUpperCase()] : null;
        if(def){
          q[0] = al[2] || "";
          if(!q[0].trim()) q.shift();
          out.push('<div class="alerta ' + def.c + '"><p class="alerta-titulo">' + def.i + " " + def.t + "</p>" + bloques(q) + "</div>");
        }else{
          out.push("<blockquote>" + bloques(q) + "</blockquote>");
        }
        continue;
      }

      /* tablas */
      if(esTabla(ls, i)){
        var enc = celdas(ls[i]);
        var alin = celdas(ls[i + 1]).map(function(c){
          var iz = c.charAt(0) === ":", de = c.charAt(c.length - 1) === ":";
          return iz && de ? "center" : de ? "right" : iz ? "left" : "";
        });
        i += 2;
        var filas = [];
        while(i < ls.length && ls[i].trim() !== "" && ls[i].indexOf("|") >= 0 && !esInicioBloque(ls[i])){
          filas.push(celdas(ls[i]));
          i++;
        }
        var est = function(k){ return alin[k] ? ' style="text-align:' + alin[k] + '"' : ""; };
        var t = '<div class="tabla-envoltorio"><table>\n<thead><tr>';
        enc.forEach(function(c, k){ t += "<th" + est(k) + ">" + enLinea(c) + "</th>"; });
        t += "</tr></thead>\n<tbody>";
        filas.forEach(function(f){
          t += "<tr>";
          for(var k = 0; k < enc.length; k++) t += "<td" + est(k) + ">" + enLinea(f[k] === undefined ? "" : f[k]) + "</td>";
          t += "</tr>";
        });
        out.push(t + "</tbody></table></div>");
        continue;
      }

      /* listas */
      if(RE_ITEM.test(L)){
        var r = lista(ls, i);
        out.push(r.html);
        i = r.i;
        continue;
      }

      /* listas de definiciones */
      if(i + 1 < ls.length && /^ {0,3}:[ \t]+\S/.test(ls[i + 1]) && !/^ {0,3}:[ \t]/.test(L)){
        var dl = [];
        while(i < ls.length){
          if(ls[i].trim() === ""){
            if(i + 1 < ls.length && ls[i + 1].trim() !== "" &&
               (/^ {0,3}:[ \t]+/.test(ls[i + 1]) || (i + 2 < ls.length && /^ {0,3}:[ \t]+/.test(ls[i + 2])))){ i++; continue; }
            break;
          }
          if(/^ {0,3}:[ \t]+/.test(ls[i])){
            dl.push("<dd>" + enLinea(ls[i].replace(/^ {0,3}:[ \t]+/, "")) + "</dd>");
            i++;
          }else if(i + 1 < ls.length && /^ {0,3}:[ \t]+/.test(ls[i + 1])){
            dl.push("<dt>" + enLinea(ls[i].trim()) + "</dt>");
            i++;
          }else break;
        }
        out.push("<dl>\n" + dl.join("\n") + "\n</dl>");
        continue;
      }

      /* codigo por sangria de cuatro espacios */
      if(/^ {4}/.test(L)){
        var cb = [];
        while(i < ls.length){
          if(ls[i].trim() === ""){
            if(i + 1 < ls.length && /^ {4}/.test(ls[i + 1])){ cb.push(""); i++; continue; }
            break;
          }
          if(!/^ {4}/.test(ls[i])) break;
          cb.push(ls[i].slice(4));
          i++;
        }
        out.push("<pre><code>" + esc(cb.join("\n")) + "</code></pre>");
        continue;
      }

      /* parrafo, con titulos subrayados */
      var p = [];
      while(i < ls.length && ls[i].trim() !== ""){
        if(p.length && /^ {0,3}=+[ \t]*$/.test(ls[i])){ p.subrayado = 1; i++; break; }
        if(p.length && /^ {0,3}-+[ \t]*$/.test(ls[i])){ p.subrayado = 2; i++; break; }
        if(p.length && (esInicioBloque(ls[i]) || esTabla(ls, i))) break;
        p.push(ls[i]);
        i++;
      }
      if(!p.length){ i++; continue; }
      if(p.subrayado){
        var st = p.join(" ").trim();
        var sid = hacerId(st), sht = enLinea(st);
        toc.push({ n: p.subrayado, id: sid, t: sht });
        out.push("<h" + p.subrayado + ' id="' + escAtr(sid) + '">' + sht +
                 '<a class="anclaje no-print" href="#' + escAtr(sid) + '">#</a></h' + p.subrayado + ">");
      }else{
        out.push("<p>" + enLinea(p.join("\n")) + "</p>");
      }
    }
    return out.join("\n");
  }

  /* ---------- puesta en marcha ---------- */
  var src = String(fuente == null ? "" : fuente).replace(/\r\n?/g, "\n").replace(/\t/g, "    ").replace(/^\n+/, "");

  /* metadatos del principio */
  var fm = src.match(/^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/);
  if(fm){
    var lineasFM = fm[1].split("\n");
    for(var f1 = 0; f1 < lineasFM.length; f1++){
      var lf = lineasFM[f1];
      if(!lf.trim() || /^\s*#/.test(lf)) continue;
      var mm = lf.match(/^([A-Za-z0-9_.\-]+)[ \t]*:[ \t]*(.*)$/);
      if(!mm) continue;
      var clave = mm[1], valor = mm[2].trim(), sueltos = [];
      if(valor === "" || valor === "|" || valor === ">" || valor === "|-" || valor === ">-"){
        var enBloque = (valor !== "");
        while(f1 + 1 < lineasFM.length){
          var sig = lineasFM[f1 + 1];
          if(sig.trim() === ""){ if(!enBloque) break; f1++; continue; }
          if(!/^[ \t]/.test(sig)) break;
          f1++;
          var t = sig.trim();
          sueltos.push(enBloque ? t : t.replace(/^-[ \t]*/, ""));
        }
        valor = sueltos.join(enBloque ? " " : ", ");
      }
      valor = valor.replace(/^["']|["']$/g, "").trim();
      var yaEsta = meta.hasOwnProperty(clave.toLowerCase());
      meta[clave.toLowerCase()] = valor;
      if(yaEsta){
        for(var f2 = 0; f2 < metaOrden.length; f2++){
          if(metaOrden[f2].k.toLowerCase() === clave.toLowerCase()){ metaOrden[f2].v = valor; break; }
        }
      }else metaOrden.push({ k: clave, v: valor });
    }
    src = src.slice(fm[0].length);
  }

  /* definiciones sueltas: enlaces, notas y abreviaturas */
  var lineas = src.split("\n"), limpio = [], enValla = null;
  for(var q1 = 0; q1 < lineas.length; q1++){
    var LN = lineas[q1], mv = LN.match(/^ {0,3}(`{3,}|~{3,})/);
    if(enValla){
      limpio.push(LN);
      if(mv && mv[1].charAt(0) === enValla.charAt(0) && mv[1].length >= enValla.length) enValla = null;
      continue;
    }
    if(mv){ enValla = mv[1]; limpio.push(LN); continue; }

    var ma = LN.match(/^\*\[([^\]]+)\]:[ \t]*(.+)$/);
    if(ma){ abrev.push({ k: ma[1], v: ma[2].trim() }); continue; }

    var mn = LN.match(/^ {0,3}\[\^([^\]\s]+)\]:[ \t]*(.*)$/);
    if(mn){
      var cuerpoN = [mn[2]];
      while(q1 + 1 < lineas.length &&
            (/^ {4}/.test(lineas[q1 + 1]) ||
             (lineas[q1 + 1].trim() === "" && /^ {4}/.test(lineas[q1 + 2] || "")))){
        q1++;
        cuerpoN.push(lineas[q1].replace(/^ {4}/, ""));
      }
      notas[mn[1]] = { md: cuerpoN.join("\n"), num: 0 };
      continue;
    }

    var mr = LN.match(/^ {0,3}\[([^\]^][^\]]*)\]:[ \t]*<?([^\s>]+)>?(?:[ \t]+["'(]([^"')]*)["')])?[ \t]*$/);
    if(mr){ refs[mr[1].toLowerCase()] = { href: mr[2], titulo: mr[3] || "" }; continue; }

    limpio.push(LN);
  }

  var cuerpo = bloques(limpio);

  /* indice */
  if(hayTOC){
    var idx = '<nav class="indice no-romper"><p class="indice-titulo">Índice</p><ul>' +
      toc.map(function(h){ return '<li class="n' + h.n + '"><a href="#' + escAtr(h.id) + '">' + h.t + "</a></li>"; }).join("") +
      "</ul></nav>";
    cuerpo = cuerpo.split(Z + "TOC" + Z).join(idx);
  }

  /* notas al pie */
  if(ordenNotas.length){
    var pie = '<section class="notas-al-pie"><hr><ol>';
    ordenNotas.forEach(function(id){
      pie += '<li id="nota-' + escAtr(id) + '">' + quitarP(bloques(notas[id].md.split("\n"))) +
             ' <a class="volver" href="#notaref-' + escAtr(id) + '" title="Volver al texto">&#8617;</a></li>';
    });
    cuerpo += pie + "</ol></section>";
  }

  return { html: abrirTodo(cuerpo), meta: meta, metaOrden: metaOrden, toc: toc };
}

var $ = function(s){ return document.querySelector(s); };

/* Modo archivo: la copia .html descargada se comporta como el documento suelto
   (sin almacenamiento, sin service worker y sin catálogo remoto). */
var ES_EXPORTADO = document.documentElement.getAttribute("data-standalone") === "1";
var MODO_ARCHIVO = ES_EXPORTADO || location.protocol === "file:";

/* El catalogo viaja dentro del archivo: asi la galeria funciona igual servida
   por http que abriendo index.html a doble clic. En la copia .html que se
   descarga el usuario no va incrustado, para que pese poco. */
var CAT_INCRUSTADO = (function(){
  if(ES_EXPORTADO) return null;

  if(!n) return null;

    var j = JSON.parse(n.textContent);
