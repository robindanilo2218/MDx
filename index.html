  }catch(e){ return null; }
})();
var HAY_GALERIA = !ES_EXPORTADO && (!MODO_ARCHIVO || !!CAT_INCRUSTADO);

var CLAVE_DOC = "mdcrgm.doc", CLAVE_NOMBRE = "mdcrgm.nombre",
    CLAVE_TEMA = "mdcrgm.tema", CLAVE_MIAS = "mdcrgm.mias",
    CLAVE_DOCS = "mdcrgm.docs", CLAVE_ACTIVO = "mdcrgm.activo",
    CLAVE_CONTADOR = "mdcrgm.n", CLAVE_NOTA = "mdcrgm.nota";

var BIENVENIDA = elFuente ? elFuente.textContent : "";
var fuenteActual = BIENVENIDA, textoBase = BIENVENIDA, nombreSugerido = "";

/* ---------- almacenamiento ---------- */
function leer(c){ try{ return localStorage.getItem(c); }catch(e){ return null; } }
function escribir(c, v){ try{ localStorage.setItem(c, v); }catch(e){} }
function borrar(c){ try{ localStorage.removeItem(c); }catch(e){} }
/* ---------- almacen de documentos ----------
   Lo que escribes se guarda solo, aqui mismo: IndexedDB si el navegador deja y,
   si no, localStorage. No sale de tu equipo; pero tampoco esta EN tu equipo: si
   borras los datos de navegacion se va con ellos. Lo unico definitivo es lo que
   descargas a tus carpetas. La copia .html exportada no guarda nada. */
var HAY_ALMACEN = !ES_EXPORTADO;
var BD_NOMBRE = "mdcrgm", BD_TIENDA = "docs", TOPE_DOCS = 60;

function ultimoUso(d){ return Math.max(d.modificado || 0, d.abierto || 0); }
function porFecha(a, b){ return ultimoUso(b) - ultimoUso(a); }

var almacen = (function(){
  var modo = null, bd = null, arranque = null;

  function abrir(){
    if(arranque) return arranque;
    arranque = new Promise(function(listo){
      if(!HAY_ALMACEN){ modo = "no"; return listo("no"); }
      var hecho = false;
      function fin(m){ if(hecho) return; hecho = true; modo = m; listo(m); }
      var reloj = setTimeout(function(){ fin("ls"); }, 3000);
      try{
        if(!window.indexedDB){ clearTimeout(reloj); return fin("ls"); }
        var p = indexedDB.open(BD_NOMBRE, 1);
        p.onupgradeneeded = function(){
          var d = p.result;
          if(!d.objectStoreNames.contains(BD_TIENDA)) d.createObjectStore(BD_TIENDA, { keyPath: "id" });
        };
        p.onsuccess = function(){ bd = p.result; clearTimeout(reloj); fin("idb"); };
        p.onerror = function(){ clearTimeout(reloj); fin("ls"); };
        p.onblocked = function(){ clearTimeout(reloj); fin("ls"); };
      }catch(e){ clearTimeout(reloj); fin("ls"); }
    });
    return arranque;
  }

  /* --- IndexedDB --- */
  function pedir(escribiendo, hacer){
    return new Promise(function(listo, falla){
      var t, q;
      try{ t = bd.transaction(BD_TIENDA, escribiendo ? "readwrite" : "readonly"); }
      catch(e){ return falla(e); }
      t.onerror = function(){ falla(t.error || new Error("error de almacenamiento")); };
      t.onabort = function(){ falla(t.error || new Error("no queda espacio")); };
      try{ q = hacer(t.objectStore(BD_TIENDA)); }catch(e){ return falla(e); }
      q.onsuccess = function(){ listo(q.result); };
    });
  }
  var idb = {
    todos: function(){
      return new Promise(function(listo, falla){
        var t, s, salida = [];
        try{ t = bd.transaction(BD_TIENDA, "readonly"); s = t.objectStore(BD_TIENDA); }
        catch(e){ return falla(e); }
        t.onerror = function(){ falla(t.error || new Error("error de almacenamiento")); };
        if(typeof s.getAll === "function"){
          var q = s.getAll();
          q.onsuccess = function(){ listo((q.result || []).sort(porFecha)); };
        }else{
          var c = s.openCursor();
          c.onsuccess = function(){
            var k = c.result;
            if(k){ salida.push(k.value); k["continue"](); }
            else listo(salida.sort(porFecha));
          };
        }
      });
    },
    poner:  function(d){ return pedir(true, function(s){ return s.put(d); }).then(function(){ return d; }); },
    quitar: function(id){ return pedir(true, function(s){ return s["delete"](id); }); },
    uno:    function(id){ return pedir(false, function(s){ return s.get(id); }); }
  };

  /* --- respaldo: localStorage --- */
  function listaLS(){
    try{ var l = JSON.parse(leer(CLAVE_DOCS) || "[]"); return l && l.length ? l : []; }
    catch(e){ return []; }
  }
  var ls = {
    todos: function(){ return Promise.resolve(listaLS().sort(porFecha)); },
    poner: function(d){
      var l = listaLS().filter(function(x){ return x.id !== d.id; });
      l.push(d); l.sort(porFecha);
      for(;;){
        try{ localStorage.setItem(CLAVE_DOCS, JSON.stringify(l)); return Promise.resolve(d); }
        catch(e){
          var i = -1, j;
          for(j = l.length - 1; j >= 0; j--){
            if(l[j].id !== d.id && l[j].descargado){ i = j; break; }
          }
          if(i < 0) return Promise.reject(new Error("no cabe: descarga y quita alguno de Recientes"));
          l.splice(i, 1);
        }
      }
    },
    quitar: function(id){
      try{ localStorage.setItem(CLAVE_DOCS, JSON.stringify(listaLS().filter(function(x){ return x.id !== id; }))); }
      catch(e){}
      return Promise.resolve();
    },
    uno: function(id){
      return Promise.resolve(listaLS().filter(function(x){ return x.id === id; })[0] || null);
    }
  };

  function usar(){
    return abrir().then(function(m){ return m === "idb" ? idb : (m === "ls" ? ls : null); });
  }
  return {
    abrir: abrir,
    modo: function(){ return modo; },
    todos:  function(){ return usar().then(function(b){ return b ? b.todos() : []; }); },
    poner:  function(d){ return usar().then(function(b){ return b ? b.poner(d) : d; }); },
    quitar: function(i){ return usar().then(function(b){ return b ? b.quitar(i) : null; }); },
    uno:    function(i){ return usar().then(function(b){ return b ? b.uno(i) : null; }); }
  };
})();

/* ---------- el documento en curso ---------- */
var docActual = null, relojGuardar = null, RECIENTES = [];

function etiquetaDoc(n){ return "md" + (n < 10 ? "0" : "") + n; }
function firma(s){
  var h = 5381, i = s.length;
  while(i) h = (h * 33 ^ s.charCodeAt(--i)) >>> 0;
  return s.length + "-" + h.toString(36);
}
function limpiarTitulo(s){
  return String(s).replace(/^['"]|['"]$/g, "").replace(/[#*`_\[\]]+/g, "")
                  .replace(/\s+/g, " ").trim().slice(0, 80);
}
function tituloDe(txt){
  var m = /^\s*---\r?\n([\s\S]*?)\r?\n---/.exec(txt);
  if(m){
    var t = /(^|\n)[ \t]*(titulo|título|title|name)[ \t]*:[ \t]*(.+)/i.exec(m[1]);
    if(t && limpiarTitulo(t[3])) return limpiarTitulo(t[3]);
  }
  var h = /^[ \t]{0,3}#{1,6}[ \t]+(.+)$/m.exec(txt);
  return h ? limpiarTitulo(h[1]) : "";
}
function aArchivo(s){
  return quitarTildes(String(s)).toLowerCase().replace(/[^a-z0-9]+/g, "-")
         .replace(/^-+|-+$/g, "").slice(0, 60);
}
function tamano(n){
  n = n || 0;
  return n < 1024 ? n + " B" : (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
}
function hace(ms){
  var s = Math.max(0, Math.round((Date.now() - (ms || 0)) / 1000));
  if(s < 90) return "hace un momento";
  var m = Math.round(s / 60); if(m < 60) return "hace " + m + " min";
  var h = Math.round(m / 60); if(h < 24) return "hace " + h + " h";
  var d = Math.round(h / 24); return d === 1 ? "ayer" : "hace " + d + " días";
}
function siguienteNumero(){
  var n = parseInt(leer(CLAVE_CONTADOR) || "0", 10);
  n = (n > 0 ? n : 0) + 1;
  escribir(CLAVE_CONTADOR, String(n));
  return n;
}
function crearDoc(texto, opc){
  opc = opc || {};
  var n = siguienteNumero(), ahora = Date.now();
  return {
    id: "d" + ahora.toString(36) + Math.random().toString(36).slice(2, 6),
    n: n, corto: etiquetaDoc(n),
    titulo: tituloDe(texto), nombre: opc.nombre || "",
    texto: texto, bytes: texto.length, creado: ahora, modificado: ahora,
    abierto: ahora, origen: opc.origen || "nuevo", plantilla: opc.plantilla || "",
    version: opc.version || 0, descargado: opc.descargado || 0,
    nombreDescarga: opc.nombreDescarga || "", firmaDescarga: opc.firmaDescarga || ""
  };
}
function pendienteDe(d){
  if(!d) return false;
  if(!d.descargado) return true;
  return firma(d.texto || "") !== d.firmaDescarga;
}
function espejo(){
  if(!HAY_ALMACEN || !docActual) return;
  escribir(CLAVE_DOC, docActual.texto);
  escribir(CLAVE_NOMBRE, docActual.nombre || "");
  escribir(CLAVE_ACTIVO, docActual.id);
}
function guardarRegistro(d){
  if(!HAY_ALMACEN || !d) return Promise.resolve(null);
  return almacen.poner(d)["catch"](function(e){
    aviso("No se pudo guardar en este navegador: " + (e && e.message ? e.message : e),
          "Descargar ahora", descargarMd);
  });
}
function guardarYa(){
  clearTimeout(relojGuardar);
  espejo();
  return guardarRegistro(docActual);
}
function guardarDoc(){
  if(!HAY_ALMACEN) return;
  if(!docActual){
    if(!fuenteActual.trim() || fuenteActual === BIENVENIDA) return;
    docActual = crearDoc(fuenteActual, { nombre: nombreSugerido, origen: "nuevo" });
    primeraVez();
  }
  docActual.texto = fuenteActual;
  docActual.bytes = fuenteActual.length;
  docActual.modificado = Date.now();
  var t = tituloDe(fuenteActual);
  if(t) docActual.titulo = t;
  espejo();
  pintarEstado();
  clearTimeout(relojGuardar);
  relojGuardar = setTimeout(guardarYa, 700);
}
function primeraVez(){
  if(leer(CLAVE_NOTA)) return;
  escribir(CLAVE_NOTA, "1");
  setTimeout(function(){
    aviso("Se guarda aquí, en este navegador. En tu equipo solo estará cuando lo descargues.",
          "Entendido", function(){});
  }, 1400);
}
function podar(lista){
  var sobra = lista.length - TOPE_DOCS;
  if(sobra <= 0) return Promise.resolve(lista);
  var fuera = lista.slice().sort(porFecha).reverse().filter(function(d){
    return d.descargado && !pendienteDe(d) && (!docActual || d.id !== docActual.id);
  }).slice(0, sobra);
  if(!fuera.length) return Promise.resolve(lista);
  var ids = {};
  fuera.forEach(function(d){ ids[d.id] = 1; });
  return Promise.all(fuera.map(function(d){ return almacen.quitar(d.id); })).then(function(){
    return lista.filter(function(d){ return !ids[d.id]; });
  })["catch"](function(){ return lista; });
}
function cargarRecientes(){
  if(!HAY_ALMACEN) return Promise.resolve([]);
  return almacen.todos().then(podar).then(function(l){
    RECIENTES = l || [];
    return RECIENTES;
  })["catch"](function(){ RECIENTES = []; return RECIENTES; });
}

/* --- nombres de descarga, con numero de version --- */
function nombreBaseDoc(){
  var b = ((docActual && docActual.nombre) || nombreSugerido || "")
          .replace(/\.(md|markdown|mdown|mkd|txt|html?)$/i, "");
  if(!b && docActual && docActual.titulo) b = aArchivo(docActual.titulo);
  if(!b) b = baseNombre();
  if((!b || b === "documento") && docActual) b = docActual.corto;
  return b || "documento";
}
function nombreParaDescargar(ext){
  var v = docActual ? (docActual.version || 0) : 0;
  return nombreBaseDoc() + (v >= 1 ? "-v" + (v + 1) : "") + "." + ext;
}
function marcarDescargado(nombre, cuentaVersion){
  if(!docActual) return;
  if(cuentaVersion) docActual.version = (docActual.version || 0) + 1;
  docActual.descargado = Date.now();
  docActual.nombreDescarga = nombre;
  docActual.firmaDescarga = firma(docActual.texto || "");
  guardarYa();
  pintarEstado();
}
function descargarMd(){
  var n = nombreParaDescargar("md");
  descargar(n, fuenteActual.replace(/^\n+/, ""), "text/markdown");
  marcarDescargado(n, true);

/* --- la pildora de estado --- */
function pintarEstado(){
  var caja = $("#estadoDoc");
  if(!caja) return;
  if(!HAY_ALMACEN || !docActual){ caja.hidden = true; return; }
  var p = pendienteDe(docActual);

  var nom = docActual.titulo || (docActual.nombre || "").replace(/\.[a-z0-9]+$/i, "") || "sin título";
  $("#estadoTexto").innerHTML = "<b>" + escUI(docActual.corto) + "</b> " + escUI(nom) + " · " +
    (p ? "guardado aquí, <b>sin descargar</b>"
       : "descargado como " + escUI(docActual.nombreDescarga || nombreParaDescargar("md")));
  $("#estadoTexto").title = p
    ? "Este documento no está en tus carpetas: vive en este navegador. Descárgalo cuando quieras; si borras los datos de navegación, se pierde. Pulsa para ver los recientes."
    : "Guardado en este navegador y descargado a tus carpetas. Pulsa para ver los recientes.";
  var b = $("#estadoDescargar");

function verRecientes(){

  catActual = "recientes";

  var b = $("#buscar"); if(b) b.value = "";

function abrirReciente(id){
  return almacen.uno(id).then(function(d){
    if(!d){ aviso("Ese documento ya no está en Recientes"); return; }
    fijarTexto(d.texto, d.nombre || (d.corto + ".md"),
               { registro: d, aviso: "Abierto " + d.corto + (d.titulo ? " · " + d.titulo : "") });
    cerrarGaleria();

/* ---------- utilidades ---------- */
function escUI(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
var temporizadorAviso = null;
function aviso(texto, etiqueta, accion){
  var caja = $("#aviso"), boton = $("#avisoBoton");
  $("#avisoTexto").textContent = texto;
  clearTimeout(temporizadorAviso);
  if(etiqueta && accion){
    boton.hidden = false;
    boton.textContent = etiqueta;
    boton.onclick = function(){ caja.hidden = true; accion(); };
  }else{
    boton.hidden = true;
    boton.onclick = null;
    temporizadorAviso = setTimeout(function(){ caja.hidden = true; }, 3800);
  }

}

/* ---------- portada y metadatos ---------- */
function quitarTildes(s){
  return String(s).normalize ? String(s).normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]", "g"), "") : String(s);
}
var CLAVES_DOC = { titulo:1, title:1, subtitulo:1, subtitle:1, autor:1, author:1, fecha:1, date:1 };
function portada(meta, orden){
  var t  = meta.titulo || meta.title || "";
  var st = meta.subtitulo || meta.subtitle || "";
  var au = meta.autor || meta.author || "";
  var fe = meta.fecha || meta.date || "";
  var otras = (orden || []).filter(function(p){ return !CLAVES_DOC[p.k.toLowerCase()]; });
  if(!t && !st && !au && !fe && !otras.length) return "";
  var h = '<header class="portada' + (!t && !st ? " solo-meta" : "") + '">';
  if(t)  h += '<h1 class="portada-titulo">' + escUI(t) + "</h1>";
  if(st) h += '<p class="portada-subtitulo">' + escUI(st) + "</p>";
  if(au || fe){
    h += '<p class="portada-datos">' + (au ? "<span>" + escUI(au) + "</span>" : "") +
         (fe ? "<span>" + escUI(fe) + "</span>" : "") + "</p>";
  }
  if(otras.length){
    h += '<dl class="portada-meta">';
    otras.forEach(function(p){ h += "<dt>" + escUI(p.k) + "</dt><dd>" + escUI(p.v) + "</dd>"; });
    h += "</dl>";
  }
  return h + "</header>";
}

/* ---------- pintar ---------- */
function prepararDiagramas(){
  Array.prototype.forEach.call(elDoc.querySelectorAll("figure.diagrama"), function(fig){
    var boton = fig.querySelector(".ver-codigo"), fuente = fig.querySelector(".diagrama-fuente");
    if(!boton || !fuente || boton.dataset.listo) return;
    boton.dataset.listo = "1";
    boton.addEventListener("click", function(){
      var abierto = !fuente.hidden;
      fuente.hidden = abierto;
      boton.setAttribute("aria-expanded", String(!abierto));
      boton.textContent = abierto ? "c\u00f3digo" : "dibujo";
      boton.style.opacity = abierto ? "" : "1";
    });
  });
}

/* la barra de botones se aparta sola mientras se lee y vuelve al subir */
function barraQueSeAparta(){
  var barra = document.getElementById("barra");
  if(!barra) return;
  var ultimo = 0;
  function mostrar(){ barra.classList.remove("escondida"); }
  function mirar(y){
    if(y < 110 || y < ultimo - 5) mostrar();
    else if(y > ultimo + 8 && !barra.contains(document.activeElement)) barra.classList.add("escondida");
    ultimo = y;
  }
  window.addEventListener("scroll", function(){
    mirar(window.pageYOffset || document.documentElement.scrollTop || 0);
  }, { passive: true });
  if(elDoc) elDoc.addEventListener("scroll", function(){ mirar(elDoc.scrollTop); }, { passive: true });
  document.addEventListener("mousemove", function(e){ if(e.clientY < 96) mostrar(); });
  document.addEventListener("focusin", mostrar);
  document.addEventListener("keydown", mostrar);
  window.addEventListener("beforeprint", mostrar);
}

function botonesCopiar(){
  Array.prototype.forEach.call(elDoc.querySelectorAll("pre"), function(pre){
    if(pre.querySelector(".copiar")) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "copiar no-print"; b.textContent = "copiar";
    b.addEventListener("click", function(){
      var c = pre.querySelector("code");
      copiar(c ? c.textContent : pre.textContent);
      b.textContent = "copiado";
      setTimeout(function(){ b.textContent = "copiar"; }, 1200);
    });
    pre.appendChild(b);
  });
}
function copiar(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt)["catch"](function(){ copiarViejo(txt); });
  }else copiarViejo(txt);
}
function copiarViejo(txt){
  var a = document.createElement("textarea");
  a.value = txt; a.style.position = "fixed"; a.style.opacity = "0";
  document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(a);
}

function pintar(md){
  var r;
  try{ r = mdAHtml(md); }
  catch(e){
    elDoc.innerHTML = '<div class="alerta precaucion"><p class="alerta-titulo">Error al convertir el texto</p><p>' +
                      escUI(e && e.message ? e.message : e) + "</p></div>";
    return;
  }
  elDoc.innerHTML = portada(r.meta, r.metaOrden) + r.html;
  var t = r.meta.titulo || r.meta.title || r.meta.name || "";
  document.title = t ? t + " · Markdown" : "Markdown · crgm";
  botonesCopiar();
  prepararDiagramas();
}

function fijarTexto(txt, nombre, opc){
  opc = opc || {};
  var anterior = docActual;
  /* lo que habia en pantalla no se pierde: se guarda antes de soltarlo */
  if(HAY_ALMACEN && anterior && (!opc.registro || opc.registro.id !== anterior.id)){
    anterior.texto = fuenteActual;
    anterior.bytes = fuenteActual.length;
    anterior.modificado = Date.now();
    clearTimeout(relojGuardar);
    guardarRegistro(anterior);
  }
  fuenteActual = String(txt);
  textoBase = fuenteActual;
  if(nombre !== undefined) nombreSugerido = nombre || "";
  if(elEd) elEd.value = fuenteActual;
  if(HAY_ALMACEN && !opc.sinRegistro){
    if(opc.registro){
      docActual = opc.registro;
      docActual.abierto = Date.now();
    }else{
      docActual = crearDoc(fuenteActual, {
        nombre: nombreSugerido, origen: opc.origen || "nuevo", plantilla: opc.plantilla || "",
        version: opc.version || 0, descargado: opc.descargado || 0,
        nombreDescarga: opc.nombreDescarga || "", firmaDescarga: opc.firmaDescarga || ""
      });
      primeraVez();
    }
    guardarYa();
  }
  pintarEstado();
  pintar(fuenteActual);
  window.scrollTo(0, 0);
  if(elDoc.parentNode) elDoc.scrollTop = 0;
  if(opc.aviso){
    if(anterior && docActual && anterior.id !== docActual.id && (anterior.texto || "").trim()){
      aviso(opc.aviso + ". " + anterior.corto + " quedó en Recientes.", "Volver a " + anterior.corto,
            function(){ abrirReciente(anterior.id); });
    }else{
      aviso(opc.aviso);
    }
  }
}
function hayCambios(){ return fuenteActual.trim() !== textoBase.trim(); }
function confirmarReemplazo(){
  if(HAY_ALMACEN) return true;   /* no hace falta preguntar: queda guardado en Recientes */
  if(!hayCambios()) return true;
  return window.confirm("Vas a reemplazar el documento actual y tienes cambios sin descargar. ¿Seguimos?");
}

/* ---------- descargas ---------- */
function descargar(nombre, texto, tipo){
  var b = new Blob([texto], { type: tipo + ";charset=utf-8" });
  var u = URL.createObjectURL(b);
  var a = document.createElement("a");
  a.href = u; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
}
function baseNombre(){
  if(nombreSugerido) return nombreSugerido.replace(/\.(md|markdown|mdown|mkd|txt|html?)$/i, "");
  var t = (document.title || "").replace(/ · Markdown$/, "").replace(/[\\\/:*?"<>|]+/g, "").trim();
  return (t && t !== "Markdown · crgm" ? t : "documento").toLowerCase().replace(/\s+/g, "-").slice(0, 60);
}
function guardarHtml(){
  var clon = document.documentElement.cloneNode(true);
  clon.setAttribute("data-standalone", "1");
  ["link[rel=manifest]", "link[rel~=apple-touch-icon]", "link[rel='alternate icon']", "link[rel=icon]"].forEach(function(sel){
    Array.prototype.forEach.call(clon.querySelectorAll(sel), function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
  });
  var cat = clon.querySelector("#catalogo");
  if(cat && cat.parentNode) cat.parentNode.removeChild(cat);
  var f = clon.querySelector("#fuente");
  if(f) f.textContent = "\n" + fuenteActual.replace(/<\/(script)/gi, "<\\/$1") + "\n";
  var d = clon.querySelector("#doc"); if(d) d.innerHTML = "";
  var le = clon.querySelector("#ladoEditor"); if(le) le.hidden = true;
  var ta = clon.querySelector("#ed"); if(ta) ta.textContent = "";
  var be = clon.querySelector("#btnEditar"); if(be) be.innerHTML = "<b>&#9998;</b><span>Editar</span>";
  var velo = clon.querySelector("#velo"); if(velo) velo.hidden = true;
  var av = clon.querySelector("#aviso"); if(av) av.hidden = true;
  var ed = clon.querySelector("#estadoDoc"); if(ed) ed.hidden = true;
  clon.querySelector("body").className = "";
  var nombreHtml = nombreBaseDoc() + ".html";
  descargar(nombreHtml, "<!doctype html>\n" + clon.outerHTML, "text/html");
  marcarDescargado(nombreHtml, false);
}

/* ---------- editor ---------- */
var abierto = false, temporizador = null;
function alternarEditor(){
  abierto = !abierto;
  document.body.classList.toggle("editando", abierto);
  $("#ladoEditor").hidden = !abierto;
  $("#btnEditar").innerHTML = abierto ? "<b>&#10007;</b><span>Cerrar</span>" : "<b>&#9998;</b><span>Editar</span>";
  if(abierto){ elEd.value = fuenteActual; elEd.focus(); }
}
if(elEd){
  elEd.addEventListener("input", function(){
    fuenteActual = elEd.value;
    clearTimeout(temporizador);
    temporizador = setTimeout(function(){ pintar(fuenteActual); guardarDoc(); }, 200);
    if(docActual){ docActual.texto = fuenteActual; pintarEstado(); }
  });
  elEd.addEventListener("keydown", function(e){
    if(e.key === "Tab"){
      e.preventDefault();
      var s = elEd.selectionStart, f = elEd.selectionEnd;
      elEd.value = elEd.value.slice(0, s) + "  " + elEd.value.slice(f);
      elEd.selectionStart = elEd.selectionEnd = s + 2;
    }
  });
}

/* ---------- tema ---------- */
function ponerTema(t){
  if(t) document.documentElement.setAttribute("data-tema", t);
  else document.documentElement.removeAttribute("data-tema");
}
ponerTema(leer(CLAVE_TEMA));
function alternarTema(){
  var actual = document.documentElement.getAttribute("data-tema");
  var oscuro = actual ? actual === "oscuro"
    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var nuevo = oscuro ? "claro" : "oscuro";
  ponerTema(nuevo);
  escribir(CLAVE_TEMA, nuevo);
}

/* ---------- catálogo de plantillas ---------- */
var CATALOGO = null, catActual = null, filtro = "";
function misPlantillas(){
  try{ return JSON.parse(leer(CLAVE_MIAS) || "[]"); }catch(e){ return []; }
}
function guardarMias(lista){ escribir(CLAVE_MIAS, JSON.stringify(lista)); }

function cargarCatalogo(){
  if(CATALOGO) return Promise.resolve(CATALOGO);
  if(MODO_ARCHIVO || !window.fetch){
    CATALOGO = CAT_INCRUSTADO || { categorias: [], plantillas: [] };
    return Promise.resolve(CATALOGO);
  }
  return fetch("plantillas/indice.json").then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(j){ CATALOGO = j; return j; })["catch"](function(e){
    if(CAT_INCRUSTADO){ CATALOGO = CAT_INCRUSTADO; return CATALOGO; }
    throw e;
  });
}

function cuerpoIncrustado(id){
  if(!CAT_INCRUSTADO) return null;
  var x = CAT_INCRUSTADO.plantillas.filter(function(y){ return y.id === id; })[0];
  return x && x.cuerpo ? x.cuerpo : null;
}

function abrirGaleria(){
  $("#velo").hidden = false;
  Promise.all([cargarCatalogo(), cargarRecientes()]).then(function(){
    if(!catActual) catActual = (CATALOGO.categorias[0] || {}).id || "mias";
    pintarGaleria();
    var b = $("#buscar"); if(b) b.focus();
  })["catch"](function(e){
    $("#tarjetas").innerHTML = '<p class="vacio">No se pudo cargar el catálogo (' + escUI(e.message) + ').</p>';
  });
}
function cerrarGaleria(){ $("#velo").hidden = true; }

function tarjetaReciente(d){
  var pend = pendienteDe(d), activo = docActual && docActual.id === d.id;
  return '<button type="button" class="tarjeta reciente' + (activo ? " activa" : "") +
         '" data-rec="' + escUI(d.id) + '">' +
         "<h3>" + escUI(d.titulo || "Sin título") + "</h3>" +
         '<p class="reciente-datos"><code>' + escUI(d.corto) + "</code> " +
         escUI(hace(d.modificado)) + " · " + tamano(d.bytes) +
         (activo ? " · en pantalla" : "") + "</p>" +
         '<span class="marca ' + (pend ? "pendiente" : "guardado") + '">' +
         (pend ? "sin descargar" : "descargado" + ((d.version || 0) > 1 ? " · v" + d.version : "")) +
         "</span>" +
         '<span class="acciones"><span data-bajarrec="' + escUI(d.id) + '">descargar</span>' +
         '<span class="quitar-rec" data-quitarrec="' + escUI(d.id) + '">quitar</span></span>' +
         "</button>";
}

function todasLasPlantillas(){
  var recs = RECIENTES.map(function(d){
    return { id: "rec:" + d.id, cat: "recientes", titulo: d.titulo || "Sin título",
             desc: d.corto + " · " + hace(d.modificado) + (pendienteDe(d) ? " · sin descargar" : ""),
             nombre: d.nombre || "", rec: d };
  });
  var mias = misPlantillas().map(function(p){
    return { id: p.id, cat: "mias", titulo: p.titulo, desc: p.desc || "Plantilla tuya",
             nombre: p.nombre || "", texto: p.texto, mia: true };
  });
  return recs.concat(CATALOGO ? CATALOGO.plantillas : []).concat(mias);
}

function pintarGaleria(){
  var cats = (HAY_ALMACEN ? [{ id: "recientes", nombre: "Recientes", icono: "◷",
                               descripcion: "Lo que has escrito o abierto en este navegador" }] : [])
    .concat(CATALOGO ? CATALOGO.categorias : [])
    .concat([{ id: "mias", nombre: "Mis plantillas", icono: "★", descripcion: "Las que guardas tú, en este navegador" }]);
  var todas = todasLasPlantillas();
  var q = filtro.trim().toLowerCase();

  var nav = "";
  if(q){
    nav = '<p>Resultados</p>';
  }else{
    nav = cats.map(function(c){
      var n = todas.filter(function(p){ return p.cat === c.id; }).length;
      return '<button type="button" data-cat="' + escUI(c.id) + '" aria-current="' + (c.id === catActual) + '">' +
             '<i>' + escUI(c.icono || "") + "</i>" + escUI(c.nombre) +
             '<span class="cuenta">' + n + "</span></button>";
    }).join("");
  }
  $("#categorias").innerHTML = nav;

  var nombreCat = {};
  cats.forEach(function(c){ nombreCat[c.id] = c.nombre; });
  var lista = todas.filter(function(p){
    if(q){
      var texto = [p.titulo, p.desc || "", p.destino || "", p.nombre || "", nombreCat[p.cat] || ""].join(" ");
      return quitarTildes(texto.toLowerCase()).indexOf(quitarTildes(q)) >= 0;
    }
    return p.cat === catActual;
  });

  var html = "";
  if(!q && catActual === "mias"){
    html += '<button type="button" class="tarjeta" data-guardar="1">' +
            "<h3>&#65291; Guardar este documento</h3>" +
            "<p>Convierte lo que tienes escrito ahora en una plantilla tuya, guardada en este navegador.</p></button>";
  }
  html += lista.map(function(p){
    if(p.rec) return tarjetaReciente(p.rec);
    return '<button type="button" class="tarjeta" data-id="' + escUI(p.id) + '">' +
           "<h3>" + escUI(p.titulo) + "</h3>" +
           "<p>" + escUI(p.desc || "") + "</p>" +
           (p.destino && p.destino !== "—" ? "<code>" + escUI(p.destino) + "</code>" : "") +
           (p.mia ? '<span class="quitar" data-quitar="' + escUI(p.id) + '">quitar</span>' : "") +
           "</button>";
  }).join("");
  if(!lista.length && !(!q && catActual === "mias")){
    html = '<p class="vacio">' + (q ? "Nada encaja con esa búsqueda."
      : (catActual === "recientes"
          ? "Aquí irá apareciendo lo que escribas o abras. Nada se pierde por cambiar de plantilla."
          : "Aquí no hay nada todavía.")) + "</p>";
  }
  if(!q && catActual === "recientes" && HAY_ALMACEN){
    html += '<p class="nota-almacen">Esto vive en este navegador (' +
            (almacen.modo() === "idb" ? "IndexedDB" : "almacenamiento local") +
            '), no en tu equipo. Si borras los datos de navegación, se borra también: ' +
            'lo único que no se pierde es lo que descargas a tus carpetas. ' +
            'Se guardan los últimos ' + TOPE_DOCS + ' documentos; al pasarse, se van los más antiguos ' +
            'que ya hubieras descargado.</p>';
  }
  $("#tarjetas").innerHTML = html;
}

function usarPlantilla(id){
  var p = todasLasPlantillas().filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  var traer;
  if(p.mia) traer = Promise.resolve(p.texto);
  else if(p.cuerpo) traer = Promise.resolve(p.cuerpo);
  else traer = fetch("plantillas/" + p.archivo).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })["catch"](function(e){
      var c = cuerpoIncrustado(id);
      if(c) return c;
      throw e;
    });
  traer.then(function(txt){
    if(!confirmarReemplazo()) return;
    fijarTexto(txt, p.nombre || (p.id + ".md"),
               { origen: "plantilla", plantilla: p.id, aviso: "Plantilla cargada: " + p.titulo });
    cerrarGaleria();
  })["catch"](function(e){ aviso("No se pudo cargar: " + e.message); });
}

/* ---------- eventos ---------- */
$("#categorias").addEventListener("click", function(e){
  var b = e.target.closest("button[data-cat]");
  if(!b) return;
  catActual = b.getAttribute("data-cat");
  pintarGaleria();
});
$("#tarjetas").addEventListener("click", function(e){
  var quitarRec = e.target.closest("[data-quitarrec]");
  if(quitarRec){
    e.stopPropagation();
    var idr = quitarRec.getAttribute("data-quitarrec");
    var reg = RECIENTES.filter(function(d){ return d.id === idr; })[0];
    var texto = reg && pendienteDe(reg)
      ? "Este documento no lo has descargado a tu equipo. Si lo quitas, se pierde. ¿Lo quito?"
      : "¿Quitar este documento de Recientes?";
    if(!window.confirm(texto)) return;
    almacen.quitar(idr).then(function(){
      if(docActual && docActual.id === idr){ docActual = null; borrar(CLAVE_ACTIVO); pintarEstado(); }
      return cargarRecientes();
    }).then(pintarGaleria);
    return;
  }
  var bajarRec = e.target.closest("[data-bajarrec]");
  if(bajarRec){
    e.stopPropagation();
    var idb2 = bajarRec.getAttribute("data-bajarrec");
    var d2 = RECIENTES.filter(function(d){ return d.id === idb2; })[0];
    if(!d2) return;
    var base = (d2.nombre || "").replace(/\.[a-z0-9]+$/i, "") || aArchivo(d2.titulo || "") || d2.corto;
    var nom = base + ((d2.version || 0) >= 1 ? "-v" + ((d2.version || 0) + 1) : "") + ".md";
    descargar(nom, (d2.texto || "").replace(/^\n+/, ""), "text/markdown");
    d2.version = (d2.version || 0) + 1;
    d2.descargado = Date.now();
    d2.nombreDescarga = nom;
    d2.firmaDescarga = firma(d2.texto || "");
    if(docActual && docActual.id === d2.id){ docActual = d2; pintarEstado(); }
    guardarRegistro(d2).then(function(){ pintarGaleria(); });
    aviso("Descargado como " + nom);
    return;
  }
  var quitar = e.target.closest("[data-quitar]");
  if(quitar){
    e.stopPropagation();
    var idq = quitar.getAttribute("data-quitar");
    if(window.confirm("¿Quitar esta plantilla tuya?")){
      guardarMias(misPlantillas().filter(function(p){ return p.id !== idq; }));
      pintarGaleria();
    }
    return;
  }
  var tarjeta = e.target.closest(".tarjeta");
  if(!tarjeta) return;
  if(tarjeta.getAttribute("data-rec")){ abrirReciente(tarjeta.getAttribute("data-rec")); return; }
  if(tarjeta.getAttribute("data-guardar")){
    var titulo = window.prompt("Nombre de la plantilla:", (document.title || "").replace(/ · Markdown$/, ""));
    if(!titulo) return;
    var lista = misPlantillas();
    lista.push({ id: "mia-" + lista.length + "-" + titulo.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24),
                 titulo: titulo, desc: "Guardada por ti", nombre: nombreSugerido, texto: fuenteActual });
    guardarMias(lista);
    pintarGaleria();
    aviso("Guardada en «Mis plantillas»");
    return;
  }
  usarPlantilla(tarjeta.getAttribute("data-id"));
});

$("#cerrarDialogo").addEventListener("click", cerrarGaleria);

$("#archivo").addEventListener("change", function(){
  var f = this.files && this.files[0];
  this.value = "";
  if(!f) return;
  if(!confirmarReemplazo()) return;
  var fr = new FileReader();
  fr.onload = function(){
    var texto = String(fr.result);
    fijarTexto(texto, f.name, {
      origen: "local", version: 1, descargado: f.lastModified || Date.now(),
      nombreDescarga: f.name, firmaDescarga: firma(texto),
      aviso: "Abierto: " + f.name
    });
  };
  fr.readAsText(f);
});

/* arrastrar y soltar un .md sobre la página */
["dragover", "drop"].forEach(function(ev){
  document.addEventListener(ev, function(e){
    e.preventDefault();
    if(ev !== "drop") return;
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f || !/\.(md|markdown|mdown|mkd|txt)$/i.test(f.name)) return;
    if(!confirmarReemplazo()) return;
    var fr = new FileReader();
    fr.onload = function(){
      var texto = String(fr.result);
      fijarTexto(texto, f.name, {
        origen: "local", version: 1, descargado: f.lastModified || Date.now(),
        nombreDescarga: f.name, firmaDescarga: firma(texto),
        aviso: "Abierto: " + f.name
      });
    };
    fr.readAsText(f);
  });
});

document.addEventListener("keydown", function(e){
  var ctrl = e.ctrlKey || e.metaKey;
  if(ctrl && (e.key === "e" || e.key === "E")){ e.preventDefault(); alternarEditor(); }
  else if(ctrl && (e.key === "k" || e.key === "K")){ e.preventDefault(); abrirGaleria(); }
  else if(e.key === "Escape" && !$("#velo").hidden){ cerrarGaleria(); }
});

/* ---------- service worker ---------- */
if(!MODO_ARCHIVO && "serviceWorker" in navigator &&
   (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound", function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", function(){
          if(nuevo.state === "installed" && navigator.serviceWorker.controller){
            aviso("Hay una versión nueva de la aplicación", "Actualizar", function(){
              nuevo.postMessage({ tipo: "ACTUALIZAR" });
            });
          }
        });
      });
    })["catch"](function(){});
    var recargando = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(recargando) return;
      recargando = true;
      location.reload();
    });
  });
}

/* ---------- arranque ---------- */
if(!HAY_GALERIA) $("#btnPlantillas").hidden = true;
if(HAY_ALMACEN){
  var guardadoDoc = leer(CLAVE_DOC);
  if(guardadoDoc && guardadoDoc.trim()){
    fuenteActual = guardadoDoc;
    textoBase = guardadoDoc;
    nombreSugerido = leer(CLAVE_NOMBRE) || "";
  }
}

var parametros = new URLSearchParams(location.search);
pintar(fuenteActual);
if(elEd) elEd.value = fuenteActual;

if(!ES_EXPORTADO && parametros.has("nuevo")){
  fijarTexto("---\ntitulo: \nautor: \nfecha: \n---\n\n", "documento.md");
  alternarEditor();
  history.replaceState(null, "", location.pathname);
}else if(HAY_GALERIA && parametros.get("plantilla")){
  var pedida = parametros.get("plantilla");
  history.replaceState(null, "", location.pathname);
  cargarCatalogo().then(function(){ usarPlantilla(pedida); })["catch"](function(){});
}else if(HAY_GALERIA && parametros.has("plantillas")){
  history.replaceState(null, "", location.pathname);
  abrirGaleria();
}

/* recuperar el documento en curso: primero el espejo (instantaneo) y luego su
   ficha completa del almacen, con el numero md y si estaba descargado */
if(HAY_ALMACEN){
  almacen.abrir().then(function(){
    var pedido = leer(CLAVE_ACTIVO);
    if(!pedido) return null;
    return almacen.uno(pedido);
  }).then(function(d){
    if(docActual) return cargarRecientes();
    if(d){
      if(fuenteActual && fuenteActual !== d.texto && fuenteActual !== BIENVENIDA){
        d.texto = fuenteActual;
        d.bytes = fuenteActual.length;
        d.modificado = Date.now();
      }
      docActual = d;
      if(!nombreSugerido && d.nombre) nombreSugerido = d.nombre;
      pintarEstado();
    }else if(fuenteActual && fuenteActual !== BIENVENIDA && fuenteActual.trim()){
      docActual = crearDoc(fuenteActual, { nombre: nombreSugerido, origen: "recuperado" });
      guardarYa();
      pintarEstado();
    }
    return cargarRecientes();
  })["catch"](function(){});
}

barraQueSeAparta();

window.plantilla = {
  convertir: mdAHtml, pintar: pintar, editor: alternarEditor, galeria: abrirGaleria,
  guardarHtml: guardarHtml, tema: alternarTema, fijar: fijarTexto,
  texto: function(){ return fuenteActual; }, modoArchivo: MODO_ARCHIVO,
  almacen: almacen, recientes: cargarRecientes, descargarMd: descargarMd,
  documento: function(){ return docActual; }, verRecientes: verRecientes
};

})();
</script>
</body>
</html>
