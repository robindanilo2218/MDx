function mdAHtml(fuente){
  var Z = String.fromCharCode(0);        // marca interna, invisible
  var RE_MARCA = new RegExp(Z + "(\\d+)" + Z, "g");
  var RE_TROZOS = new RegExp("(" + Z + "\\d+" + Z + "|<[^<>]*>)");

  var G = [];            // fragmentos ya resueltos, a salvo de las demas reglas
  var refs = {};         // definiciones de enlace
  var notas = {};        // notas al pie
  var ordenNotas = [];
  var abrev = [];
  var toc = [];
  var ids = {};
  var meta = {};
  var metaOrden = [];
  var hayTOC = false;

  function g(html){ G.push(html); return Z + (G.length - 1) + Z; }
  function abrirTodo(s){
    var antes, vueltas = 0;
    do{
      antes = s;
      s = s.replace(RE_MARCA, function(m, i){ return G[+i] !== undefined ? G[+i] : m; });
      vueltas++;
    } while(s !== antes && vueltas < 30);
    return s;
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function escAtr(s){ return esc(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function hacerId(t){
    var s = String(t).replace(/<[^>]*>/g, "").replace(/[`*_~\[\]()]/g, "").toLowerCase();
    try{ s = s.normalize("NFD").replace(RE_DIACRITICOS, ""); }catch(e){}
    s = s.replace(/[^a-z0-9\s-]/g, "").trim().replace(/\s+/g, "-").replace(/-+/g, "-");
    if(!s) s = "seccion";
    if(ids[s] === undefined){ ids[s] = 0; return s; }
    ids[s]++;
    return s + "-" + ids[s];
  }

  /* ---------- nivel de linea ---------- */
  function ancla(href, titulo, texto){
    var externo = /^(https?:)?\/\//i.test(href) || /^www\./i.test(href);
    return '<a href="' + escAtr(href) + '"' +
           (titulo ? ' title="' + escAtr(titulo) + '"' : "") +
           (externo ? ' target="_blank" rel="noopener"' : "") + ">" + enLinea(texto) + "</a>";
  }

  function enLinea(t){
    if(t === undefined || t === null) return "";
    t = String(t);

    /* saltos de linea forzados */
    t = t.replace(/ {2,}\n/g, function(){ return g("<br>") + "\n"; });
    t = t.replace(/\\\n/g,   function(){ return g("<br>") + "\n"; });

    /* codigo dentro de la frase */
    t = t.replace(/(`+)([\s\S]+?)\1(?!`)/g, function(m, tk, c){
      if(/^ [\s\S]* $/.test(c) && c.trim() !== "") c = c.slice(1, -1);
      return g("<code>" + esc(c) + "</code>");
    });

    /* formulas entre dolares: $E = mc^2$ */
    if(meta.matematicas !== "no"){
      t = t.replace(/(^|[^\\$])\$([^\s$][^$\n]*?)\$(?![\w$])/g, function(m, antes, cuerpo){
        if(/\s$/.test(cuerpo)) return m;
        return antes + g(formula(cuerpo, false));
      });
    }

    /* caracteres escapados con barra invertida */
    t = t.replace(/\\([\\`*_{}\[\]()<>#+\-.!|~^=$:@\/"'])/g, function(m, c){ return g(esc(c)); });

    /* autoenlaces */
    t = t.replace(/<((?:https?|ftp|mailto):[^>\s]+)>/gi, function(m, u){
      return g('<a href="' + escAtr(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^mailto:/i, "")) + "</a>");
    });
    t = t.replace(/<([^\s<>@]+@[^\s<>@]+\.[a-z]{2,})>/gi, function(m, e){
      return g('<a href="mailto:' + escAtr(e) + '">' + esc(e) + "</a>");
    });

    /* HTML escrito a mano: se respeta tal cual */
    t = t.replace(/<!--[\s\S]*?-->/g, function(m){ return g(m); });
    t = t.replace(/<\/?[a-zA-Z][a-zA-Z0-9-]*(?:\s[^<>]*)?\/?>/g, function(m){ return g(m); });

    /* lo que quede de & < > se escapa */
    t = t.replace(/&(?![a-zA-Z#][a-zA-Z0-9]{1,10};)/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    /* notas al pie */
    t = t.replace(/\[\^([^\]\s]+)\]/g, function(m, id){
      if(!notas[id]) return m;
      if(!notas[id].num){ notas[id].num = ordenNotas.length + 1; ordenNotas.push(id); }
      return g('<sup class="nota-ref" id="notaref-' + escAtr(id) + '"><a href="#nota-' + escAtr(id) + '">' + notas[id].num + "</a></sup>");
    });

    /* imagenes */
    t = t.replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]*)>?(?:\s+["']([^"']*)["'])?\s*\)/g, function(m, alt, src, tit){
      return g('<img src="' + escAtr(src) + '" alt="' + escAtr(alt) + '"' + (tit ? ' title="' + escAtr(tit) + '"' : "") + ">");
    });
    t = t.replace(/!\[([^\]]*)\]\[([^\]]*)\]/g, function(m, alt, id){
      var r = refs[(id || alt).toLowerCase()];
      if(!r) return m;
      return g('<img src="' + escAtr(r.href) + '" alt="' + escAtr(alt) + '"' + (r.titulo ? ' title="' + escAtr(r.titulo) + '"' : "") + ">");
    });

    /* enlaces: directos, por referencia y por referencia corta */
    t = t.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\(\s*<?([^)\s>]*)>?(?:\s+["']([^"']*)["'])?\s*\)/g, function(m, txt, href, tit){
      return g(ancla(href, tit, txt));
    });
    t = t.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\[([^\]]*)\]/g, function(m, txt, id){
      var r = refs[(id || txt).toLowerCase()];
      return r ? g(ancla(r.href, r.titulo, txt)) : m;
    });
    t = t.replace(/\[([^\[\]]+)\](?!\()/g, function(m, txt){
      var r = refs[txt.toLowerCase()];
      return r ? g(ancla(r.href, r.titulo, txt)) : m;
    });

    /* direcciones escritas sueltas */
    t = t.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<>()"']+[^\s<>()"'.,;:!?])/g, function(m, pre, u){
      return pre + g('<a href="' + escAtr(/^www\./i.test(u) ? "https://" + u : u) + '" target="_blank" rel="noopener">' + esc(u) + "</a>");
    });

    /* enfasis y adornos */
    t = t.replace(/(\*\*\*|___)(?=\S)([\s\S]*?\S)\1/g, "<strong><em>$2</em></strong>");
    t = t.replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>");
    t = t.replace(/\*(?=\S)([\s\S]*?\S)\*/g, "<em>$1</em>");
    t = t.replace(/(^|[^\wÀ-ɏ])_(?=\S)([\s\S]*?\S)_(?![\wÀ-ɏ])/g, "$1<em>$2</em>");
    t = t.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
    t = t.replace(/==(?=\S)([\s\S]*?\S)==/g, "<mark>$1</mark>");
    t = t.replace(/\^([^\s^]+)\^/g, "<sup>$1</sup>");
    t = t.replace(/~([^\s~]+)~/g, "<sub>$1</sub>");

    /* emojis por nombre */
    t = t.replace(/:([a-z0-9_+-]{1,30}):/gi, function(m, n){
      var e = EMOJI[n.toLowerCase()];
      return e ? e : m;
    });

    /* abreviaturas */
    if(abrev.length){
      t = t.split(RE_TROZOS).map(function(trozo, i){
        if(i % 2 === 1 || !trozo) return trozo;
        abrev.forEach(function(a){
          trozo = trozo.replace(new RegExp("(^|[^\\w])(" + escRe(a.k) + ")(?![\\w])", "g"), function(mm, p, w){
            return p + '<abbr title="' + escAtr(a.v) + '">' + w + "</abbr>";
          });
        });
        return trozo;
      }).join("");
    }
    return t;
  }

  /* ---------- ayudas de bloque ---------- */
  function esInicioBloque(l){
    return RE_VALLA.test(l) || RE_ATX.test(l) || RE_HR.test(l) ||
           /^ {0,3}>/.test(l) || RE_ITEM.test(l) || RE_HTML.test(l) ||
           /^ {0,3}<!--/.test(l) || RE_TOC.test(l);
  }
  function esTabla(ls, i){
    return ls[i].indexOf("|") >= 0 && i + 1 < ls.length &&
           ls[i + 1].indexOf("-") >= 0 && RE_SEP_TABLA.test(ls[i + 1]);
  }
  function celdas(l){
    var s = l.trim().replace(/^\|/, "").replace(/\|$/, "");
    var out = [], cur = "";
    for(var k = 0; k < s.length; k++){
      if(s[k] === "\\" && s[k + 1] === "|"){ cur += "|"; k++; continue; }
      if(s[k] === "|"){ out.push(cur); cur = ""; continue; }
      cur += s[k];
    }
    out.push(cur);
    return out.map(function(x){ return x.trim(); });
  }
  function quitarP(html){ return html.replace(/^<p>([\s\S]*?)<\/p>\s*/, "$1"); }

  /* ---------- listas ---------- */
  function lista(ls, i){
    var prim = ls[i].match(RE_ITEM);
    var ordenada = /\d/.test(prim[2]);
    var inicio = ordenada ? parseInt(prim[2], 10) : 1;
    var sangriaBase = prim[1].length;
    var items = [], suelta = false, hayTareas = false;

    while(i < ls.length){
      var mm = ls[i].match(RE_ITEM);
      if(!mm) break;
      if(mm[1].length < sangriaBase || mm[1].length > sangriaBase + 3) break;
      if(/\d/.test(mm[2]) !== ordenada) break;
      if(RE_HR.test(ls[i])) break;

      var sangriaCont = mm[1].length + mm[2].length + (mm[3] ? mm[3].length : 1);
      var reCont = new RegExp("^ {" + sangriaCont + ",}");
      var cuerpo = [mm[4]];
      i++;

      while(i < ls.length){
        var l2 = ls[i];
        if(l2.trim() === ""){
          var j = i;
          while(j < ls.length && ls[j].trim() === "") j++;
          if(j < ls.length && reCont.test(ls[j])){
            for(var k = i; k < j; k++) cuerpo.push("");
            suelta = true;
            i = j;
            continue;
          }
          var sig = j < ls.length ? ls[j].match(RE_ITEM) : null;
          if(sig && sig[1].length >= sangriaBase && sig[1].length <= sangriaBase + 3) suelta = true;
          i = j;
          break;
        }
        if(reCont.test(l2)){ cuerpo.push(l2.slice(sangriaCont)); i++; continue; }
        var m3 = l2.match(RE_ITEM);
        if(m3 && m3[1].length >= sangriaBase) break;
        if(esInicioBloque(l2)) break;
        cuerpo.push(l2);                 /* continuacion perezosa */
        i++;
      }
      items.push(cuerpo);
    }

    var html = items.map(function(c){
      var texto = c.join("\n");
      var marca = "";
      var tarea = texto.match(/^\[([ xX])\][ \t]+([\s\S]*)$/);
      if(tarea){
        hayTareas = true;
        marca = '<input type="checkbox" disabled' + (/[xX]/.test(tarea[1]) ? " checked" : "") + "> ";
        texto = tarea[2];
      }
      var dentro = bloques(texto.split("\n"));
      if(!suelta) dentro = quitarP(dentro);
      return "<li" + (tarea ? ' class="tarea"' : "") + ">" + marca + dentro + "</li>";
    }).join("\n");

    var etq = ordenada ? "ol" : "ul";
    var atr = (ordenada && inicio !== 1 ? ' start="' + inicio + '"' : "") +
              (hayTareas ? ' class="lista-tareas"' : "");
    return { html: "<" + etq + atr + ">\n" + html + "\n</" + etq + ">", i: i };
  }

  /* ---------- bloques ---------- */
  function bloques(ls){
    var out = [], i = 0, m;

    while(i < ls.length){
      var L = ls[i];

      if(!L.trim()){ i++; continue; }

      /* indice automatico */
      if(RE_TOC.test(L)){ out.push(Z + "TOC" + Z); hayTOC = true; i++; continue; }

      /* formula suelta entre dobles dolares */
      if(meta.matematicas !== "no" && /^ {0,3}\$\$/.test(L)){
        var restoF = L.replace(/^ {0,3}\$\$/, ""), bufF = [];
        var cerradaF = /\$\$[ \t]*$/.test(restoF) && restoF.replace(/\$\$[ \t]*$/, "").trim() !== "";
        if(cerradaF){
          bufF.push(restoF.replace(/\$\$[ \t]*$/, ""));
          i++;
        }else{
          if(restoF.trim()) bufF.push(restoF);
          i++;
          while(i < ls.length){
            if(/\$\$[ \t]*$/.test(ls[i])){
              var colaF = ls[i].replace(/\$\$[ \t]*$/, "");
              if(colaF.trim()) bufF.push(colaF);
              i++;
              cerradaF = true;
              break;
            }
            bufF.push(ls[i]);
            i++;
          }
        }
        if(cerradaF || bufF.length){
          out.push('<div class="formula-caja no-romper">' + formula(bufF.join("\n").trim(), true) + "</div>");
          continue;
        }
      }

      /* bloque de codigo con vallas */
      m = L.match(RE_VALLA);
      if(m && (m[2].length >= 3)){
        var sangria = m[1].length, valla = m[2], leng = m[3] || "";
        var reSangria = new RegExp("^ {0," + sangria + "}");
        var buf = [];
        i++;
        while(i < ls.length){
          var c = ls[i].match(RE_CIERRE);
          if(c && c[1].charAt(0) === valla.charAt(0) && c[1].length >= valla.length){ i++; break; }
          buf.push(ls[i].replace(reSangria, ""));
          i++;
        }
        var codigo = buf.join("\n");
        var etiqueta = leng.toLowerCase().replace(/^lang(uage)?-/, "");
        if(etiqueta === "mermaid" || etiqueta === "diagrama" || etiqueta === "grafico" || etiqueta === "gr\u00e1fico"){
          var svg = dibujarDiagrama(codigo);
          if(svg){
            out.push('<figure class="diagrama no-romper">' + svg +
                     '<button type="button" class="ver-codigo no-print" aria-expanded="false">c\u00f3digo</button>' +
                     '<pre class="diagrama-fuente" hidden><code>' + esc(codigo) + "</code></pre></figure>");
            continue;
          }
        }
        out.push("<pre" + (leng ? ' data-lenguaje="' + escAtr(leng) + '"' : "") + "><code" +
                 (leng ? ' class="lenguaje-' + escAtr(etiqueta) + '"' : "") + ">" +
                 (hayLenguaje(etiqueta) ? resaltar(codigo, etiqueta) : esc(codigo)) + "</code></pre>");
        continue;
      }

      /* titulos con almohadilla */
      m = L.match(RE_ATX);
      if(m){
        var niv = m[1].length, txt = (m[2] || "").trim(), id = "";
        var mid = txt.match(/[ \t]*\{#([^}]+)\}$/);
        if(mid){ id = mid[1]; txt = txt.slice(0, mid.index); }
        var htxt = enLinea(txt);
        if(!id) id = hacerId(txt);
        toc.push({ n: niv, id: id, t: htxt });
        out.push("<h" + niv + ' id="' + escAtr(id) + '">' + htxt +
                 '<a class="anclaje no-print" href="#' + escAtr(id) + '" aria-label="Enlace a esta sección">#</a></h' + niv + ">");
        i++;
        continue;
      }

      /* raya divisoria */
      if(RE_HR.test(L)){ out.push("<hr>"); i++; continue; }

      /* HTML escrito a mano */
      if(RE_HTML.test(L) || /^ {0,3}<!--/.test(L)){
        var crudo = [];
        while(i < ls.length && ls[i].trim() !== ""){ crudo.push(ls[i]); i++; }
        out.push(crudo.join("\n"));
        continue;
      }

      /* citas y avisos */
      if(/^ {0,3}>/.test(L)){
        var q = [];
        while(i < ls.length){
          if(/^ {0,3}>/.test(ls[i])){ q.push(ls[i].replace(/^ {0,3}>[ \t]?/, "")); i++; }
          else if(ls[i].trim() !== "" && q.length && !esInicioBloque(ls[i])){ q.push(ls[i]); i++; }
          else break;
        }
        var al = q.length ? q[0].match(/^\[!([A-Za-zÁÉÍÓÚÑáéíóúñ]+)\][ \t]*(.*)$/) : null;
        var def = al ? ALERTAS[al[1].toUpperCase()] : null;
        if(def){
          q[0] = al[2] || "";
          if(!q[0].trim()) q.shift();
          out.push('<div class="alerta ' + def.c + '"><p class="alerta-titulo">' + def.i + " " + def.t + "</p>" + bloques(q) + "</div>");
        }else{
          out.push("<blockquote>" + bloques(q) + "</blockquote>");
        }
        continue;
      }

      /* tablas */
      if(esTabla(ls, i)){
        var enc = celdas(ls[i]);
        var alin = celdas(ls[i + 1]).map(function(c){
          var iz = c.charAt(0) === ":", de = c.charAt(c.length - 1) === ":";
          return iz && de ? "center" : de ? "right" : iz ? "left" : "";
        });
        i += 2;
        var filas = [];
        while(i < ls.length && ls[i].trim() !== "" && ls[i].indexOf("|") >= 0 && !esInicioBloque(ls[i])){
          filas.push(celdas(ls[i]));
          i++;
        }
        var est = function(k){ return alin[k] ? ' style="text-align:' + alin[k] + '"' : ""; };
        var t = '<div class="tabla-envoltorio"><table>\n<thead><tr>';
        enc.forEach(function(c, k){ t += "<th" + est(k) + ">" + enLinea(c) + "</th>"; });
        t += "</tr></thead>\n<tbody>";
        filas.forEach(function(f){
          t += "<tr>";
          for(var k = 0; k < enc.length; k++) t += "<td" + est(k) + ">" + enLinea(f[k] === undefined ? "" : f[k]) + "</td>";
          t += "</tr>";
        });
        out.push(t + "</tbody></table></div>");
        continue;
      }

      /* listas */
      if(RE_ITEM.test(L)){
        var r = lista(ls, i);
        out.push(r.html);
        i = r.i;
        continue;
      }

      /* listas de definiciones */
      if(i + 1 < ls.length && /^ {0,3}:[ \t]+\S/.test(ls[i + 1]) && !/^ {0,3}:[ \t]/.test(L)){
        var dl = [];
        while(i < ls.length){
          if(ls[i].trim() === ""){
            if(i + 1 < ls.length && ls[i + 1].trim() !== "" &&
               (/^ {0,3}:[ \t]+/.test(ls[i + 1]) || (i + 2 < ls.length && /^ {0,3}:[ \t]+/.test(ls[i + 2])))){ i++; continue; }
            break;
          }
          if(/^ {0,3}:[ \t]+/.test(ls[i])){
            dl.push("<dd>" + enLinea(ls[i].replace(/^ {0,3}:[ \t]+/, "")) + "</dd>");
            i++;
          }else if(i + 1 < ls.length && /^ {0,3}:[ \t]+/.test(ls[i + 1])){
            dl.push("<dt>" + enLinea(ls[i].trim()) + "</dt>");
            i++;
          }else break;
        }
        out.push("<dl>\n" + dl.join("\n") + "\n</dl>");
        continue;
      }

      /* codigo por sangria de cuatro espacios */
      if(/^ {4}/.test(L)){
        var cb = [];
        while(i < ls.length){
          if(ls[i].trim() === ""){
            if(i + 1 < ls.length && /^ {4}/.test(ls[i + 1])){ cb.push(""); i++; continue; }
            break;
          }
          if(!/^ {4}/.test(ls[i])) break;
          cb.push(ls[i].slice(4));
          i++;
        }
        out.push("<pre><code>" + esc(cb.join("\n")) + "</code></pre>");
        continue;
      }

      /* parrafo, con titulos subrayados */
      var p = [];
      while(i < ls.length && ls[i].trim() !== ""){
        if(p.length && /^ {0,3}=+[ \t]*$/.test(ls[i])){ p.subrayado = 1; i++; break; }
        if(p.length && /^ {0,3}-+[ \t]*$/.test(ls[i])){ p.subrayado = 2; i++; break; }
        if(p.length && (esInicioBloque(ls[i]) || esTabla(ls, i))) break;
        p.push(ls[i]);
        i++;
      }
      if(!p.length){ i++; continue; }
      if(p.subrayado){
        var st = p.join(" ").trim();
        var sid = hacerId(st), sht = enLinea(st);
        toc.push({ n: p.subrayado, id: sid, t: sht });
        out.push("<h" + p.subrayado + ' id="' + escAtr(sid) + '">' + sht +
                 '<a class="anclaje no-print" href="#' + escAtr(sid) + '">#</a></h' + p.subrayado + ">");
      }else{
        out.push("<p>" + enLinea(p.join("\n")) + "</p>");
      }
    }
    return out.join("\n");
  }

  /* ---------- puesta en marcha ---------- */
  var src = String(fuente == null ? "" : fuente).replace(/\r\n?/g, "\n").replace(/\t/g, "    ").replace(/^\n+/, "");

  /* metadatos del principio */
  var fm = src.match(/^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/);
  if(fm){
    var lineasFM = fm[1].split("\n");
    for(var f1 = 0; f1 < lineasFM.length; f1++){
      var lf = lineasFM[f1];
      if(!lf.trim() || /^\s*#/.test(lf)) continue;
      var mm = lf.match(/^([A-Za-z0-9_.\-]+)[ \t]*:[ \t]*(.*)$/);
      if(!mm) continue;
      var clave = mm[1], valor = mm[2].trim(), sueltos = [];
      if(valor === "" || valor === "|" || valor === ">" || valor === "|-" || valor === ">-"){
        var enBloque = (valor !== "");
        while(f1 + 1 < lineasFM.length){
          var sig = lineasFM[f1 + 1];
          if(sig.trim() === ""){ if(!enBloque) break; f1++; continue; }
          if(!/^[ \t]/.test(sig)) break;
          f1++;
          var t = sig.trim();
          sueltos.push(enBloque ? t : t.replace(/^-[ \t]*/, ""));
        }
        valor = sueltos.join(enBloque ? " " : ", ");
      }
      valor = valor.replace(/^["']|["']$/g, "").trim();
      var yaEsta = meta.hasOwnProperty(clave.toLowerCase());
      meta[clave.toLowerCase()] = valor;
      if(yaEsta){
        for(var f2 = 0; f2 < metaOrden.length; f2++){
          if(metaOrden[f2].k.toLowerCase() === clave.toLowerCase()){ metaOrden[f2].v = valor; break; }
        }
      }else metaOrden.push({ k: clave, v: valor });
    }
    src = src.slice(fm[0].length);
  }

  /* definiciones sueltas: enlaces, notas y abreviaturas */
  var lineas = src.split("\n"), limpio = [], enValla = null;
  for(var q1 = 0; q1 < lineas.length; q1++){
    var LN = lineas[q1], mv = LN.match(/^ {0,3}(`{3,}|~{3,})/);
    if(enValla){
      limpio.push(LN);
      if(mv && mv[1].charAt(0) === enValla.charAt(0) && mv[1].length >= enValla.length) enValla = null;
      continue;
    }
    if(mv){ enValla = mv[1]; limpio.push(LN); continue; }

    var ma = LN.match(/^\*\[([^\]]+)\]:[ \t]*(.+)$/);
    if(ma){ abrev.push({ k: ma[1], v: ma[2].trim() }); continue; }

    var mn = LN.match(/^ {0,3}\[\^([^\]\s]+)\]:[ \t]*(.*)$/);
    if(mn){
      var cuerpoN = [mn[2]];
      while(q1 + 1 < lineas.length &&
            (/^ {4}/.test(lineas[q1 + 1]) ||
             (lineas[q1 + 1].trim() === "" && /^ {4}/.test(lineas[q1 + 2] || "")))){
        q1++;
        cuerpoN.push(lineas[q1].replace(/^ {4}/, ""));
      }
      notas[mn[1]] = { md: cuerpoN.join("\n"), num: 0 };
      continue;
    }

    var mr = LN.match(/^ {0,3}\[([^\]^][^\]]*)\]:[ \t]*<?([^\s>]+)>?(?:[ \t]+["'(]([^"')]*)["')])?[ \t]*$/);
    if(mr){ refs[mr[1].toLowerCase()] = { href: mr[2], titulo: mr[3] || "" }; continue; }

    limpio.push(LN);
  }

  var cuerpo = bloques(limpio);

  /* indice */
  if(hayTOC){
    var idx = '<nav class="indice no-romper"><p class="indice-titulo">Índice</p><ul>' +
      toc.map(function(h){ return '<li class="n' + h.n + '"><a href="#' + escAtr(h.id) + '">' + h.t + "</a></li>"; }).join("") +
      "</ul></nav>";
    cuerpo = cuerpo.split(Z + "TOC" + Z).join(idx);
  }

  /* notas al pie */
  if(ordenNotas.length){
    var pie = '<section class="notas-al-pie"><hr><ol>';
    ordenNotas.forEach(function(id){
      pie += '<li id="nota-' + escAtr(id) + '">' + quitarP(bloques(notas[id].md.split("\n"))) +
             ' <a class="volver" href="#notaref-' + escAtr(id) + '" title="Volver al texto">&#8617;</a></li>';
    });
    cuerpo += pie + "</ol></section>";
  }

  return { html: abrirTodo(cuerpo), meta: meta, metaOrden: metaOrden, toc: toc };
}

/* ==========================================================================
   INTERFAZ: pintar, editar, plantillas, guardar, imprimir, instalar
   ========================================================================== */
var $ = function(s){ return document.querySelector(s); };
var elFuente = $("#fuente"), elDoc = $("#doc"), elEd = $("#ed");

/* Modo archivo: la copia .html descargada se comporta como el documento suelto
   (sin almacenamiento, sin service worker y sin catálogo remoto). */
var MODO_ARCHIVO = document.documentElement.getAttribute("data-standalone") === "1" ||
                   location.protocol === "file:";

var CLAVE_DOC = "mdcrgm.doc", CLAVE_NOMBRE = "mdcrgm.nombre",
    CLAVE_TEMA = "mdcrgm.tema", CLAVE_MIAS = "mdcrgm.mias";

var BIENVENIDA = elFuente ? elFuente.textContent : "";
var fuenteActual = BIENVENIDA, textoBase = BIENVENIDA, nombreSugerido = "";

/* ---------- almacenamiento ---------- */
function leer(c){ try{ return localStorage.getItem(c); }catch(e){ return null; } }
function escribir(c, v){ try{ localStorage.setItem(c, v); }catch(e){} }
function borrar(c){ try{ localStorage.removeItem(c); }catch(e){} }
function guardarDoc(){
  if(MODO_ARCHIVO) return;
  escribir(CLAVE_DOC, fuenteActual);
  escribir(CLAVE_NOMBRE, nombreSugerido);
}

/* ---------- utilidades ---------- */
function escUI(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
var temporizadorAviso = null;
function aviso(texto, etiqueta, accion){
  var caja = $("#aviso"), boton = $("#avisoBoton");
  $("#avisoTexto").textContent = texto;
  clearTimeout(temporizadorAviso);
  if(etiqueta && accion){
    boton.hidden = false;
    boton.textContent = etiqueta;
    boton.onclick = function(){ caja.hidden = true; accion(); };
  }else{
    boton.hidden = true;
    boton.onclick = null;
    temporizadorAviso = setTimeout(function(){ caja.hidden = true; }, 3800);
  }
  caja.hidden = false;
}

/* ---------- portada y metadatos ---------- */
function quitarTildes(s){
  return String(s).normalize ? String(s).normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]", "g"), "") : String(s);
}
var CLAVES_DOC = { titulo:1, title:1, subtitulo:1, subtitle:1, autor:1, author:1, fecha:1, date:1 };
function portada(meta, orden){
  var t  = meta.titulo || meta.title || "";
  var st = meta.subtitulo || meta.subtitle || "";
  var au = meta.autor || meta.author || "";
  var fe = meta.fecha || meta.date || "";
  var otras = (orden || []).filter(function(p){ return !CLAVES_DOC[p.k.toLowerCase()]; });
  if(!t && !st && !au && !fe && !otras.length) return "";
  var h = '<header class="portada' + (!t && !st ? " solo-meta" : "") + '">';
  if(t)  h += '<h1 class="portada-titulo">' + escUI(t) + "</h1>";
  if(st) h += '<p class="portada-subtitulo">' + escUI(st) + "</p>";
  if(au || fe){
    h += '<p class="portada-datos">' + (au ? "<span>" + escUI(au) + "</span>" : "") +
         (fe ? "<span>" + escUI(fe) + "</span>" : "") + "</p>";
  }
  if(otras.length){
    h += '<dl class="portada-meta">';
    otras.forEach(function(p){ h += "<dt>" + escUI(p.k) + "</dt><dd>" + escUI(p.v) + "</dd>"; });
    h += "</dl>";
  }
  return h + "</header>";
}

/* ---------- pintar ---------- */
function prepararDiagramas(){
  Array.prototype.forEach.call(elDoc.querySelectorAll("figure.diagrama"), function(fig){
    var boton = fig.querySelector(".ver-codigo"), fuente = fig.querySelector(".diagrama-fuente");
    if(!boton || !fuente || boton.dataset.listo) return;
    boton.dataset.listo = "1";
    boton.addEventListener("click", function(){
      var abierto = !fuente.hidden;
      fuente.hidden = abierto;
      boton.setAttribute("aria-expanded", String(!abierto));
      boton.textContent = abierto ? "c\u00f3digo" : "dibujo";
      boton.style.opacity = abierto ? "" : "1";
    });
  });
}

/* la barra de botones se aparta sola mientras se lee y vuelve al subir */
function barraQueSeAparta(){
  var barra = document.getElementById("barra");
  if(!barra) return;
  var ultimo = 0;
  function mostrar(){ barra.classList.remove("escondida"); }
  function mirar(y){
    if(y < 110 || y < ultimo - 5) mostrar();
    else if(y > ultimo + 8 && !barra.contains(document.activeElement)) barra.classList.add("escondida");
    ultimo = y;
  }
  window.addEventListener("scroll", function(){
    mirar(window.pageYOffset || document.documentElement.scrollTop || 0);
  }, { passive: true });
  if(elDoc) elDoc.addEventListener("scroll", function(){ mirar(elDoc.scrollTop); }, { passive: true });
  document.addEventListener("mousemove", function(e){ if(e.clientY < 96) mostrar(); });
  document.addEventListener("focusin", mostrar);
  document.addEventListener("keydown", mostrar);
  window.addEventListener("beforeprint", mostrar);
}

function botonesCopiar(){
  Array.prototype.forEach.call(elDoc.querySelectorAll("pre"), function(pre){
    if(pre.querySelector(".copiar")) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "copiar no-print"; b.textContent = "copiar";
    b.addEventListener("click", function(){
      var c = pre.querySelector("code");
      copiar(c ? c.textContent : pre.textContent);
      b.textContent = "copiado";
      setTimeout(function(){ b.textContent = "copiar"; }, 1200);
    });
    pre.appendChild(b);
  });
}
function copiar(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt)["catch"](function(){ copiarViejo(txt); });
  }else copiarViejo(txt);
}
function copiarViejo(txt){
  var a = document.createElement("textarea");
  a.value = txt; a.style.position = "fixed"; a.style.opacity = "0";
  document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(a);
}

function pintar(md){
  var r;
  try{ r = mdAHtml(md); }
  catch(e){
    elDoc.innerHTML = '<div class="alerta precaucion"><p class="alerta-titulo">Error al convertir el texto</p><p>' +
                      escUI(e && e.message ? e.message : e) + "</p></div>";
    return;
  }
  elDoc.innerHTML = portada(r.meta, r.metaOrden) + r.html;
  var t = r.meta.titulo || r.meta.title || r.meta.name || "";
  document.title = t ? t + " · Markdown" : "Markdown · crgm";
  botonesCopiar();
  prepararDiagramas();
}

function fijarTexto(txt, nombre){
  fuenteActual = String(txt);
  textoBase = fuenteActual;
  if(nombre !== undefined) nombreSugerido = nombre || "";
  if(elEd) elEd.value = fuenteActual;
  guardarDoc();
  pintar(fuenteActual);
  window.scrollTo(0, 0);
  if(elDoc.parentNode) elDoc.scrollTop = 0;
}
function hayCambios(){ return fuenteActual.trim() !== textoBase.trim(); }
function confirmarReemplazo(){
  if(!hayCambios()) return true;
  return window.confirm("Vas a reemplazar el documento actual y tienes cambios sin descargar. ¿Seguimos?");
}

/* ---------- descargas ---------- */
function descargar(nombre, texto, tipo){
  var b = new Blob([texto], { type: tipo + ";charset=utf-8" });
  var u = URL.createObjectURL(b);
  var a = document.createElement("a");
  a.href = u; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
}
function baseNombre(){
  if(nombreSugerido) return nombreSugerido.replace(/\.(md|markdown|mdown|mkd|txt|html?)$/i, "");
  var t = (document.title || "").replace(/ · Markdown$/, "").replace(/[\\\/:*?"<>|]+/g, "").trim();
  return (t && t !== "Markdown · crgm" ? t : "documento").toLowerCase().replace(/\s+/g, "-").slice(0, 60);
}
function guardarHtml(){
  var clon = document.documentElement.cloneNode(true);
  clon.setAttribute("data-standalone", "1");
  ["link[rel=manifest]", "link[rel~=apple-touch-icon]", "link[rel='alternate icon']", "link[rel=icon]"].forEach(function(sel){
    Array.prototype.forEach.call(clon.querySelectorAll(sel), function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
  });
  var f = clon.querySelector("#fuente");
  if(f) f.textContent = "\n" + fuenteActual.replace(/<\/(script)/gi, "<\\/$1") + "\n";
  var d = clon.querySelector("#doc"); if(d) d.innerHTML = "";
  var le = clon.querySelector("#ladoEditor"); if(le) le.hidden = true;
  var ta = clon.querySelector("#ed"); if(ta) ta.textContent = "";
  var be = clon.querySelector("#btnEditar"); if(be) be.innerHTML = "<b>&#9998;</b><span>Editar</span>";
  var velo = clon.querySelector("#velo"); if(velo) velo.hidden = true;
  var av = clon.querySelector("#aviso"); if(av) av.hidden = true;
  clon.querySelector("body").className = "";
  descargar(baseNombre() + ".html", "<!doctype html>\n" + clon.outerHTML, "text/html");
}

/* ---------- editor ---------- */
var abierto = false, temporizador = null;
function alternarEditor(){
  abierto = !abierto;
  document.body.classList.toggle("editando", abierto);
  $("#ladoEditor").hidden = !abierto;
  $("#btnEditar").innerHTML = abierto ? "<b>&#10007;</b><span>Cerrar</span>" : "<b>&#9998;</b><span>Editar</span>";
  if(abierto){ elEd.value = fuenteActual; elEd.focus(); }
}
if(elEd){
  elEd.addEventListener("input", function(){
    fuenteActual = elEd.value;
    clearTimeout(temporizador);
    temporizador = setTimeout(function(){ pintar(fuenteActual); guardarDoc(); }, 200);
  });
  elEd.addEventListener("keydown", function(e){
    if(e.key === "Tab"){
      e.preventDefault();
      var s = elEd.selectionStart, f = elEd.selectionEnd;
      elEd.value = elEd.value.slice(0, s) + "  " + elEd.value.slice(f);
      elEd.selectionStart = elEd.selectionEnd = s + 2;
    }
  });
}

/* ---------- tema ---------- */
function ponerTema(t){
  if(t) document.documentElement.setAttribute("data-tema", t);
  else document.documentElement.removeAttribute("data-tema");
}
ponerTema(leer(CLAVE_TEMA));
function alternarTema(){
  var actual = document.documentElement.getAttribute("data-tema");
  var oscuro = actual ? actual === "oscuro"
    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var nuevo = oscuro ? "claro" : "oscuro";
  ponerTema(nuevo);
  escribir(CLAVE_TEMA, nuevo);
}

/* ---------- catálogo de plantillas ---------- */
var CATALOGO = null, catActual = null, filtro = "";
function misPlantillas(){
  try{ return JSON.parse(leer(CLAVE_MIAS) || "[]"); }catch(e){ return []; }
}
function guardarMias(lista){ escribir(CLAVE_MIAS, JSON.stringify(lista)); }

function cargarCatalogo(){
  if(CATALOGO) return Promise.resolve(CATALOGO);
  if(MODO_ARCHIVO) return Promise.resolve({ categorias: [], plantillas: [] });
  return fetch("plantillas/indice.json").then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(j){ CATALOGO = j; return j; });
}

function abrirGaleria(){
  $("#velo").hidden = false;
  cargarCatalogo().then(function(){
    if(!catActual) catActual = (CATALOGO.categorias[0] || {}).id || "mias";
    pintarGaleria();
    var b = $("#buscar"); if(b) b.focus();
  })["catch"](function(e){
    $("#tarjetas").innerHTML = '<p class="vacio">No se pudo cargar el catálogo (' + escUI(e.message) + ').</p>';
  });
}
function cerrarGaleria(){ $("#velo").hidden = true; }

function todasLasPlantillas(){
  var mias = misPlantillas().map(function(p){
    return { id: p.id, cat: "mias", titulo: p.titulo, desc: p.desc || "Plantilla tuya",
             nombre: p.nombre || "", texto: p.texto, mia: true };
  });
  return (CATALOGO ? CATALOGO.plantillas : []).concat(mias);
}

function pintarGaleria(){
  var cats = (CATALOGO ? CATALOGO.categorias : []).concat(
    [{ id: "mias", nombre: "Mis plantillas", icono: "★", descripcion: "Las que guardas tú, en este navegador" }]);
  var todas = todasLasPlantillas();
  var q = filtro.trim().toLowerCase();

  var nav = "";
  if(q){
    nav = '<p>Resultados</p>';
  }else{
    nav = cats.map(function(c){
      var n = todas.filter(function(p){ return p.cat === c.id; }).length;
      return '<button type="button" data-cat="' + escUI(c.id) + '" aria-current="' + (c.id === catActual) + '">' +
             '<i>' + escUI(c.icono || "") + "</i>" + escUI(c.nombre) +
             '<span class="cuenta">' + n + "</span></button>";
    }).join("");
  }
  $("#categorias").innerHTML = nav;

  var nombreCat = {};
  cats.forEach(function(c){ nombreCat[c.id] = c.nombre; });
  var lista = todas.filter(function(p){
    if(q){
      var texto = [p.titulo, p.desc || "", p.destino || "", p.nombre || "", nombreCat[p.cat] || ""].join(" ");
      return quitarTildes(texto.toLowerCase()).indexOf(quitarTildes(q)) >= 0;
    }
    return p.cat === catActual;
  });

  var html = "";
  if(!q && catActual === "mias"){
    html += '<button type="button" class="tarjeta" data-guardar="1">' +
            "<h3>&#65291; Guardar este documento</h3>" +
            "<p>Convierte lo que tienes escrito ahora en una plantilla tuya, guardada en este navegador.</p></button>";
  }
  html += lista.map(function(p){
    return '<button type="button" class="tarjeta" data-id="' + escUI(p.id) + '">' +
           "<h3>" + escUI(p.titulo) + "</h3>" +
           "<p>" + escUI(p.desc || "") + "</p>" +
           (p.destino && p.destino !== "—" ? "<code>" + escUI(p.destino) + "</code>" : "") +
           (p.mia ? '<span class="quitar" data-quitar="' + escUI(p.id) + '">quitar</span>' : "") +
           "</button>";
  }).join("");
  if(!lista.length && !(!q && catActual === "mias")){
    html = '<p class="vacio">' + (q ? "Nada encaja con esa búsqueda." : "Aquí no hay nada todavía.") + "</p>";
  }
  $("#tarjetas").innerHTML = html;
}

function usarPlantilla(id){
  var p = todasLasPlantillas().filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  var traer = p.mia ? Promise.resolve(p.texto)
                    : fetch("plantillas/" + p.archivo).then(function(r){
                        if(!r.ok) throw new Error("HTTP " + r.status);
                        return r.text();
                      });
  traer.then(function(txt){
    if(!confirmarReemplazo()) return;
    fijarTexto(txt, p.nombre || (p.id + ".md"));
    cerrarGaleria();
    aviso("Plantilla cargada: " + p.titulo);
  })["catch"](function(e){ aviso("No se pudo cargar: " + e.message); });
}

/* ---------- eventos ---------- */
$("#categorias").addEventListener("click", function(e){
  var b = e.target.closest("button[data-cat]");
  if(!b) return;
  catActual = b.getAttribute("data-cat");
  pintarGaleria();
});
$("#tarjetas").addEventListener("click", function(e){
  var quitar = e.target.closest("[data-quitar]");
  if(quitar){
    e.stopPropagation();
    var idq = quitar.getAttribute("data-quitar");
    if(window.confirm("¿Quitar esta plantilla tuya?")){
      guardarMias(misPlantillas().filter(function(p){ return p.id !== idq; }));
      pintarGaleria();
    }
    return;
  }
  var tarjeta = e.target.closest(".tarjeta");
  if(!tarjeta) return;
  if(tarjeta.getAttribute("data-guardar")){
    var titulo = window.prompt("Nombre de la plantilla:", (document.title || "").replace(/ · Markdown$/, ""));
    if(!titulo) return;
    var lista = misPlantillas();
    lista.push({ id: "mia-" + lista.length + "-" + titulo.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24),
                 titulo: titulo, desc: "Guardada por ti", nombre: nombreSugerido, texto: fuenteActual });
    guardarMias(lista);
    pintarGaleria();
    aviso("Guardada en «Mis plantillas»");
    return;
  }
  usarPlantilla(tarjeta.getAttribute("data-id"));
});
$("#buscar").addEventListener("input", function(){ filtro = this.value; pintarGaleria(); });
$("#cerrarDialogo").addEventListener("click", cerrarGaleria);
$("#velo").addEventListener("click", function(e){ if(e.target === this) cerrarGaleria(); });

$("#btnEditar").addEventListener("click", alternarEditor);
$("#btnPlantillas").addEventListener("click", abrirGaleria);
$("#btnTema").addEventListener("click", alternarTema);
$("#btnImprimir").addEventListener("click", function(){ window.print(); });
$("#btnMd").addEventListener("click", function(){
  descargar((nombreSugerido && /\.[a-z]+$/i.test(nombreSugerido) ? nombreSugerido : baseNombre() + ".md"),
            fuenteActual.replace(/^\n+/, ""), "text/markdown");
});
$("#btnHtml").addEventListener("click", guardarHtml);
$("#btnNuevo").addEventListener("click", function(){
  if(!confirmarReemplazo()) return;
  fijarTexto("---\ntitulo: \nautor: \nfecha: \n---\n\n", "documento.md");
  if(!abierto) alternarEditor();
});
$("#btnAbrir").addEventListener("click", function(){ $("#archivo").click(); });
$("#archivo").addEventListener("change", function(){
  var f = this.files && this.files[0];
  this.value = "";
  if(!f) return;
  if(!confirmarReemplazo()) return;
  var fr = new FileReader();
  fr.onload = function(){ fijarTexto(String(fr.result), f.name); aviso("Abierto: " + f.name); };
  fr.readAsText(f);
});

/* arrastrar y soltar un .md sobre la página */
["dragover", "drop"].forEach(function(ev){
  document.addEventListener(ev, function(e){
    e.preventDefault();
    if(ev !== "drop") return;
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f || !/\.(md|markdown|mdown|mkd|txt)$/i.test(f.name)) return;
    if(!confirmarReemplazo()) return;
    var fr = new FileReader();
    fr.onload = function(){ fijarTexto(String(fr.result), f.name); aviso("Abierto: " + f.name); };
    fr.readAsText(f);
  });
});

document.addEventListener("keydown", function(e){
  var ctrl = e.ctrlKey || e.metaKey;
  if(ctrl && (e.key === "e" || e.key === "E")){ e.preventDefault(); alternarEditor(); }
  else if(ctrl && (e.key === "k" || e.key === "K")){ e.preventDefault(); abrirGaleria(); }
  else if(e.key === "Escape" && !$("#velo").hidden){ cerrarGaleria(); }
});

/* ---------- instalar como aplicación ---------- */
var promesaInstalar = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  promesaInstalar = e;
  $("#btnInstalar").hidden = false;
});
$("#btnInstalar").addEventListener("click", function(){
  if(!promesaInstalar) return;
  promesaInstalar.prompt();
  promesaInstalar.userChoice.then(function(){
    promesaInstalar = null;
    $("#btnInstalar").hidden = true;
  });
});
window.addEventListener("appinstalled", function(){ $("#btnInstalar").hidden = true; });

/* ---------- service worker ---------- */
if(!MODO_ARCHIVO && "serviceWorker" in navigator &&
   (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound", function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", function(){
          if(nuevo.state === "installed" && navigator.serviceWorker.controller){
            aviso("Hay una versión nueva de la aplicación", "Actualizar", function(){
              nuevo.postMessage({ tipo: "ACTUALIZAR" });
            });
          }
        });
      });
    })["catch"](function(){});
    var recargando = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(recargando) return;
      recargando = true;
      location.reload();
    });
  });
}

/* ---------- arranque ---------- */
if(MODO_ARCHIVO){
  $("#btnPlantillas").hidden = true;
}else{
  var guardadoDoc = leer(CLAVE_DOC);
  if(guardadoDoc && guardadoDoc.trim()){
    fuenteActual = guardadoDoc;
    textoBase = guardadoDoc;
    nombreSugerido = leer(CLAVE_NOMBRE) || "";
  }
}

var parametros = new URLSearchParams(location.search);
pintar(fuenteActual);
if(elEd) elEd.value = fuenteActual;

if(!MODO_ARCHIVO && parametros.has("nuevo")){
  fijarTexto("---\ntitulo: \nautor: \nfecha: \n---\n\n", "documento.md");
  alternarEditor();
  history.replaceState(null, "", location.pathname);
}else if(!MODO_ARCHIVO && parametros.get("plantilla")){
  var pedida = parametros.get("plantilla");
  history.replaceState(null, "", location.pathname);
  cargarCatalogo().then(function(){ usarPlantilla(pedida); })["catch"](function(){});
}else if(!MODO_ARCHIVO && parametros.has("plantillas")){
  history.replaceState(null, "", location.pathname);
  abrirGaleria();
}

barraQueSeAparta();

window.plantilla = {
  convertir: mdAHtml, pintar: pintar, editor: alternarEditor, galeria: abrirGaleria,
  guardarHtml: guardarHtml, tema: alternarTema, fijar: fijarTexto,
  texto: function(){ return fuenteActual; }, modoArchivo: MODO_ARCHIVO
};

})();
</script>
</body>
</html>
