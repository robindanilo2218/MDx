dirse\n     de verdad va en permissions.deny de settings.json o en un hook PreToolUse.\n     Las reglas deny y ask se aplican de inmediato; las de allow, solo después\n     de que cada persona confíe en la carpeta del proyecto. -->\n\n# Reglas de seguridad\n\n## Secretos\n\n- Ninguna clave, token o contraseña en el código, ni siquiera en ejemplos o pruebas.\n- Las variables de entorno se leen en un único módulo (`src/config.ts`) y se validan al arrancar.\n- Si encuentras un secreto en el repositorio, detente y avísame: no lo borres sin más, hay que rotarlo.\n\n## Datos personales\n\n- No se registran en los logs: nada de correos, teléfonos, direcciones ni documentos de identidad.\n- No salen en los mensajes de error que ve el cliente.\n- No se envían a servicios externos sin que esté decidido explícitamente.\n\n## Entradas\n\n- Todo lo que llega de fuera se valida en el borde con un esquema, no con `if` sueltos.\n- SQL siempre parametrizado. Una consulta construida con concatenación es un fallo crítico.\n- Las rutas de archivo que vengan del usuario se normalizan y se comprueban contra el directorio permitido.\n\n## Dependencias\n\n- No añadas dependencias sin preguntar.\n- Nada de paquetes con menos de un año o sin mantenimiento para tareas críticas.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — dónde va una regla y por qué es contexto, no una barrera.\n- [Claude Code settings](https://code.claude.com/docs/en/settings.md) — `permissions.deny`, `ask` y `allow`, y su precedencia.\n- [Hooks reference](https://code.claude.com/docs/en/hooks.md) — el hook `PreToolUse`, que sí bloquea.\n"},{"id":"regla-commits","cat":"reglas","archivo":"regla-commits.md","nombre":"git.md","titulo":"Regla: git, commits y PRs","destino":".claude/rules/git.md","desc":"Nombres de rama, formato de commit y qué no se hace jamás con el historial.","cuerpo":"<!-- Guardar como: .claude/rules/git.md\n     Esto es contexto, no una barrera: para impedir de verdad un push forzado\n     hace falta un hook PreToolUse. -->\n\n# Git: ramas, commits y pull requests\n\n## Antes de nada\n\nNo confirmes ni subas nada si no te lo he pedido explícitamente.\n\n## Ramas\n\n`tipo/descripcion-corta`, con el tipo entre: `feat`, `fix`, `refactor`, `docs`, `chore`.\n\n```\nfeat/aviso-de-cobro\nfix/fecha-en-utc\n```\n\n## Mensajes de commit\n\n- Primera línea: imperativo, en español, máximo 72 caracteres, sin punto final.\n- Línea en blanco.\n- Cuerpo: **por qué**, no qué. El qué ya está en el diff.\n\n```\nCorrige el cálculo del IVA para clientes fuera de la UE\n\nLa tabla de tipos aplicaba el tipo nacional a cualquier país sin\ncódigo de región, así que los pedidos internacionales salían con\nun 21% de más.\n```\n\n## Pull requests\n\n- Título como el del commit.\n- Cuerpo con tres apartados: **Qué cambia**, **Por qué** y **Cómo probarlo**.\n- Un PR, un tema. Si has arreglado algo de paso, va en otro commit y se explica.\n\n## Nunca\n\n- Reescribir el historial de una rama compartida.\n- `--force` sobre `main`.\n- Commits con el mensaje «cambios», «wip» o «arreglos».\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — `.claude/rules/` y cómo se cargan estas reglas.\n- [Best practices for Claude Code](https://code.claude.com/docs/en/best-practices.md) — qué convenciones merece la pena escribir.\n- [Hooks reference](https://code.claude.com/docs/en/hooks.md) — cómo impedir un push forzado pase lo que pase.\n"},{"id":"agents-md","cat":"reglas","archivo":"agents-md.md","nombre":"AGENTS.md","titulo":"AGENTS.md (formato abierto)","destino":"AGENTS.md","desc":"El README para agentes que leen Codex, Cursor, Copilot y veinte más: comandos, estilo, pruebas y límites.","cuerpo":"# AGENTS.md\n\n> [!NOTE]\n> `AGENTS.md` es un formato abierto: un README para agentes. Lo leen Codex, Cursor,\n> Copilot, Jules, Aider, Zed, Devin y una veintena más. Va en la **raíz del repositorio**.\n> En un monorepo puedes poner uno por subproyecto: gana el más cercano al archivo que se\n> está tocando. Borra este aviso y escribe lo tuyo debajo.\n\nEste archivo es para el agente, no para el visitante. El `README.md` explica qué es el\nproyecto y cómo empezar; aquí va lo que hay que saber para **trabajar dentro** sin romper\nnada. Si algo sirve para las dos cosas, déjalo en el README y aquí solo enlázalo.\n\n## Qué es esto\n\n[Una o dos frases: qué hace el proyecto y para quién. Sin marketing.]\n\n- **Lenguaje y versión:** [TypeScript 5.6, Node 22]\n- **Gestor de paquetes:** [pnpm 9 — no uses npm ni yarn, el lockfile es de pnpm]\n- **Dónde está lo importante:** [`src/` el código, `tests/` las pruebas, `infra/` el despliegue]\n\n## Comandos\n\nLos que se usan de verdad. Si un comando necesita algo montado antes, dilo aquí.\n\n```bash\n[pnpm install]          # instalar dependencias\n[pnpm dev]              # levantar en local, en el puerto 3000\n[pnpm test]             # todas las pruebas\n[pnpm test -- ruta]     # una sola prueba, mientras trabajas\n[pnpm lint --fix]       # formato y reglas\n[pnpm build]            # compilar para producción\n```\n\n## Estilo de código\n\nLas reglas que no puede adivinar leyendo dos archivos.\n\n- [Comillas simples, sin punto y coma. Lo pone el formateador, no lo discutas.]\n- [Nombres de archivo en kebab-case; los componentes en PascalCase.]\n- [Nada de `any`. Si no sabes el tipo, escríbelo como `unknown` y estrecha.]\n- [Los errores se lanzan, no se devuelven como `null`.]\n- [Los textos que ve el usuario van en `i18n/`, nunca sueltos en el código.]\n\n## Pruebas\n\n- **Cómo se lanzan:** [`pnpm test`, o `pnpm test -- --watch` mientras escribes]\n- **Dónde viven:** [junto al archivo que prueban, con el sufijo `.test.ts`]\n- **Qué se espera:** [toda función nueva con lógica de negocio va con su prueba]\n- **Lo que no hay que hacer:** [no toques las capturas (*snapshots*) para que pasen; arregla la causa]\n- [Si una prueba tarda más de N segundos, algo está llamando a la red de verdad.]\n\n## Antes de abrir un pull request\n\n- [ ] `[pnpm lint && pnpm test]` en verde.\n- [ ] El título va como `[tipo(ámbito): descripción en imperativo]`.\n- [ ] [Un cambio por PR. Si hay refactor y funcionalidad, son dos.]\n- [ ] [Actualiza `CHANGELOG.md` si el cambio se nota desde fuera.]\n- [ ] [No incluyas archivos generados ni `.env`.]\n\n## Límites\n\nLo que **no** debe hacerse sin preguntar. Esta sección es la que evita los desastres.\n\n- **No** [toques `migrations/`: las migraciones se generan con `[comando]`].\n- **No** [modifiques la configuración de despliegue ni los secretos].\n- **No** [añadas dependencias nuevas sin decirlo: cada una hay que mantenerla].\n- **No** [borres pruebas para que pase la CI].\n- [Los datos de `datos/produccion/` son reales: no los uses en pruebas.]\n\n## Cosas que aquí se hacen distinto\n\nLas trampas del proyecto, las que solo se aprenden a base de tropezar.\n\n- [`utils/fecha.ts` no usa la zona horaria del sistema: usa la del cliente. Es a propósito.]\n- [El módulo `pagos/` está congelado hasta la migración de [mes]. Si algo falla ahí, avisa.]\n- [Hay dos clientes de HTTP por motivos históricos. El nuevo es `lib/http.ts`.]\n\n## Dónde mirar\n\n| Si vas a tocar… | Lee antes |\n| --- | --- |\n| [La API] | [`docs/api.md`] |\n| [El esquema de datos] | [`docs/datos.md`] |\n| [El despliegue] | [`infra/README.md`] |\n\n---\n\n*Consejos para que este archivo sirva de algo:*\n\n- *Escribe en imperativo y en concreto: «usa pnpm», no «se recomienda usar pnpm».*\n- *Que todo lo que pongas sea comprobable. Si dices «pnpm test», que ese comando exista.*\n- *Un archivo corto que se lee entero vale más que uno de treinta páginas que se hojea.*\n- *Cuando algo cambie en el proyecto, cambia también aquí: un AGENTS.md caducado hace más daño que no tenerlo.*\n- *Si además usas Claude Code, puedes tener los dos: pon lo común aquí y en `CLAUDE.md` una línea que diga «lee AGENTS.md», más lo específico de Claude.*\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [AGENTS.md](https://agents.md) — el formato abierto: qué secciones lleva y cómo se resuelve en un monorepo.\n- [agentsmd/agents.md](https://github.com/agentsmd/agents.md) — el repositorio del estándar, con ejemplos y la licencia MIT.\n"},{"id":"comando-basico","cat":"comandos","archivo":"comando-basico.md","nombre":"mi-comando.md","titulo":"Comando básico","destino":".claude/commands/mi-comando.md","desc":"Un procedimiento corto que lanzas escribiendo /mi-comando.","cuerpo":"---\ndescription: Qué hace este comando, en una frase\ndisable-model-invocation: true\n---\n\n<!-- Guardar como: .claude/commands/mi-comando.md  -> se invoca con /mi-comando\n     (equivale a .claude/skills/mi-comando/SKILL.md; en un archivo de commands\n     los campos `name` y `paths` se ignoran)\n     disable-model-invocation: solo lo lanzas tú, Claude no lo dispara solo.\n     Los comandos personalizados se han fusionado con las skills: los archivos\n     de commands/ siguen funcionando, pero para algo nuevo la recomendación\n     oficial es hacer una skill. Si coinciden en nombre, gana la skill. -->\n\nHaz lo siguiente, en este orden:\n\n1. *[Primer paso]*\n2. *[Segundo paso]*\n3. *[Cómo termina]*\n\nCuando acabes, resume en dos líneas qué has hecho.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Commands](https://code.claude.com/docs/en/commands.md) — la referencia oficial de comandos; para los tuyos remite a la página de skills.\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — «Custom commands have been merged into skills»: qué sigue funcionando y qué cambia.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — por qué para trabajo nuevo se recomienda una skill en vez de un comando.\n"},{"id":"comando-con-argumentos","cat":"comandos","archivo":"comando-con-argumentos.md","nombre":"componente.md","titulo":"Comando con argumentos","destino":".claude/commands/componente.md","desc":"Argumentos con nombre: /componente Boton src/ui rellena $nombre y $carpeta.","cuerpo":"---\ndescription: Crea el esqueleto de un componente nuevo\nargument-hint: \"[nombre] [carpeta]\"\narguments: [nombre, carpeta]\ndisable-model-invocation: true\nallowed-tools: Write, Read, Glob\n---\n\n<!-- Se invoca así:  /componente Boton src/ui\n     $nombre  -> Boton      (primer argumento)\n     $carpeta -> src/ui     (segundo)\n     $ARGUMENTS -> todo junto;  $0, $1... por posición (base 0,\n     atajo de $ARGUMENTS[0], $ARGUMENTS[1]...) -->\n\n# Componente `$nombre`\n\nCrea en `$carpeta` un componente llamado `$nombre` siguiendo el estilo de los que ya existen ahí.\n\n## Qué generar\n\n1. `$carpeta/$nombre.tsx` — el componente, con sus tipos de props.\n2. `$carpeta/$nombre.test.tsx` — una prueba de que se pinta y una del caso límite.\n\n## Antes de escribir\n\nAbre otro componente de esa misma carpeta y **copia sus convenciones**: cómo exporta, cómo tipa las props, cómo nombra los manejadores. No impongas un estilo nuevo.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Commands](https://code.claude.com/docs/en/commands.md) — la referencia oficial de comandos.\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — `$ARGUMENTS`, `$ARGUMENTS[N]`, `$N` y los argumentos con nombre del campo `arguments`.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — dónde vive `.claude/commands/` y qué convive con él.\n"},{"id":"comando-commit","cat":"comandos","archivo":"comando-commit.md","nombre":"commit.md","titulo":"Comando: preparar commit","destino":".claude/commands/commit.md","desc":"Lee el estado real del repositorio antes de proponer el mensaje de commit.","cuerpo":"---\ndescription: Prepara un commit con un mensaje escrito a partir de los cambios reales\ndisable-model-invocation: true\nallowed-tools: Bash(git status), Bash(git diff *), Bash(git log *), Bash(git add *), Bash(git commit *)\n---\n\n<!-- El bloque de abajo se ejecuta ANTES de que Claude lea esto,\n     así que recibe el estado de verdad del repositorio. -->\n\n## Estado actual\n\n```!\ngit status --short\ngit diff --stat\ngit log --oneline -5\n```\n\n## Tu tarea\n\n1. Mira los cambios y decide si son **un solo commit** o varios. Si son varios temas, dilo y propón cómo partirlos; no los mezcles.\n2. Escribe el mensaje siguiendo el estilo de los últimos commits del repositorio.\n   - Primera línea en imperativo, máximo 72 caracteres, sin punto final.\n   - Cuerpo explicando **por qué**, no qué.\n3. Enséñame el mensaje **antes** de confirmar.\n4. No subas nada al remoto.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Commands](https://code.claude.com/docs/en/commands.md) — la referencia oficial de comandos.\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — el bloque !`comando` y las reglas de `allowed-tools`.\n- [Claude Code settings](https://code.claude.com/docs/en/settings.md) — los cuatro archivos de settings y el orden de precedencia de los permisos.\n"},{"id":"hooks-formateo","cat":"comandos","archivo":"hooks-formateo.md","nombre":"hook-formateo.md","titulo":"Hook: formatear al editar","destino":".claude/settings.json + .claude/hooks/","desc":"PostToolUse que pasa el formateador cada vez que Claude toca un archivo.","cuerpo":"<!-- Guardar el bloque JSON en .claude/settings.json (del proyecto)\n     o en ~/.claude/settings.json (personal). -->\n\n# Hook: formatear cada archivo que Claude edita\n\nUn hook es una orden que Claude Code ejecuta **siempre**, decida Claude lo que decida. Es la diferencia entre «pídele que formatee» y «se formatea».\n\n## La configuración\n\n```json\n{\n  \"hooks\": {\n    \"PostToolUse\": [\n      {\n        \"matcher\": \"Edit|Write\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"${CLAUDE_PROJECT_DIR}/.claude/hooks/formatear.sh\",\n            \"timeout\": 30,\n            \"statusMessage\": \"Formateando...\"\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\nAdemás de `command`, un hook puede ser de tipo `http`, `mcp_tool`, `prompt` o `agent`.\n\n## El script\n\nGuárdalo en `.claude/hooks/formatear.sh` y dale permisos con `chmod +x`.\n\n```bash\n#!/usr/bin/env bash\n# Recibe por la entrada estándar un JSON con los datos de la herramienta.\nentrada=$(cat)\narchivo=$(jq -r '.tool_input.file_path // empty' <<<\"$entrada\")\n\n[ -z \"$archivo\" ] && exit 0\n[ -f \"$archivo\" ] || exit 0\n\ncase \"$archivo\" in\n  *.ts|*.tsx|*.js|*.jsx|*.json|*.css|*.md)\n    npx prettier --write \"$archivo\" >/dev/null 2>&1\n    ;;\n  *.py)\n    ruff format \"$archivo\" >/dev/null 2>&1\n    ;;\nesac\n\nexit 0\n```\n\n## Cómo se comporta\n\n| Código de salida | Qué pasa |\n| :---: | --- |\n| `0` | Todo bien; si imprime JSON, se interpreta como decisión |\n| `2` | Error bloqueante: en `PostToolUse` el error se le enseña a Claude |\n| otro | Error no bloqueante: sigue adelante y muestra el `stderr` |\n\n## Eventos que más se usan\n\n`PreToolUse`, `PostToolUse`, `UserPromptSubmit`, `Stop`, `SubagentStop`, `SessionStart`, `SessionEnd`, `PreCompact`, `Notification`. La referencia lista 31 eventos en total.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Hooks reference](https://code.claude.com/docs/en/hooks.md) — los 31 eventos, los cinco tipos de hook y la estructura JSON completa.\n- [Automate actions with hooks](https://code.claude.com/docs/en/hooks-guide.md) — la guía práctica, con ejemplos y el navegador `/hooks`.\n- [Claude Code settings](https://code.claude.com/docs/en/settings.md) — en qué archivo poner el bloque y qué manda sobre qué.\n"},{"id":"hooks-bloqueo","cat":"comandos","archivo":"hooks-bloqueo.md","nombre":"hook-bloqueo.md","titulo":"Hook: bloquear órdenes peligrosas","destino":".claude/settings.json + .claude/hooks/","desc":"PreToolUse que deniega rm -rf, push forzado o DROP TABLE antes de que se ejecuten.","cuerpo":"<!-- Guardar el JSON en .claude/settings.json y el script en .claude/hooks/ -->\n\n# Hook: impedir órdenes peligrosas\n\nCLAUDE.md es contexto: Claude *intenta* seguirlo. Un hook `PreToolUse` es una barrera: se ejecuta antes de la herramienta y puede denegarla.\n\n## La configuración\n\n```json\n{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"${CLAUDE_PROJECT_DIR}/.claude/hooks/guardian.sh\",\n            \"timeout\": 15\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\n## El script\n\n```bash\n#!/usr/bin/env bash\nentrada=$(cat)\norden=$(jq -r '.tool_input.command // empty' <<<\"$entrada\")\n\nprohibido() {\n  jq -n --arg motivo \"$1\" '{\n    hookSpecificOutput: {\n      hookEventName: \"PreToolUse\",\n      permissionDecision: \"deny\",\n      permissionDecisionReason: $motivo\n    }\n  }'\n  exit 0\n}\n\ncase \"$orden\" in\n  *\"rm -rf /\"*)            prohibido \"Borrado masivo bloqueado por política\" ;;\n  *\"git push --force\"*)    prohibido \"Nada de push forzado: reescribe la rama compartida\" ;;\n  *\"git push\"*\" main\"*)    prohibido \"No se sube directamente a main; abre una rama\" ;;\n  *\"DROP TABLE\"*)          prohibido \"Sentencia destructiva de SQL bloqueada\" ;;\nesac\n\nexit 0\n```\n\n## Decisiones que puede devolver\n\n| `permissionDecision` | Efecto |\n| --- | --- |\n| `\"allow\"` | Se ejecuta sin preguntar |\n| `\"deny\"` | Se bloquea y Claude ve el motivo |\n| `\"ask\"` | Te pregunta a ti |\n\nTambién vale salir con código `2` y escribir el motivo en `stderr`: bloquea igual.\n\n## Ojo\n\nUn hook se ejecuta con **tus** permisos. Revisa el script como revisarías cualquier cosa que corre sola en tu máquina.\n\nComprueba con `/hooks` que quedó registrado: ese menú enseña evento, matcher, tipo y archivo de origen, pero es de solo lectura; para añadir o cambiar un hook se edita el JSON.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Hooks reference](https://code.claude.com/docs/en/hooks.md) — campos de un hook y salida JSON de `PreToolUse`.\n- [Automate actions with hooks](https://code.claude.com/docs/en/hooks-guide.md) — por qué un hook decide y una instrucción de CLAUDE.md solo orienta.\n- [Claude Code settings](https://code.claude.com/docs/en/settings.md) — `permissions.deny`, la otra forma de cerrar la puerta.\n"},{"id":"hooks-avisos","cat":"comandos","archivo":"hooks-avisos.md","nombre":"hooks-avisos.md","titulo":"Hooks de aviso y arranque","destino":"~/.claude/settings.json","desc":"Notificación al terminar, contexto cargado al arrancar y registro de órdenes.","cuerpo":"<!-- Guardar en ~/.claude/settings.json para tenerlo en todos tus proyectos -->\n\n# Hooks de aviso y de arranque\n\n## Avisarte cuando Claude termina\n\n```json\n{\n  \"hooks\": {\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"notify-send 'Claude Code' 'Terminó la tarea'\"\n          }\n        ]\n      }\n    ],\n    \"Notification\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"paplay /usr/share/sounds/freedesktop/stereo/message.oga\"\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\nEn macOS, cambia `notify-send` por:\n\n```bash\nosascript -e 'display notification \"Terminó la tarea\" with title \"Claude Code\"'\n```\n\n## Cargar contexto al arrancar la sesión\n\n```json\n{\n  \"hooks\": {\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"${CLAUDE_PROJECT_DIR}/.claude/hooks/contexto.sh\"\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\nCon un script que imprima lo que quieres que Claude sepa desde el minuto cero:\n\n```bash\n#!/usr/bin/env bash\necho \"Rama: $(git branch --show-current)\"\necho \"Últimos commits:\"\ngit log --oneline -3\necho \"Tareas abiertas:\"\ngrep -rn \"TODO\" src/ | head -5\n```\n\n## Registrar todo lo que se ejecuta\n\n```json\n{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"jq -r '.tool_input.command' >> ~/.claude/ordenes.log\"\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\nEstos hooks también pueden declararse en el front matter de una skill o de un subagente, no solo en `settings.json`.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Hooks reference](https://code.claude.com/docs/en/hooks.md) — los nombres exactos de los eventos, `Stop` y `Notification` incluidos.\n- [Automate actions with hooks](https://code.claude.com/docs/en/hooks-guide.md) — más ejemplos de configuración en settings.json.\n- [Claude Code settings](https://code.claude.com/docs/en/settings.md) — los cuatro archivos de settings y su orden de precedencia.\n"},{"id":"rol-experto","cat":"roles","archivo":"rol-experto.md","nombre":"rol-experto.md","titulo":"Rol: especialista","destino":"Pégalo al principio de la conversación","desc":"Un experto que va al grano, recomienda una opción y dice qué se pierde con ella.","cuerpo":"# Rol: especialista en [campo]\n\nEres *[cargo concreto]* con *[años]* de experiencia en *[campo]*. Has trabajado sobre todo en *[contexto: empresas pequeñas, sector sanitario, sistemas heredados...]*, así que conoces las restricciones reales, no solo la teoría.\n\n## Cómo respondes\n\n- Vas al grano: la conclusión primero, el razonamiento después y solo si aporta.\n- Usas el vocabulario del oficio, pero explicas el término la primera vez.\n- Cuando hay varias opciones, recomiendas una y dices qué pierdes con ella.\n- Si la pregunta parte de una premisa equivocada, lo dices antes de responder.\n\n## Lo que nunca haces\n\n- Dar una respuesta genérica que valdría para cualquier caso.\n- Rellenar con avisos obvios («consulta a un profesional», «depende del contexto»).\n- Inventar cifras, normativas o referencias. Si no lo sabes, dices qué haría falta para saberlo.\n\n## Formato\n\n- Respuestas de menos de 300 palabras salvo que te pidan profundidad.\n- Listas solo cuando hay elementos paralelos de verdad.\n- Nada de resúmenes al final repitiendo lo dicho.\n\n## Contexto de trabajo\n\n*[Describe aquí el proyecto, el público, las restricciones y lo que ya se ha probado.]*\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) — Anthropic: la sección «Give Claude a role» explica qué gana un prompt al fijar el papel.\n- [Messages](https://platform.claude.com/docs/en/api/messages) — dónde se pone ese papel: el parámetro `system` de la API.\n"},{"id":"rol-tutor","cat":"roles","archivo":"rol-tutor.md","nombre":"rol-tutor.md","titulo":"Rol: tutor","destino":"Pégalo al principio de la conversación","desc":"Enseña con ejercicios y pistas en lugar de soltar la solución completa.","cuerpo":"# Rol: tutor de [materia]\n\nEnseñas *[materia]* a alguien con este punto de partida: *[qué sabe ya y qué no]*. Tu objetivo no es que entienda tu explicación, sino que sepa resolverlo solo.\n\n## Método\n\n1. **Comprueba de dónde partimos.** Antes de explicar, haz una pregunta corta para saber qué sabe ya.\n2. **Explica con un ejemplo primero**, y solo después con la regla general.\n3. **Da un ejercicio** después de cada idea nueva. Uno, no cinco.\n4. **Corrige el razonamiento, no solo el resultado.** Si falla, señala dónde se torció el pensamiento.\n5. **Recapitula al final** con las tres ideas que se lleva.\n\n## Reglas\n\n- Nunca sueltes la solución completa a la primera: da la siguiente pista.\n- Si se atasca dos veces en lo mismo, cambia de enfoque; no repitas la explicación más despacio.\n- Usa ejemplos de su mundo, no ejemplos de libro.\n- Corrige los errores en el momento, sin suavizarlos.\n\n## Lo que no eres\n\nNo eres un buscador ni un resolvedor de deberes. Si te pide la respuesta directa, das el camino.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) — Anthropic: «Give Claude a role», el efecto de fijar un papel en el prompt de sistema.\n- [Messages](https://platform.claude.com/docs/en/api/messages) — el parámetro `system`, que es donde va este texto.\n"},{"id":"rol-entrevistador","cat":"roles","archivo":"rol-entrevistador.md","nombre":"rol-entrevistador.md","titulo":"Rol: entrevistador de requisitos","destino":"Pégalo al principio de la conversación","desc":"Saca lo que el cliente quiere de verdad: una pregunta cada vez y ejemplos concretos.","cuerpo":"# Rol: entrevistador de requisitos\n\nTu trabajo es sacar de la cabeza de una persona lo que quiere de verdad, que casi nunca coincide con lo que pide al principio.\n\n## Cómo trabajas\n\n- **Una pregunta cada vez.** Nada de cuestionarios de diez puntos.\n- Empiezas por el **problema**, no por la solución: «¿qué pasa hoy cuando...?».\n- Persigues los ejemplos concretos: «cuéntame la última vez que ocurrió».\n- Cuando alguien pide una función, buscas el motivo: «¿qué harías con eso una vez lo tengas?».\n- Detectas y devuelves las contradicciones: «antes dijiste X, y esto implica lo contrario».\n\n## Qué persigues\n\n| Bloque | Lo que necesitas saber |\n| --- | --- |\n| Problema | Qué duele hoy, a quién y cuántas veces |\n| Actores | Quién lo usa y con qué frecuencia |\n| Flujo actual | Cómo se resuelve ahora, incluida la hoja de cálculo escondida |\n| Éxito | Cómo sabremos dentro de un mes que ha funcionado |\n| Límites | Presupuesto, plazos, sistemas que no se tocan |\n| Casos raros | Qué pasa cuando falla, cuando no hay datos, cuando hay dos a la vez |\n\n## Cómo cierras\n\nCuando tengas suficiente, escribes:\n\n1. **El problema**, en tres frases.\n2. **Lo imprescindible** para la primera versión.\n3. **Lo que dejamos fuera** a propósito, y por qué.\n4. **Lo que sigue sin estar claro**, con la pregunta que lo resolvería.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) — Anthropic: «Give Claude a role» y el resto de técnicas de prompt.\n- [Messages](https://platform.claude.com/docs/en/api/messages) — el parámetro `system`, donde se declara el papel.\n"},{"id":"rol-editor","cat":"roles","archivo":"rol-editor.md","nombre":"rol-editor.md","titulo":"Rol: editor de textos","destino":"Pégalo al principio de la conversación","desc":"Corrige respetando la voz de quien escribe y explica solo los cambios no evidentes.","cuerpo":"# Rol: editor de textos\n\nCorriges textos ajenos respetando la voz de quien escribe. No los reescribes a tu gusto.\n\n## Orden de trabajo\n\n1. **Lo que impide entender.** Frases ambiguas, saltos lógicos, referencias sin antecedente.\n2. **Lo que sobra.** Palabras, frases y párrafos que no cambian nada si se quitan.\n3. **Lo incorrecto.** Ortografía, concordancia, puntuación, tiempos verbales.\n4. **Lo mejorable.** Ritmo, repeticiones, orden de las ideas.\n\n## Cómo entregas\n\nDos bloques:\n\n**Texto corregido** — listo para usar, sin marcas.\n\n**Qué cambié y por qué** — lista breve, solo los cambios que no son evidentes:\n\n- «Cambié X por Y porque la frase original decía dos cosas a la vez.»\n\n## Reglas\n\n- No cambies el registro: si escribe informal, sigue informal.\n- No metas palabras que esa persona no usaría.\n- Si una frase está mal pero es su marca, la dejas y lo comentas.\n- Si el texto tiene un problema de fondo (no dice nada, promete lo que no cumple), lo dices al principio; no lo maquilles.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) — Anthropic: «Give Claude a role», por qué una frase de papel cambia el tono.\n- [Messages](https://platform.claude.com/docs/en/api/messages) — el parámetro `system` de la API de Mensajes.\n"},{"id":"prompt-sistema-app","cat":"roles","archivo":"prompt-sistema-app.md","nombre":"prompt-sistema.md","titulo":"Prompt de sistema para una app","destino":"Parámetro system de la API","desc":"Qué puede hacer, qué no, con qué tono y qué hacer cuando no pueda ayudar.","cuerpo":"<!-- Plantilla de prompt de sistema para una aplicación que llama a la API de Claude.\n     Va en el parámetro `system`, no en el mensaje del usuario: en la API de\n     Mensajes no existe un rol \"system\" dentro de `messages`. -->\n\n# Prompt de sistema\n\nEres el asistente de *[nombre del producto]*, una aplicación de *[qué hace]* para *[quién la usa]*.\n\n## Qué puedes hacer\n\n- *[Capacidad 1]*\n- *[Capacidad 2]*\n- *[Capacidad 3]*\n\n## Qué no haces\n\n- No hablas de temas ajenos al producto. Si te preguntan otra cosa, lo dices en una frase y vuelves al tema.\n- No inventas datos del usuario ni de su cuenta: si no está en el contexto, dices que no lo tienes.\n- No prometes acciones que la aplicación no puede ejecutar.\n\n## Tono\n\n*[Cercano y breve / formal y preciso / técnico]*. Respuestas de *[longitud]*. Nunca empiezas con «¡Claro!» ni con un resumen de la pregunta.\n\n## Datos disponibles en cada conversación\n\n```\nUsuario: {{nombre}}\nPlan: {{plan}}\nIdioma: {{idioma}}\nFecha de hoy: {{fecha}}\n```\n\nUsa estos datos sin pedirlos otra vez.\n\n## Cuando no puedas ayudar\n\nDilo claro, en una frase, y ofrece el camino real: *[centro de ayuda, contacto humano, documentación]*. No te disculpes más de una vez.\n\n## Casos delicados\n\nSi detectas *[urgencia médica, riesgo económico, datos sensibles...]*, *[qué debe hacer exactamente]*.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Messages](https://platform.claude.com/docs/en/api/messages) — el parámetro `system`: no existe un rol «system» dentro de `messages`.\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) — Anthropic: «Give Claude a role» y las técnicas vigentes de prompt.\n"},{"id":"ia-estructura-md","cat":"ia","archivo":"ia-estructura-md.md","nombre":"estructura.md","titulo":"La anatomía de un .md para una IA","destino":"—","desc":"Qué va en cada parte del archivo y por qué: la guía para escribir cualquier cosa que vaya a leer un modelo.","cuerpo":"---\ntitulo: La anatomía de un .md para una IA\nsubtitulo: Qué va en cada parte del archivo, y por qué\nautor: Tu nombre\nfecha: \n---\n\nUn archivo que va a leer un modelo se escribe distinto de uno que va a leer una\npersona. La persona hojea, salta y vuelve atrás cuando algo no cuadra. El modelo\nrecibe el texto de corrido, sin poder hojear, y muchas veces recibe **solo un\ntrozo**. Esta guía explica qué va en cada parte del archivo y por qué esa parte\nestá ahí.\n\n> [!NOTE]\n> Vale para cualquier sistema: Claude, ChatGPT, Gemini, un modelo que corre en tu\n> propio equipo o un buscador de documentos tipo RAG. Cambian los nombres de los\n> campos; la anatomía no.\n\n[TOC]\n\n## 1. Por qué el formato importa\n\nAl modelo le llega **texto plano**. No hay tamaños de letra, ni columnas, ni\ncolores, ni el gesto de pasar la página. Los encabezados, las listas y las tablas\nson las únicas señales de jerarquía que sobreviven al viaje. Y sobreviven porque\nel modelo ha leído millones de archivos Markdown: reconoce lo que significan.\n\n| Lo que escribes | Lo que el modelo entiende |\n| --- | --- |\n| `## Cómo se nombran las ramas` | Aquí empieza un tema nuevo, y se llama así |\n| Una lista con guiones | Estos elementos son hermanos, van al mismo nivel |\n| Una tabla | Estos campos pertenecen a estas filas, y solo a estas |\n| Código entre vallas | Esto es literal: cópialo, no lo parafrasees |\n| Un párrafo de cuarenta líneas | Ninguna jerarquía. Todo pesa lo mismo |\n\n**El formato no es decoración: es la estructura del contenido escrita de manera\nque se pueda leer sin ojos.**\n\n## 2. Anatomía, parte por parte\n\nEste es el orden que funciona. No es el único posible, pero cada pieza está donde\nestá por un motivo.\n\n### a) Metadatos (front matter), cuando alguien los lee\n\nVan al principio, entre dos líneas de tres guiones. Solo tienen sentido si algo\nlos lee de verdad: una habilidad de Claude Code, un indexador, tu propia\naplicación. Si nadie los lee, sobran.\n\n**Qué va ahí:** el nombre, una descripción y —lo más importante— **cuándo hay que\naplicar este archivo**. En muchos sistemas la descripción es lo único que el\nmodelo ve antes de decidir si abre el archivo o lo ignora.\n\n````yaml\n---\nname: convenciones-api\ndescription: Cómo se nombran las rutas, cómo se devuelven los errores y cómo se pagina. Úsalo al crear o modificar cualquier endpoint.\n---\n````\n\n> [!TIP]\n> Escribe la descripción como \"qué es **más** cuándo se usa\". «Notas de la API» no\n> ayuda a elegir. «Cómo se nombran las rutas, y cuándo aplicarlo» sí.\n\n### b) El título\n\nUna sola línea con una almohadilla, y que identifique el archivo **sin depender\nde la carpeta donde está**. Puede que el modelo vea el título y nada más.\n\n- Mal: `# Guía`, `# Documentación`, `# Notas internas`.\n- Bien: `# Convenciones de la API de facturación`.\n\nUn archivo, un `#`. Todo lo demás son `##` y `###`.\n\n### c) La primera frase\n\nEs la línea más rentable del documento. Tiene que contestar dos preguntas: **para\nqué sirve esto** y **cuándo se usa**.\n\n**Mal.** «Este documento describe diversos aspectos relacionados con el proceso\nde despliegue.»\n\n**Bien.** «Cómo se publica la API en producción. Úsalo cuando haya que sacar una\nversión; para el entorno de pruebas, ve a `docs/pruebas.md`.»\n\n### d) El cuerpo, por secciones, de lo importante a lo accesorio\n\nAquí no hay intriga que mantener. Lo primero que se lee es lo que más peso tiene,\ny si el archivo se corta por longitud, se corta por el final.\n\nCada sección trata **un** tema y lleva un encabezado que se entiende suelto. Si\nuna sección pasa de una pantalla, pártela en dos.\n\nUn orden que casi siempre funciona:\n\n1. Las reglas que no se saltan nunca.\n2. El procedimiento normal, numerado.\n3. Los casos raros.\n4. El material de consulta que casi nadie mira.\n\n### e) Ejemplos\n\nUn ejemplo vale más que tres adjetivos. «Escribe mensajes de commit claros» no\ndice nada; dos mensajes, uno bueno y otro malo, se entienden a la primera.\n\nPon el ejemplo **completo** y en el formato exacto en el que quieres la\nrespuesta. Si tienes un contraejemplo, ponlo justo al lado.\n\n````md\nBien: fix(pagos): evitar el cobro duplicado al reintentar\nMal:  arreglos varios\n````\n\n### f) Los límites: lo que NO debe hacer\n\nSección propia, no una coletilla al final de un párrafo. Lo que puede salir mal\nes infinito; solo tú sabes qué caminos están cerrados en tu casa.\n\nEscríbelo en negativo y con la salida al lado:\n\n````md\n- No toques `migraciones/`. Si hace falta un cambio de esquema, proponlo y espera.\n- No inventes números. Si el dato no está, escribe \"sin dato\" y sigue.\n````\n\n### g) Referencias a otros archivos\n\nAl final, con la ruta exacta y una frase que diga **cuándo** ir allí. Un enlace\nsin motivo no se sigue.\n\n````md\n- `docs/errores.md` — catálogo de códigos de error. Ve ahí si tienes que\n  inventarte un código nuevo.\n````\n\n> [!WARNING]\n> No escribas instrucciones que dependan de algo que no está en el archivo ni se\n> puede abrir desde él: «sigue el estilo de siempre», «como quedamos en la\n> reunión», «ya sabes cómo lo hacemos». El modelo no estuvo en la reunión.\n\n<div class=\"salto-pagina\"><\/div>\n\n## 3. Tabla resumen\n\n| Parte del archivo | Qué va ahí | Error típico |\n| --- | --- | --- |\n| Front matter | Nombre, descripción y cuándo aplicarlo | Ponerlo cuando nadie lo lee, o describir el tema sin decir cuándo se usa |\n| Título | Una línea que identifique el archivo por sí sola | `# Notas`, `# Documentación` |\n| Primera frase | Para qué sirve y cuándo se usa | Arrancar con la historia del proyecto |\n| Cuerpo | Un tema por sección, lo importante arriba | Un solo bloque de texto sin encabezados |\n| Ejemplos | Caso real, completo, en el formato de la salida | Describir el ejemplo en vez de darlo |\n| Límites | Lo que no debe hacer, con la alternativa | Darlo por sobreentendido |\n| Referencias | Ruta exacta y cuándo ir allí | Una lista de enlaces sin explicación |\n\n## 4. Las reglas de oro\n\n1. **Una cosa por archivo.** Si el título necesita una «y», probablemente son dos\n   archivos. Mezclar temas hace que se recupere el archivo entero para responder\n   a media pregunta.\n2. **Encabezados que se entiendan solos.** Puede que al modelo le llegue\n   únicamente ese trozo, sin el título ni las secciones anteriores. El encabezado\n   es lo único que le sitúa.\n3. **Imperativo y segunda persona.** «Valida la entrada antes de guardar», no «se\n   recomienda que la entrada sea validada». Una instrucción se obedece; una\n   descripción se resume.\n4. **Concreto antes que abstracto.** «Rápido» no se puede cumplir; «por debajo de\n   200 ms en el percentil 95» sí. Pon el número, el nombre del archivo, el\n   comando exacto.\n5. **Un ejemplo vale más que tres adjetivos.** Cuando dudes entre explicar mejor\n   o poner un ejemplo, pon el ejemplo.\n6. **Di también lo que no se debe hacer.** Las prohibiciones cierran caminos que\n   ninguna instrucción positiva cierra.\n7. **Lo importante arriba.** El principio y el final de un texto largo se\n   atienden mejor que el centro. No entierres la regla clave en la página cuatro.\n8. **Corto, y por un motivo.** No corto por estética: corto porque cada línea que\n   sobra compite por la atención con las que importan. Si una frase no cambia\n   ninguna decisión, quítala.\n\n## 5. Cómo lo lee la máquina\n\nVentana de contexto\n: Todo lo que el modelo puede tener delante a la vez: tu archivo, la conversación y lo demás que se haya cargado.\n: Es finita. Lo que metes de más desplaza a otra cosa, y no eliges tú a cuál.[^1]\n\nTroceado\n: Muchos sistemas parten los documentos en fragmentos antes de guardarlos, y **cortan por los encabezados**.\n: Cada `##` que escribes marca un sitio por donde puede caer el corte.\n\nRecuperación\n: Cuando llega una pregunta, el sistema busca los fragmentos que más se parecen y le entrega al modelo **solo esos**.\n: El resto del documento, para esa respuesta, no existe.\n\n[^1]: El modelo no cuenta palabras ni caracteres, sino *tokens*: trozos de palabra.\n    Cada modelo trocea a su manera, así que la cuenta cambia de uno a otro. Como\n    regla de servilleta, en español un token ronda las tres o cuatro letras.\n\n````mermaid\nflowchart TD\n  A[Tu archivo .md] --> B[Se corta por los encabezados]\n  B --> C[Fragmento con encabezado claro]\n  B --> D[Fragmento titulado Notas]\n  E[Pregunta del usuario] --> F[Búsqueda]\n  C --> F\n  D --> F\n  F --> G[Al modelo le llegan dos o tres fragmentos]\n````\n\n**Por qué un archivo de 40 páginas se lee peor que cuatro de 10.** El de 40 se\nrecupera entero, y entonces se lleva casi toda la ventana de contexto, o se\ntrocea a ciegas y te devuelve un fragmento sin cabeza ni pies. Cuatro archivos de\n10, con títulos distintos, permiten traer justo el que hace falta. Además, dentro\nde un archivo largo las instrucciones lejanas empiezan a competir entre sí.\n\n**Y por eso `## Notas` es un fragmento perdido.** Nadie pregunta nunca «notas».\n`## Cómo se nombran las ramas de git` comparte palabras con la pregunta real\n—«¿cómo llamo a esta rama?»— y por eso se encuentra. El encabezado no es un\nrótulo decorativo: es la etiqueta con la que ese trozo va a ser buscado.\n\n<div class=\"salto-pagina\"><\/div>\n\n## 6. Antipatrones\n\n### El muro de texto\n\nTodo seguido, sin encabezados ni listas. No hay por dónde cortarlo ni qué\npriorizar.\n\n````md\nMal\nPara desplegar hay que tener en cuenta que primero conviene revisar que las\npruebas pasen y también que la rama esté actualizada, y luego ya se lanza el\ncomando de construcción, aunque si es viernes mejor no, y recuerda avisar.\n\nBien\n## Desplegar\n1. `npm test` — tiene que pasar en verde.\n2. `git pull --rebase origin main`.\n3. `npm run deploy`.\n\n> [!WARNING]\n> Los viernes no se despliega.\n````\n\n### El archivo cajón de sastre\n\nUn `notas.md` con el despliegue, el tono de los correos y el cumpleaños de la\njefa. Cuando alguien pregunte por el despliegue, se recuperará también el\ncumpleaños.\n\n| Mal | Bien |\n| --- | --- |\n| `notas.md` (todo dentro) | `despliegue.md`, `tono-correos.md`, `equipo.md` |\n\n### Las reglas contradictorias\n\nDos frases que no pueden cumplirse a la vez. El modelo elegirá una, y no sabrás\ncuál.\n\n````md\nMal\n- Nunca modifiques archivos de configuración.\n- Actualiza la versión en package.json antes de publicar.\n\nBien\n- No modifiques archivos de configuración, **salvo** el campo `version` de\n  `package.json` al publicar.\n````\n\n### La cortesía inútil\n\nFrases que ocupan sitio y no cambian ninguna decisión.\n\n````md\nMal\nPor favor, sé tan amable de intentar, si te resulta posible, ser lo más\ncuidadoso que puedas con el código, ya que es muy importante para nosotros.\n\nBien\nNo cambies ninguna firma pública sin decirlo antes.\n````\n\n### El contexto caducado sin fecha\n\nUn dato verdadero en marzo, escrito como si fuese eterno.\n\n````md\nMal\nAhora mismo estamos migrando a la versión 3.\n\nBien\n**Estado a 21 de agosto de 2026:** migrando a la versión 3; los módulos de pago\nsiguen en la 2. Si lees esto tres meses después, pregunta antes de fiarte.\n````\n\n### La instrucción que cuelga del aire\n\nDepende de algo que no está en el archivo y no se puede abrir desde él.\n\n````md\nMal\nSigue el estilo habitual del equipo y aplica lo acordado en la revisión.\n\nBien\nSigue `docs/estilo.md`. Los tres puntos que más se incumplen son: sin `any`,\nerrores con `AppError`, fechas en UTC.\n````\n\n## 7. Antes de guardar\n\n- [ ] El archivo trata **una** cosa y el título lo dice.\n- [ ] La primera frase dice para qué sirve y cuándo se usa.\n- [ ] Cada encabezado se entiende fuera de contexto.\n- [ ] Lo más importante está en el primer tercio.\n- [ ] Hay al menos un ejemplo completo, en el formato exacto de la salida.\n- [ ] Hay una sección con lo que **no** se debe hacer.\n- [ ] Ninguna regla contradice a otra.\n- [ ] Todo dato que caduca lleva fecha.\n- [ ] Ninguna instrucción depende de algo que no esté aquí o enlazado aquí.\n- [ ] Has borrado lo que no cambia ninguna decisión.\n\n*[RAG]: Recuperación aumentada: el sistema busca fragmentos de tus documentos y se los entrega al modelo junto con la pregunta\n"},{"id":"ia-contexto-proyecto","cat":"ia","archivo":"ia-contexto-proyecto.md","nombre":"contexto.md","titulo":"Contexto de proyecto","destino":"—","desc":"Lo que la IA necesita saber antes de responder: estado, montaje, glosario, convenciones y lo prohibido.","cuerpo":"# Contexto del proyecto [nombre]\n\nLéete esto entero antes de responder nada. Describe el proyecto **a fecha de\n[fecha de hoy]**. Si algo de lo que te pida choca con lo que aquí pone, dímelo en\nvez de decidir por tu cuenta.\n\n## Qué es esto\n\nUna frase, sin adjetivos de folleto. *[nombre]* es *[qué es: una app, un script,\nun servicio, un libro]* que *[qué hace]*.\n\n## Para quién y qué problema resuelve\n\nDos o tres frases: quién lo usa, qué hacía antes de esto y qué le duele. Si no\nsabes decir a quién le duele, la IA tampoco sabrá qué priorizar.\n\n- **Quién lo usa:** [perfil concreto, no \"usuarios\"]\n- **Qué hacía antes:** [la hoja de cálculo, la llamada por teléfono, nada]\n- **Qué gana:** [en tiempo, en errores, en dinero]\n\n## Estado actual — [fecha]\n\nSé honesto sobre lo que está a medias: es donde una IA se equivoca más, porque da\npor terminado lo que ve escrito.\n\n- **Funciona:** [lo que está en producción y no se toca]\n- **A medias:** [lo empezado, y hasta dónde llega]\n- **No existe todavía:** [lo que parece que hay pero no hay]\n\n> [!IMPORTANT]\n> Pon la fecha y actualízala cuando cambie algo. Un contexto sin fecha envejece\n> mal: dentro de tres meses seguirá sonando igual de seguro y ya será mentira.\n\n## Cómo está montado\n\nLas piezas y para qué sirve cada una. Si una pieza no hace falta para entender lo\nque vas a pedir, no la pongas.\n\n| Pieza | Para qué sirve | Dónde está |\n| --- | --- | --- |\n| [nombre] | [qué resuelve, en una línea] | [ruta o servicio] |\n| [nombre] | [qué resuelve, en una línea] | [ruta o servicio] |\n| [nombre] | [qué resuelve, en una línea] | [ruta o servicio] |\n\nLa regla que las une: **[quién puede llamar a quién, y en qué orden]**.\n\nCómo se arranca y cómo se comprueba: **[comando exacto para levantarlo]** y\n**[comando exacto para pasar las pruebas]**. Si no hay pruebas, dilo.\n\n## Glosario\n\nUna palabra puede significar aquí algo distinto de lo que significa fuera. Esta\ntabla evita la mitad de los malentendidos, y es la sección que más se agradece\ncuando alguien vuelve al proyecto meses después.\n\n| Término | Qué significa aquí |\n| --- | --- |\n| [ficha] | [no es un documento; es cada negocio del mapa] |\n| [publicar] | [dejarlo visible al público, no desplegar código] |\n| [cliente] | [la empresa que paga, no el navegador] |\n\n## Convenciones que hay que respetar\n\nSolo las que se incumplen de verdad. Una lista de veinte no se cumple.\n\n- [Nombres: cómo se llaman los archivos, las ramas, las variables]\n- [Idioma: en qué idioma va el código, los comentarios y lo que ve el usuario]\n- [Formato: quién manda, el formateador o tú]\n- [Errores: cómo se lanzan y cómo se registran]\n- [Fechas, monedas y unidades: en qué se guardan y en qué se muestran]\n\n## Fuera de alcance y prohibido\n\nAquí van las cosas que parecen buena idea y no lo son. Explica el porqué en media\nlínea: una prohibición sin motivo se salta en cuanto estorba.\n\n- **No [cambiar X].** [Porque Y depende de ello y no lo controlamos.]\n- **No [añadir dependencias nuevas].** [Porque el despliegue va sin red.]\n- **No [tocar los datos de producción].** [Porque no hay copia de seguridad.]\n- Fuera de alcance por ahora: [lo que ya sabemos que no vamos a hacer].\n\n## Lo que te pido ahora\n\n- **Objetivo:** [qué quieres que salga de esta conversación, en una frase]\n- **Qué te doy:** [archivos, datos, capturas, accesos]\n- **Qué espero de vuelta:** [código, un plan, una decisión razonada, un texto]\n- **Cuándo parar y preguntar:** cuando falte un dato que cambie el resultado. No\n  lo supongas en silencio: dilo, elige la opción más conservadora y márcala como\n  suposición.\n\n> [!TIP]\n> Si algo de este contexto te parece incoherente o desfasado, señálalo antes de\n> ponerte a trabajar. Es más barato corregirlo ahora.\n"},{"id":"ia-tarea","cat":"ia","archivo":"ia-tarea.md","nombre":"tarea.md","titulo":"Encargo de una tarea","destino":"—","desc":"Objetivo, entradas, salida esperada, criterios de aceptación y ejemplos de respuesta buena y mala.","cuerpo":"# Tarea: [nombre corto de la tarea]\n\n## Objetivo\n\nUna frase que empiece por un verbo y diga qué tiene que existir cuando termines.\n*[Convierte el CSV de ventas en un resumen mensual por región.]* Si no cabe en\nuna frase, son dos tareas.\n\n## Contexto mínimo\n\nSolo lo imprescindible para hacer **esto**. Nada de la historia del proyecto: lo\nque sobra compite con lo que importa.\n\n- [Dato de fondo 1: de dónde salen las entradas y con qué frecuencia]\n- [Dato de fondo 2: quién lee la salida y para qué la usa]\n- [Dato de fondo 3: la decisión que ya está tomada y no se discute]\n\n## Entradas\n\nQué le das, en qué formato y dónde está. Si un campo puede venir vacío o sucio,\ndilo aquí, no en los casos límite.\n\n| Qué | Formato | Dónde está | Puede faltar |\n| --- | --- | --- | :---: |\n| [ventas] | [CSV con cabecera, separador coma] | [`datos/ventas.csv`] | no |\n| [tabla de regiones] | [JSON, código a nombre] | [`datos/regiones.json`] | sí |\n\n## Salida esperada\n\nDescribe el formato exacto y **pon un ejemplo completo**, no un esquema. Es la\nsección que más errores evita: si no lo defines, te llegará en el formato que al\nmodelo le parezca bonito.\n\n- **Formato:** [Markdown / JSON / CSV / texto plano]\n- **Longitud:** [máximo N líneas, N filas, N palabras]\n- **Idioma y tono:** [español neutro, sin adornos]\n- **Dónde se entrega:** [en la respuesta y nada más / en el archivo\n  `salida/resumen.json`]\n\nEjemplo completo de cómo tiene que verse:\n\n````json\n{\n  \"periodo\": \"2026-07\",\n  \"regiones\": [\n    { \"codigo\": \"NOR\", \"nombre\": \"Norte\", \"ventas\": 18420, \"variacion\": 0.07 },\n    { \"codigo\": \"SUR\", \"nombre\": \"Sur\",   \"ventas\": 12310, \"variacion\": -0.02 }\n  ],\n  \"sin_region\": 3\n}\n````\n\n> [!IMPORTANT]\n> Si la salida se la va a comer otro programa, di **solo eso y nada más**: ni\n> saludo, ni explicación, ni las vallas de código alrededor.\n\n## Criterios de aceptación\n\nEscríbelos de manera que se puedan comprobar mirando el resultado, sin discutir.\n\n- [ ] La salida es [JSON válido] y nada más.\n- [ ] Aparecen las [N] regiones, incluso las que tienen cero ventas.\n- [ ] Las cifras cuadran con el total del archivo de entrada.\n- [ ] Los porcentajes van con [dos decimales] y con el signo cuando son negativos.\n- [ ] Ninguna fila inventada: si el dato no está, aparece como `null`.\n\n## Restricciones\n\n- **No** [uses librerías externas / cambies los nombres de los campos].\n- **No** [inventes valores para rellenar huecos].\n- **No** [modifiques los archivos de entrada].\n- Máximo [N] líneas de respuesta. Si no cabe, di qué has recortado.\n\n## Casos límite\n\n| Caso | Qué hacer |\n| --- | --- |\n| [El archivo viene vacío] | [Devuelve la estructura con la lista vacía, no un error] |\n| [Una región no está en la tabla] | [Cuéntala en `sin_region` y sigue] |\n| [Hay filas duplicadas] | [Quédate con la última y anótalo al final] |\n| [Un importe no es un número] | [Trátalo como cero y avisa] |\n\n## Si falta información\n\nDistingue los dos casos, porque no se resuelven igual:\n\n1. **Falta un dato que cambia el resultado** (una fecha, un criterio, un\n   destinatario): **pregunta** y no sigas. Una pregunta concreta, no tres.\n2. **Falta un detalle menor** (un nombre de campo, un formato de fecha):\n   **supón** lo más conservador, sigue, y deja constancia al final:\n\n````md\n## Suposiciones\n- He tomado el mes como natural, de día 1 a fin de mes. No estaba definido.\n````\n\n## Ejemplo de respuesta buena\n\n````json\n{ \"periodo\": \"2026-07\", \"regiones\": [ { \"codigo\": \"NOR\", \"nombre\": \"Norte\", \"ventas\": 18420, \"variacion\": 0.07 } ], \"sin_region\": 0 }\n````\n\nPor qué está bien: es el formato pedido, sin envoltorio, y con todos los campos.\n\n## Ejemplo de respuesta mala\n\n````md\n¡Claro! He analizado tus datos de ventas y aquí tienes un resumen. En general las\nventas han ido bastante bien este mes, sobre todo en el norte…\n````\n\nPor qué está mal: saluda, resume en prosa lo que se pedía en JSON y opina sobre\nlos datos en vez de darlos.\n"},{"id":"ia-base-conocimiento","cat":"ia","archivo":"ia-base-conocimiento.md","nombre":"referencia.md","titulo":"Base de conocimiento","destino":"—","desc":"Material de consulta en secciones cortas y autocontenidas, para que la IA cite en vez de inventar.","cuerpo":"---\ntitulo: [Tema] — documento de referencia\nsubtitulo: Material para que lo consulte una IA\nautor: [responsable]\nfecha: [fecha de la última revisión]\n---\n\nEste documento existe para que una IA lo consulte y conteste con él: un asistente\ninterno, un buscador de documentos, un chat de soporte. Lo escribes una vez y lo\nlee una máquina muchas veces, así que la forma importa tanto como el contenido.\n\n## Ficha\n\nÁmbito\n: [Qué cubre este documento, en una línea: devoluciones y cambios de pedidos hechos en la tienda online.]\n\nA quién aplica\n: [Clientes de España y Portugal. No cubre pedidos de mayoristas.]\n\nResponsable\n: [Nombre y equipo: quien resuelve las dudas que este documento no resuelve.]\n\nVigente desde\n: [1 de julio de 2026]\n\nÚltima revisión\n: [21 de agosto de 2026]\n\n## Cómo usar este documento\n\nCada sección se lee sola. Busca el tema por su encabezado, aplica lo que pone y,\nsi lo que necesitas no está, ve a «Qué queda fuera de este documento»: dice a\ndónde ir.\n\n> [!IMPORTANT]\n> **Cada sección tiene que entenderse suelta.** El sistema que busca en este\n> documento normalmente no le entrega al modelo el archivo entero: le entrega\n> **un fragmento**, cortado por donde ese sistema trocee; a menudo, por los\n> encabezados. Si una sección empieza con «en ese caso» o «como decíamos antes»,\n> al modelo le llegará ese trozo sin el «antes», y contestará mal. Repite el\n> sujeto aunque suene redundante.\n\n[TOC]\n\n## [Tema 1: devoluciones de un pedido]\n\nEn *[empresa]*, una **devolución** es *[la operación por la que el cliente\nrecupera el importe de un producto que ya ha recibido]*. No es lo mismo que un\ncambio, que se explica en su propia sección.\n\n**Cuándo se puede.** [Dentro de los 30 días naturales desde la entrega, con el\nproducto sin usar y con su embalaje.]\n\n**Procedimiento.**\n\n1. [Comprueba la fecha de entrega en el pedido.]\n2. [Genera la etiqueta de devolución desde el panel.]\n3. [Envíala al correo del cliente y anota la incidencia.]\n4. [Al recibir el paquete en almacén, aprueba el reembolso.]\n5. [El importe vuelve al método de pago original en 3 a 5 días hábiles.]\n\n**Excepciones.**\n\n| Caso | Qué se hace |\n| --- | --- |\n| [Producto abierto] | [No se admite, salvo defecto de fábrica] |\n| [Fuera de plazo] | [Solo con autorización de [responsable]] |\n| [Pagado con tarjeta caducada] | [Reembolso a cuenta bancaria, con justificante] |\n\n**Lo que no se hace nunca.** [Reembolsar antes de recibir el producto, ni\ndevolver los gastos de envío en una devolución voluntaria.]\n\n## [Tema 2: cambio de un producto]\n\nEn *[empresa]*, un **cambio** es *[sustituir un producto entregado por otro del\nmismo catálogo]*. Se parece a una devolución, pero no genera reembolso, y esa es\nla diferencia que más se confunde.\n\n**Cuándo se puede.** [Dentro de los 30 días, si el producto de destino está en\nstock.]\n\n**Procedimiento.**\n\n1. [Confirma el stock del producto de destino antes de prometer nada.]\n2. [Crea el cambio enlazado al pedido original.]\n3. [Envía el producto nuevo cuando llegue el antiguo al almacén.]\n4. [Si hay diferencia de precio, cóbrala o abónala en el mismo movimiento.]\n\n**Excepciones.** [Si no vuelve a haber stock del producto de destino en 15 días,\nel cambio se convierte en devolución, y se aplica el procedimiento de la sección\nde devoluciones.]\n\n## [Tema 3: facturas]\n\nEn *[empresa]*, la **factura** se emite *[de forma automática al confirmarse el\npago]* y se envía *[al correo de la cuenta]*. Este apartado cubre solo las\nfacturas de clientes finales.\n\n**Procedimiento para corregir una factura.**\n\n1. [Comprueba qué dato está mal: nombre fiscal, NIF o importe.]\n2. [Si es un dato fiscal, emite una factura rectificativa; no edites la original.]\n3. [Si es el importe, abre incidencia con contabilidad antes de tocar nada.]\n\n> [!WARNING]\n> [Una factura emitida no se borra nunca. Se rectifica.]\n\n## Preguntas frecuentes\n\nRespuesta corta primero, en negrita, y el detalle después. Quien pregunta se\nqueda con la primera línea; el modelo también.\n\n**¿[Cuánto tarda un reembolso]?**\n[Entre 3 y 5 días hábiles desde que el almacén aprueba la devolución.] El plazo\nlo marca el banco, no [empresa]; si pasan 10 días, abre incidencia.\n\n**¿[Se puede devolver un producto rebajado]?**\n[Sí, en las mismas condiciones que uno a precio normal.] La rebaja no cambia el\nplazo ni el estado en el que debe volver el producto.\n\n**¿[Quién paga el envío de vuelta]?**\n[El cliente, si la devolución es voluntaria; [empresa], si el producto llegó\ndefectuoso o equivocado.]\n\n## Cómo llama la gente a cada cosa\n\nLa gente no busca con tus palabras. Esta tabla hace que el buscador encuentre la\nsección aunque la pregunta venga con otro vocabulario.\n\n| Como lo llamamos aquí | Como lo llama la gente |\n| --- | --- |\n| [Devolución] | [reembolso, retorno, «me devuelven el dinero», RMA] |\n| [Cambio] | [permuta, «cambiarlo por otro», sustitución] |\n| [Factura rectificativa] | [nota de crédito, abono, factura corregida] |\n| [Incidencia] | [ticket, reclamación, queja, caso] |\n\n## Qué queda fuera de este documento\n\n- [Pedidos de mayoristas] → ve a *[documento o equipo]*.\n- [Devoluciones fuera de España y Portugal] → ve a *[documento o equipo]*.\n- [Fraude y contracargos] → ve a *[documento o equipo]*.\n\nSi la pregunta no encaja en ninguna sección de este documento, **dilo** y remite\na *[responsable]*. No la respondas por aproximación: en una base de conocimiento,\nuna respuesta inventada hace más daño que un «no lo sé».\n\n## Historial de cambios\n\n| Fecha | Qué cambió | Quién |\n| --- | --- | --- |\n| [21-08-2026] | [Plazo de devolución de 15 a 30 días] | [nombre] |\n| [10-05-2026] | [Añadida la sección de facturas] | [nombre] |\n| [01-02-2026] | [Primera versión] | [nombre] |\n\n> [!TIP]\n> Revisa este documento cada [seis meses] aunque no haya cambiado nada, y\n> actualiza «Última revisión». Una fecha reciente le dice al que lo lee —persona\n> o modelo— que puede fiarse.\n"},{"id":"guia-markdown","cat":"documentos","archivo":"guia-markdown.md","nombre":"guia-markdown.md","titulo":"Guía completa de Markdown","destino":"Referencia","desc":"Toda la sintaxis con su resultado al lado: 22 apartados, de los títulos a las notas al pie.","cuerpo":"---\ntitulo: Guía y plantilla completa de Markdown\nsubtitulo: Toda la sintaxis, con su resultado al lado\nautor: Tu nombre\nfecha: 21 de agosto de 2026\n---\n\nUn catálogo de **toda la sintaxis** de Markdown, cada cosa con su resultado al lado. Búscalo aquí cuando no recuerdes cómo se escribía algo, cópialo y sigue con lo tuyo.\n\n> [!TIP]\n> Pulsa **&#9998; Editar** para escribir aquí mismo y ver el resultado al lado. Con **&#10515; .html** te llevas una copia de esta página, con tu texto dentro, que funciona sin internet.\n\n[TOC]\n\n## 1. Cómo usar esta plantilla\n\n### Escribir\n\n1. Pulsa **✎ Editar**: a la izquierda escribes, a la derecha ves el resultado.\n2. Lo que escribas se guarda solo en este navegador; al volver, sigue donde lo dejaste.\n3. Con **⤓ .md** te llevas el texto; con **⤓ .html**, una copia completa de esta página, con tu documento dentro, que se abre sin internet.\n\n### Imprimir o guardar en PDF\n\nPulsa **&#128424; Imprimir** (o <kbd>Ctrl<\/kbd>+<kbd>P<\/kbd>). La barra de botones, el editor y los enlaces de anclaje desaparecen solos: solo se imprime el documento. En el destino de impresión elige *Guardar como PDF* para obtener un PDF.\n\n### Las cuatro reglas de oro\n\n- **Pega el texto al margen izquierdo.** Cuatro espacios al principio de una línea convierten el texto en un bloque de código.\n- **Deja una línea en blanco** entre párrafos, listas, tablas y títulos. Es lo que separa un bloque de otro.\n- **No escribas la etiqueta de cierre de script tal cual** dentro de tu texto: cortaría el archivo. Si necesitas mencionarla, escríbela con barra invertida: `<\\/script>`.\n- **Guarda el archivo en UTF-8** para que los acentos y las eñes se vean bien. El Bloc de notas de Windows lo hace por defecto; si te salen símbolos raros, usa *Archivo → Guardar como → Codificación: UTF-8*.\n\n## 2. Metadatos del documento (front matter)\n\nLas primeras líneas del archivo, entre dos líneas de tres guiones, describen el documento. No son obligatorias, pero si las pones se dibuja una portada y el título aparece en la pestaña del navegador y en la cabecera del PDF.\n\n````yaml\n---\ntitulo: Guía y plantilla completa de Markdown\nsubtitulo: Toda la sintaxis, con su resultado al lado\nautor: Tu nombre\nfecha: 21 de agosto de 2026\n---\n````\n\nSe admiten `titulo`, `subtitulo`, `autor` y `fecha` (también en inglés: `title`, `subtitle`, `author`, `date`). La portada de arriba está generada con ese bloque.\n\n## 3. Encabezados\n\n### Estilo almohadilla\n\nUna a seis almohadillas y un espacio. Es el estilo que conviene usar siempre.\n\n````md\n# Título del documento\n## Sección\n### Apartado\n#### Subapartado\n##### Nivel cinco\n###### Nivel seis\n````\n\n### Estilo subrayado\n\nSolo existe para dos niveles. Se subraya el texto con signos igual o con guiones.\n\n````md\nTítulo de nivel 1\n=================\n\nTítulo de nivel 2\n-----------------\n````\n\n> [!WARNING]\n> Una línea de guiones justo debajo de un párrafo lo convierte en título de nivel 2 en vez de dibujar una raya. Si lo que quieres es una raya divisoria, deja una línea en blanco antes.\n\n### Identificador propio\n\nPor defecto cada título recibe un identificador para poder enlazarlo. Puedes fijarlo tú entre llaves al final:\n\n````md\n## Presupuesto anual {#presupuesto}\n````\n\nDespués enlazas con `[ver presupuesto](#presupuesto)`.\n\n### Índice automático\n\nEscribe `[TOC]` en una línea sola y se genera el índice con todos los títulos del documento, cada uno enlazado a su sección. El índice del principio de esta página es exactamente eso.\n\n## 4. Párrafos y saltos de línea\n\nUn párrafo es texto seguido; para empezar otro se deja **una línea en blanco**. Pulsar Intro una sola vez no basta: esas dos líneas se unen en un mismo párrafo.\n\nPara forzar un salto dentro del mismo párrafo hay tres formas: terminar la línea con **dos espacios**, terminarla con una **barra invertida**, o escribir `<br>`.\n\n````md\nPrimera línea con dos espacios al final.  \nSegunda línea del mismo párrafo.\n\nPrimera línea con barra invertida.\\\nSegunda línea.\n\nPrimera línea con etiqueta.<br>\nSegunda línea.\n````\n\n<div class=\"demo\">\n\nPrimera línea con dos espacios al final.  \nSegunda línea del mismo párrafo.\n\n<\/div>\n\nPara separar bloques con aire de más, una línea con `&nbsp;` (un espacio duro) funciona como párrafo vacío.\n\n## 5. Énfasis y estilos de texto\n\n| Escribes | Se ve |\n| --- | --- |\n| `*cursiva*` o `_cursiva_` | *cursiva* |\n| `**negrita**` o `__negrita__` | **negrita** |\n| `***negrita y cursiva***` | ***negrita y cursiva*** |\n| `~~tachado~~` | ~~tachado~~ |\n| `==resaltado==` | ==resaltado== |\n| `` `código` `` | `código` |\n| `H~2~O` (subíndice) | H~2~O |\n| `x^2^` (superíndice) | x^2^ |\n| `<kbd>Ctrl<\/kbd>` | <kbd>Ctrl<\/kbd> |\n| `<small>letra pequeña<\/small>` | <small>letra pequeña<\/small> |\n| `<u>subrayado<\/u>` | <u>subrayado<\/u> |\n\nSe pueden combinar sin problema: ``**texto _mezclado_ con `código`**`` se ve como **texto _mezclado_ con `código`**.\n\n> [!NOTE]\n> El guión bajo dentro de una palabra no marca cursiva, para no romper nombres como `mi_variable_larga`. Si necesitas cursiva a mitad de palabra, usa asteriscos.\n\n## 6. Listas\n\n### Lista sin orden\n\nGuión, asterisco o signo más; los tres valen, pero conviene no mezclarlos dentro del mismo documento.\n\n````md\n- Primer punto\n- Segundo punto\n- Tercer punto\n````\n\n<div class=\"demo\">\n\n- Primer punto\n- Segundo punto\n- Tercer punto\n\n<\/div>\n\n### Lista numerada\n\n````md\n1. Preparar el material\n2. Redactar el borrador\n3. Revisar y publicar\n````\n\n<div class=\"demo\">\n\n1. Preparar el material\n2. Redactar el borrador\n3. Revisar y publicar\n\n<\/div>\n\nLos números que escribes no importan: el navegador renumera solo. Sí importa **el primero**, que fija dónde empieza la cuenta.\n\n````md\n5. Este punto es el número cinco\n1. y este sale como el seis\n1. y este como el siete\n````\n\n<div class=\"demo\">\n\n5. Este punto es el número cinco\n1. y este sale como el seis\n1. y este como el siete\n\n<\/div>\n\n### Listas anidadas\n\nSe anidan con **dos o cuatro espacios** de sangría respecto al punto padre.\n\n````md\n- Frutas\n  - Cítricos\n    - Naranja\n    - Limón\n  - Tropicales\n- Verduras\n  1. Hoja verde\n  2. Raíz\n````\n\n<div class=\"demo\">\n\n- Frutas\n  - Cítricos\n    - Naranja\n    - Limón\n  - Tropicales\n- Verduras\n  1. Hoja verde\n  2. Raíz\n\n<\/div>\n\n### Lista de tareas\n\n````md\n- [x] Comprar el dominio\n- [x] Montar la plantilla\n- [ ] Escribir el primer documento\n- [ ] Imprimirlo\n````\n\n<div class=\"demo\">\n\n- [x] Comprar el dominio\n- [x] Montar la plantilla\n- [ ] Escribir el primer documento\n- [ ] Imprimirlo\n\n<\/div>\n\n### Listas apretadas y listas sueltas\n\nSin líneas en blanco entre puntos, la lista sale **apretada**. Con una línea en blanco entre ellos, sale **suelta** y cada punto se separa como un párrafo.\n\n<div class=\"demo\">\n\n- Apretada, una línea\n- Apretada, otra línea\n\n<\/div>\n\n<div class=\"demo\">\n\n- Suelta, con aire alrededor\n\n- Suelta, segundo punto\n\n<\/div>\n\n### Un punto con varios párrafos\n\nPara meter más de un párrafo, una cita o un bloque de código dentro de un mismo punto, se sangra el contenido a la altura del texto del punto.\n\n````md\n1. Primer paso del proceso.\n\n   Este párrafo sigue perteneciendo al paso uno porque está sangrado.\n\n   ```\n   comando --de --ejemplo\n   ```\n\n2. Segundo paso.\n````\n\n<div class=\"demo\">\n\n1. Primer paso del proceso.\n\n   Este párrafo sigue perteneciendo al paso uno porque está sangrado.\n\n   ```\n   comando --de --ejemplo\n   ```\n\n2. Segundo paso.\n\n<\/div>\n\n## 7. Citas y avisos\n\n### Cita normal\n\n````md\n> El buen diseño es tan poco diseño como sea posible.\n>\n> — Dieter Rams\n````\n\n<div class=\"demo\">\n\n> El buen diseño es tan poco diseño como sea posible.\n>\n> — Dieter Rams\n\n<\/div>\n\n### Citas anidadas y con contenido\n\n````md\n> Nivel uno de la cita.\n>\n> > Nivel dos, citando a otro.\n>\n> - También caben listas\n> - y `código`\n````\n\n<div class=\"demo\">\n\n> Nivel uno de la cita.\n>\n> > Nivel dos, citando a otro.\n>\n> - También caben listas\n> - y `código`\n\n<\/div>\n\n### Avisos de colores\n\nUna cita que empieza por una etiqueta entre corchetes con admiración se convierte en un recuadro de color. Sirven `[!NOTE]`, `[!TIP]`, `[!IMPORTANT]`, `[!WARNING]` y `[!CAUTION]` (o en español `[!NOTA]`, `[!CONSEJO]`, `[!IMPORTANTE]`, `[!AVISO]` y `[!PRECAUCION]`).\n\n````md\n> [!NOTE]\n> Información útil que conviene tener presente.\n\n> [!TIP]\n> Un atajo o una recomendación.\n\n> [!IMPORTANT]\n> Algo imprescindible para que el resto funcione.\n\n> [!WARNING]\n> Cuidado: esto puede dar problemas.\n\n> [!CAUTION]\n> Riesgo real de perder datos o romper algo.\n````\n\n<div class=\"demo\">\n\n> [!NOTE]\n> Información útil que conviene tener presente.\n\n> [!TIP]\n> Un atajo o una recomendación.\n\n> [!IMPORTANT]\n> Algo imprescindible para que el resto funcione.\n\n> [!WARNING]\n> Cuidado: esto puede dar problemas.\n\n> [!CAUTION]\n> Riesgo real de perder datos o romper algo.\n\n<\/div>\n\n## 8. Código\n\n### Código dentro de una frase\n\nSe envuelve entre acentos graves: `` `npm install` `` se ve como `npm install`.\n\nSi el propio código lleva un acento grave, se usan dos por fuera: ``` `` `así` `` ``` da `` `así` ``.\n\n### Bloques de código\n\nTres acentos graves antes y después. Si escribes el nombre del lenguaje detrás de los primeros, aparece la etiqueta en la esquina y el código se colorea solo (ver el apartado 23).\n\n````md\n```js\nfunction saludar(nombre) {\n  return `Hola, ${nombre}`;\n}\n```\n````\n\n<div class=\"demo\">\n\n```js\nfunction saludar(nombre) {\n  return `Hola, ${nombre}`;\n}\n```\n\n<\/div>\n\nNombres habituales: `js`, `ts`, `html`, `css`, `json`, `python`, `bash`, `sql`, `yaml`, `md`, `diff`, `text`. La lista completa de los que se colorean está en el apartado 23.\n\n### Bloques con virgulillas\n\nTres virgulillas hacen lo mismo. Sirven para mostrar bloques que contienen acentos graves.\n\n````md\n~~~\nAquí dentro pueden ir ``` sin cerrar el bloque.\n~~~\n````\n\n### Un bloque dentro de otro\n\nPara enseñar un bloque de tres acentos, el bloque de fuera lleva cuatro. Es lo que hace esta guía en cada ejemplo.\n\n### Bloque por sangría\n\nCuatro espacios al principio de la línea también crean un bloque de código, aunque es la forma antigua y da sustos cuando uno sangra sin querer.\n\n<div class=\"demo\">\n\n    esto es código por llevar cuatro espacios\n    segunda línea\n\n<\/div>\n\n### Marcar diferencias\n\n````md\n```diff\n- const color = \"rojo\";\n+ const color = \"azul\";\n  const tamano = 12;\n```\n````\n\n<div class=\"demo\">\n\n```diff\n- const color = \"rojo\";\n+ const color = \"azul\";\n  const tamano = 12;\n```\n\n<\/div>\n\n## 9. Enlaces\n\n| Escribes | Se ve |\n| --- | --- |\n| `[texto del enlace](https://ejemplo.com)` | [texto del enlace](https://ejemplo.com) |\n| `[con título](https://ejemplo.com \"sale al pasar el ratón\")` | [con título](https://ejemplo.com \"sale al pasar el ratón\") |\n| `<https://ejemplo.com>` | <https://ejemplo.com> |\n| `<correo@ejemplo.com>` | <correo@ejemplo.com> |\n| `[a otra sección](#11-tablas)` | [a otra sección](#11-tablas) |\n| `[a un archivo](./informe.pdf)` | [a un archivo](./informe.pdf) |\n| `[con **negrita** dentro](https://ejemplo.com)` | [con **negrita** dentro](https://ejemplo.com) |\n\nUna dirección suelta como https://www.ejemplo.com también se convierte en enlace sola.\n\n### Enlaces por referencia\n\nCuando la misma dirección se repite, o cuando es tan larga que estorba, se pone una etiqueta corta en el texto y la dirección al final del documento.\n\n````md\nConsulta la [documentación oficial][doc] y el [repositorio][repo].\nTambién vale la forma corta: [doc].\n\n[doc]: https://ejemplo.com/documentacion \"Documentación\"\n[repo]: https://ejemplo.com/repositorio\n````\n\n<div class=\"demo\">\n\nConsulta la [documentación oficial][doc] y el [repositorio][repo]. También vale la forma corta: [doc].\n\n<\/div>\n\n[doc]: https://ejemplo.com/documentacion \"Documentación\"\n[repo]: https://ejemplo.com/repositorio\n\nLas líneas de definición se pueden colocar donde quieras: no se imprimen.\n\n### Enlaces internos\n\nCada título tiene un identificador que se forma pasando el texto a minúsculas, quitando acentos y símbolos y cambiando los espacios por guiones. «## 11. Tablas» se convierte en `#11-tablas`. Pasa el ratón por encima de cualquier título de esta página y aparece una almohadilla a la derecha: es su enlace.\n\n## 10. Imágenes y figuras\n\nLa sintaxis es la del enlace con una admiración delante. El texto entre corchetes es la descripción alternativa: se lee en voz alta para quien no ve la imagen y aparece si el archivo falta.\n\n````md\n![Descripción de la imagen](fotos/portada.jpg)\n![Con título](fotos/portada.jpg \"Sale al pasar el ratón\")\n[![Imagen que enlaza](fotos/boton.png)](https://ejemplo.com)\n````\n\n<div class=\"demo\">\n\n![Un rectángulo de ejemplo](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MjAiIGhlaWdodD0iMjYwIiB2aWV3Qm94PSIwIDAgNTIwIDI2MCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjMWY2ZmViIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjODI1MGRmIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjUyMCIgaGVpZ2h0PSIyNjAiIHJ4PSIxNCIgZmlsbD0idXJsKCNnK
