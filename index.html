<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==========================================================================
   PALETA
   ========================================================================== */
:root{
  --fondo:#ffffff;
  --papel:#ffffff;
  --texto:#1b1f24;
  --tenue:#5c6773;
  --borde:#e2e6ea;
  --borde-fuerte:#c9d1d9;
  --acento:#1f6feb;
  --acento-suave:#e8f0fe;
  --codigo-fondo:#f6f8fa;
  --codigo-texto:#24292f;
  --cita-fondo:#f7f9fb;
  --marca:#fff2a8;
  --sombra:0 1px 3px rgba(16,24,40,.08), 0 8px 24px rgba(16,24,40,.06);
  --ancho:46rem;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --n:#1f6feb; --n-f:#e8f0fe;
  --c:#1a7f37; --c-f:#e6f6ea;
  --i:#8250df; --i-f:#f3ecfd;
  --a:#bf8700; --a-f:#fff8e1;
  --p:#cf222e; --p-f:#ffebe9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --fondo:#0d1117; --papel:#12171f; --texto:#e6edf3; --tenue:#9aa7b4;
    --borde:#242c37; --borde-fuerte:#39424e; --acento:#6ea8fe; --acento-suave:#16243c;
    --codigo-fondo:#161b22; --codigo-texto:#e6edf3; --cita-fondo:#151b23; --marca:#6b5b00;
    --sombra:0 1px 3px rgba(0,0,0,.5);
    --n-f:#12243c; --c-f:#0f2417; --i-f:#1d1630; --a-f:#2a2109; --p-f:#2d1416;
    --n:#6ea8fe; --c:#5fd07a; --i:#c297ff; --a:#e3b341; --p:#ff7b72;
  }
}
:root[data-tema="oscuro"]{
  --fondo:#0d1117; --papel:#12171f; --texto:#e6edf3; --tenue:#9aa7b4;
  --borde:#242c37; --borde-fuerte:#39424e; --acento:#6ea8fe; --acento-suave:#16243c;
  --codigo-fondo:#161b22; --codigo-texto:#e6edf3; --cita-fondo:#151b23; --marca:#6b5b00;
  --sombra:0 1px 3px rgba(0,0,0,.5);
  --n-f:#12243c; --c-f:#0f2417; --i-f:#1d1630; --a-f:#2a2109; --p-f:#2d1416;
  --n:#6ea8fe; --c:#5fd07a; --i:#c297ff; --a:#e3b341; --p:#ff7b72;
}

/* ==========================================================================
   BASE
   ========================================================================== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--fondo); color:var(--texto);
  font-family:var(--serif); font-size:18px; line-height:1.7;
  -webkit-text-size-adjust:100%; text-rendering:optimizeLegibility;
}
#panel{display:block}
body.editando #panel{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); height:100vh}
body.editando #ladoEditor{border-right:1px solid var(--borde); background:var(--papel); min-height:0}
body.editando .documento{overflow:auto; height:100vh; margin:0; padding:2.5rem 3rem 6rem; max-width:none}
#ed{
  width:100%; height:100%; border:0; resize:none; outline:none; padding:2.5rem 1.5rem 6rem 2rem;
  font-family:var(--mono); font-size:14px; line-height:1.65; tab-size:2;
  background:var(--papel); color:var(--texto);
}

/* ==========================================================================
   BARRA DE HERRAMIENTAS
   ========================================================================== */
.barra{
  position:fixed; top:.7rem; right:.7rem; z-index:50; display:flex; gap:.3rem;
  background:var(--papel); border:1px solid var(--borde); border-radius:.7rem;
  padding:.3rem; box-shadow:var(--sombra); font-family:var(--sans);
}
.barra button{
  font:inherit; font-size:12.5px; line-height:1; cursor:pointer; color:var(--texto);
  background:transparent; border:0; border-radius:.5rem; padding:.5rem .6rem; white-space:nowrap;
}
.barra button:hover{background:var(--acento-suave); color:var(--acento)}
.barra button:active{transform:translateY(1px)}
@media (max-width:640px){ .barra{left:.7rem; right:.7rem; justify-content:space-between} }

/* ==========================================================================
   DOCUMENTO
   ========================================================================== */
.documento{max-width:var(--ancho); margin:0 auto; padding:4.5rem 1.5rem 7rem}
.documento > *:first-child{margin-top:0}

h1,h2,h3,h4,h5,h6{
  font-family:var(--sans); font-weight:650; line-height:1.25;
  margin:2.4em 0 .7em; letter-spacing:-.011em; scroll-margin-top:1.5rem;
}
h1{font-size:2.1em; margin-top:0; letter-spacing:-.021em}
h2{font-size:1.55em; padding-bottom:.3em; border-bottom:1px solid var(--borde)}
h3{font-size:1.25em}
h4{font-size:1.06em}
h5{font-size:1em; color:var(--tenue)}
h6{font-size:.9em; color:var(--tenue); text-transform:uppercase; letter-spacing:.06em}
h1+h2,h2+h3,h3+h4{margin-top:1.4em}

.anclaje{
  float:right; margin-left:.5rem; color:var(--borde-fuerte); text-decoration:none;
  opacity:0; transition:opacity .15s; font-weight:400;
}
h1:hover .anclaje,h2:hover .anclaje,h3:hover .anclaje,
h4:hover .anclaje,h5:hover .anclaje,h6:hover .anclaje{opacity:1}
.anclaje:hover{color:var(--acento)}

p{margin:0 0 1.15em}
a{color:var(--acento); text-underline-offset:.18em; text-decoration-thickness:from-font}
a:hover{text-decoration-thickness:2px}

strong{font-weight:700}
em{font-style:italic}
del{color:var(--tenue)}
mark{background:var(--marca); color:inherit; padding:.05em .2em; border-radius:.2em}
sup,sub{font-size:.75em; line-height:0}
abbr[title]{text-decoration:underline dotted; cursor:help}
small{font-size:.85em; color:var(--tenue)}
kbd{
  font-family:var(--sans); font-size:.8em; padding:.15em .45em; border-radius:.35em;
  border:1px solid var(--borde-fuerte); border-bottom-width:2px;
  background:var(--codigo-fondo); color:var(--texto); white-space:nowrap;
}

/* listas */
ul,ol{margin:0 0 1.15em; padding-left:1.6em}
li{margin:.28em 0}
li>ul,li>ol{margin:.3em 0}
li>p{margin:0 0 .6em}
ul.lista-tareas{list-style:none; padding-left:.2em}
ul.lista-tareas li.tarea{padding-left:0}
ul.lista-tareas input[type=checkbox]{
  width:1em; height:1em; margin-right:.45em; vertical-align:-.1em; accent-color:var(--acento);
}

/* citas */
blockquote{
  margin:0 0 1.15em; padding:.1em 0 .1em 1.2em;
  border-left:.25em solid var(--borde-fuerte); color:var(--tenue);
}
blockquote > *:last-child{margin-bottom:0}

/* avisos estilo GitHub */
.alerta{
  margin:0 0 1.2em; padding:.85em 1.1em; border-left:.25em solid var(--n);
  background:var(--n-f); border-radius:0 .5em .5em 0;
}
.alerta > *:last-child{margin-bottom:0}
.alerta-titulo{font-family:var(--sans); font-weight:650; font-size:.92em; color:var(--n); margin:0 0 .4em}
.alerta.consejo{border-color:var(--c); background:var(--c-f)} .alerta.consejo .alerta-titulo{color:var(--c)}
.alerta.importante{border-color:var(--i); background:var(--i-f)} .alerta.importante .alerta-titulo{color:var(--i)}
.alerta.aviso{border-color:var(--a); background:var(--a-f)} .alerta.aviso .alerta-titulo{color:var(--a)}
.alerta.precaucion{border-color:var(--p); background:var(--p-f)} .alerta.precaucion .alerta-titulo{color:var(--p)}

/* código */
code{
  font-family:var(--mono); font-size:.86em;
  background:var(--codigo-fondo); color:var(--codigo-texto);
  padding:.15em .38em; border-radius:.35em; border:1px solid var(--borde);
}
pre{
  position:relative; margin:0 0 1.3em; padding:1em 1.1em; overflow-x:auto;
  background:var(--codigo-fondo); border:1px solid var(--borde); border-radius:.6em;
}
pre code{
  background:none; border:0; padding:0; font-size:.82em; line-height:1.6;
  color:var(--codigo-texto); white-space:pre; display:block;
}
pre[data-lenguaje]::after{
  content:attr(data-lenguaje); position:absolute; top:.35em; right:.6em;
  font-family:var(--sans); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--tenue); pointer-events:none;
}
.copiar{
  position:absolute; top:.4em; right:.5em; opacity:0; transition:opacity .15s;
  font-family:var(--sans); font-size:11px; cursor:pointer; color:var(--tenue);
  background:var(--papel); border:1px solid var(--borde); border-radius:.4em; padding:.25em .5em;
}
pre:hover .copiar{opacity:1}
.copiar:hover{color:var(--acento); border-color:var(--acento)}
pre:hover[data-lenguaje]::after{opacity:0}

/* tablas */
.tabla-envoltorio{overflow-x:auto; margin:0 0 1.3em}
table{border-collapse:collapse; width:100%; font-family:var(--sans); font-size:.88em}
th,td{border:1px solid var(--borde); padding:.5em .75em; text-align:left; vertical-align:top}
thead th{background:var(--codigo-fondo); font-weight:650}
tbody tr:nth-child(even){background:color-mix(in srgb, var(--codigo-fondo) 55%, transparent)}
table code{font-size:.92em}

/* imágenes y figuras */
img{max-width:100%; height:auto; border-radius:.4em}
figure{margin:0 0 1.4em; text-align:center}
figcaption{font-family:var(--sans); font-size:.82em; color:var(--tenue); margin-top:.5em}

/* reglas */
hr{border:0; border-top:1px solid var(--borde); margin:2.4em 0}

/* listas de definiciones */
dl{margin:0 0 1.2em}
dt{font-weight:650; font-family:var(--sans); font-size:.95em; margin-top:.9em}
dd{margin:.2em 0 .2em 1.4em; color:var(--tenue)}

/* índice automático */
.indice{
  font-family:var(--sans); font-size:.9em; background:var(--papel);
  border:1px solid var(--borde); border-radius:.7em; padding:1em 1.3em; margin:0 0 2em;
}
.indice-titulo{font-weight:650; margin:0 0 .5em; font-size:.95em}
.indice ul{list-style:none; margin:0; padding:0; columns:2; column-gap:2rem}
.indice li{margin:.15em 0; break-inside:avoid}
.indice li a{text-decoration:none; color:var(--texto)}
.indice li a:hover{color:var(--acento); text-decoration:underline}
.indice .n1{font-weight:650}
.indice .n3{padding-left:1em; font-size:.94em; color:var(--tenue)}
.indice .n4,.indice .n5,.indice .n6{padding-left:2em; font-size:.9em; color:var(--tenue)}
@media (max-width:640px){ .indice ul{columns:1} }

/* portada generada desde el front matter */
.portada{margin:0 0 3rem; padding:0 0 1.5rem; border-bottom:2px solid var(--borde)}
.portada-titulo{font-size:2.4em; margin:0 0 .2em; line-height:1.15}
.portada-subtitulo{font-size:1.15em; color:var(--tenue); font-family:var(--sans); margin:0 0 .9em}
.portada-datos{font-family:var(--sans); font-size:.85em; color:var(--tenue); margin:0}
.portada-datos span+span::before{content:" · "}

/* notas al pie */
.notas-al-pie{margin-top:3.5rem; font-size:.88em; color:var(--tenue)}
.notas-al-pie ol{padding-left:1.4em}
.notas-al-pie li{margin:.4em 0}
.notas-al-pie li:target{background:var(--acento-suave); border-radius:.3em}
.nota-ref a{text-decoration:none; padding:0 .15em}
.volver{text-decoration:none; margin-left:.35em}

/* bloque de ejemplo de la guía */
.demo{
  position:relative; margin:0 0 1.6em; padding:1.9em 1.2em 1em;
  border:1px dashed var(--borde-fuerte); border-radius:.6em; background:var(--papel);
}
.demo::before{
  content:"Se ve así"; position:absolute; top:.5em; left:1.2em;
  font-family:var(--sans); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--tenue);
}
.demo > *:last-child{margin-bottom:0}
.demo pre{margin-bottom:1em}

/* utilidades */
.salto-pagina{break-after:page; page-break-after:always; height:0}
.centrado{text-align:center}
.dos-columnas{columns:2; column-gap:2.5rem}
@media (max-width:640px){ .dos-columnas{columns:1} }

/* ==========================================================================
   IMPRESIÓN
   ========================================================================== */
@page{ margin:2cm 1.9cm; }
@media print{
  :root{
    --fondo:#fff; --papel:#fff; --texto:#000; --tenue:#444; --borde:#bbb; --borde-fuerte:#888;
    --acento:#000; --acento-suave:#fff; --codigo-fondo:#f4f4f4; --codigo-texto:#000;
    --marca:#ffef9f; --sombra:none;
  }
  html,body{background:#fff !important; color:#000 !important; font-size:11.5pt}
  .no-print,.barra,#ladoEditor,.copiar,.anclaje{display:none !important}
  body.editando #panel{display:block}
  body.editando .documento{height:auto; overflow:visible; padding:0; margin:0 auto; max-width:none}
  .documento{max-width:none; padding:0; margin:0}
  a{color:#000 !important; text-decoration:underline}
  h1,h2,h3,h4,h5,h6{break-after:avoid; page-break-after:avoid}
  p,li,blockquote{orphans:3; widows:3}
  pre,table,figure,.demo,.alerta,blockquote{break-inside:avoid; page-break-inside:avoid}
  pre{white-space:pre-wrap; word-wrap:break-word}
  pre code{white-space:pre-wrap}
  tr,img{break-inside:avoid; page-break-inside:avoid}
  thead{display:table-header-group}
  .indice{border:1px solid #bbb}
  .notas-al-pie{break-before:auto}
}

/* ==========================================================================
   SITIO: barra adaptable, catálogo de plantillas, avisos
   ========================================================================== */
.barra{flex-wrap:wrap; max-width:min(94vw,54rem); justify-content:flex-end}
.barra button b{font-weight:400; font-style:normal}
.barra button span{margin-left:.4em}
@media (max-width:820px){
  .barra button span{display:none}
  .barra button{padding:.6em .65em; font-size:15px}
}

/* metadatos del documento (front matter completo) */
.portada-meta{
  margin:1.2rem 0 0; padding:.8rem 1rem; border:1px solid var(--borde);
  border-radius:.6rem; background:var(--codigo-fondo);
  display:grid; grid-template-columns:auto 1fr; gap:.25rem .9rem;
  font-family:var(--mono); font-size:.78rem; line-height:1.55;
}
.portada-meta dt{font-weight:600; color:var(--tenue); margin:0}
.portada-meta dd{margin:0; white-space:pre-wrap; word-break:break-word}
.portada.solo-meta{border-bottom:0; padding-bottom:0; margin-bottom:2rem}

/* diálogo del catálogo */
.velo{
  position:fixed; inset:0; z-index:100; padding:1rem;
  background:rgba(8,12,18,.55); display:flex; align-items:center; justify-content:center;
}
.velo[hidden]{display:none}
.dialogo{
  width:min(66rem,100%); max-height:min(88vh,880px); overflow:hidden;
  background:var(--papel); color:var(--texto); font-family:var(--sans);
  border:1px solid var(--borde); border-radius:1rem;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  display:grid; grid-template-rows:auto minmax(0,1fr);
}
.dialogo-cabecera{display:flex; align-items:center; gap:.9rem; padding:.9rem 1.1rem; border-bottom:1px solid var(--borde)}
.dialogo-cabecera h2{margin:0; padding:0; border:0; font-size:1.05rem; font-family:var(--sans); font-weight:650; white-space:nowrap}
.dialogo-cabecera input[type=search]{
  flex:1; min-width:0; font:inherit; font-size:.9rem; padding:.5em .8em;
  border:1px solid var(--borde); border-radius:.5em; background:var(--fondo); color:var(--texto);
}
.dialogo-cabecera input[type=search]:focus{outline:2px solid var(--acento); outline-offset:-1px}
.cerrar{
  font:inherit; cursor:pointer; border:0; background:transparent; color:var(--tenue);
  border-radius:.5em; padding:.4em .6em; line-height:1;
}
.cerrar:hover{background:var(--acento-suave); color:var(--acento)}
.dialogo-cuerpo{display:grid; grid-template-columns:15.5rem minmax(0,1fr); min-height:0}
.categorias{border-right:1px solid var(--borde); overflow:auto; padding:.7rem; min-height:0}
.categorias button{
  display:block; width:100%; text-align:left; font:inherit; font-size:.88rem; cursor:pointer;
  border:0; background:transparent; color:var(--texto); border-radius:.55em; padding:.55em .7em; margin-bottom:.15rem;
}
.categorias button:hover{background:var(--acento-suave)}
.categorias button[aria-current=true]{background:var(--acento); color:#fff}
.categorias button i{font-style:normal; display:inline-block; width:1.4em; opacity:.8}
.categorias .cuenta{float:right; font-size:.78em; opacity:.6}
.categorias p{margin:.9rem .7rem .4rem; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--tenue)}
.tarjetas{overflow:auto; padding:1rem; min-height:0; display:grid; gap:.8rem; align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(16rem,1fr))}
.tarjeta{
  text-align:left; font:inherit; cursor:pointer; color:var(--texto);
  border:1px solid var(--borde); border-radius:.7rem; background:var(--fondo);
  padding:.85rem .95rem; display:flex; flex-direction:column; gap:.35rem;
  transition:border-color .12s, transform .12s;
}
.tarjeta:hover{border-color:var(--acento); transform:translateY(-1px)}
.tarjeta h3{margin:0; font-size:.94rem; font-weight:650; font-family:var(--sans)}
.tarjeta p{margin:0; font-size:.82rem; color:var(--tenue); line-height:1.45}
.tarjeta code{
  font-size:.72rem; padding:.2em .45em; align-self:flex-start; margin-top:.2rem;
  background:var(--codigo-fondo); border:1px solid var(--borde); border-radius:.35em; color:var(--tenue);
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tarjeta .quitar{
  align-self:flex-start; margin-top:.3rem; font:inherit; font-size:.75rem; cursor:pointer;
  border:0; background:transparent; color:var(--p); padding:.2em 0; text-decoration:underline;
}
.vacio{grid-column:1/-1; color:var(--tenue); font-size:.9rem; padding:2rem 0; text-align:center}
@media (max-width:760px){
  .dialogo-cuerpo{grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr)}
  .categorias{border-right:0; border-bottom:1px solid var(--borde); display:flex; gap:.3rem; overflow-x:auto; padding:.6rem}
  .categorias button{width:auto; white-space:nowrap; margin:0}
  .categorias p, .categorias .cuenta{display:none}
}

/* avisos flotantes */
.estado-doc{
  position:fixed; left:.7rem; bottom:.9rem; z-index:60; display:flex; align-items:center; gap:.5rem;
  max-width:min(92vw,30rem); background:var(--papel); color:var(--tenue);
  border:1px solid var(--borde); border-radius:.7rem; padding:.35rem .5rem .35rem .6rem;
  font-family:var(--sans); font-size:.76rem; line-height:1.3; box-shadow:var(--sombra);
}
.estado-doc .punto{ width:.5em; height:.5em; border-radius:50%; background:var(--c); flex:0 0 auto }
.estado-doc.pendiente .punto{ background:var(--a) }
.estado-doc .texto{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer }
.estado-doc b{ color:var(--texto); font-weight:600 }
.estado-doc button{
  font:inherit; cursor:pointer; white-space:nowrap; color:var(--acento);
  background:transparent; border:1px solid var(--borde); border-radius:.45rem; padding:.25em .55em;
}
.estado-doc button:hover{ background:var(--acento-suave); border-color:var(--acento) }
@media (max-width:600px){ .estado-doc{ left:.5rem; bottom:.5rem; font-size:.72rem; max-width:calc(100vw - 1rem) } }

.tarjeta .reciente-datos{ color:var(--tenue); font-size:.75rem }
.tarjeta .reciente-datos code{ font-size:.95em; background:var(--codigo-fondo); padding:.05em .35em; border-radius:.3em }
.tarjeta .marca{
  align-self:flex-start; font-size:.7rem; border-radius:.4em; padding:.15em .5em;
  border:1px solid transparent;
}
.tarjeta .marca.pendiente{ background:var(--a-f); color:var(--a); border-color:var(--a) }
.tarjeta .marca.guardado{ background:var(--c-f); color:var(--c); border-color:var(--c) }
.tarjeta .acciones{ display:flex; gap:.8rem; margin-top:.3rem }
.tarjeta .acciones span{
  font-size:.75rem; cursor:pointer; text-decoration:underline; color:var(--acento);
}
.tarjeta .acciones span.quitar-rec{ color:var(--p) }
.tarjeta.activa{ border-color:var(--acento) }
.nota-almacen{
  grid-column:1/-1; margin:.4rem 0 0; color:var(--tenue); font-size:.78rem; line-height:1.5;
  border-top:1px solid var(--borde); padding-top:.7rem;
}
.aviso-flotante{
  position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:120;
  display:flex; align-items:center; gap:.9rem; max-width:min(92vw,32rem);
  background:var(--texto); color:var(--fondo); font-family:var(--sans); font-size:.86rem;
  padding:.7em 1em; border-radius:.65em; box-shadow:0 8px 30px rgba(0,0,0,.3);
}
.aviso-flotante[hidden]{display:none}

---
titulo: Escribe en Markdown
subtitulo: Míralo bien, imprímelo y llévatelo
---

Esto es un editor de Markdown que funciona **sin cuenta, sin internet y sin subir nada a ningún sitio**. Lo que escribes se queda en tu navegador.

> [!TIP]
> Pulsa **✎ Editar** y empieza. Lo que escribas se guarda solo, aquí mismo.

## Por dónde empezar

- **▤ Plantillas** — un catálogo listo para usar: habilidades y agentes para Claude, `CLAUDE.md`, reglas, informes, actas, propuestas… Elige una y ya tienes el documento montado.
- **✎ Editar** — escribes a la izquierda, lo ves a la derecha.
- **🖨 Imprimir** — imprime o guarda en PDF, limpio y sin la barra de botones.
- **⤓ .html** — te descargas esta misma página con tu texto dentro: un solo archivo que funciona sin conexión y que puedes enviar por correo.
- **◷ Recientes** — lo que escribes se guarda solo en este navegador, con un nombre corto (`md01`, `md02`…). Puedes irte a mirar plantillas y volver: lo encuentras en **Plantillas → Recientes**. En tu equipo solo estará lo que descargues, y si borras los datos de navegación se va con ellos.

## También dibuja

Un bloque marcado como `mermaid` se dibuja de verdad (flujo, secuencia, estados y tarta), las fórmulas entre `$` se ven como fórmulas y el código se colorea solo según el lenguaje. Todo dentro de esta página, sin conexión.

```mermaid
graph LR
  A[Escribes] --> B[Lo ves al lado]
  B --> C{¿Te gusta?}
  C -->|Sí| D([Imprimes o te lo llevas])
  C -->|No| A
```

## Si no te acuerdas de la sintaxis

Abre **Plantillas → Documentos → Guía completa de Markdown**: está toda, con su resultado al lado, incluidos los diagramas, las fórmulas y los colores.

## Instalar

En el móvil o en el escritorio puedes instalarla como una aplicación: aparece el botón **⤒ Instalar** en la barra, o usa *Añadir a la pantalla de inicio* desde el menú del navegador. Una vez instalada funciona sin conexión.

<script type="application/json" id="catalogo">{"version":1,"categorias":[{"id":"habilidades","nombre":"Habilidades (skills)","icono":"✦","descripcion":"Archivos SKILL.md que le enseñan a Claude un procedimiento. Van en .claude/skills/<nombre>/SKILL.md"},{"id":"agentes","nombre":"Subagentes","icono":"◉","descripcion":"Especialistas a los que Claude delega tareas. Van en .claude/agents/<nombre>.md"},{"id":"reglas","nombre":"CLAUDE.md, AGENTS.md y reglas","icono":"▤","descripcion":"Instrucciones que se cargan en cada sesión. CLAUDE.md o AGENTS.md en la raíz, o archivos sueltos en .claude/rules/"},{"id":"comandos","nombre":"Comandos y hooks","icono":"⌘","descripcion":"Órdenes que escribes con /barra, y hooks que se ejecutan siempre, decida Claude lo que decida"},{"id":"roles","nombre":"Roles y prompts","icono":"◆","descripcion":"Prompts de sistema y papeles para conversar con Claude o para tu propia aplicación"},{"id":"ia","nombre":"Escribir para una IA","icono":"◈","descripcion":"Archivos pensados para que los lea un modelo: contexto, encargos y material de consulta"},{"id":"documentos","nombre":"Documentos","icono":"▦","descripcion":"Informes, actas, propuestas y demás papeleo, ya maquetado para imprimir"},{"id":"academico","nombre":"Trabajos académicos (APA)","icono":"¶","descripcion":"Documentos con el formato de la norma APA 7: portada, interlineado doble, sangría y lista de referencias"}],"plantillas":[{"id":"skill-basica","cat":"habilidades","archivo":"skill-basica.md","nombre":"SKILL.md","titulo":"Habilidad básica","destino":".claude/skills/mi-habilidad/SKILL.md","desc":"El esqueleto mínimo: cuándo usarla, cómo proceder y qué reglas respetar.","cuerpo":"---\nname: mi-habilidad\ndescription: Qué hace esta habilidad y cuándo debe usarla Claude. Pon el caso de uso principal al principio.\n---\n\n<!-- Guardar como: .claude/skills/mi-habilidad/SKILL.md\n     El comando (/mi-habilidad) sale del nombre de la carpeta, no del campo `name`.\n     En el front matter todos los campos son opcionales; la que conviene poner\n     siempre es `description`, porque es lo que Claude lee para saber cuándo usarla. -->\n\n# Mi habilidad\n\nUna frase que explique el objetivo de esta habilidad.\n\nAl arrancar, Claude solo ve el nombre y la `description`; cuando la tarea encaja, carga este archivo entero y se queda en el contexto. Por eso el cuerpo va corto: instrucciones, no ensayo.\n\n## Cuándo usarla\n\n- Cuando el usuario pide *[situación concreta]*.\n- Cuando aparece *[señal en el código o en la conversación]*.\n\n## Cómo proceder\n\n1. **Primer paso.** Qué mirar antes de tocar nada.\n2. **Segundo paso.** La acción principal, con el detalle que Claude no puede adivinar.\n3. **Tercer paso.** Cómo comprobar que ha salido bien.\n\n## Reglas\n\n- Nunca *[cosa que no se debe hacer]*.\n- Siempre *[condición que hay que respetar]*.\n\n## Ejemplo\n\nEntrada: *[lo que pide el usuario]*\nSalida esperada: *[cómo debe quedar el resultado]*\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — la página oficial de skills: dónde viven y qué admite el front matter.\n- [Specification](https://agentskills.io/specification) — el formato abierto: `name` y `description` obligatorios, y los límites de tamaño.\n- [Guides: Add Skills to Your Agent](https://ai-sdk.dev/cookbook/guides/agent-skills) — las tres fases de carga: descubrimiento, activación y ejecución.\n- [Agent Skills: It's Just Markdown Files All the Way Down](https://dev.to/nicoeft/agent-skills-its-just-markdown-files-all-the-way-down-5hj5) — Nicolas Francisquelo Tacca: el `description` es lo que decide si la habilidad se activa, y el cuerpo, por debajo de las 500 líneas.\n"},{"id":"skill-flujo","cat":"habilidades","archivo":"skill-flujo.md","nombre":"SKILL.md","titulo":"Flujo de trabajo paso a paso","destino":".claude/skills/desplegar/SKILL.md","desc":"Procedimiento con lista de comprobación que solo se dispara cuando tú lo invocas.","cuerpo":"---\nname: desplegar\ndescription: Despliega la aplicación a producción siguiendo la lista de comprobación del equipo\nargument-hint: \"[entorno]\"\ndisable-model-invocation: true\nallowed-tools: Bash(git status), Bash(git log *), Bash(npm run build), Read\n---\n\n<!-- Guardar como: .claude/skills/desplegar/SKILL.md\n     disable-model-invocation evita que Claude despliegue por su cuenta:\n     solo se dispara cuando tú escribes /desplegar\n     Si el cuerpo no llevara $ARGUMENTS, Claude Code añadiría al final\n     una línea `ARGUMENTS: produccion` con lo que hubieras escrito. -->\n\n# Desplegar a $ARGUMENTS\n\nSigue estos pasos **en orden** y no saltes ninguno. Si un paso falla, detente y explica qué pasó.\n\n## 1. Comprobaciones previas\n\n- [ ] La rama actual es `main` y está limpia.\n- [ ] Las pruebas pasan.\n- [ ] La versión en `package.json` se ha subido.\n\n## 2. Construir\n\nEjecuta la construcción y comprueba que no hay avisos nuevos.\n\n## 3. Desplegar\n\nLanza el despliegue al entorno indicado.\n\n## 4. Verificar\n\n- [ ] La página principal responde.\n- [ ] El registro de errores está limpio en los primeros cinco minutos.\n\n## Si algo sale mal\n\nRevierte al despliegue anterior y avisa antes de intentarlo otra vez.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — `argument-hint`, `disable-model-invocation`, `allowed-tools` y las sustituciones de `$ARGUMENTS`.\n- [Specification](https://agentskills.io/specification) — por qué el cuerpo va en pasos, con ejemplos y casos límite.\n- [How to write effective AI agent skills: 6 data-backed practices](https://arize.com/blog/how-to-write-effective-ai-agent-skills/) — Laurie Voss, 2026: una habilidad enfocada dice cuándo cargarla, qué secuencia seguir y cómo es un buen resultado.\n"},{"id":"skill-referencia","cat":"habilidades","archivo":"skill-referencia.md","nombre":"SKILL.md","titulo":"Conocimiento de referencia","destino":".claude/skills/convenciones-api/SKILL.md","desc":"Documentación que Claude carga solo cuando toca archivos que encajan con unos patrones.","cuerpo":"---\nname: convenciones-api\ndescription: Convenciones de diseño de la API de este proyecto: nombres de rutas, formato de errores, paginación y versionado\nuser-invocable: false\npaths:\n  - \"src/api/**/*.ts\"\n  - \"src/routes/**/*.ts\"\n---\n\n<!-- Guardar como: .claude/skills/convenciones-api/SKILL.md\n     user-invocable: false -> es conocimiento de fondo, no un comando\n     paths -> solo se carga cuando Claude trabaja con esos archivos,\n     así estas convenciones no gastan contexto el resto del tiempo -->\n\n# Convenciones de la API\n\n## Rutas\n\n- Sustantivos en plural y en minúsculas: `/facturas`, `/clientes/{id}/pagos`.\n- Nada de verbos en la ruta: la acción la marca el método HTTP.\n- Versión en el prefijo: `/v1/...`.\n\n## Formato de error\n\nTodos los errores devuelven la misma forma:\n\n```json\n{\n  \"error\": {\n    \"codigo\": \"factura_no_encontrada\",\n    \"mensaje\": \"No existe la factura 4821\",\n    \"detalles\": {}\n  }\n}\n```\n\nEl `codigo` es estable y se puede comparar en el cliente; el `mensaje` es para humanos y puede cambiar.\n\n## Paginación\n\nPor cursor, nunca por número de página:\n\n```json\n{ \"datos\": [], \"siguiente\": \"cursor_opaco_o_null\" }\n```\n\n## Qué nunca hacemos\n\n- Devolver 200 con un error dentro.\n- Romper un contrato sin subir la versión.\n- Exponer identificadores de base de datos en la respuesta.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — `user-invocable`, `paths` y cómo Claude carga una habilidad por relevancia.\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — la otra forma de guardar convenciones: `.claude/rules/*.md`, también con `paths`.\n- [How to write effective AI agent skills: 6 data-backed practices](https://arize.com/blog/how-to-write-effective-ai-agent-skills/) — Laurie Voss, 2026: mover las referencias a archivos aparte gana puntos frente a la documentación larga.\n- [markdown-viewer/skills](https://github.com/markdown-viewer/skills) — catorce habilidades reales donde ver qué se queda en el cuerpo y qué baja a `references/`.\n"},{"id":"skill-con-scripts","cat":"habilidades","archivo":"skill-con-scripts.md","nombre":"SKILL.md","titulo":"Habilidad con scripts","destino":".claude/skills/generar-grafico/SKILL.md","desc":"Carpeta con scripts y recursos, y permisos preaprobados para ejecutarlos sin preguntar.","cuerpo":"---\nname: generar-grafico\ndescription: Genera un gráfico a partir de un CSV usando el script incluido en la habilidad\nargument-hint: \"[archivo.csv]\"\nallowed-tools: Bash(${CLAUDE_SKILL_DIR}/scripts/grafico.py *), Read\n---\n\n<!-- Estructura de carpetas:\n     .claude/skills/generar-grafico/\n     ├── SKILL.md          <- este archivo\n     ├── scripts/\n     │   └── grafico.py\n     └── references/\n         └── paletas.md\n     Las carpetas scripts/, references/ y assets/ son las del formato\n     abierto Agent Skills, y su contenido solo se lee cuando hace falta.\n     La regla de allowed-tools usa la misma variable que el cuerpo,\n     así el script se ejecuta sin pedir permiso. -->\n\n# Generar un gráfico\n\n## Pasos\n\n1. Lee las primeras filas del CSV para entender las columnas.\n2. Elige el tipo de gráfico según la forma de los datos:\n   - una serie temporal → líneas\n   - comparación entre categorías → barras horizontales\n   - parte de un todo → barras apiladas, nunca un queso\n3. Ejecuta el script:\n\n   ```\n   ${CLAUDE_SKILL_DIR}/scripts/grafico.py $ARGUMENTS --salida grafico.png\n   ```\n\n4. Enseña el resultado y explica en una frase qué se ve.\n\n## Colores\n\nUsa la paleta de `${CLAUDE_SKILL_DIR}/references/paletas.md`. No inventes colores nuevos.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — `${CLAUDE_SKILL_DIR}` se sustituye en el cuerpo y en las reglas Bash de `allowed-tools`.\n- [Specification](https://agentskills.io/specification) — la carpeta de una habilidad: `SKILL.md` más `scripts/`, `references/` y `assets/`.\n- [anthropics/skills](https://github.com/anthropics/skills) — el repositorio público de Anthropic, con la plantilla y ejemplos por categoría.\n- [markdown-viewer/skills](https://github.com/markdown-viewer/skills) — colección con `references/`, `examples/`, `layouts/` y `styles/` dentro de cada habilidad.\n"},{"id":"skill-contexto-dinamico","cat":"habilidades","archivo":"skill-contexto-dinamico.md","nombre":"SKILL.md","titulo":"Contexto dinámico","destino":".claude/skills/resumen-pr/SKILL.md","desc":"Ejecuta órdenes de shell antes de enviar el texto, para que Claude reciba datos reales.","cuerpo":"---\nname: resumen-pr\ndescription: Resume los cambios de un pull request con los datos reales traídos de GitHub\ncontext: fork\nagent: Explore\nallowed-tools: Bash(gh *)\n---\n\n<!-- La sintaxis !`comando` ejecuta la orden ANTES de enviarle el texto a Claude\n     y sustituye el hueco por su salida, así Claude recibe datos de verdad.\n     context: fork hace que corra en su propio subagente y no gaste\n     el contexto de la conversación principal.\n     Todo lo que ejecutes con !`...` tiene que estar permitido en\n     allowed-tools, o se quedará esperando permiso. -->\n\n# Contexto del pull request\n\n- Diferencias: !`gh pr diff`\n- Archivos tocados: !`gh pr diff --name-only`\n- Comentarios: !`gh pr view --comments`\n\nEstado del repositorio:\n\n```!\ngit status --short\ngit log --oneline -5\n```\n\n# Tu tarea\n\nEscribe un resumen para quien va a revisar el PR:\n\n1. **Qué cambia**, en dos frases y sin jerga.\n2. **Por dónde empezar a revisar**, ordenando los archivos por riesgo.\n3. **Qué vigilar**: efectos colaterales, migraciones, cambios que rompen contratos.\n4. **Qué no está probado**, si lo detectas.\n\nNo repitas el diff línea a línea: eso ya lo tiene delante.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — la sintaxis !`comando`, que se ejecuta antes de enviarle el texto a Claude.\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — qué es el subagente al que delegas con `context: fork` y `agent`.\n"},{"id":"skill-subagente","cat":"habilidades","archivo":"skill-subagente.md","nombre":"SKILL.md","titulo":"Habilidad que corre en subagente","destino":".claude/skills/auditar-dependencias/SKILL.md","desc":"Trabajo largo en segundo plano, en su propio contexto, sin gastar el de la conversación.","cuerpo":"---\nname: auditar-dependencias\ndescription: Audita las dependencias del proyecto en busca de paquetes abandonados, duplicados o con licencias problemáticas\ncontext: fork\nagent: Explore\nbackground: true\neffort: high\nallowed-tools: Bash(npm ls *), Bash(npm outdated), Read, Grep\n---\n\n<!-- context: fork -> corre en un subagente aparte\n     background: true -> no bloquea la conversación; el resultado llega luego\n     effort: high -> más razonamiento para una tarea de análisis\n     Si necesitas más control (herramientas, modelo, permisos), declara un\n     subagente propio en .claude/agents/ y llámalo desde el campo agent. -->\n\n# Auditoría de dependencias\n\nRevisa el proyecto y devuelve **una tabla**, no un ensayo.\n\n## Qué buscar\n\n| Señal | Cómo detectarla |\n| --- | --- |\n| Paquete abandonado | Sin publicaciones en más de dos años |\n| Duplicado | Dos librerías que hacen lo mismo |\n| Peso injustificado | Una dependencia enorme usada en un solo sitio |\n| Licencia contagiosa | GPL o AGPL en un producto cerrado |\n| Sin usar | Está en el manifiesto pero no se importa en ningún lado |\n\n## Formato de salida\n\n| Paquete | Problema | Gravedad | Qué hacer |\n| --- | --- | :---: | --- |\n| ejemplo | Sin usar | media | Quitar |\n\nTermina con **una** recomendación: por dónde empezar.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — la página oficial: front matter, herramientas heredadas y valores de `model`.\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — `context`, `agent`, `background` y `effort` en el front matter de la habilidad.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — dónde viven `.claude/agents/` y `.claude/skills/` dentro del proyecto.\n"},{"id":"skill-revision-codigo","cat":"habilidades","archivo":"skill-revision-codigo.md","nombre":"SKILL.md","titulo":"Revisión de código","destino":".claude/skills/revisar/SKILL.md","desc":"Qué buscar y qué no comentar, para que la revisión encuentre fallos y no estilo.","cuerpo":"---\nname: revisar\ndescription: Revisa los cambios pendientes buscando errores reales, no cuestiones de estilo\nargument-hint: \"[rama-o-archivo]\"\ndisable-model-invocation: true\nallowed-tools: Bash(git diff *), Bash(git log *), Read, Grep\n---\n\n<!-- Guardar como: .claude/skills/revisar/SKILL.md\n     Este cuerpo no usa $ARGUMENTS: cuando escribes /revisar mi-rama,\n     Claude Code añade `ARGUMENTS: mi-rama` al final, así que llega igual. -->\n\n# Revisión de código\n\n## Qué revisar\n\nEmpieza por el diff. Si no hay argumento, revisa lo que no está confirmado.\n\n## Qué buscar, por orden de importancia\n\n1. **Fallos de corrección.** Casos límite, nulos, errores de índice, condiciones de carrera, promesas sin esperar.\n2. **Fugas de datos.** Claves, tokens, rutas absolutas, registros con datos personales.\n3. **Recursos sin cerrar.** Conexiones, ficheros, escuchadores de eventos.\n4. **Errores tragados.** `catch` vacíos, errores que se registran y se ignoran.\n5. **Duplicación real.** Código que ya existe en el proyecto y se ha vuelto a escribir.\n\n## Qué NO comentar\n\n- Formato, comillas, punto y coma: eso lo arregla el formateador.\n- Preferencias personales sin consecuencias.\n- Renombrados cosméticos.\n\n## Cómo entregarlo\n\nPara cada hallazgo:\n\n- **Archivo y línea.**\n- **Qué falla**, en una frase.\n- **Cómo se rompe**: entradas concretas que provocan el fallo.\n- **El arreglo**, en código.\n\nSi no encuentras nada serio, dilo claramente en una línea. No rellenes.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — front matter, `allowed-tools` y qué pasa con los argumentos si el cuerpo no los usa.\n- [Commands](https://code.claude.com/docs/en/commands.md) — los comandos y habilidades que Claude Code ya trae de fábrica, revisión incluida.\n- [Specification](https://agentskills.io/specification) — el cuerpo de una habilidad: pasos, ejemplos de entrada y salida, casos límite.\n"},{"id":"skill-estilo-escritura","cat":"habilidades","archivo":"skill-estilo-escritura.md","nombre":"SKILL.md","titulo":"Voz de marca","destino":".claude/skills/voz-de-marca/SKILL.md","desc":"Cómo se escriben los textos de cara al público: tono, palabras vetadas y formato.","cuerpo":"---\nname: voz-de-marca\ndescription: Cómo escribimos los textos de cara al público: tono, palabras que usamos y palabras prohibidas\nuser-invocable: false\npaths:\n  - \"content/**/*.md\"\n  - \"src/**/*.copy.ts\"\n---\n\n<!-- Guardar como: .claude/skills/voz-de-marca/SKILL.md\n     user-invocable: false -> no sale en el menú /, la carga Claude sola\n     paths -> solo cuando trabaja con textos de cara al público -->\n\n# Voz de marca\n\n## Cómo sonamos\n\nCercanos y concretos. Escribimos como habla una persona que sabe del tema y tiene prisa por ayudarte.\n\n- Frases cortas. Una idea por frase.\n- Segunda persona: «puedes», «tienes», no «el usuario puede».\n- Voz activa. «El sistema envía el aviso», no «el aviso es enviado».\n\n## Palabras que no usamos\n\n| No escribas | Escribe |\n| --- | --- |\n| solución integral | lo que hace de verdad |\n| potenciar, empoderar | ayudar, permitir |\n| en el corto plazo | pronto, o una fecha |\n| innovador, disruptivo | (nada: demuéstralo) |\n| simplemente, solo tienes que | (quítalo: nada es simple para quien no lo sabe) |\n\n## Formato\n\n- Títulos en mayúscula solo la primera letra.\n- Números del cero al nueve con letra; del 10 en adelante, con cifras.\n- Precios con el símbolo detrás: `12,50 €`.\n- Nunca terminamos con signos de exclamación.\n\n## Antes de dar un texto por bueno\n\n- [ ] ¿Se entiende leyéndolo una sola vez?\n- [ ] ¿Sobra alguna palabra?\n- [ ] ¿Prometemos algo que el producto no hace?\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — `user-invocable: false` y `paths` para conocimiento de fondo, no comandos.\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — las otras casas de las reglas: CLAUDE.md y `.claude/rules/` con `paths`.\n- [Best practices for Claude Code](https://code.claude.com/docs/en/best-practices.md) — «Write an effective CLAUDE.md»: qué merece estar escrito y qué sobra.\n"},{"id":"skill-evaluable","cat":"habilidades","archivo":"skill-evaluable.md","nombre":"SKILL.md","titulo":"Habilidad con evaluaciones","destino":".claude/skills/mi-habilidad/SKILL.md","desc":"Con criterios de aceptación y una carpeta evals/: casos que demuestran que la habilidad hace lo que promete.","cuerpo":"---\nname: mi-habilidad-evaluable\ndescription: Qué hace esta habilidad y cuándo debe usarla Claude. Empieza por la tarea concreta y mete las palabras que usaría quien la pide.\n---\n\n<!-- Guardar como: .claude/skills/mi-habilidad-evaluable/SKILL.md\n     Al lado, en la misma carpeta:\n     .claude/skills/mi-habilidad-evaluable/\n     ├── SKILL.md          <- este archivo\n     ├── evals/\n     │   └── evals.json    <- los casos de prueba de abajo, para la máquina\n     └── references/\n         └── detalle.md    <- lo que solo se lee cuando hace falta\n     El comando sale del nombre de la carpeta, no del campo `name`. -->\n\n# Mi habilidad evaluable\n\nUna frase con el objetivo: qué produce esta habilidad y para quién.\n\nUna habilidad que no se ha probado contra la tarea que dice hacer es prosa. Esta plantilla trae los apartados que la obligan a demostrarlo: criterios que se miran, casos que se ejecutan y un procedimiento para pasarlos.\n\nAl arrancar, Claude solo ve el nombre y la `description`; cuando la tarea encaja, carga este archivo entero y se queda en el contexto. Por eso el cuerpo va corto: pasos, no ensayo.\n\n## Cuándo se usa y cuándo no\n\n**Se usa cuando:**\n\n- El usuario pide *[la tarea concreta]*.\n- Aparece *[la señal en el código, en un archivo o en la conversación]*.\n- Hay que seguir *[el procedimiento interno que Claude no puede adivinar]*.\n\n**No se usa cuando:**\n\n- *[La tarea parecida que resuelve otra habilidad]* — usa *[nombre de la otra]*.\n- El modelo ya lo hace bien sin ayuda: si sin la habilidad los casos de prueba también pasan, esta habilidad sobra.\n- *[El caso peligroso que debe pasar por una persona]*.\n\n## Cómo proceder\n\n1. **Antes de tocar nada.** Qué mirar para saber si hay material suficiente: *[archivo, campo, comando]*.\n2. **La acción principal.** El detalle que Claude no puede deducir leyendo el proyecto.\n3. **Comprobar.** Repasa los criterios de aceptación uno a uno antes de dar la tarea por hecha.\n4. **Entregar.** Formato exacto de la salida: *[archivo, tabla, ruta]*.\n\nExplica el porqué de cada regla: «haz X porque Y provoca Z» funciona mejor que «SIEMPRE X, NUNCA Y».\n\n## Criterios de aceptación\n\nCómo se sabe que ha hecho bien su trabajo. Escríbelos en cosas que se puedan mirar: un archivo existe, un número cuadra, un comando termina con código 0. Nada de «la salida es buena». Lo que sea gusto o diseño, déjalo para la revisión humana, no lo pongas aquí.\n\n*Ejemplo relleno para una habilidad que extrae facturas a JSON. Cámbialo por el tuyo:*\n\n- [ ] Existe `salidas/factura.json` y es JSON válido (`jq . salidas/factura.json` sale sin error).\n- [ ] Están los cuatro campos obligatorios: `numero`, `fecha`, `total` y `moneda`.\n- [ ] El `total` coincide con la suma de las líneas, con dos decimales.\n- [ ] Un dato que no aparece en el documento vale `null`; no se inventa ninguno.\n- [ ] No se ha escrito ni modificado ningún archivo fuera de `salidas/`.\n\n## Casos de prueba\n\nDos o tres casos bastan para empezar. Uno con la petición escrita como la diría una persona, otro preciso, y al menos uno límite. Guárdalos en `evals/evals.json` con el prompt, la salida esperada y los archivos de entrada.\n\n| Entrada | Qué tiene que salir | Cómo lo compruebas |\n| --- | --- | --- |\n| `/mi-habilidad evals/entradas/normal.pdf` — factura de una página con 3 líneas | JSON con los 4 campos y 3 líneas | `jq '.lineas \\| length'` devuelve `3` y `jq -e '.total'` no falla |\n| «sácame los datos de esta factura», con `evals/entradas/escaneo.pdf` | El mismo JSON, aunque el prompt no diga «JSON» ni nombre la habilidad | Los 4 campos están y el total cuadra con la suma de las líneas |\n| `evals/entradas/sin-total.pdf` — el documento no trae total | `total` a `null` y un aviso en la respuesta diciendo que falta | `jq '.total'` devuelve `null`, no un número |\n\n## Casos límite\n\nQué tiene que pasar cuando la entrada no es la de siempre. Decídelo aquí, no en el momento.\n\n- **Falta un dato.** Deja el campo a `null` y dilo en la respuesta. No lo estimes ni lo rellenes con un valor plausible.\n- **El archivo está vacío o es ilegible.** Para, di por qué y no escribas una salida a medias. Un archivo incompleto es peor que ninguno.\n- **Hay más de un candidato.** Aplica el desempate: *[el más reciente / el de la ruta indicada]*. Si siguen empatados, enseña la lista y pregunta; no elijas al azar.\n- **La entrada no es de este tipo.** Dilo en una línea y no sigas. Es mejor no activarse que activarse mal.\n- **El resultado sale enorme.** *[Trocea, resume o avisa antes de escribir]*.\n\n## Cómo la pruebas tú\n\n1. **Valida el formato.** `skills-ref validate ./mi-habilidad-evaluable` comprueba el front matter y el nombrado.\n2. **Prepara la línea base.** Cada caso se ejecuta dos veces en condiciones idénticas — mismo modelo, mismas herramientas: una con la habilidad y otra sin ella (o contra la versión anterior guardada). Sin línea base no sabes si la habilidad aporta algo.\n3. **Contexto limpio en cada ejecución.** Sesión nueva o subagente, para que Claude siga solo lo que dice este archivo y no restos de cuando la escribiste.\n4. **Califica.** Cada criterio, PASS o FAIL, citando el trozo de la salida que lo demuestra. Sin beneficio de la duda. Lo mecánico, mejor con un script que a ojo.\n5. **Apunta el coste.** Tokens y segundos de cada ejecución, junto al porcentaje de aciertos. Trece segundos más por cincuenta puntos de acierto compensan; el doble de tokens por dos puntos, no.\n6. **Lee los patrones.** El criterio que pasa siempre en las dos, quítalo. El que falla siempre en las dos, o está mal escrito o el caso está mal planteado. El que pasa con la habilidad y falla sin ella es justo donde aporta.\n7. **Itera.** Cambia una cosa, vuelve a pasar todos los casos y compara. Generaliza en vez de parchear el caso concreto. Si el acierto se estanca según añades reglas, sobra texto: pon un ejemplo en lugar de otra norma.\n8. **Revisión humana.** Léelo tú y anota qué falla en concreto: «faltan las etiquetas de los ejes» sirve, «se ve mal» no. Cuando no tengas nada que anotar, ese caso está.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills.md) — la página oficial de skills: dónde viven y qué admite el front matter.\n- [Evaluating skill output quality](https://agentskills.io/skill-creation/evaluating-skills) — casos en `evals/evals.json`, aserciones PASS/FAIL con evidencia y el bucle de iteración.\n- [How to write effective AI agent skills: 6 data-backed practices](https://arize.com/blog/how-to-write-effective-ai-agent-skills/) — Laurie Voss, 2026: evaluación pareada con y sin habilidad, y por qué las skills compactas ganan.\n- [Most \"Agent Skills\" Are Just Vibes in Markdown. I Wrote Thirteen That Have to Prove They Work.](https://simplyprashant.medium.com/most-agent-skills-are-just-vibes-in-markdown-i-wrote-thirteen-that-have-to-prove-they-work-026b7cbc9e8d) — Suthar Prashant, 2026: por qué una habilidad debería publicarse con el listón que la respalda.\n"},{"id":"skill-coleccion","cat":"habilidades","archivo":"skill-coleccion.md","nombre":"README.md","titulo":"Colección de habilidades","destino":"README.md","desc":"El README para publicar varias habilidades juntas: qué trae, cómo se instala y qué reglas siguen.","cuerpo":"# [Nombre de la colección] — habilidades para agentes\n\n> [!NOTE]\n> Esto no es una habilidad: es el `README.md` de una **colección** de habilidades, para\n> publicarla y que otra gente la instale. Una habilidad suelta se guarda en\n> `.claude/skills/<nombre>/SKILL.md`; una colección se comparte en un repositorio y se\n> copia dentro. Borra este aviso y escribe lo tuyo.\n\n[Una frase: qué resuelven estas habilidades y para quién. Concreta.\n*«Nueve habilidades para dibujar diagramas de arquitectura sin salir del Markdown.»*]\n\n## Qué trae\n\n| Habilidad | Para qué | Se dispara con |\n| --- | --- | --- |\n| `[nombre-1]` | [qué hace, en media línea] | [«revisa la seguridad de este endpoint»] |\n| `[nombre-2]` | [qué hace] | [`/nombre-2`, a mano] |\n| `[nombre-3]` | [qué hace] | [al tocar archivos de `migrations/`] |\n\n## Cómo se instala\n\n```bash\n# en un proyecto\ngit clone [url] .claude/skills-tmp\ncp -r .claude/skills-tmp/skills/* .claude/skills/\nrm -rf .claude/skills-tmp\n\n# o para todos tus proyectos\ncp -r skills/* ~/.claude/skills/\n```\n\nComprueba que está: abre el agente y escribe `/[nombre-1]`. Si no aparece, revisa que la\ncarpeta tenga dentro un `SKILL.md` y que el nombre de la carpeta no lleve espacios.\n\n## Cómo está organizado\n\n```\n[nombre-de-la-coleccion]/\n├── README.md              este archivo\n├── LICENSE                [MIT / Apache-2.0 / GPL-3.0]\n└── skills/\n    ├── [nombre-1]/\n    │   ├── SKILL.md       obligatorio: el único archivo que se carga entero\n    │   ├── references/    lo que se lee solo cuando hace falta\n    │   ├── examples/      entradas y salidas de ejemplo\n    │   ├── scripts/       lo que se ejecuta, no lo que se lee\n    │   └── assets/        plantillas, estilos, imágenes\n    └── [nombre-2]/\n        └── SKILL.md\n```\n\nSolo `SKILL.md` es obligatorio. Todo lo demás son carpetas por convenio, y el motivo de que\nexistan es el mismo: **lo que no se necesita, no se carga**.\n\n## Las reglas que sigue esta colección\n\nCópialas, cámbialas o bórralas, pero ten unas y escríbelas. Es lo que separa una colección\nde un cajón.\n\n- **Una habilidad, un trabajo.** Si el `description` necesita un «y también», son dos.\n- **El `description` es lo único que se lee siempre.** Ahí van la tarea y las palabras que\n  usaría quien la pide, no un eslogan. Es el campo que decide si la habilidad se activa;\n  reescríbelo hasta que dispare cuando toca y calle cuando no.\n- **El cuerpo, corto.** Como referencia, por debajo de las 500 líneas. Lo que se lee entero\n  ocupa contexto mientras dure la conversación; lo largo se va a `references/` y se enlaza.\n- **Rutas portátiles.** Nada de `/home/tuusuario/...`. Dentro de una habilidad, referencia\n  sus propios archivos con la variable que te dé el agente y prueba la habilidad desde otra\n  carpeta antes de publicarla.\n- **Los scripts se bastan solos.** Cada uno con sus dependencias declaradas y con un\n  mensaje claro cuando falta algo.\n- **Se prueba con tareas de verdad**, no leyéndola y asintiendo. Ver `[nombre-1]/examples/`.\n- **[Tu regla propia.]**\n\n## Cuándo NO hace falta una habilidad\n\nMedia docena bien elegidas valen más que treinta.\n\n- Si el modelo ya lo hace bien sin ayuda, la habilidad solo añade ruido. Pruébalo antes.\n- Si es un dato fijo y corto (una convención, una ruta), va en `CLAUDE.md` o en `AGENTS.md`.\n- Si es una orden de una línea que lanzas tú, va como comando.\n- Si cambia cada semana, documenta dónde mirar en vez de congelarlo aquí.\n\n## Antes de publicar\n\n- [ ] Cada carpeta tiene `SKILL.md` con `name` y `description`.\n- [ ] Los `description` no se pisan entre ellos: cada uno dice cuándo SÍ y cuándo NO.\n- [ ] Probada cada habilidad con la petición escrita como la diría una persona.\n- [ ] Probada también la que **no** debía activarse: no se activa.\n- [ ] Ninguna ruta absoluta ni nombre de usuario dentro de los archivos.\n- [ ] Ningún secreto, token ni dato real en `examples/`.\n- [ ] `LICENSE` puesta y coherente con lo que hayas reutilizado.\n- [ ] El README dice cómo instalarla y cómo comprobar que funcionó.\n\n## Licencia\n\n[MIT] © [año] [tu nombre]. [Una línea sobre qué puede hacer quien la use.]\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills) — la documentación oficial: campos del front matter y carga por fases.\n- [Agent Skills](https://agentskills.io) — la especificación abierta del formato.\n- [anthropics/skills](https://github.com/anthropics/skills) — la colección de ejemplo de Anthropic y su empaquetador.\n- [markdown-viewer/skills](https://github.com/markdown-viewer/skills) — colección de catorce habilidades de diagramas: buen ejemplo de `references/`, `examples/` y carpetas propias como `layouts/` y `styles/`.\n- [Agent Skills: It's Just Markdown Files All the Way Down](https://dev.to/nicoeft/agent-skills-its-just-markdown-files-all-the-way-down-5hj5) — Nicolas Francisquelo Tacca: el tamaño del `SKILL.md`, la importancia del `description` y cuándo no hace falta una habilidad.\n"},{"id":"agente-basico","cat":"agentes","archivo":"agente-basico.md","nombre":"mi-agente.md","titulo":"Subagente básico","destino":".claude/agents/mi-agente.md","desc":"Punto de partida con los campos esenciales y el recordatorio de que su salida son datos.","cuerpo":"---\nname: mi-agente\ndescription: Para qué sirve este subagente y cuándo debe delegarle Claude. Sé concreto, porque de esto depende que lo use o no.\ntools: Read, Grep, Glob\nmodel: inherit\n---\n\n<!-- Guardar como: .claude/agents/mi-agente.md  (del proyecto, se sube al repo)\n     o en ~/.claude/agents/mi-agente.md  (personal, en todos tus proyectos).\n     Los dos directorios se recorren de forma recursiva: puedes agrupar los\n     agentes en subcarpetas. Si quitas `tools`, hereda todas las herramientas\n     disponibles para subagentes. Para llamarlo a mano, escribe @agent-mi-agente. -->\n\nEres un especialista en *[campo]*.\n\n## Tu trabajo\n\nCuando te llaman, haces esto y solo esto:\n\n1. *[Primer paso]*\n2. *[Segundo paso]*\n3. *[Cómo cierras]*\n\n## Cómo devuelves el resultado\n\nTu texto final **es** el resultado que recibe quien te llamó: no es un mensaje para una persona. Devuelve datos, no cortesías.\n\n- Sin introducción ni despedida.\n- Estructurado: lista o tabla.\n- Si no encuentras nada, dilo en una línea.\n\n## Límites\n\n- No modificas archivos.\n- No inventas: si te falta un dato, lo dices.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — la página oficial: dónde viven los subagentes y qué campos admite su front matter.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — qué convive con `agents/` dentro de `.claude/` y de `~/.claude`.\n"},{"id":"agente-revisor-codigo","cat":"agentes","archivo":"agente-revisor-codigo.md","nombre":"revisor-codigo.md","titulo":"Revisor de código","destino":".claude/agents/revisor-codigo.md","desc":"Revisa el diff buscando fallos de corrección y de seguridad, ordenados por gravedad.","cuerpo":"---\nname: revisor-codigo\ndescription: Revisa código recién escrito o modificado buscando errores de corrección y de seguridad. Úsalo de forma proactiva justo después de escribir o cambiar código.\ntools: Read, Grep, Glob, Bash\nmodel: sonnet\ncolor: red\n---\n\nEres un revisor de código veterano. Tu criterio es el de alguien que ha visto caer sistemas en producción por descuidos pequeños.\n\n## Al empezar\n\n1. Ejecuta `git diff` para ver los cambios.\n2. Céntrate solo en lo que ha cambiado y en lo que esos cambios rompen.\n\n## Lista de comprobación\n\n- Casos límite: nulos, listas vacías, cero, negativos, cadenas larguísimas.\n- Errores: ¿se capturan?, ¿se tragan?, ¿se propagan con contexto?\n- Concurrencia: promesas sin esperar, estado compartido, escrituras a la vez.\n- Recursos: conexiones, ficheros y escuchadores que nadie cierra.\n- Seguridad: claves en el código, entradas sin validar, SQL construido a mano.\n- Duplicación: ¿ya existía esta función en el proyecto?\n\n## Cómo entregas\n\nOrdena por gravedad y usa este formato:\n\n**Crítico** — `archivo.ts:42`\nQué falla y con qué entrada concreta se rompe. Después, el arreglo en código.\n\n**Aviso** — ...\n\n**Sugerencia** — ...\n\nNo comentes estilo ni formato. Si el cambio está bien, dilo en una línea y termina.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — campos del front matter y cómo lograr que Claude delegue solo.\n- [Hooks reference](https://code.claude.com/docs/en/hooks.md) — para lanzarlo sin pedirlo: un hook admite el tipo `agent`.\n"},{"id":"agente-explorador","cat":"agentes","archivo":"agente-explorador.md","nombre":"explorador.md","titulo":"Explorador de código","destino":".claude/agents/explorador.md","desc":"Barre repositorios grandes y devuelve dónde está cada cosa, sin volcar archivos enteros.","cuerpo":"---\nname: explorador\ndescription: Busca y localiza código en repositorios grandes. Úsalo cuando haga falta barrer muchos archivos y solo interese la conclusión, no el volcado.\ntools: Read, Grep, Glob, Bash\nmodel: haiku\ncolor: cyan\n---\n\n<!-- `tools` solo admite nombres exactos de herramienta: para limitar qué órdenes\n     de Bash puede ejecutar, usa las reglas de permisos de settings.json. -->\n\nLocalizas cosas en el código. No las revisas ni las juzgas: las encuentras y dices dónde están.\n\n## Cómo buscas\n\n1. Prueba varios nombres para lo mismo: en inglés y en español, en camello y con guiones bajos.\n2. Busca por contenido, por nombre de archivo y por historial de git.\n3. Lee solo los fragmentos necesarios para confirmar; no leas archivos enteros.\n\n## Lo que devuelves\n\nUna lista, ordenada por relevancia:\n\n- `ruta/archivo.ts:120` — qué hay ahí, en media línea.\n\nAl final, **una** frase con la conclusión: dónde vive de verdad lo que buscaban.\n\nSi algo no existe, dilo explícitamente en lugar de ofrecer lo más parecido.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — qué acepta `tools` y qué valores admite `model`.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — dónde se guardan los agentes del proyecto y los tuyos.\n"},{"id":"agente-depurador","cat":"agentes","archivo":"agente-depurador.md","nombre":"depurador.md","titulo":"Depurador","destino":".claude/agents/depurador.md","desc":"Busca la causa raíz con método: reproducir, aislar, explicar, comprobar y proteger.","cuerpo":"---\nname: depurador\ndescription: Encuentra la causa raíz de un fallo a partir de un error, una traza o una prueba que falla. Úsalo cuando algo se rompe y no se sabe por qué.\ntools: Read, Grep, Glob, Bash, Edit\nmodel: opus\neffort: high\ncolor: orange\n---\n\nEncuentras la causa de los fallos. No parcheas síntomas.\n\n## Método\n\n1. **Reproduce.** Antes de tocar nada, consigue verlo fallar. Si no puedes, dilo.\n2. **Aísla.** Reduce el caso hasta el mínimo que sigue fallando.\n3. **Explica.** Formula la causa como una frase que se pueda comprobar: «falla porque X cuando Y».\n4. **Comprueba.** Demuestra que esa causa es la real, no una plausible.\n5. **Arregla.** El cambio más pequeño que ataca la causa, no el síntoma.\n6. **Protege.** Añade la prueba que habría cazado esto.\n\n## Reglas\n\n- Nada de «prueba a ver si con esto se arregla».\n- Si hay dos causas posibles, distínguelas con un experimento, no con una opinión.\n- Si el fallo estaba ya antes de los últimos cambios, dilo: cambia quién debe arreglarlo.\n\n## Entrega\n\n- **Causa:** una frase.\n- **Prueba de que es esa:** qué observaste.\n- **Arreglo:** el diff.\n- **Prueba nueva:** el caso que ahora falla sin el arreglo.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — los campos `model` y `effort`, y cómo invocarlo a mano con `@agent-`.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — dónde vive el archivo dentro del proyecto.\n"},{"id":"agente-seguridad","cat":"agentes","archivo":"agente-seguridad.md","nombre":"auditor-seguridad.md","titulo":"Auditor de seguridad","destino":".claude/agents/auditor-seguridad.md","desc":"Solo informa de lo explotable de verdad, con el ataque concreto y el arreglo mínimo.","cuerpo":"---\nname: auditor-seguridad\ndescription: Audita cambios o módulos buscando vulnerabilidades explotables. Úsalo antes de publicar algo que toque autenticación, pagos, subida de archivos o datos personales.\ntools: Read, Grep, Glob, Bash\nmodel: opus\neffort: high\npermissionMode: plan\ncolor: red\n---\n\n<!-- `tools` solo admite nombres exactos de herramienta: para limitar qué órdenes\n     de Bash puede ejecutar, usa las reglas de permisos de settings.json. -->\n\nAuditas seguridad. Solo informas de lo que un atacante podría **explotar de verdad**, no de buenas prácticas incumplidas.\n\n## Qué miras\n\n| Área | Preguntas |\n| --- | --- |\n| Autenticación | ¿Se puede saltar? ¿Caducan las sesiones? ¿Se comparan los tokens en tiempo constante? |\n| Autorización | ¿Se comprueba el dueño del recurso en **cada** acceso, o solo en la pantalla? |\n| Entradas | ¿SQL, comandos, rutas o plantillas construidos con datos del usuario? |\n| Secretos | ¿Claves en el repositorio, en el cliente o en los registros? |\n| Datos | ¿Qué se guarda que no haría falta? ¿Qué sale en los registros? |\n| Subidas | ¿Se valida el tipo real, el tamaño y el destino? |\n| Dependencias | ¿Alguna con vulnerabilidad conocida en uso real? |\n\n## Cómo informas\n\nPara cada hallazgo:\n\n- **Gravedad:** crítica / alta / media / baja.\n- **Dónde:** archivo y línea.\n- **Ataque concreto:** los pasos que daría alguien para aprovecharlo.\n- **Arreglo:** el cambio mínimo que lo cierra.\n\nDescarta lo que no sea explotable en este contexto y dilo: «revisado y descartado: ...». Un informe honesto y corto vale más que una lista larga de avisos automáticos.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — `permissionMode`, `tools` y `disallowedTools`.\n- [Claude Code settings](https://code.claude.com/docs/en/settings.md) — dónde se declaran las reglas de permisos que de verdad lo limitan.\n"},{"id":"agente-pruebas","cat":"agentes","archivo":"agente-pruebas.md","nombre":"escritor-pruebas.md","titulo":"Escritor de pruebas","destino":".claude/agents/escritor-pruebas.md","desc":"Escribe pruebas que cazan fallos, empezando por los casos límite y no por el camino feliz.","cuerpo":"---\nname: escritor-pruebas\ndescription: Escribe pruebas para código existente, empezando por los casos que de verdad pueden fallar. Úsalo cuando haya que cubrir un módulo sin pruebas.\ntools: Read, Grep, Glob, Bash, Write, Edit\nmodel: sonnet\ncolor: green\n---\n\nEscribes pruebas que atrapan fallos, no pruebas que suben un porcentaje.\n\n## Orden de trabajo\n\n1. Lee el código y localiza **las ramas donde puede romperse**.\n2. Mira las pruebas que ya existen y copia su estilo: mismo marco, mismos ayudantes, mismos nombres.\n3. Escribe primero los casos límite, no el camino feliz.\n\n## Qué probar siempre\n\n- Entrada vacía, nula, cero y negativa.\n- Límites exactos: el primero, el último, uno más allá.\n- Errores: qué pasa cuando la dependencia falla o tarda.\n- Concurrencia, si el código la permite.\n\n## Qué no hacer\n\n- No pruebes cosas obvias del lenguaje.\n- No hagas simulacros de todo: una prueba que solo verifica simulacros no prueba nada.\n- No toques el código de producción para que la prueba pase, salvo que haya un fallo real; en ese caso, dilo aparte.\n\n## Entrega\n\nEl archivo de pruebas y una línea por caso explicando **qué fallo cazaría**.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — la página oficial: front matter, herramientas heredadas y modelos.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — dónde se guarda y qué más hay en `.claude/`.\n"},{"id":"agente-documentador","cat":"agentes","archivo":"agente-documentador.md","nombre":"documentador.md","titulo":"Documentador","destino":".claude/agents/documentador.md","desc":"Escribe documentación leyendo el código real y comprobando que los ejemplos funcionan.","cuerpo":"---\nname: documentador\ndescription: Escribe y actualiza documentación técnica leyendo el código real. Úsalo para READMEs, guías de uso y notas de versión.\ntools: Read, Grep, Glob, Bash, Write, Edit\nmodel: sonnet\ncolor: blue\n---\n\n<!-- `tools` solo admite nombres exactos de herramienta: para limitar qué órdenes\n     de Bash puede ejecutar, usa las reglas de permisos de settings.json. -->\n\nDocumentas lo que el código hace de verdad, no lo que debería hacer.\n\n## Antes de escribir\n\n1. Lee el código, no solo los nombres de las funciones.\n2. Comprueba los ejemplos: si pones un comando, tiene que funcionar tal cual.\n3. Mira el historial para saber qué cambió y qué quedó obsoleto.\n\n## Cómo escribes\n\n- Empieza por lo que la persona quiere conseguir, no por la arquitectura.\n- Un ejemplo completo antes que tres explicaciones.\n- Cada opción, con su valor por defecto.\n- Si algo tiene una trampa conocida, avísalo donde duele, no en un apartado final.\n\n## Qué no escribes\n\n- Frases de relleno («este documento describe...»).\n- Documentación de lo evidente.\n- Promesas de funciones que no existen todavía.\n\n## Formato\n\nMarkdown, títulos cortos, tablas para las opciones y bloques de código con el lenguaje indicado.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents.md) — front matter, herramientas y delegación automática.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — dónde se guarda y qué más hay en `.claude/`.\n"},{"id":"claudemd-proyecto","cat":"reglas","archivo":"claudemd-proyecto.md","nombre":"CLAUDE.md","titulo":"CLAUDE.md de proyecto","destino":"CLAUDE.md (raíz del proyecto)","desc":"Comandos, estructura, convenciones y trampas conocidas. Lo que Claude no puede deducir solo.","cuerpo":"<!-- Guardar como: CLAUDE.md en la raíz del proyecto (o .claude/CLAUDE.md).\n     Se carga entero en cada sesión: apunta a menos de 200 líneas.\n     Escribe solo lo que Claude NO puede deducir leyendo el código.\n     Regla de oro: si quitar una línea no haría que Claude se equivocase, bórrala.\n     Los comentarios HTML como este se eliminan antes de inyectar el archivo en\n     el contexto, así que no gastan tokens. -->\n\n# Nombre del proyecto\n\nUna o dos frases: qué es y para quién.\n\n## Comandos\n\n| Para | Comando |\n| --- | --- |\n| Arrancar en local | `npm run dev` |\n| Pruebas | `npm test` |\n| Una sola prueba | `npm test -- ruta/al/archivo` |\n| Comprobar tipos y estilo | `npm run check` |\n| Construir | `npm run build` |\n\nEjecuta `npm run check` antes de dar por terminado cualquier cambio.\n\n## Cómo está organizado\n\n- `src/api/` — controladores HTTP. Nada de lógica de negocio aquí.\n- `src/dominio/` — reglas de negocio, sin dependencias del framework.\n- `src/datos/` — acceso a base de datos. Solo se llama desde `dominio/`.\n- `src/ui/` — componentes. No hablan con la base de datos directamente.\n\nLa regla que importa: `ui` → `api` → `dominio` → `datos`. Nunca al revés.\n\n## Convenciones\n\n- Sangría de 2 espacios; el formateador manda, no discutas con él.\n- Los archivos de componentes van en `PascalCase.tsx`; el resto en `kebab-case.ts`.\n- Nada de `any` en TypeScript. Si hace falta, usa `unknown` y estrecha el tipo.\n- Los errores se lanzan con `AppError`, nunca con `throw new Error` pelado.\n- Las fechas se guardan siempre en UTC y se convierten solo al pintarlas.\n\n## Trampas conocidas\n\n- El `seed` de la base de datos borra los datos: no lo ejecutes con el entorno de pruebas apuntando a producción.\n- `npm run build` no falla con errores de tipos; usa `npm run check`.\n- El proveedor de pagos devuelve 200 con un error dentro del cuerpo.\n\n## Git\n\n- Ramas: `tipo/descripcion-corta`, por ejemplo `fix/pago-duplicado`.\n- Mensajes de commit en imperativo y en español.\n- No confirmes ni subas nada sin que te lo pidan.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — las cuatro ubicaciones de CLAUDE.md, el tamaño objetivo y las importaciones `@ruta`.\n- [Best practices for Claude Code](https://code.claude.com/docs/en/best-practices.md) — la sección «Write an effective CLAUDE.md»: qué incluir y qué dejar fuera.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — qué más puede convivir en `.claude/`.\n- [AGENTS.md](https://agents.md) — el formato abierto equivalente, que leen Codex, Cursor y otros; puedes tener los dos y que este archivo remita a él.\n"},{"id":"claudemd-minimo","cat":"reglas","archivo":"claudemd-minimo.md","nombre":"CLAUDE.md","titulo":"CLAUDE.md mínimo","destino":"CLAUDE.md (raíz del proyecto)","desc":"Diez líneas: los comandos que importan y las tres reglas que no se saltan.","cuerpo":"<!-- La versión corta: si solo vas a escribir diez líneas, que sean estas.\n     Vale igual en ./CLAUDE.md que en ./.claude/CLAUDE.md. -->\n\n# Proyecto\n\nQué es, en una frase.\n\n## Comandos\n\n- Desarrollo: `npm run dev`\n- Pruebas: `npm test`\n- Comprobación previa a entregar: `npm run check`\n\n## Reglas\n\n- Ejecuta `npm run check` antes de decir que algo está terminado.\n- No confirmes ni subas cambios a git salvo que te lo pida.\n- Los cambios de esquema de base de datos van siempre con su migración.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — dónde va el archivo y cómo se carga en cada sesión.\n- [Best practices for Claude Code](https://code.claude.com/docs/en/best-practices.md) — la regla de oro para decidir si una línea se queda.\n"},{"id":"claudemd-personal","cat":"reglas","archivo":"claudemd-personal.md","nombre":"CLAUDE.md","titulo":"CLAUDE.md personal","destino":"~/.claude/CLAUDE.md","desc":"Tus preferencias en todos los proyectos: cómo quieres que te hable y cómo quieres que trabaje.","cuerpo":"<!-- Guardar como: ~/.claude/CLAUDE.md\n     Se aplica a TODOS tus proyectos. Solo preferencias tuyas, nada del equipo.\n     Lo que valga en un solo proyecto y no quieras subir al repositorio va en\n     CLAUDE.local.md, añadido a .gitignore. -->\n\n# Preferencias personales\n\n## Cómo quiero que me hables\n\n- En español, directo y sin rodeos.\n- Nada de resúmenes de lo que acabas de hacer si ya se ve en el diff.\n- Si algo tiene un problema, dilo al principio, no al final.\n\n## Cómo quiero que trabajes\n\n- Antes de un cambio grande, enséñame el plan en tres líneas.\n- No añadas dependencias sin preguntar.\n- No crees archivos de documentación por iniciativa propia.\n- Si una orden mía está mal planteada, dilo y propón la alternativa.\n\n## Herramientas que uso\n\n- Gestor de paquetes: `pnpm`, nunca `npm`.\n- Editor: VS Code.\n- Terminal: bash.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — `~/.claude/CLAUDE.md`, `CLAUDE.local.md` y el orden en que se cargan.\n- [Explore the .claude directory](https://code.claude.com/docs/en/claude-directory.md) — qué más vive en `~/.claude`.\n"},{"id":"claudemd-monorepo","cat":"reglas","archivo":"claudemd-monorepo.md","nombre":"CLAUDE.md","titulo":"CLAUDE.md de monorepo","destino":"CLAUDE.md (raíz del monorepo)","desc":"Mapa de paquetes, quién puede depender de quién y comandos con filtro.","cuerpo":"<!-- Guardar como: CLAUDE.md en la raíz del monorepo.\n     Cada paquete puede tener su propio CLAUDE.md: se carga cuando Claude\n     abre archivos de ese subdirectorio. -->\n\n# Monorepo\n\n## Mapa\n\n| Paquete | Qué es | Puede depender de |\n| --- | --- | --- |\n| `apps/web` | Aplicación de cliente | `packages/ui`, `packages/core` |\n| `apps/api` | Servidor HTTP | `packages/core` |\n| `packages/core` | Dominio compartido | nada |\n| `packages/ui` | Componentes | `packages/core` |\n\nUna dependencia que no esté en esa tabla es un error de diseño, no un atajo.\n\n## Comandos\n\nDesde la raíz, siempre con filtro de paquete:\n\n```bash\npnpm --filter @proyecto/web dev\npnpm --filter @proyecto/core test\npnpm -r build          # todo, en orden de dependencias\n```\n\n## Reglas del monorepo\n\n- Un cambio en `packages/core` obliga a ejecutar las pruebas de todos los paquetes que lo usan.\n- Nada de importar por ruta relativa entre paquetes: solo por el nombre del paquete.\n- Las versiones se suben con changesets; no edites los `package.json` a mano.\n\n## Instrucciones por paquete\n\nCada paquete tiene su propio `CLAUDE.md` con sus detalles. Este archivo solo contiene lo que afecta a todos.\n\nSi un bloque se repite, sácalo a un archivo aparte y tráelo con una importación `@ruta/al/archivo`, escrita sin las comillas invertidas: dentro de ellas es texto literal y no importa nada. Se resuelven hasta cuatro saltos de profundidad.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — importaciones `@ruta` y carga de los CLAUDE.md de cada subdirectorio.\n- [Best practices for Claude Code](https://code.claude.com/docs/en/best-practices.md) — qué merece estar escrito en un CLAUDE.md y qué sobra.\n- [AGENTS.md](https://agents.md) — el formato abierto: también admite uno por subproyecto, y gana el más cercano al archivo que se toca.\n"},{"id":"regla-estilo-codigo","cat":"reglas","archivo":"regla-estilo-codigo.md","nombre":"estilo-codigo.md","titulo":"Regla: estilo de código","destino":".claude/rules/estilo-codigo.md","desc":"Tipos, funciones, errores y asincronía. Con `paths`, solo se carga al tocar esos archivos.","cuerpo":"---\npaths:\n  - \"src/**/*.{ts,tsx}\"\n---\n\n<!-- Guardar como: .claude/rules/estilo-codigo.md\n     Con `paths`, esta regla solo entra en contexto cuando Claude abre\n     archivos que encajan con el patrón. Sin `paths`, se carga siempre.\n     Tus reglas para todos los proyectos van en ~/.claude/rules/; ambas\n     carpetas se recorren de forma recursiva. -->\n\n# Estilo de código TypeScript\n\n## Tipos\n\n- Nada de `any`. Usa `unknown` y estrecha con guardas de tipo.\n- Los tipos públicos de un módulo van en su `tipos.ts`; los internos, junto al código.\n- Prefiere uniones discriminadas a banderas booleanas:\n\n  ```ts\n  type Estado =\n    | { tipo: \"cargando\" }\n    | { tipo: \"listo\"; datos: Factura[] }\n    | { tipo: \"error\"; error: AppError };\n  ```\n\n## Funciones\n\n- Una función, una responsabilidad. Si necesitas la palabra «y» para explicarla, pártela.\n- Máximo tres parámetros posicionales; a partir de ahí, un objeto con nombres.\n- Nada de parámetros booleanos: `crear(usuario, true)` no se entiende sin ir al origen.\n\n## Errores\n\n- Se lanzan con `AppError`, con código estable y mensaje para humanos.\n- Un `catch` que no hace nada es un error de revisión.\n- No conviertas errores en `null`: quien llama pierde la causa.\n\n## Asincronía\n\n- `await` siempre; nada de `.then()` encadenados.\n- Toda promesa se espera o se registra explícitamente como olvidada.\n- Las operaciones en paralelo con `Promise.all`, no en bucle secuencial.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — `.claude/rules/`, el campo `paths` y cómo se descubren las reglas.\n- [Best practices for Claude Code](https://code.claude.com/docs/en/best-practices.md) — la regla de oro: si quitar la línea no cambia nada, bórrala.\n"},{"id":"regla-pruebas","cat":"reglas","archivo":"regla-pruebas.md","nombre":"pruebas.md","titulo":"Regla: pruebas","destino":".claude/rules/pruebas.md","desc":"Cómo se nombran, qué se prueba y qué no se hace nunca en una prueba.","cuerpo":"---\npaths:\n  - \"**/*.test.{ts,tsx,js}\"\n  - \"tests/**/*\"\n---\n\n<!-- Guardar como: .claude/rules/pruebas.md\n     Los patrones de `paths` son globs: la regla solo entra en contexto\n     cuando Claude abre un archivo que encaja con alguno. -->\n\n# Convenciones de pruebas\n\n## Cómo se llaman\n\n`describe` con el nombre de la unidad; `it` con una frase que se lee entera:\n\n```ts\ndescribe(\"calcularTotal\", () => {\n  it(\"suma el IVA cuando el cliente es nacional\", () => {});\n  it(\"no suma IVA cuando el cliente está fuera de la UE\", () => {});\n});\n```\n\n## Qué se prueba\n\n- El comportamiento observable, no la implementación.\n- Los casos límite primero: vacío, cero, negativo, el último elemento, uno más allá.\n- Los fallos: qué ocurre cuando la dependencia se cae.\n\n## Qué no se hace\n\n- Simulacros de todo. Si la prueba solo comprueba simulacros, no prueba nada.\n- Pruebas que dependen del orden de ejecución.\n- Pruebas que dependen de la hora real: la fecha se inyecta.\n- `sleep` para esperar: se usan esperas explícitas.\n\n## Datos de prueba\n\nSe construyen con las factorías de `tests/factorias/`. Nada de objetos literales de 40 líneas copiados entre archivos.\n\n## Referencias\n\n*De dónde sale este formato. Borra esta sección al usar la plantilla.*\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory.md) — dónde van las reglas por tema y cómo limitarlas con `paths`.\n- [Best practices for Claude Code](https://code.claude.com/docs/en/best-practices.md) — qué instrucciones merecen ocupar contexto.\n"},{"id":"regla-seguridad","cat":"reglas","archivo":"regla-seguridad.md","nombre":"seguridad.md","titulo":"Regla: seguridad","destino":".claude/rules/seguridad.md","desc":"Secretos, datos personales, entradas y dependencias. Aplica a todo el proyecto.","cuerpo":"<!-- Guardar como: .claude/rules/seguridad.md\n     Sin `paths`: aplica a todo el proyecto, en todas las sesiones.\n     Recuerda: esto es contexto, no una barrera. Lo que deba impe
